  bundleNotes: "Weakest bundle in the group: the Python wrapper converts every exception into a clean-looking marker line, two of the eight tasks are stubs (latency, report), two raise no issues (throughput, health), and one is a static text blob. No generation rule, so no auto-discovery. Region shortcut options in the runbook do not exist in the script's CLI. Cross-task state via Set Global Variable DISCOVERED_MODELS. The SLI mixes log counts, a 0.5 'no data' default and a constant 1.0 latency so 0.6-0.9 is the normal range for a healthy project."
