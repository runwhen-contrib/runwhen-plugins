    - title: Check Vertex AI Model Garden API Logs for Issues
      at: runbook.robot:217
      asserts: "Audit-log ERROR entries for aiplatform.googleapis.com in LOG_FRESHNESS (2h): total/ChatCompletions/Predict counts; auth errors (status 7/16) and quota errors (status 8) each raise a sev 2 issue; permission denied on the log read raises a sev 2 issue."
      reads: ["gcloud logging read 'resource.type=\"audited_resource\" AND resource.labels.service=\"aiplatform.googleapis.com\" AND severity=\"ERROR\"' --freshness --limit=50 --format=json", "jq over a temp JSON file"]
      permissions: ["logging.privateLogEntries.list (Data Access audit logs; roles/logging.privateLogViewer)", "logging.logEntries.list"]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "runbook.robot:~226-235: only stderr matching 'permission|denied|PERMISSION_DENIED|not authorized' is treated as an error; any other gcloud failure (network, API disabled, bad project) leaves stdout empty, which is then handled as 'No errors / system appears healthy' or as count 0. rc is not checked. Generic ERROR entries (non auth/quota) are only counted in the report, not raised as issues."
      notes: "Only status 7/16 (auth) and 8 (quota) become issues; code 14 (unavailable) is counted but not raised. Limit 50, so counts saturate. Several jq calls use '2>/dev/null || echo \"Error ...\"'."
