      permissions: ["aiplatform.endpoints.list", "aiplatform.endpoints.get"]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Failure direction is a false positive: every region error is swallowed (silent unless VERTEX_AI_DEBUG) so a permission/API-disabled failure reports 'No Vertex AI models discovered'. Sweeps 24 regions sequentially with a 60 s timeout each. Inventories only deployed endpoint models (self-hosted/MaaS), not Model Garden publisher (Gemini etc.) usage. Sets global DISCOVERED_MODELS/ENDPOINTS used by later tasks."
    - title: Analyze Vertex AI Model Garden Error Patterns and Response Codes
      at: runbook.robot:77
      asserts: "Over the last 2 h the publisher model_invocation_count metric shows non-2xx response codes: error rate > 5% (HIGH_ERROR_RATE:true, sev 1) or any error count > 0 (sev 2)."
      reads: ["python3 vertex_ai_monitoring.py errors --hours 2 --no-discovery", "GET monitoring.googleapis.com/v3/projects/<p>/timeSeries aiplatform.googleapis.com/publisher/online_serving/model_invocation_count"]
      permissions: ["monitoring.timeSeries.list"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vertex_ai_monitoring.py analyze_error_patterns: both 'except Exception' blocks print 'HIGH_ERROR_RATE:false' and 'ERROR_COUNT:0' (and the script exits 0); no invocation data also prints ERROR_COUNT:0. The runbook only greps those markers and never checks rc."
      notes: "Metric is aiplatform publisher serving (Model Garden MaaS), not deployed endpoint metrics, so it sees nothing for self-hosted endpoints. Reads only the first page of time series (no pagination). requests.get has no timeout."
    - title: Investigate Vertex AI Model Latency Performance Issues
      at: runbook.robot:134
      asserts: "Nothing: the python 'latency' command prints 'Latency analysis not yet implemented in REST API version'. The task would raise sev 1/2 issues if HIGH_LATENCY_MODELS / ELEVATED_LATENCY_MODELS markers were printed, which they never are."
      reads: ["python3 vertex_ai_monitoring.py latency --hours 2 --no-discovery (prints a stub message)"]
      permissions: []
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vertex_ai_monitoring.py main(): elif args.command == 'latency': print('Latency analysis not yet implemented'). Markers absent -> counts stay 0 -> no issue; SLI latency score defaults to 1.0 (sli.robot:~207)."
