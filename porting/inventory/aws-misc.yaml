- bundle: gh-actions-artifact-analysis
  displayName: "GitHub Actions Artifact Analysis"
  classicResourceTypes: []
  matchHints: "no .runwhen directory (manual SLX only)"
  sli: true
  sliAsserts: "Pushes the number printed by the user ANALYSIS_COMMAND (read from report.txt) after the same download pipeline; if the pipeline fails report.txt is missing and Convert To Number raises, so no metric. False-pass: none."
  egress: "public internet: api.github.com plus the artifact download host (GitHub redirects archive_download_url to blob storage)"
  tools: [curl, jq, unzip, openssl, base64, bash]
  inputs: [GITHUB_REPO, WORKFLOW_NAME, ARTIFACT_NAME, ANALYSIS_COMMAND, RESULT_FILE, PERIOD_HOURS, ISSUE_SEARCH_STRING, ISSUE_SEVERITY, ISSUE_TITLE, ISSUE_NEXT_STEPS]
  credential: "GITHUB_TOKEN (PAT) or GitHub App (GITHUB_APP_ID + GITHUB_APP_PRIVATE_KEY [+ GITHUB_APP_INSTALLATION_ID, GITHUB_APP_CLIENT_ID]); all optional, one required"
  tasks:
    - title: "Analyze artifact from GitHub workflow in repository"
      at: "runbook.robot:17"
      asserts: "Problem (sev3) if the latest run of WORKFLOW_NAME did not conclude success or is older than PERIOD_HOURS (matched from stderr); problem (ISSUE_SEVERITY) if the user ANALYSIS_COMMAND output over the artifact's RESULT_FILE matches ISSUE_SEARCH_STRING."
      reads: ["GET https://api.github.com/repos/<repo>/actions/runs", "GET /repos/<repo>/actions/runs/<id>/artifacts", "GET <artifact archive_download_url> (zip download)", "unzip; cat <RESULT_FILE> | eval $ANALYSIS_COMMAND > report.txt"]
      permissions: ["PAT classic: repo (private) or public_repo; fine-grained: Actions: read + Metadata: read", "GitHub App: Actions: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:35 `grep -E '${ISSUE_SEARCH_STRING}'report.txt` has no space before report.txt, so the pattern becomes ERROR|Errorreport.txt and grep reads empty stdin: the search-string issue can never fire. :47 only greps stderr for 'did not complete successfully|run is older than'; every other error_exit (Failed to fetch workflow runs, No runs found, No artifacts found, Result file not found, auth failure) matches nothing -> no issue."
      notes: "Runs a user-supplied command via eval (arbitrary code execution; escaped with RW.CLI.Escape Bash Command). Runs list is only the first page (30) of all workflows so a busy repo may not contain the workflow. Uses GNU date -d. Defaults for the string inputs are the literal \"''\"."
  bundleNotes: "The only reliable signal is workflow conclusion/age through stderr text. Artifact content assertion is dead."

- bundle: gh-actions-health
  displayName: "GitHub Actions Health Monitoring"
  classicResourceTypes: []
  matchHints: "generation rule file is entirely commented out (template for future github_organizations / github_repository resource types); effectively manual SLX only"
  sli: true
  sliAsserts: "Seven sub-scores averaged: workflow success rate >= MIN_WORKFLOW_SUCCESS_RATE (0.95), org health >= 0.90, runner availability >= 0.95, security score >= 0.98 and 0 critical vulns, performance >= 0.90, API rate-limit usage <= 70%. False-pass confirmed: every task's JSON-parse EXCEPT logs 'defaulting to perfect score' (sli.robot) and the calculate_*_sli.sh scripts emit 1.0 when no runs/runners were found (e.g. calculate_workflow_sli.sh:67-68, calculate_runner_sli.sh:72-73)."
  egress: "public internet: api.github.com"
  tools: [curl, jq, bc, openssl, base64, bash, GNU date]
  inputs: [GITHUB_REPOS, GITHUB_ORGS, MAX_WORKFLOW_DURATION_MINUTES, REPO_FAILURE_THRESHOLD, HIGH_RUNNER_UTILIZATION_THRESHOLD, HIGH_USAGE_THRESHOLD, RATE_LIMIT_WARNING_THRESHOLD, FAILURE_LOOKBACK_DAYS, MAX_REPOS_TO_ANALYZE, MAX_REPOS_PER_ORG]
  credential: "GITHUB_TOKEN (PAT) or GitHub App (GITHUB_APP_ID + GITHUB_APP_PRIVATE_KEY [+ GITHUB_APP_INSTALLATION_ID]); all optional, one required; _github_auth.sh mints per-org installation tokens when no installation id is given"
  tasks:
    - title: "Check Recent Workflow Failures Across Specified Repositories"
      at: "runbook.robot:19"
      asserts: "Problem (sev3) for each workflow whose latest failed/cancelled/timed_out run falls within FAILURE_LOOKBACK_DAYS (runbook default 1), with job/step log excerpts."
      reads: ["GET /orgs/<org>/repos (when GITHUB_REPOS=ALL)", "GET /repos/<r>/actions/runs?status=failure&created=>date&per_page=50", "GET /repos/<r>/actions/runs/<id>/jobs", "GET /repos/<r>/actions/jobs/<id>/logs"]
      permissions: ["PAT classic: repo; fine-grained: Actions: read, Metadata: read (+ org Members/Metadata for org repo listing)", "GitHub App: Actions: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_workflow_failures.sh:242-246,282-284 perform_curl is `curl -sS` (exit 0 on HTTP 401/403/404); an error body fails `jq -e .workflow_runs` and only stderr gets 'No workflow runs found or access denied'; stdout stays `[]`. runbook.robot:43-46 TRY/EXCEPT defaults to an empty list on any unparsable stdout."
      notes: "A failure stays reported for the whole lookback even if a later run is green. API query status=failure excludes cancelled/timed_out although the jq select includes them. Org repo list is the first 100 only (per_page=100, no pagination); orgs that error are skipped with stderr only."
    - title: "Check Long Running Workflows Across Specified Repositories"
      at: "runbook.robot:69"
      asserts: "Problem (sev4) for in_progress runs older than MAX_WORKFLOW_DURATION_MINUTES (60) and for up to 3 recently completed runs per repo whose updated_at - created_at exceeds it."
      reads: ["GET /repos/<r>/actions/runs?status=in_progress&per_page=100", "GET /repos/<r>/actions/runs?status=completed&per_page=50"]
      permissions: ["PAT classic: repo; fine-grained: Actions: read, Metadata: read", "GitHub App: Actions: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_long_running_workflows.sh:30,60 same curl -sS pattern: HTTP error body -> stderr 'access denied' -> empty long_running; runbook.robot:95 EXCEPT defaults to empty."
      notes: "Completed-run duration includes queue time and re-runs (updated_at - created_at)."
    - title: "Check Repository Health Summary for Specified Repositories"
      at: "runbook.robot:120"
      asserts: "Problem (sev2) if total failed/cancelled/timed_out runs in the lookback across all repos exceeds REPO_FAILURE_THRESHOLD (10)."
      reads: ["GET /repos/<r>/actions/runs?created=>date&per_page=100"]
      permissions: ["PAT classic: repo; fine-grained: Actions: read, Metadata: read", "GitHub App: Actions: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_repo_health_summary.sh:38-52 an inaccessible repo is still counted as analysed with 0 failures (else branch is attached to the inner `if failures>0`, so access-denied prints nothing and 'No workflow runs found' prints for healthy repos); health_score 1.0. runbook.robot:144 EXCEPT then `.get('overall_health_score', 1.0)` defaults to 1.0."
      notes: "Only the first 100 runs per repo are counted."
    - title: "Check GitHub Actions Runner Health Across Specified Organizations"
      at: "runbook.robot:165"
      asserts: "Problem (sev3) per self-hosted runner with status offline; problem (sev4) if busy/total runners exceeds HIGH_RUNNER_UTILIZATION_THRESHOLD (80%)."
      reads: ["GET /orgs/<org>/actions/runners?per_page=100"]
      permissions: ["PAT classic: admin:org; fine-grained: Organization self-hosted runners: read", "GitHub App: organization_self_hosted_runners: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_runner_health.sh:32-89 a 403/404 body fails `jq -e .runners` and only prints 'No runners found or access denied' to stderr; org counts as analysed with 0 runners -> no offline list, utilization 0. EXCEPT at runbook.robot:188 also defaults."
      notes: "Requires GITHUB_ORGS (error_exit otherwise -> non-JSON stdout -> silent). No pagination beyond 100 runners; ephemeral runners appear offline."
    - title: "Check Security Workflow Status Across Specified Repositories"
      at: "runbook.robot:225"
      asserts: "Problem (sev1) if any repo has open critical Dependabot alerts; problem (sev3) per failed/cancelled run of a workflow whose name matches security|vuln|cve|dependabot|codeql|trivy|snyk|semgrep|bandit within the lookback."
      reads: ["GET /repos/<r>/actions/runs?created=>date&per_page=100", "GET /repos/<r>/dependabot/alerts?state=open&per_page=100", "GET /repos/<r>/security-advisories?state=published&per_page=50"]
      permissions: ["PAT classic: repo + security_events; fine-grained: Actions: read, Dependabot alerts: read, Repository security advisories: read, Metadata: read", "GitHub App: Actions: read, Dependabot alerts: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_security_workflows.sh `if github_curl_url <dependabot url> &>/dev/null; then` is always true because curl -sS exits 0 on 403/404; the error object is then iterated by jq (`.[] | {..}` on string values) which errors under `set -e`, so the script emits no JSON; runbook.robot:249 EXCEPT -> empty dict -> 0 critical vulns."
      notes: "High-severity alerts are counted but never alerted. Published security advisories are not vulnerabilities and are not counted."
    - title: "Check GitHub Actions Billing and Usage Across Specified Organizations"
      at: "runbook.robot:284"
      asserts: "Problem (sev4) if total_minutes_used / included_minutes exceeds HIGH_USAGE_THRESHOLD (80%) across the orgs."
      reads: ["GET /orgs/<org>/settings/billing/actions"]
      permissions: ["PAT classic: admin:org (org owner / billing manager)", "GitHub App: not supported for this legacy billing endpoint (verify)"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_billing_usage.sh:31 `perform_curl ... || echo {zeros}` never triggers; a 4xx body lacks .total_minutes_used so the org is recorded with usage 0 / included 0 (echo 'Failed to fetch billing data' to stderr only); runbook.robot:307 EXCEPT and :314 usage_percentage = 0 when included is 0."
      notes: "Uses the legacy /settings/billing/actions endpoint; GitHub has been migrating billing to the enhanced billing platform, so this may return nothing for newer orgs (not verified here)."
    - title: "Check GitHub API Rate Limits"
      at: "runbook.robot:328"
      asserts: "Problem (sev3) if the core API rate-limit usage of the bundle's own credential exceeds RATE_LIMIT_WARNING_THRESHOLD (70%)."
      reads: ["GET /rate_limit"]
      permissions: ["any valid token (the call does not count against the limit)"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_rate_limits.sh: `.rate.limit // 0`, non-numeric -> 0, so Bad credentials / error body gives limit 0 and usage_percentage 0.00; runbook.robot:350 EXCEPT defaults to 0 as well."
      notes: "Measures the token the bundle itself uses, not org-wide Actions API consumption; also reads the legacy .rate key."
  bundleNotes: "check_org_workflow_health.sh is not referenced by runbook or SLI and has a piped `while` that loses its counters. All access-denied paths log to stderr only; every task parses stdout JSON inside TRY/EXCEPT with an empty/perfect default. GITHUB_REPOS=ALL requires GITHUB_ORGS."

- bundle: gh-repo-health
  displayName: "GitHub Repository Health"
