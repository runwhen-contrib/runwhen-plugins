- bundle: aws-account-cost-health
  displayName: "AWS Account Cost Report"
  classicResourceTypes: [aws_ec2_vpcs]
  matchHints: "any VPC name (pattern .+, substring); qualifiers [account_id] so one SLX per account; level basic"
  sli: false
  sliAsserts: "n/a: generation rule lists an sli output but its template points at codebundles/cron-scheduler-sli (schedules the runbook), the bundle has no sli.robot and scores nothing"
  egress: "cloud API: AWS Cost Explorer (ce, hard-coded us-east-1), STS, IAM"
  tools: [aws, jq, bc, bash, GNU date]
  inputs: [AWS_REGION, AWS_ACCOUNT_NAME, COST_ANALYSIS_LOOKBACK_DAYS, COST_INCREASE_THRESHOLD, OUTPUT_FORMAT, COST_BUDGET, COST_CONCENTRATION_THRESHOLD, TIMEOUT_SECONDS]
  credential: "aws_credentials secret (platform aws-auth block: access key+secret, optional AWS_ROLE_ARN assume-role, IRSA, pod identity or default chain; auth.sh verifies with sts get-caller-identity)"
  tasks:
    - title: "Generate AWS Cost Report By Service for Account"
      at: "runbook.robot:18"
      asserts: "Problem if period-over-period spend rose >= COST_INCREASE_THRESHOLD %, a day in the last 7 exceeded 2x the 7-day average, total exceeded COST_BUDGET (when > 0), one service exceeds COST_CONCENTRATION_THRESHOLD % of total, or the current-period Cost Explorer query fails."
      reads: ["aws ce get-cost-and-usage (MONTHLY by SERVICE, current and previous period)", "aws ce get-cost-and-usage (DAILY, last 7 days)", "aws ce get-cost-and-usage (MONTHLY by LINKED_ACCOUNT)", "aws sts get-caller-identity", "aws iam list-account-aliases"]
      permissions: ["ce:GetCostAndUsage", "iam:ListAccountAliases", "sts:GetCallerIdentity", "sts:AssumeRole (only when AWS_ROLE_ARN set)"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "aws_cost_report.sh:108-134 previous-period query result is tested with `if [[ $? -eq 0 ]]` AFTER `previous_total=0; previous_services='[]'` ran, so $? is always 0; a failed query leaves previous_total 0/empty -> percent_change 0 -> no trend issue. :99-104 daily query `2>/dev/null || echo '{\"ResultsByTime\":[]}'` -> 'Insufficient daily data' -> no spike issue. :140-149 same stale-$? pattern for LINKED_ACCOUNT. Only the current-period query (:56-74) is checked."
      notes: "Runbook only tests returncode == -1 (timeout) and two auth strings in stdout; script exits 0 on a failed current query but writes a sev2 issue to aws_cost_trend_issues.json so that path is reported. Cost Explorer API requests are billed per call. Uses UnblendedCost only. Issue file read with `cat ... 2>/dev/null || echo [] `."
    - title: "Analyze AWS Reserved Instance and Savings Plans Recommendations for Account"
      at: "runbook.robot:77"
      asserts: "Raises a savings-opportunity issue when Cost Explorer RI/Savings Plans purchase recommendations sum to >= MIN_SAVINGS_THRESHOLD USD/month (default 100, script env only, not wired from runbook). Cost-optimization suggestion, not a fault in the source system."
      reads: ["aws ce get-reservation-purchase-recommendation (EC2, RDS, ElastiCache; ONE_YEAR and THREE_YEARS, NO_UPFRONT, SIXTY_DAYS)", "aws ce get-savings-plans-purchase-recommendation (COMPUTE_SP, EC2_INSTANCE_SP x terms)", "aws sts get-caller-identity", "aws iam list-account-aliases"]
      permissions: ["ce:GetReservationPurchaseRecommendation", "ce:GetSavingsPlansPurchaseRecommendation", "iam:ListAccountAliases", "sts:GetCallerIdentity"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "aws_ri_recommendations.sh:42-48, 82-88, 121-127, 160-166 every ce call is `2>/dev/null` with `if [[ $? -eq 0 && -n ... ]]`; AccessDenied/throttle -> recommendation_count stays 0 -> 'No RI or Savings Plans recommendations found', no issue."
      notes: "Only checked failure paths are timeout and two auth strings. Ten-ish sequential CE calls per run."
  bundleNotes: "Two tasks, no SLI. Cost Explorer is global but always called in us-east-1 regardless of AWS_REGION. Needs Cost Explorer enabled in the account (payer or member with access)."

- bundle: aws-cloudwatch-overused-ec2
  displayName: "AWS CloudWatch Overutlized EC2 Inspection"
  classicResourceTypes: []
  matchHints: "no .runwhen/generation-rules (manual SLX only)"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: "cloud API: AWS CloudWatch"
  tools: [aws, jq]
  inputs: [AWS_DEFAULT_REGION, UTILIZATION_THRESHOLD]
  credential: "aws_credentials secret (platform aws-auth block); also imports an 'aws' Service (aws-service.shared)"
  tasks:
    - title: "Check For Overutilized Ec2 Instances"
      at: "runbook.robot:14"
      asserts: "Problem (sev4) if any EC2 instance's max CPUUtilization over the last 3h exceeds UTILIZATION_THRESHOLD."
      reads: ["aws cloudwatch get-metric-data (Metrics Insights: SELECT MAX(CPUUtilization) FROM AWS/EC2 GROUP BY InstanceId, period 60) piped to jq"]
      permissions: ["cloudwatch:GetMetricData"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:21 `aws cloudwatch get-metric-data ... | jq ...` is bash -c without pipefail and rc is never read; any aws failure (AccessDenied, bad region, throttle) -> empty stdout -> `Should Contain stdout 'Instance'` false -> no issue."
      notes: "UTILIZATION_THRESHOLD default 0.8 is compared with CPUUtilization which is 0-100 percent, so the default flags every instance above 0.8% (false positives). Match is the bare word 'Instance' in stdout. No --region flag; region comes from AWS_DEFAULT_REGION env. No auth.sh/assume-role helper (relies on platform env). Metrics Insights query returns at most 500 series."
  bundleNotes: "Single task, no SLI, no discovery."

- bundle: aws-eks-health
  displayName: "AWS EKS Cluster Health"
  classicResourceTypes: [aws_eks_clusters]
  matchHints: "any EKS cluster name (pattern .+, substring); qualifiers [resource, region, account_id]; level basic"
  sli: false
  sliAsserts: "n/a: sli template points at codebundles/cron-scheduler-sli (schedules the runbook); no sli.robot, nothing is scored"
  egress: "cloud API: AWS EKS, STS"
  tools: [aws, jq, bc, bash]
  inputs: [AWS_REGION, EKS_CLUSTER_NAME, AWS_ACCOUNT_NAME]
  credential: "aws_credentials secret (platform aws-auth block; auth.sh supports keys, assume role, IRSA, pod identity, default chain)"
  tasks:
    - title: "Check EKS Cluster Health in Account Region"
      at: "runbook.robot:19"
      asserts: "Problem if cluster status != ACTIVE (sev2), cluster.health.issues non-empty (sev2), no control-plane log types enabled (sev4), any managed add-on status != ACTIVE (sev3), or the cluster cannot be described/listed (sev2)."
      reads: ["aws eks list-clusters (only if EKS_CLUSTER_NAME unset)", "aws eks describe-cluster", "aws eks list-addons / describe-addon", "aws eks list-nodegroups / describe-nodegroup", "aws eks list-fargate-profiles / describe-fargate-profile"]
      permissions: ["eks:ListClusters", "eks:DescribeCluster", "eks:ListAddons", "eks:DescribeAddon", "eks:ListNodegroups", "eks:DescribeNodegroup", "eks:ListFargateProfiles", "eks:DescribeFargateProfile", "sts:GetCallerIdentity"]
      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "check_eks_cluster_health.sh core reads (list/describe-cluster) are rc-checked and raise issues; but add-on, node group and Fargate sub-reads only echo 'Failed to list add-ons' / 'Failed to describe' and add no issue (:188-190, :183-185), so a denied eks:ListAddons hides a non-ACTIVE add-on. Runbook checks only returncode == -1 and two auth strings."
      notes: "Task also prints node group and Fargate summaries (duplicated by the two tasks below) but only raises issues for node group status/health there. Secrets encryption absence is info-only."
    - title: "Check Fargate Profile Health for EKS Cluster in Account Region"
      at: "runbook.robot:75"
      asserts: "Problem if a Fargate profile status != ACTIVE (sev2), has no selectors (sev4), or list/describe of profiles fails (sev3)."
      reads: ["aws eks list-clusters (if EKS_CLUSTER_NAME unset)", "aws eks list-fargate-profiles", "aws eks describe-fargate-profile"]
      permissions: ["eks:ListClusters", "eks:ListFargateProfiles", "eks:DescribeFargateProfile"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Every aws call is rc-checked and turned into an issue. Clusters with zero profiles are reported as info (healthy)."
    - title: "Check Kubernetes Version Support for EKS Cluster in Account Region"
      at: "runbook.robot:131"
      asserts: "Problem if cluster version is not in the supported list built from describe-addon-versions (sev1), is >= 3 minors behind latest (sev2, 'likely extended support'), or >= 2 minors behind (sev3); includes a hard-coded extended-support cost estimate."
      reads: ["aws eks describe-addon-versions --addon-name vpc-cni (to infer supported versions)", "aws eks list-clusters", "aws eks describe-cluster"]
      permissions: ["eks:DescribeAddonVersions", "eks:ListClusters", "eks:DescribeCluster"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_eks_version_support.sh:52-60 `describe-addon-versions ... 2>/dev/null` (then a second fallback also 2>/dev/null); empty result -> LATEST_VERSION empty -> :130 'Skipping support check' for every cluster, no issue."
      notes: "Support status is inferred from the vpc-cni add-on compatibility matrix and minors-behind heuristics, not from AWS's published support calendar; pricing constants ($0.10/$0.60 per hour) hard-coded."
    - title: "Check Node Group Health for EKS Cluster in Account Region"
      at: "runbook.robot:187"
      asserts: "Problem if a managed node group status != ACTIVE (sev2), has health issues (sev2), desired == max with room to scale (sev3), desired == 0 (sev3), or list/describe fails (sev3)."
      reads: ["aws eks list-clusters (if unset)", "aws eks list-nodegroups", "aws eks describe-nodegroup"]
      permissions: ["eks:ListClusters", "eks:ListNodegroups", "eks:DescribeNodegroup"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Does not look at Kubernetes node readiness or self-managed nodes. desired==0 is flagged even when intentional."
  bundleNotes: "Auth failures are detected only by two stdout strings from auth.sh; all four tasks otherwise parse JSON written by the scripts. When EKS_CLUSTER_NAME is unset every cluster in the region is scanned."

- bundle: aws-elasticache-redis-health
  displayName: "AWS ElastiCache Health Check"
  classicResourceTypes: [aws_elasticache_clusters]
  matchHints: "any ElastiCache cluster name (pattern .+, substring; note trailing space in the rule's resource type); qualifiers [resource, account_id, region]; level basic"
  sli: true
  sliAsserts: "Pushes 0 if redis_status_scan.sh exits non-zero (auth failure or any serverless cache status != available) else 1. False-pass confirmed: a failed describe-serverless-caches yields empty output and exit 0 -> score 1 (redis_status_scan.sh:9,15-23); also reads `${process.rc}` rather than returncode."
  egress: "cloud API: AWS ElastiCache, CloudWatch"
  tools: [aws, jq, bash, "redis-cli (monitor_redis_performance.sh, not called)"]
  inputs: [AWS_REGION, AWS_ACCOUNT_NAME]
  credential: "aws_credentials secret (platform aws-auth block)"
  tasks:
    - title: "Scan AWS Elasticache Redis Status in Account Region"
      at: "runbook.robot:19"
      asserts: "Intended: problem if a serverless cache has SnapshotRetentionLimit 0 (sev4) or is 'not available' (sev2). In practice the issue conditions can never be true."
      reads: ["aws cloudwatch get-metric-statistics AWS/ElastiCache CPUUtilization and CacheMisses (no dimensions, last 24h)", "aws elasticache describe-events", "aws elasticache describe-serverless-caches"]
      permissions: ["cloudwatch:GetMetricStatistics", "elasticache:DescribeEvents", "elasticache:DescribeServerlessCaches", "sts:GetCallerIdentity"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:25 and :34 grep stdout for 'Snapshot retention limit is set to 0' and 'is not available', but analyze_aws_elasticache_redis_metrics.sh prints only 'Error: Redis events are present' and '... non-available status'; the snapshot/'is not available' strings exist only in validate_aws_elasticache_redis_config.py which no task runs. Auth failure exit 1 text also matches nothing. No returncode check."
      notes: "Only serverless caches are listed; node-based clusters/replication groups (what the resource type aws_elasticache_clusters likely discovers) are never examined. Metric queries have no dimensions so datapoints are empty/meaningless. describe-events (default last 60 min) is printed, never asserted. monitor_redis_performance.sh (redis-cli with REDIS_PASSWORD) is unreferenced and has quoting bugs."
  bundleNotes: "Region-wide scan regardless of which cluster the SLX was generated for. Dead issue conditions mean the runbook cannot report anything."

- bundle: aws-lambda-health
  displayName: "AWS Lambda Health Check"
  classicResourceTypes: [aws_lambda_functions]
  matchHints: "any Lambda function name (pattern .+, substring); qualifiers [resource]; level basic"
  sli: true
  sliAsserts: "Pushes 0 if analyze_lambda_invocation_errors.sh stdout contains the substring ERROR, else 1. False-pass confirmed: log-tail or list-functions failure produces no ERROR text -> 1."
  egress: "cloud API: AWS Lambda, CloudWatch Logs, CloudWatch"
  tools: [aws, jq, bash, GNU date]
  inputs: [AWS_REGION, AWS_ACCOUNT_NAME]
  credential: "aws_credentials secret (platform aws-auth block)"
  tasks:
    - title: "List Lambda Versions and Runtimes in Account Region"
      at: "runbook.robot:19"
      asserts: "Report only: lists runtime and version of every function; never raises an issue (no EOL-runtime check)."
      reads: ["aws lambda list-functions", "aws lambda get-function (Runtime, Version) twice per function"]
      permissions: ["lambda:ListFunctions", "lambda:GetFunction", "sts:GetCallerIdentity"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "list_lambda_runtimes.sh passes no --region (relies on AWS_REGION being honoured by the CLI). Unversioned functions print Version $LATEST. N+2 API calls."
    - title: "Analyze AWS Lambda Invocation Errors in Account Region"
      at: "runbook.robot:26"
      asserts: "Problem (sev2) if the last 24h of CloudWatch log output of any function contains the substring ERROR."
      reads: ["aws lambda list-functions (twice)", "aws logs tail /aws/lambda/<function> --since 24h per function"]
      permissions: ["lambda:ListFunctions", "logs:FilterLogEvents (aws logs tail)", "sts:GetCallerIdentity"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "analyze_lambda_invocation_errors.sh:29 `log_messages=$(aws logs tail ...)` captures stdout only; missing log group/AccessDenied go to stderr and the loop continues; :11 list-functions failure -> zero functions. runbook.robot:32 tests only `'ERROR' in stdout`; auth failure text contains no 'ERROR'. rc never checked."
      notes: "Log text match, not the Lambda Errors metric. Substring ERROR also matches ordinary log lines and function names that contain ERROR (stdout echoes function names). Tails up to 24h of logs for every function (large). Region-wide although the SLX is per function."
    - title: "Monitor AWS Lambda Performance Metrics in Account Region"
      at: "runbook.robot:42"
      asserts: "Report only: prints Duration (avg), Errors, Throttles, Invocations (sum) for the last 60 minutes; no issue is ever raised."
      reads: ["aws lambda list-functions", "aws cloudwatch get-metric-statistics AWS/Lambda Duration, Errors, Throttles, Invocations per function"]
      permissions: ["lambda:ListFunctions", "cloudwatch:GetMetricStatistics"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Raw JSON dumped to the report; failures leave blank sections. `lambda_names` array is never reset."
  bundleNotes: "Generation rule is per function but every script scans all functions in the region. No task ever checks rc or distinguishes 'no errors' from 'could not read logs'."

- bundle: aws-sqs-dlq-investigation
  displayName: "AWS SQS Dead Letter Queue Investigation"
  classicResourceTypes: [aws_sqs_queues]
  matchHints: "any SQS queue name (pattern .+, substring); qualifiers [region, account_id]; level basic"
  sli: true
  sliAsserts: "1 when sqs-redrive-and-dlq-depth.sh writes an empty issue list, else 0 (parse failure -> 0). False-pass confirmed: unreadable DLQ attributes are coerced to depth 0/age 0, so no backlog issue (sqs-redrive-and-dlq-depth.sh:139-148); 'no queues matched' and 'no redrive policy' do score 0."
  egress: "cloud API: AWS SQS, Lambda, CloudWatch Logs, CloudWatch"
  tools: [aws, jq, bash]
  inputs: [AWS_REGION, AWS_ACCOUNT_NAME, SQS_QUEUE_URLS, RESOURCES, DLQ_DEPTH_THRESHOLD, CLOUDWATCH_LOG_LOOKBACK_MINUTES, EXTRA_LOG_GROUP_NAMES, MAX_DLQ_SAMPLE_MESSAGES]
  credential: "aws_credentials secret (platform aws-auth block)"
  tasks:
    - title: "Check SQS Redrive Policy and DLQ Depth for Queues in Region"
      at: "runbook.robot:19"
      asserts: "Problem if a primary queue has no RedrivePolicy or an invalid one (sev3), DLQ URL cannot be resolved (sev3), DLQ ApproximateNumberOfMessages > DLQ_DEPTH_THRESHOLD (sev2), oldest DLQ message older than 3600s while visible > 0 (sev3), no queues matched (sev3) or queue ARN unreadable (sev4)."
      reads: ["aws sqs list-queues (when SQS_QUEUE_URLS unset)", "aws sqs get-queue-attributes (QueueArn, then All) on primary and DLQ", "aws sqs get-queue-url"]
      permissions: ["sqs:ListQueues", "sqs:GetQueueAttributes", "sqs:GetQueueUrl", "sts:GetCallerIdentity"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "sqs-redrive-and-dlq-depth.sh:139-148 DLQ get-queue-attributes `2>/dev/null || dlq_attrs={}` then `// \"0\"` -> depth 0, age 0 -> no backlog issue. Auth failure exits before redrive_dlq_issues.json is written; runbook.robot:38-43 TRY/EXCEPT turns the unreadable/stale file into an empty list. Opposite direction: primary attrs failure (:68-72) is reported as 'No dead-letter redrive policy'."
      notes: "DLQ_MAX_AGE_SECONDS (default 3600) is script-level env, not a runbook input. Writes sqs_investigation_context.json that the next four tasks require (shared working dir ordering dependency). set -x traces all commands."
    - title: "Peek Sample Messages on Dead Letter Queues in Region"
      at: "runbook.robot:58"
      asserts: "Problem if any DLQ returns sample messages (issue carries message id, attributes, 800-char body snippets)."
      reads: ["aws sqs receive-message --max-number-of-messages MAX_DLQ_SAMPLE_MESSAGES --visibility-timeout 5 on each DLQ"]
      permissions: ["sqs:ReceiveMessage"]
      scope: account
      readOnly: false
      falsePass: confirmed
      falsePassWhy: "sqs-peek-dlq-messages.sh:53-60 `receive-message ... 2>/dev/null) || recv={}` -> count 0 -> no issue (AccessDenied, wrong region, throttle)."
      notes: "Tagged access:read-only but ReceiveMessage is a state change: increments ApproximateReceiveCount, hides messages for 5s, and can push messages toward a DLQ's own redrive/retention limits; nothing is deleted. Message bodies (possible PII/secrets) flow into issue details. Depends on context file from task 1."
    - title: "Discover Lambda Consumers for SQS Queues in Region"
      at: "runbook.robot:97"
      asserts: "Problem if no Lambda event source mapping exists for a primary queue ARN (or the context file is missing)."
      reads: ["aws lambda list-event-source-mappings --event-source-arn <queue arn>"]
      permissions: ["lambda:ListEventSourceMappings"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Errors are coerced to zero mappings, i.e. reported as 'no consumers' (false positive direction). Spurious issue when the consumer is not Lambda (ECS/EC2). Writes lambda_consumers.json for task 4."
    - title: "Fetch Recent Lambda Processor Errors from CloudWatch Logs in Region"
      at: "runbook.robot:136"
      asserts: "Problem if CloudWatch filter 'ERROR ?Task ?timed ?out ?Runtime' matches events in the last CLOUDWATCH_LOG_LOOKBACK_MINUTES in the consumer Lambda log groups or EXTRA_LOG_GROUP_NAMES, or if no log groups are known."
      reads: ["aws logs filter-log-events --limit 50 per log group"]
      permissions: ["logs:FilterLogEvents"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "sqs-fetch-lambda-error-logs.sh:67-73 `filter-log-events ... 2>/dev/null) || evts={events:[]}` -> cnt 0 -> no issue (missing log group, AccessDenied)."
      notes: "CloudWatch filter syntax: plain term ERROR is AND-ed with the ?-prefixed OR group, so 'Task timed out' lines without the word ERROR probably do not match (unverified). Capped at 50 events per group."
    - title: "Summarize CloudWatch Metrics for SQS Queues and DLQs in Region"
      at: "runbook.robot:175"
      asserts: "Report only: 15-minute sums of sent/received/deleted/delayed (and DLQ visible) messages; the script always writes an empty issue list."
      reads: ["aws cloudwatch get-metric-statistics AWS/SQS NumberOfMessagesSent/Received/Deleted, ApproximateNumberOfMessagesDelayed/Visible"]
      permissions: ["cloudwatch:GetMetricStatistics"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "sqs_sum_metric uses `2>/dev/null | jq 'add // 0'`, so failures print zeros in the report (misleading) but nothing asserts on them."
  bundleNotes: "Tasks 2-5 depend on files written by task 1 in the same working dir. Task 1 and the SLI both silently treat an unreadable DLQ as empty."

- bundle: curl-gmp-kong-ingress-inspection
  displayName: "GKE Kong Ingress Host Triage"
  classicResourceTypes: []
  matchHints: "no .runwhen/generation-rules (manual SLX only)"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: "cloud API: monitoring.googleapis.com (Google Managed Prometheus query API) and gcloud auth endpoints"
  tools: [gcloud, curl, jq, awk, bash]
  inputs: [GCP_PROJECT_ID, HTTP_ERROR_CODES, TIME_SLICE, HTTP_ERROR_RATE_THRESHOLD, INGRESS_UPSTREAM, INGRESS_SERVICE, REQUEST_LATENCY_THRESHOLD]
  credential: "gcp_credentials secret (service account JSON key, activated with gcloud auth activate-service-account); also imports a 'gcloud' Service"
  tasks:
    - title: "Check If Kong Ingress HTTP Error Rate Violates HTTP Error Threshold in GCP Project"
      at: "runbook.robot:18"
      asserts: "Problem (sev3) if PromQL rate(kong_http_requests_total{service=INGRESS_SERVICE, code=~HTTP_ERROR_CODES}[TIME_SLICE]) > HTTP_ERROR_RATE_THRESHOLD returns any series (stdout contains 'Route')."
      reads: ["gcloud auth activate-service-account --key-file", "curl POST https://monitoring.googleapis.com/v1/projects/<P>/location/global/prometheus/api/v1/query with gcloud auth print-access-token (instant query, run twice: thresholded and raw)"]
      permissions: ["monitoring.timeSeries.list via GMP Prometheus API (roles/monitoring.viewer)"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:22 one `A && response=$(curl -s ...) && jq -e '.data.result | length > 0' && jq -r ... || echo 'No HTTP Error threshold violations found'`: a failure of activate-service-account, curl (-s hides errors, no -f), an HTTP 401/403 JSON body, or jq lands in the `||` branch and prints a healthy-sounding message; issue only if stdout contains 'Route'."
      notes: "INGRESS_SERVICE is overloaded: PromQL label value and dot-split by awk (fields 1 and 4) to derive namespace/ingress names for next steps. The metric is a per-second rate but the output label says 'HTTP Error Count'. activate-service-account writes gcloud config under the runner HOME."
    - title: "Check If Kong Ingress HTTP Request Latency Violates Threshold in GCP Project"
      at: "runbook.robot:53"
      asserts: "Problem (sev3) if histogram_quantile(0.99, sum(rate(kong_request_latency_ms_bucket{service}[TIME_SLICE])) by (le)) > REQUEST_LATENCY_THRESHOLD ms."
      reads: ["gcloud auth activate-service-account", "curl POST GMP Prometheus instant query (p99 latency)"]
      permissions: ["monitoring.timeSeries.list via GMP Prometheus API (roles/monitoring.viewer)"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:57 same `&& ... || echo 'No HTTP request latency threshold violations found'` chain; query/auth failure prints the healthy message."
      notes: "REQUEST_LATENCY_THRESHOLD has no default (required). Result row has no route label so only the service is named."
    - title: "Check If Kong Ingress Controller Reports Upstream Errors in GCP Project"
      at: "runbook.robot:86"
      asserts: "Two checks on kong_upstream_target_health{upstream=INGRESS_UPSTREAM}: state='healthchecks_off' > 0 (sev3 'healthchecks disabled') and state=~'dns_error|unhealthy' > 0 (sev3 'healthcheck errors')."
      reads: ["gcloud auth activate-service-account", "curl POST GMP Prometheus instant query x2 (healthchecks_off; dns_error|unhealthy)"]
      permissions: ["monitoring.timeSeries.list via GMP Prometheus API (roles/monitoring.viewer)"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:90 and :109 `... && jq -e ... && jq -r ... || echo '<upstream> has healthchecks enabled.' / 'is reported as healthy'`: any failure prints a healthy message. Additionally :90's jq program ends `\" Healthchecks Disabled!'` with an unterminated string, so jq always fails to compile and the `Should Contain Disabled` check at :97 can never match (dead check that also asserts 'healthchecks enabled')."
      notes: "Second query keys off the word 'detected' that the jq output prepends."
  bundleNotes: "Manual SLX (no generation rules). Every query is a curl/jq chain whose failure branch is a success-looking echo. Kong metric names (kong_http_requests_total, kong_request_latency_ms_bucket) assume the Kong Prometheus plugin is scraped by GMP."

- bundle: curl-gmp-nginx-ingress-inspection
  displayName: "GKE Nginx Ingress Host Triage"
  classicResourceTypes: []
  matchHints: "no .runwhen/generation-rules (manual SLX only)"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: "cloud API: monitoring.googleapis.com (GMP query API) plus the Kubernetes API"
  tools: [gcloud, curl, jq, awk, kubectl-or-oc, bash]
  inputs: [KUBERNETES_DISTRIBUTION_BINARY, CONTEXT, NAMESPACE, GCP_PROJECT_ID, INGRESS_HOST, INGRESS_SERVICE, INGRESS_OBJECT_NAME, TIME_SLICE, ERROR_CODES]
  credential: "gcp_credentials secret (service account JSON key) and kubeconfig secret"
  tasks:
    - title: "Fetch Nginx HTTP Errors From GMP for Ingress"
      at: "runbook.robot:19"
      asserts: "Problem (sev2) if rate(nginx_ingress_controller_requests{host=INGRESS_HOST, service=INGRESS_SERVICE, status=~ERROR_CODES}[TIME_SLICE]) > 0 returns a series (stdout contains 'Host'); then looks up the ingress backend owner for next steps."
      reads: ["gcloud auth activate-service-account", "curl POST GMP Prometheus instant query (twice)", "kubectl get ingress <name> -n <ns> -o json and jsonpath", "kubectl get service / get endpoints / get pod / get replicaset"]
      permissions: ["monitoring.timeSeries.list via GMP Prometheus API (roles/monitoring.viewer)", {apiGroups: [networking.k8s.io], resources: [ingresses], verbs: [get]}, {apiGroups: [""], resources: [services, endpoints, pods], verbs: [get]}, {apiGroups: [apps], resources: [replicasets], verbs: [get]}]
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:24 `gcloud auth ... && curl -d ... | jq -r 'if .data.result[0] then ... else \"\" end'`: no -s/-f, no pipefail, rc ignored; an auth failure short-circuits to empty stdout, an HTTP error JSON has no .data.result[0] -> '' -> no 'Host' -> no issue."
      notes: "Threshold hard-coded to > 0 for the whole TIME_SLICE (default 60m), so any 5xx in the hour flags. Only the first series is reported. kubectl failures only blank the owner text."
    - title: "Find Owner and Service Health for Ingress"
      at: "runbook.robot:74"
      asserts: "Report only: prints backend services, endpoint pods, owners and a Healthy/Unhealthy line; never raises an issue."
      reads: ["kubectl get ingress <name> -ojsonpath", "kubectl get service <svc>", "kubectl get endpoints <svc>", "kubectl get pod <pod>", "kubectl get replicaset <rs>"]
      permissions: [{apiGroups: [networking.k8s.io], resources: [ingresses], verbs: [get]}, {apiGroups: [""], resources: [services, endpoints, pods], verbs: [get]}, {apiGroups: [apps], resources: [replicasets], verbs: [get]}]
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "health_status is reassigned to Healthy after a service with endpoints is processed, overwriting an earlier Unhealthy from a missing service/endpoint. A Forbidden get prints 'Service X does not exist'."
  bundleNotes: "Task 1's HTTP-error query shares a lot with the Kong bundle. Ingress controller metric names assume ingress-nginx scraped by GMP. Auth is `gcloud auth activate-service-account`."

- bundle: curl-http-ok
  displayName: "cURL HTTP OK"
  classicResourceTypes: [service, ingress]
  matchHints: "three rule files: service of type LoadBalancer with azure-load-balancer-internal annotation 'false' (template http-ok-tls-aks-public-loadbalancer-ext-dns-tls, with workflow); ingress with spec/tls/hosts (http-ok-tls, with slo); ingress without spec/tls/hosts (http-ok, with slo); level basic, qualifiers [resource, namespace, cluster]"
  sli: true
  sliAsserts: "1 only if every URL passes: curl rc == 0, http_code != 000, code in ACCEPTABLE_RESPONSE_CODES and time_total <= TARGET_LATENCY; any curl failure/empty/unparseable output scores 0. False-pass: none."
  egress: "public internet (or cluster-reachable network): HTTP(S) GET to each URL in URLS"
  tools: [curl, jq, bash]
  inputs: [URLS, TARGET_LATENCY, ACCEPTABLE_RESPONSE_CODES, OWNER_DETAILS, VERIFY_SSL]
  credential: "none"
  tasks:
    - title: "Check HTTP URL Availability and Timeliness"
      at: "runbook.robot:16"
      asserts: "Per URL: problem (sev2) if curl exits non-zero, JSON unparseable or http_code is 000; problem (sev4) if http_code not in ACCEPTABLE_RESPONSE_CODES; problem (sev4) if time_total > TARGET_LATENCY."
      reads: ["curl --connect-timeout 5 --max-time 15 -L -o /dev/null -w <json timing/status> <url> (--insecure when VERIFY_SSL=false)"]
      permissions: ["network egress to the target URL"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Defaults weaken the check: VERIFY_SSL defaults to false (--insecure, so expired/untrusted certs pass) and ACCEPTABLE_RESPONSE_CODES includes 301/302/307/401/403. -L follows redirects so the final status is judged. %{exitcode} needs curl >= 7.75. OWNER_DETAILS only decorates issue text. Probes only from the runner's network location."
  bundleNotes: "Healthy example of rc-checked handling. Resource types come from three separate generation rules; the URLS input is populated from ingress hosts by the templates."

- bundle: dns-health
  displayName: "DNS Health & Monitoring"
  classicResourceTypes: []
  matchHints: "no .runwhen directory (manual SLX only)"
  sli: true
  sliAsserts: "Average of 4 binary scores: resolution (dig @8.8.8.8 returns an answer for every configured FQDN), latency (avg of first 3 FQDNs < 500 ms), zone health (>= 80% of DNS_ZONES return NS), resolver availability (dig google.com @each resolver). Missing config/no data scores 0, failures score 0. False-pass: none (but hard-codes 8.8.8.8 and scores 0 permanently when DNS_ZONES is empty)."
  egress: "DNS queries (UDP/TCP 53) to the system resolver and to 8.8.8.8 / 1.1.1.1 or DNS_RESOLVERS"
  tools: [dig, nslookup, timeout, bash]
  inputs: [TEST_FQDNS, FORWARD_LOOKUP_ZONES, PUBLIC_DOMAINS, DNS_RESOLVERS, DNS_ZONES, FORWARD_ZONE_TEST_SUBDOMAINS]
  credential: "none"
  tasks:
    - title: "Check DNS Zone Records"
      at: "runbook.robot:23"
      asserts: "Problem (sev2) if dig NS or dig SOA +short for a zone in DNS_ZONES is empty or exits non-zero."
      reads: ["dig NS <zone> +short +timeout=10", "dig SOA <zone> +short +timeout=10"]
      permissions: ["DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "No-op (report line only) when DNS_ZONES is empty. Uses the system resolver, not DNS_RESOLVERS. Defaults for the zone variables are the literal string \"\" in some places."
    - title: "Detect Broken Record Resolution"
      at: "runbook.robot:91"
      asserts: "Problem (sev2) if 3 repeated lookups of a TEST_FQDNS entry show 'server can't find / NXDOMAIN' or 'connection timed out / no response' in stdout."
      reads: ["for i in 1..3: dig +nocmd +noall +answer <fqdn> @<resolver> || nslookup <fqdn> <resolver>; sleep 2"]
      permissions: ["DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:110 `dig +noall +answer ... || nslookup ...`: dig exits 0 with an empty answer on NXDOMAIN, so the nslookup fallback (the only source of the matched 'can't find' text) never runs and the failure regexes at :121/:135 see nothing. Missing dig and nslookup also produce empty stdout."
      notes: "Uses only the first entry of DNS_RESOLVERS (default 8.8.8.8). Timeouts are caught via the nslookup fallback ('connection timed out')."
    - title: "Test Forward Lookup Zones"
      at: "runbook.robot:151"
      asserts: "Problem if nslookup of a FORWARD_LOOKUP_ZONES entry fails (sev2) or of <subdomain>.<zone> from FORWARD_ZONE_TEST_SUBDOMAINS fails (sev1)."
      reads: ["nslookup <zone> && echo SUCCESS || echo FAILED", "nslookup <subdomain>.<zone> && echo SUCCESS || echo FAILED"]
      permissions: ["DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "rc based (nslookup non-zero or missing -> FAILED). Uses the system resolver, not DNS_RESOLVERS, so it tests the runner's own forwarders. No-op when FORWARD_LOOKUP_ZONES empty."
    - title: "External Resolution Validation"
      at: "runbook.robot:221"
      asserts: "Problem if any resolver (default, 8.8.8.8/1.1.1.1 or DNS_RESOLVERS) answers 'can't find' for a PUBLIC_DOMAINS entry (sev2); sev3 if all fail."
      reads: ["nslookup <domain>", "nslookup <domain> <resolver> per resolver"]
      permissions: ["DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:273 and :283 count only the text \"can't find\" (NXDOMAIN/SERVFAIL); a down/blocked resolver prints 'connection timed out; no servers could be reached' (or nothing if nslookup is absent) and rc is ignored, so no issue."
      notes: "Whole task skipped when PUBLIC_DOMAINS is empty or the literal \"\"."
    - title: "DNS Latency Check"
      at: "runbook.robot:315"
      asserts: "Problem if latency output is empty (sev1) or more than 2 of 5 nslookup samples take >= 5 s (sev2) for any zone/FQDN/forward zone."
      reads: ["for i in 1..5: (time nslookup <domain> 2>&1) 2>&1 | grep -E 'real|user|sys'; sleep 1"]
      permissions: ["DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "A failing or NXDOMAIN lookup still prints bash `time` lines, so only slow (>= 5 s, e.g. timeouts) responses are caught; fast failures are indistinguishable from success and nslookup rc is not read."
      notes: "Regex real 0m5-99s only; durations >= 1 minute use a different format and are missed."
  bundleNotes: "Tool-only bundle (no credentials). Several failure idioms rely on matching the human-readable text of nslookup/dig output, which differs by binary version. Some variable defaults are the literal two-character string \"\"."

- bundle: gcloud-log-inspection
  displayName: "GCP Gcloud Log Inspection"
