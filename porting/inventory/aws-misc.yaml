    - title: "Detect Stale Issue Accumulation"
      at: "runbook.robot:63"
      asserts: "Problem (sev3) if stale issues (no update for STALE_ISSUE_DAYS=60) exceed STALE_ISSUE_THRESHOLD (20) across repos; problem (sev3) listing issues with no team response."
      reads: ["GET /repos/<r>/issues?state=open&per_page=100&sort=created&direction=asc", "GET /repos/<r>/issues/<n>/comments?per_page=3"]
      permissions: ["PAT classic: repo; fine-grained: Issues: read, Metadata: read", "GitHub App: Issues: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_stale_issues.sh:28 `perform_curl ... || echo []`: error object instead of array breaks the jq loop (set -e) or yields zero issues; runbook.robot:79 EXCEPT defaults to an empty dict."
      notes: "Only the 100 oldest open items (issues endpoint also returns PRs); no pagination."
    - title: "Detect Stale Pull Requests"
      at: "runbook.robot:116"
      asserts: "Problem (sev3) for PRs open > STALE_PR_DAYS (14) OR with zero reviews OR mergeable_state == dirty; separate problem (sev3) for PRs with merge conflicts."
      reads: ["GET /repos/<r>/pulls?state=open&per_page=100&sort=created&direction=asc", "GET /repos/<r>/pulls/<n>/reviews?per_page=20"]
      permissions: ["PAT classic: repo; fine-grained: Pull requests: read, Metadata: read", "GitHub App: Pull requests: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_stale_prs.sh:28 `|| echo []` never triggers; error body -> no iteration; runbook.robot:132 EXCEPT defaults. Separately the conflict check is dead: mergeable_state (:46,:72) is not returned by the list-pulls endpoint, so it is always 'unknown' and no PR is ever flagged as conflicting."
      notes: "The OR condition makes every un-reviewed PR 'stale' regardless of age. First 100 PRs only."
    - title: "Audit Branch Hygiene"
      at: "runbook.robot:174"
      asserts: "Problem (sev4) listing unprotected non-default branches whose last commit is older than STALE_BRANCH_DAYS (60)."
      reads: ["GET /repos/<r>", "GET /repos/<r>/branches?per_page=100", "GET /repos/<r>/commits/<sha> per branch"]
      permissions: ["PAT classic: repo; fine-grained: Contents: read, Metadata: read", "GitHub App: Contents: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_branch_hygiene.sh:25,28,54 `perform_curl ... || echo {...}` fallbacks never fire; error body yields no branches or a null commit date which `continue`s; runbook.robot EXCEPT defaults to empty."
      notes: "First 100 branches per repo; one extra API call per branch (rate-limit heavy)."
    - title: "Audit Repository Configuration Health"
      at: "runbook.robot:214"
      asserts: "Problem (sev4, aggregated) for repos missing README (<= 100 bytes), LICENSE, description, CONTRIBUTING.md, .github/CODEOWNERS or default-branch protection (community health score < 70 is computed but not raised)."
      reads: ["GET /repos/<r>", "GET /repos/<r>/contents/README.md, CONTRIBUTING.md, .github/CODEOWNERS", "GET /repos/<r>/branches/<default>/protection", "GET /repos/<r>/community/profile"]
      permissions: ["PAT classic: repo (branch protection needs admin on the repo); fine-grained: Contents: read, Administration: read, Metadata: read", "GitHub App: Contents: read, Administration: read"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Error direction is reversed: any 401/403/404 (including non-admin branch-protection reads) is recorded as 'missing', i.e. false positives. CONTRIBUTING only looked up at repo root; CODEOWNERS only under .github/."
    - title: "Check Release Health and Cadence"
      at: "runbook.robot:270"
      asserts: "Problem (sev3) for repos with > OVERDUE_COMMIT_THRESHOLD (30) commits since the latest release and > 14 days old; problem (sev4) for repos with no GitHub releases."
      reads: ["GET /repos/<r>/releases?per_page=10", "GET /repos/<r>", "GET /repos/<r>/compare/<last_tag>...<default_branch>"]
      permissions: ["PAT classic: repo; fine-grained: Contents: read, Metadata: read", "GitHub App: Contents: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_release_health.sh:57 `compare ... 2>/dev/null || echo {ahead_by:0}` and :25-26 fallbacks; errors give ahead_by 0 (never overdue) or an empty release list; runbook.robot EXCEPT defaults to empty."
      notes: "Repos that tag without GitHub Releases are reported as 'no releases'."
    - title: "Generate Contributor Activity Pulse"
      at: "runbook.robot:336"
      asserts: "Problem (sev3) per open PR whose requested reviewers have neither approved nor requested changes (review bottleneck); otherwise report-only activity per contributor."
      reads: ["GET /repos/<r>/commits?since=<PULSE_DAYS>&per_page=100", "GET /repos/<r>/pulls?state=open&per_page=100", "GET /repos/<r>/pulls/<n>/reviews?per_page=20"]
      permissions: ["PAT classic: repo; fine-grained: Contents: read, Pull requests: read, Metadata: read", "GitHub App: Contents: read, Pull requests: read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_contributor_pulse.sh:34 and :69 contain `if echo ... | jq -e 'type == \"array\"' >/dev/null 2>>/dev/null 2>&1 ]; then1; then` (corrupted text): `]` becomes a jq file argument and `then1` is run as a command (command not found), so both the commit loop and the PR loop bodies never execute. The script always emits zero contributors/bottlenecks; runbook.robot:352 EXCEPT defaults to empty."
      notes: "Verified by running the construct in isolation: body skipped, 'then1: command not found' on stderr. Task cannot detect anything as shipped."
  bundleNotes: "Seven read-only GitHub checks over the first page of each API collection (no pagination). Same perform_curl idiom as gh-actions-health: HTTP errors are 200-class to bash, then swallowed by jq/TRY-EXCEPT defaults, so access problems look like clean repos. Config-health is the only task where errors become findings."

- bundle: gke-cluster-health
  displayName: "GKE Cluster Health"
  classicResourceTypes: [gcp_container_clusters]
  matchHints: "any GKE cluster name (pattern .+, substring); qualifiers [project] so one SLX per project, and every script lists all clusters in the project; level basic"
  sli: false
  sliAsserts: "n/a: sli template points at codebundles/cron-scheduler-sli (schedules the runbook); no sli.robot, nothing is scored"
  egress: "cloud API: GCP container, compute, recommender, IAM, resourcemanager (gcloud), plus every cluster's Kubernetes API server (kubectl)"
  tools: [gcloud, kubectl, jq, bc, python3, bash]
  inputs: [GCP_PROJECT_ID, CRITICAL_NAMESPACES, MAX_CPU_LIMIT_OVERCOMMIT, MAX_MEM_LIMIT_OVERCOMMIT, OPERATIONS_LOOKBACK_HOURS, OPERATIONS_STUCK_HOURS, NODE_HEALTH_LOOKBACK_HOURS]
  credential: "gcp_credentials secret (service account JSON key via GOOGLE_APPLICATION_CREDENTIALS) plus kubeconfig minted per cluster with gcloud container clusters get-credentials (KUBECONFIG env)"
  tasks:
    - title: "Identify GKE Service Account Issues in GCP Project"
      at: "runbook.robot:77"
      asserts: "Problem (sev2) if a node-pool service account lacks logging.logEntries.create, monitoring.timeSeries.create or autoscaling.sites.writeMetrics according to project-level IAM bindings."
      reads: ["gcloud projects describe", "gcloud container clusters list / node-pools list / node-pools describe", "gcloud projects get-iam-policy --flatten bindings", "gcloud iam roles describe <role> per binding"]
      permissions: ["resourcemanager.projects.get", "container.clusters.list", "container.nodePools.list", "container.nodePools.get", "resourcemanager.projects.getIamPolicy", "iam.roles.get"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "sa_check.sh:105-110 `gcloud container clusters list` has no rc check; failure -> zero service accounts discovered -> :159 'All service accounts have the required permissions' and an empty issues.json. (Opposite direction: get-iam-policy/roles describe failures make every permission 'No' and flag all accounts.)"
      notes: "Only project-level bindings are inspected: inherited folder/org bindings, group grants and custom roles needing --project are missed (false positives). Uses --zone for regional clusters. Runbook reads `cat issues.json` with no rc check. Suite init runs gcloud auth activate-service-account with `|| true`."
    - title: "Fetch GKE Recommendations for GCP Project"
      at: "runbook.robot:109"
      asserts: "Problem (severity from recommendation priority) for every active google.container.DiagnosisRecommender recommendation in each cluster location; a suggestion feed, not a fault."
      reads: ["gcloud container clusters list --format=json", "gcloud recommender recommendations list --recommender=google.container.DiagnosisRecommender per location"]
      permissions: ["container.clusters.list", "recommender.containerDiagnosisRecommendations.list"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "gcp_recommendations.sh:46 `clusters list ... || true` and :66-70 `recommendations list ... 2>/dev/null || true`: failure -> empty -> 'No recommendations found for location'. When no clusters are found the script exits 0 at :47-50 before writing recommendations_issues.json, so the runbook `cat` then fails to parse (loud error, not pass)."
      notes: "RECOMMENDER_ID env defaults to the diagnosis recommender only."
    - title: "Check Kubernetes Version Support for GKE Clusters in GCP Project"
      at: "runbook.robot:141"
      asserts: "Problem if a cluster's master minor is not in get-server-config validMasterVersions (sev1), >= 3 minors behind latest (sev2, likely extended support), >= 2 behind (sev3), or node pool minors differ; includes extended-support cost estimates."
      reads: ["gcloud container clusters list --format=json", "gcloud container get-server-config --location <loc>"]
      permissions: ["container.clusters.list", "container.clusters.get (get-server-config)"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_gke_version_support.sh:65 `CLUSTERS_JSON=$(gcloud ... 2>/dev/null)` under `set -euo pipefail` kills the script on failure before version_support_issues.json is written, and runbook.robot:182 reads it with `cat ... 2>/dev/null || echo '[]'` -> no issue (rc only compared to -1). :85-86 get-server-config `2>/dev/null || echo {}` -> 'Could not fetch valid versions' -> cluster skipped silently."
      notes: "Version support is inferred from validMasterVersions and a minors-behind heuristic, not from the official support calendar; pricing constants hard-coded (0.10/0.60 USD/hr)."
    - title: "Fetch GKE Cluster Health for GCP Project"
      at: "runbook.robot:202"
      asserts: "Problem if a node is not Ready (sev2), a pod is in CrashLoopBackOff (sev1 if in CRITICAL_NAMESPACES else sev4), a node pool's CPU/memory usage is high (sev by percent of affected nodes), a pool is underutilized (cost saving, both < 25%), or cluster credentials cannot be fetched (sev4)."
      reads: ["gcloud container clusters list", "gcloud container clusters get-credentials", "kubectl get nodes", "kubectl top nodes", "kubectl get pods -A", "kubectl get nodes -o json"]
      permissions: ["container.clusters.list", "container.clusters.getCredentials", "{apiGroups: [\"\"], resources: [nodes], verbs: [get, list]}", "{apiGroups: [metrics.k8s.io], resources: [nodes], verbs: [get, list]}", "{apiGroups: [\"\"], resources: [pods], verbs: [list]}"]
      scope: all-namespaces
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "cluster_health.sh:45 `kubectl get nodes --no-headers 2>/dev/null || true` -> 'No nodes or unable to list nodes' (log only); :115 `kubectl get pods -A --no-headers 2>/dev/null | awk '$4==\"CrashLoopBackOff\"'` -> failure = no crashloops; :75 `kubectl top nodes ... || true` skips utilization."
      notes: "Only STATUS == CrashLoopBackOff exactly; Error/ImagePullBackOff/Pending are not reported. get-credentials failure is reported (sev4). bash -n on macOS bash 3.2 reports a syntax error at cluster_health.sh:384 (not verified on the runner's bash)."
    - title: "Check for Quota Related GKE Autoscaling Issues in GCP Project"
      at: "runbook.robot:236"
      asserts: "Problem if regional CPUS / IN_USE_ADDRESSES / SSD_TOTAL_GB quota cannot cover cluster min nodes (sev2) or full scale-out (sev2), or usage is >= 80% of the limit (sev3)."
      reads: ["gcloud container clusters list", "gcloud container node-pools list", "gcloud container clusters describe", "gcloud compute regions describe <region>"]
      permissions: ["container.clusters.list", "container.clusters.get", "container.nodePools.list", "compute.regions.get"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "quota_check.sh:62 `clusters list || true`, :105 `regions describe ... 2>/dev/null || true` (empty region JSON -> no quota values -> no breach), :176 `node-pools list || true`, :185 `clusters describe ... || echo {}`."
      notes: "Region derived by trimming the zone suffix from cluster location."
    - title: "Validate GKE Node Sizes for GCP Project"
      at: "runbook.robot:269"
      asserts: "Problem if pod requests/limits overload a node or node pool beyond MAX_CPU_LIMIT_OVERCOMMIT (3) / MAX_MEM_LIMIT_OVERCOMMIT (2), unscheduled pods exist, or a cheaper/better machine type is recommended; also 'Sizing failed' / 'Analysis failed' issues on exceptions."
      reads: ["gcloud container clusters list / get-credentials / describe", "kubectl get pods -A -o json", "kubectl get nodes -o json", "gcloud container node-pools list", "gcloud compute machine-types list"]
      permissions: ["container.clusters.list", "container.clusters.get", "container.clusters.getCredentials", "container.nodePools.list", "compute.machineTypes.list", "{apiGroups: [\"\"], resources: [pods, nodes], verbs: [list]}"]
      scope: all-namespaces
      readOnly: true
      falsePass: likely
      falsePassWhy: "gke_node_size.py:53-57 and :80-84 gather_pods()/allocatable() catch CalledProcessError, print a Warning and return empty dicts, so denied kubectl produces an analysis over nothing and no issue; other exceptions become 'Sizing failed' issues."
      notes: "Runbook runs it as a plain Run Cli (no rc check) and reads node_size_issues.json."
    - title: "Fetch GKE Cluster Operations for GCP Project"
      at: "runbook.robot:301"
      asserts: "Problem if a cluster operation in OPERATIONS_LOOKBACK_HOURS (24) is RUNNING/PENDING/ERROR/FAILED/ABORTING (sev3, sev2 when RUNNING > OPERATIONS_STUCK_HOURS=2) or > 1 same-type operation is in the stuck window with one RUNNING (sev2)."
      reads: ["gcloud container clusters list --format=json", "gcloud container operations list --location <loc> --filter targetLink:clusters/<name> AND startTime>..."]
      permissions: ["container.clusters.list", "container.operations.list"]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "cluster_operations.sh:86-90 `gcloud container operations list ... >\"$op_file\" || true` (per cluster): failure -> empty op file -> zero operations -> no issue."
      notes: "Issues file is removed at start, so a script crash before completion makes the runbook cat/parse fail loudly rather than pass."
    - title: "Check Node Pool Health for GCP Project"
      at: "runbook.robot:336"
      asserts: "Problem if a node pool is not running, exceeds/at max capacity, instance groups have no/failed instances or high failure rate, compute operations failed (quota/capacity exhaustion), node counts mismatch compute instances, K8s node events are critical, pods fail scheduling or disks fail to attach, or the cluster is not RUNNING."
      reads: ["gcloud compute instances list", "gcloud compute instance-groups managed list / list-instances", "gcloud compute operations list --filter insertTime>-P<N>H", "gcloud container clusters list / get-credentials / describe / node-pools list", "kubectl get nodes -o json", "kubectl get events (current namespace only) -o json"]
      permissions: ["compute.instances.list", "compute.instanceGroupManagers.list", "compute.instanceGroups.list", "compute.operations.list", "container.clusters.list", "container.clusters.get", "container.clusters.getCredentials", "container.nodePools.list", "{apiGroups: [\"\"], resources: [nodes], verbs: [list]}", "{apiGroups: [\"\"], resources: [events], verbs: [list]}"]
      scope: cluster
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "node_pool_health.sh:99-102,106-109,113-118 `gcloud compute ... 2>/dev/null || echo '[]'`; :158-165 `kubectl get nodes/events ... 2>/dev/null || echo '{\"items\":[]}'`; :197-201 node-pools list `|| echo '[]'`; :779-787 clusters list `|| echo '[]'` exits 0 with an empty issue file."
      notes: "`kubectl get events` has no -A, so only the kubeconfig's current namespace is read. 851-line script; fetches project-wide compute data once and filters locally."
  bundleNotes: "Eight tasks, no SLI. Fail-open is pervasive in the shell scripts (`|| true`, `2>/dev/null || echo '[]'`). Several tasks need a Kubernetes-API path from the runner to each cluster in the project (private clusters will silently produce empty kubectl output)."

- bundle: jenkins-health
  displayName: "Jenkins Health"
  classicResourceTypes: [ec2_instance]
  matchHints: "AWS EC2 instance (platform aws) whose tag values contain 'jenkins-server' AND state/Name contains 'running'; qualifiers [resource]; level detailed"
  sli: true
  sliAsserts: "Average of 6 binary scores: failed builds <= MAX_FAILED_BUILDS, long-running builds <= MAX_LONG_RUNNING_BUILDS, failed tests <= MAX_ALLOWED_FAILED_TESTS, /api/json reachable, queued builds <= MAX_QUEUED_BUILDS, no executor label above MAX_EXECUTOR_UTILIZATION. False-pass confirmed for failed-builds and long-running scores: failed_build_logs.sh / long_running_builds.sh output that is not JSON (401 HTML page, curl failure) falls into the EXCEPT that defaults to an empty list (sli.robot:27, :48). Library-based and health scores fail closed."
  egress: "Jenkins server at JENKINS_URL over HTTP(S) (customer network)"
  tools: [curl, jq, column, bash, "python requests (libraries/Jenkins)"]
  inputs: [JENKINS_URL, LONG_RUNNING_BUILD_MAX_WAIT_TIME, QUEUED_BUILD_MAX_WAIT_TIME, MAX_EXECUTOR_UTILIZATION, JENKINS_INSTANCE_NAME]
  credential: "JENKINS_USERNAME + JENKINS_TOKEN secrets (Jenkins user API token, HTTP basic auth)"
  tasks:
    - title: "List Failed Build Logs in Jenkins Instance"
      at: "runbook.robot:15"
      asserts: "Problem (sev3) for each top-level job whose lastBuild.result == FAILURE, with console log excerpts mapped to suggestions via error_patterns.json."
      reads: ["GET <JENKINS_URL>/api/json?depth=2", "GET <build url>logText/progressiveText?start=0 per failed job"]
      permissions: ["Jenkins Overall/Read and Job/Read (builds and console output) for the token's user"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "failed_build_logs.sh: `curl -s` with no -f; a 401/403 HTML body is non-empty so the :14 empty-check passes, then `jq -c '.jobs[] ...'` errors inside the pipeline, the loop never runs and the script prints `[ ]`; runbook.robot:24-29 TRY/EXCEPT also turns a non-JSON error message into an empty list -> 'No failed builds found'."
      notes: "Only lastBuild of top-level jobs (no folders/multibranch traversal); depth=2 fetch of the whole tree."
    - title: "List Long Running Builds in Jenkins Instance"
      at: "runbook.robot:64"
      asserts: "Problem (sev4) for jobs whose lastBuild is still building longer than LONG_RUNNING_BUILD_MAX_WAIT_TIME."
      reads: ["GET <JENKINS_URL>/api/json?depth=2"]
      permissions: ["Jenkins Overall/Read and Job/Read"]
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "long_running_builds.sh pipes `curl -s` output to jq; HTML/auth-error body makes jq fail, stdout is not the expected JSON, and runbook.robot:75-80 EXCEPT defaults to an empty object -> 'No long running builds found'."
      notes: "Threshold parser accepts minutes 0-59, hours 0-23, days only; default value is the literal string with quotes (\"10m\") which convert_to_minutes would reject if the quotes are passed through (unverified)."
    - title: "List Recent Failed Tests in Jenkins Instance"
      at: "runbook.robot:109"
      asserts: "Problem (sev3) per failed test case in jobs whose lastBuild.result is UNSTABLE."
      reads: ["GET <JENKINS_URL>/api/json?depth=2", "GET <lastBuild url>testReport/api/json per UNSTABLE job"]
      permissions: ["Jenkins Overall/Read and Job/Read"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Library raises ConnectionError on any HTTP failure (raise_for_status), so errors fail the task loudly. Only UNSTABLE builds are inspected; FAILURE builds with test failures are not."
    - title: "Check Jenkins Instance Health"
      at: "runbook.robot:151"
      asserts: "Problem (sev1) if GET /api/json does not return parseable JSON."
      reads: ["curl -s -u user:token <JENKINS_URL>/api/json"]
      permissions: ["Jenkins Overall/Read"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Any non-JSON response (HTML login page, timeout) is an issue. A JSON 200 from a reverse proxy would pass. TODO in source: capture more exceptions."
    - title: "List Long Queued Builds in Jenkins Instance"
      at: "runbook.robot:174"
      asserts: "Problem (sev4) per queue item waiting longer than QUEUED_BUILD_MAX_WAIT_TIME."
      reads: ["GET <JENKINS_URL>/queue/api/json", "GET queued item url for task name"]
      permissions: ["Jenkins Overall/Read"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Library raises ConnectionError on failure; the TRY/EXCEPT in the runbook wraps only the post-processing, not the call."
    - title: "List Executor Utilization in Jenkins Instance"
      at: "runbook.robot:224"
      asserts: "Problem (sev3) if busyExecutors/totalExecutors of an assignedLabels entry exceeds MAX_EXECUTOR_UTILIZATION (80%)."
      reads: ["GET <JENKINS_URL>/api/json?depth=2 (assignedLabels)"]
      permissions: ["Jenkins Overall/Read"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Utilization is per label (built-in, agent labels), not per node, so a node with several labels is counted several times. Library raises on HTTP failure."
    - title: "Fetch Jenkins Instance Logs and Add to Report"
      at: "runbook.robot:266"
      asserts: "Report only: parses the Jenkins system log Atom feed into the report; never raises an issue."
      reads: ["GET <JENKINS_URL>/manage/log/rss"]
      permissions: ["permission to read /manage/log (Overall/Administer or SystemRead; unverified)"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Fails loudly (ConnectionError) if the feed is not readable."
  bundleNotes: "Mix of two idioms: shell scripts (fail open via JSON-parse EXCEPT defaults) and the Jenkins Python library (raises on HTTP errors, fail closed). The generation rule is AWS-only (EC2 tagged jenkins-server), so Jenkins elsewhere is manual."

- bundle: mailgun-sending-domain-health
  displayName: "Mailgun Sending Domain Delivery & DNS Health"
  classicResourceTypes: []
  matchHints: "no .runwhen directory (manual SLX only); domains in scope come from RESOURCES=All discovery (GET /v3/domains) or a single RESOURCES value"
  sli: true
  sliAsserts: "Average of 4 binary scores for ONE domain (MAILGUN_SENDING_DOMAIN): domain state active, delivery success >= MAILGUN_MIN_DELIVERY_SUCCESS_PCT, SPF includes mailgun, week volume not down >= MAILGUN_VOLUME_DROP_THRESHOLD_PCT vs 30-day average. API/parse failures score 0. False-pass partial: zero email volume scores delivery 1 and insufficient history (< 10 messages) scores volume 1 (sli-mailgun-delivery-score.sh, sli-mailgun-volume-trend-score.sh)."
  egress: "public internet: api.mailgun.net or api.eu.mailgun.net, plus public DNS lookups from the runner"
  tools: [curl, jq, awk, dig, python3, bash]
  inputs: [MAILGUN_SENDING_DOMAIN, MAILGUN_API_REGION, RESOURCES, MAILGUN_STATS_WINDOW_HOURS, MAILGUN_MIN_DELIVERY_SUCCESS_PCT, MAILGUN_MAX_BOUNCE_RATE_PCT, MAILGUN_MAX_COMPLAINT_RATE_PCT, MAILGUN_VERIFY_MX, MAILGUN_VOLUME_DROP_THRESHOLD_PCT, MAILGUN_DELIVERED_SAMPLE_SIZE]
  credential: "mailgun_api_key secret (Mailgun private API key, basic auth api:KEY)"
  tasks:
    - title: "Validate Mailgun Domain Scope Configuration"
      at: "runbook.robot:19"
      asserts: "Problem (sev4) if no sending domain resolved from RESOURCES=All discovery or the override."
      reads: ["GET /v3/domains?limit=100 (suite-init discovery via discover-mailgun-domains.sh)"]
      permissions: ["Mailgun API key with read access to domains"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Discovery failure or an auth error body yields an empty list, which is reported as the issue. Only the first page (100) of domains."
    - title: "Verify Mailgun Domain Registration and State for Domains in Scope"
      at: "runbook.robot:36"
      asserts: "Per domain: problem (sev4) if GET /v3/domains/<d> is not HTTP 200; problem (sev3) if state != active; problem (sev3) per sending_dns_records entry with active == false."
      reads: ["GET /v3/domains/<domain>"]
      permissions: ["Mailgun API key with read access to the domain"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "HTTP code is checked (curl -w %{http_code}). Residual: if the script dies before writing its issue file (missing key, jq failure under set -e) the runbook cats a missing/stale file and the EXCEPT defaults to empty; the file is shared across domains in the loop so a crash can reuse the previous domain's issues."
    - title: "Check Delivery Success Rate for Mailgun Domains in Scope"
      at: "runbook.robot:75"
      asserts: "Per domain: problem (sev3) if delivered/(delivered+failed) over MAILGUN_STATS_WINDOW_HOURS (24) < MAILGUN_MIN_DELIVERY_SUCCESS_PCT (95); problem (sev3) if the metrics API is not HTTP 200."
      reads: ["POST /v1/analytics/metrics (delivered_count, failed_count, include_aggregates)"]
      permissions: ["Mailgun API key with analytics read access"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Zero volume in the window prints 'nothing to evaluate' and raises no issue (a silent sender is not a delivery failure here). The failed bucket sums all failure types, including temporary ones."
    - title: "Check Bounce and Complaint Rates for Mailgun Domains in Scope"
      at: "runbook.robot:114"
      asserts: "Per domain: problem (sev3) if bounced/accepted > MAILGUN_MAX_BOUNCE_RATE_PCT (5); problem (sev4) if complained/accepted > MAILGUN_MAX_COMPLAINT_RATE_PCT (0.1); API error (sev3)."
      reads: ["POST /v1/analytics/metrics (accepted_outgoing_count, bounced_count, complained_count)"]
      permissions: ["Mailgun API key with analytics read access"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Denominator forced to 1 when accepted is 0 (rates then equal raw counts)."
    - title: "Sample Recent Delivered Messages for Mailgun Domains in Scope"
      at: "runbook.robot:153"
      asserts: "Report only: samples MAILGUN_DELIVERED_SAMPLE_SIZE delivered events (recipient, subject, details) from the last 7 days; never raises an issue."
      reads: ["POST /v1/analytics/logs (events: delivered)"]
      permissions: ["Mailgun API key with logs read access"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "An HTTP error prints 'ERROR: HTTP <code>' into the report only (exit 0). Recipient addresses and subjects (PII) land in the report."
    - title: "Analyze 30-Day Volume Trends for Mailgun Domains in Scope"
      at: "runbook.robot:171"
      asserts: "Per domain: problem (sev2) for a day-over-day drop >= MAILGUN_VOLUME_DROP_THRESHOLD_PCT (80, prev day >= 10 msgs) and for current-week volume down >= threshold vs historical average; plus suppression/rate-limit findings; API error issue."
      reads: ["POST /v1/analytics/metrics (30 days, daily resolution)"]
      permissions: ["Mailgun API key with analytics read access"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Embedded python3 analysis; thresholds on low-volume domains are skipped."
    - title: "Check Recent Permanent Failures in Mailgun Events for Domains in Scope"
      at: "runbook.robot:210"
      asserts: "Per domain: problem (sev3) if any 'failed' events exist in the last 1 day (up to 25 sampled); API error (sev3)."
      reads: ["POST /v1/analytics/logs (events: failed, duration 1d, limit 25)"]
      permissions: ["Mailgun API key with logs read access"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Any failed event raises an issue regardless of rate."
    - title: "Check for Rejected Messages in Mailgun for Domains in Scope"
      at: "runbook.robot:249"
      asserts: "Per domain: problem (sev2) if more than 5 'rejected' events exist in the last 5 days; API error (sev3)."
      reads: ["POST /v1/analytics/logs (events: rejected, 5 days)"]
      permissions: ["Mailgun API key with logs read access"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Fewer than 6 rejections are printed but not raised."
    - title: "Verify SPF Record for Mailgun Sending Domains in Scope"
      at: "runbook.robot:288"
      asserts: "Per domain: problem (sev3) if no v=spf1 TXT is published, or if the SPF TXT does not mention mailgun."
      reads: ["dig +short TXT <domain>", "GET /v3/domains/<domain> (expected SPF value, best effort)"]
      permissions: ["Mailgun API key with domain read access", "public DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "verify-mailgun-spf-dns.sh `txt=$(dig +short TXT ... | tr ...)` under `set -euo pipefail`: a failing dig (no dig binary, resolver timeout rc 9) kills the script before mailgun_spf_issues.json is rewritten; the runbook ignores rc and its EXCEPT defaults to an empty list. (An empty but successful answer is reported as 'Missing SPF'.)"
      notes: "Substring check for 'mailgun' and v=spf1 only; does not validate includes or lookup limits."
    - title: "Verify DKIM DNS Records for Mailgun Domains in Scope"
      at: "runbook.robot:327"
      asserts: "Per domain: problem if a Mailgun-published _domainkey TXT record is inactive in Mailgun or the published DNS TXT does not contain the expected value."
      reads: ["GET /v3/domains/<domain> (sending_dns_records)", "dig +short TXT <selector>._domainkey.<domain>"]
      permissions: ["Mailgun API key with domain read access", "public DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "verify-mailgun-dkim-dns.sh: the record loop reads `jq ... 2>/dev/null || true`, so a response without _domainkey TXT records yields zero iterations and no issue; dig failure under pipefail aborts before the issue file is written and the runbook EXCEPT defaults to empty. HTTP non-200 is reported."
      notes: "Compares full TXT string with grep -F, sensitive to DNS provider TXT splitting."
    - title: "Verify DMARC Policy for Mailgun Sending Domains in Scope"
      at: "runbook.robot:366"
      asserts: "Per domain: problem (sev2) if no TXT with v=DMARC1 exists at _dmarc.<domain>."
      reads: ["dig +short TXT _dmarc.<domain>"]
      permissions: ["public DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "verify-mailgun-dmarc-dns.sh: same `dig ... | tr` under `set -euo pipefail` and ignored rc; dig failure leaves no/stale issue file and the runbook EXCEPT defaults to empty."
      notes: "Does not check policy strength (p=none passes) and looks only at the exact domain, not the organizational domain."
    - title: "Verify MX Records for Mailgun Domains When MX Verification Is Enabled"
      at: "runbook.robot:405"
      asserts: "Only when MAILGUN_VERIFY_MX is true: problem if no MX is published or published MX does not mention mailgun while Mailgun lists receiving MX records."
      reads: ["GET /v3/domains/<domain> (receiving_dns_records)", "dig +short MX <domain>"]
      permissions: ["Mailgun API key with domain read access", "public DNS resolution from the runner"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "Default MAILGUN_VERIFY_MX=false writes an empty issue list and exits (verify-mailgun-mx-dns.sh), so by default it asserts nothing; with it enabled the dig-under-pipefail failure mode is the same as SPF/DMARC."
      notes: "Task is a no-op in default configuration."
  bundleNotes: "HTTP checks use curl -w %{http_code} with explicit non-200 handling (good). Weak spots are the dig-based DNS tasks (script crash -> missing/stale file -> EXCEPT empty list) and temp files under /tmp/mg_*.json shared across domains. Issue files in cwd are reused across the per-domain loop. No generation rules."

- bundle: openrouter-spend-health
  displayName: "OpenRouter Spend Health and Forecasting"
  classicResourceTypes: []
  matchHints: "no .runwhen directory (manual SLX only)"
  sli: true
  sliAsserts: "Average of 6 binary scores: API reachable (balance script reports no 'Cannot Reach'/'Invalid' issue), key limit_remaining >= OPENROUTER_MIN_BALANCE_USD, credits available, budget adherence (usage_monthly <= OPENROUTER_BUDGET_USD, or 1 when budget 0), no anomalies, no model concentration. False-pass confirmed for Budget Adherence: `curl -s .../key | jq '.data.usage_monthly // .data.usage // \"0\"'` (sli.robot:150) turns any API failure into usage 0 <= budget -> 1; also scores 1 whenever OPENROUTER_BUDGET_USD is 0 (the default). Balance sufficiency fails closed."
  egress: "public internet: openrouter.ai/api/v1"
  tools: [curl, jq, bc, bash]
  inputs: [OPENROUTER_API_KEY_LABEL, OPENROUTER_LOOKBACK_DAYS, OPENROUTER_BUDGET_USD, OPENROUTER_MIN_BALANCE_USD, OPENROUTER_SPEND_CONCENTRATION_THRESHOLD, OPENROUTER_BALANCE_ALERT_WINDOW_DAYS, OPENROUTER_ANOMALY_STDDEV_THRESHOLD]
  credential: "OPENROUTER_API_KEY secret (Bearer token; a management key is required for /activity, /keys, /credits, /workspaces)"
  tasks:
    - title: "Check OpenRouter Account Balance for Account"
      at: "runbook.robot:19"
      asserts: "Problem if /key is unreachable or the key is invalid/expired, remaining balance (limit_remaining, or credits for management keys) < OPENROUTER_MIN_BALANCE_USD (10) or not reported, disabled child keys exist, keys have no spend limit, or no workspaces found."
      reads: ["GET /api/v1/key", "GET /api/v1/workspaces", "GET /api/v1/keys?include_disabled=true", "GET /api/v1/credits"]
      permissions: ["OpenRouter API key (management key for workspaces/keys/credits)"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "HTTP status checked on every call (curl -w http_code) and failures become issues. An inference-only key cannot see account credits and gets 'Remaining Credits Not Reported'."
    - title: "Review OpenRouter Spend History for Account"
      at: "runbook.robot:55"
      asserts: "Problem if /activity needs a management key (403), cannot be fetched, returns no rows over the lookback (sev2), or has missing days."
      reads: ["GET /api/v1/activity?date=<D> for each day in OPENROUTER_LOOKBACK_DAYS (capped to 30)"]
      permissions: ["OpenRouter management API key"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "One HTTP call per day (up to 30)."
    - title: "Analyze OpenRouter Spend by Model for Account"
      at: "runbook.robot:91"
      asserts: "Problem if a single model's share of spend exceeds OPENROUTER_SPEND_CONCENTRATION_THRESHOLD (50%), or /activity cannot be fetched."
      reads: ["GET /api/v1/activity?date=<D> per day"]
      permissions: ["OpenRouter management API key"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Zero activity rows exit with an empty issue list (no signal, no issue)."
    - title: "Check OpenRouter Budget Status for Account"
      at: "runbook.robot:127"
      asserts: "Problem if cumulative key usage exceeds OPENROUTER_BUDGET_USD or the budget is at depletion risk; skipped entirely when the budget is 0 (default)."
      reads: ["GET /api/v1/key", "GET /api/v1/workspaces and /api/v1/keys (management keys)"]
      permissions: ["OpenRouter API key (management key for aggregation)"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Asserts nothing in the default configuration (budget disabled). API errors are raised as 'Cannot Reach' / 'Key Invalid' issues."
    - title: "Forecast OpenRouter Spend Trend for Account"
      at: "runbook.robot:163"
      asserts: "Problem if projected spend from the average daily burn would exceed the budget, or if the key limit will be depleted within OPENROUTER_BALANCE_ALERT_WINDOW_DAYS (7)."
      reads: ["GET /api/v1/activity?date=<D> per day", "GET /api/v1/key"]
      permissions: ["OpenRouter management API key"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Budget projection only fires when a budget is configured."
    - title: "Detect OpenRouter Spend Anomalies for Account"
      at: "runbook.robot:199"
      asserts: "Problem if a day's spend is a z-score outlier above OPENROUTER_ANOMALY_STDDEV_THRESHOLD (2) or spend is accelerating; activity fetch errors raise issues."
      reads: ["GET /api/v1/activity?date=<D> per day"]
      permissions: ["OpenRouter management API key"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Needs several days of data for a baseline."
  bundleNotes: "Good pattern: every API call captures the HTTP status and failure branches write issues. All tasks and the SLI re-run the same scripts; SLI Balance/Budget sub-scores bypass the scripts with an inline curl|jq."

- bundle: terraform-cloud-workspace-lock-check
  displayName: "Terraform Cloud Workspace Lock Check"
  classicResourceTypes: []
  matchHints: "no .runwhen directory (manual SLX only)"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: "public internet: app.terraform.io (or TERRAFORM_API_URL) API v2"
  tools: [curl, bash]
  inputs: [TERRAFORM_API_URL, TERRAFORM_ORGANIZATION_NAME, TERRAFORM_WORKSPACE_NAME]
  credential: "TERRAFORM_API_TOKEN secret (Terraform Cloud/Enterprise API token, written to a secret file and sent as Bearer)"
  tasks:
    - title: "Checking whether the Terraform Cloud Workspace is in a locked state"
      at: "runbook.robot:17"
      asserts: "Problem (sev4) if data.attributes.locked of the workspace is not false."
      reads: ["GET <TERRAFORM_API_URL>/organizations/<org>/workspaces/<workspace>"]
      permissions: ["Terraform Cloud token with read access to the workspace (team/user token with workspace Read)"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "RW.CLI.Parse Cli Json Output enforces rc == 0, and runbook.robot:31 indexes ['data']['attributes']['locked'] so a 401/404 error body raises KeyError (loud failure, not a pass). A workspace is also locked during every active run, so 'locked' is not necessarily a fault."
  bundleNotes: "Single GET, fails loudly on API errors."

- bundle: vercel-project-health
  displayName: "Vercel Project Health"
  classicResourceTypes: []
  matchHints: "no .runwhen directory (manual SLX only); one or many projects via VERCEL_PROJECT_ID / VERCEL_PROJECT_IDS"
  sli: true
  sliAsserts: "Average of 8 sub-scores: API reachable, latest production deployment READY, recent failed deployments <= SLI_MAX_RECENT_FAILED_DEPLOYMENTS, production branch matches EXPECTED_PRODUCTION_BRANCH, production deployment fresh (<168h), alias current, all production domains verified, runtime error sample <= SLI_MAX_ERROR_EVENTS. False-pass confirmed: Score Vercel Runtime Error Sample (sli.robot:227-270) leaves count 0 -> score 1 on api-error, missing-owner-id or missing token (reason only logged); Domain Verification defaults to 1 when the token is empty (sli.robot:195-196)."
  egress: "public internet: api.vercel.com REST, vercel.com/api/logs/request-logs (dashboard endpoint), and HTTP GET probes to the project's production URL"
  tools: [bash, curl, jq, python3 (libraries/Vercel)]
  inputs: [VERCEL_TEAM_ID, VERCEL_PROJECT_ID, VERCEL_PROJECT_IDS, VERCEL_ARTIFACT_ROOT, TIME_WINDOW_HOURS, DEPLOYMENT_ENVIRONMENT, UNHEALTHY_HTTP_CODES, MIN_REQUEST_COUNT_THRESHOLD, VERCEL_REQUEST_LOGS_ENV, VERCEL_REQUEST_LOGS_MAX_ROWS, VERCEL_REQUEST_LOGS_MAX_PAGES, VERCEL_PROBE_PATHS, VERCEL_PROBE_BASE_URL, VERCEL_PROBE_TIMEOUT_SECONDS, VERCEL_PROBE_SLOW_MS, DEPLOYMENT_SNAPSHOT_LIMIT, MAX_FAILED_DEPLOYMENTS_TO_DIAGNOSE, MAX_DEPLOYMENTS_TO_SCAN]
  credential: "vercel_token secret (Vercel API token with read access to the team/project; import is optional and a missing token raises 'Vercel token missing' issues)"
  tasks:
    - title: "Fetch Vercel Project Configuration for Configured Project(s)"
      at: "runbook.robot:20"
      asserts: "Report only (sanitized project metadata); problem (sev4) if the token is missing/invalid (invalidToken) or the project cannot be fetched."
      reads: ["GET /v9/projects/{id}"]
      permissions: ["Vercel token with read access to the project (team scope via teamId)"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Writes vercel_project_raw.json and vercel_project_config.json to the artifact dir; those files are used by later tasks (probe base URL)."
    - title: "Report Vercel Deployment Branches and Status for Configured Project(s)"
      at: "runbook.robot:28"
      asserts: "Problem (sev3) if the deployments list is empty or the newest production deployment readyState != READY; API failure raises sev4."
      reads: ["GET /v6/deployments?projectId=<id>&target=..."]
      permissions: ["Vercel token with read access to deployments"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Snapshot written to the artifact dir for the diagnose task."
    - title: "Diagnose Recent Failed Vercel Deployments for Configured Project(s)"
      at: "runbook.robot:36"
      asserts: "One problem (sev3) per ERROR/CANCELED/FAILED deployment in the snapshot (capped by MAX_FAILED_DEPLOYMENTS_TO_DIAGNOSE) that carries an errorCode/errorMessage."
      reads: ["GET /v13/deployments/{id} per failed deployment (from the snapshot written by the previous task)"]
      permissions: ["Vercel token with read access to deployments"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "runbook.robot:446-448 and diagnose-recent-failed-deployments.sh:37-47 treat a missing snapshot (task 2 not run or failed) as api_status=missing-snapshot -> prints 'Run the deployment-branches task first' and exits 0 with no issue."
      notes: "Hidden dependency on vercel_deployments_snapshot.json from the branches task in the same working dir."
    - title: "Verify Vercel Project Production Domains for Configured Project(s)"
      at: "runbook.robot:44"
      asserts: "One problem (sev3) per production-bound domain with verified == false; API failure raises sev3."
      reads: ["GET /v9/projects/{id}/domains"]
      permissions: ["Vercel token with read access to project domains"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Preview/custom-environment aliases are excluded."
    - title: "Resolve Vercel Deployments in Time Window for Configured Project(s)"
      at: "runbook.robot:52"
      asserts: "Problem if no READY deployment of DEPLOYMENT_ENVIRONMENT overlaps the TIME_WINDOW_HOURS (24) lookback."
      reads: ["GET /v6/deployments?projectId=<id>"]
      permissions: ["Vercel token with read access to deployments"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "API failure raises sev4. A selection exception creates an empty id list and only logs a WARN, then the shell script reports no coverage."
    - title: "Collect Vercel Request Logs for Configured Project(s)"
      at: "runbook.robot:60"
      asserts: "Collection only: writes request-log rows for the window; problem (sev3) if the project has no accountId/ownerId or the request-logs query fails."
      reads: ["GET /v9/projects/{id}", "GET https://vercel.com/api/logs/request-logs?projectId=..&ownerId=.. (paginated)"]
      permissions: ["Vercel token with read access to the project and its logs"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Uses the undocumented dashboard request-logs endpoint (not the public REST API); may change without notice. Rows file is pre-created as [] so downstream tasks read it even when this task failed."
    - title: "Aggregate 4xx Paths from Vercel Request Logs for Configured Project(s)"
      at: "runbook.robot:68"
      asserts: "Report only: groups 4xx responses by code/path/method; the issues file is always []."
      reads: ["local vercel_request_log_rows.json from the collect task"]
      permissions: ["none (local files)"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "aggregate-vercel-4xx-paths.sh: a missing or empty rows file prints 'No request-log rows file found. Run the collector task first.' and exits 0; jq failures `|| echo 0`. Never produces an issue anyway."
      notes: "Never raises issues; 4xx are only surfaced via the summary task for 401/403."
    - title: "Aggregate 5xx Paths from Vercel Request Logs for Configured Project(s)"
      at: "runbook.robot:76"
      asserts: "Problem (sev2) if any 5xx response appears in the collected rows for the window."
      reads: ["local vercel_request_log_rows.json from the collect task"]
      permissions: ["none (local files)"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "aggregate-vercel-5xx-paths.sh:31-38 missing/empty rows file (`[[ ! -s ]]` -> exit 0) or `jq length ... || echo 0` exits 0 with no issue; a failed collector (which raised its own issue in the previous task) is invisible to this task in isolation."
      notes: "Ignores MIN_REQUEST_COUNT_THRESHOLD (one 5xx is enough)."
    - title: "Aggregate Other Unhealthy HTTP Codes from Vercel Request Logs for Configured Project(s)"
      at: "runbook.robot:84"
      asserts: "Report only: groups UNHEALTHY_HTTP_CODES (default 408,429) by code/path/method; the issues file is always []."
      reads: ["local vercel_request_log_rows.json from the collect task"]
      permissions: ["none (local files)"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "Same missing-rows/`|| echo 0` handling as the 4xx/5xx scripts, and it never emits an issue."
      notes: "Never raises issues."
    - title: "Build Consolidated Vercel HTTP Error Summary for Configured Project(s)"
      at: "runbook.robot:92"
      asserts: "Problem (sev2) if 5xx hits were seen; problem (sev3) if 401/403 hits reach MIN_REQUEST_COUNT_THRESHOLD (5)."
      reads: ["local aggregate files (vercel_aggregate_4xx/5xx/other.json)"]
      permissions: ["none (local files)"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "report-vercel-http-error-summary.sh:41-43 `[[ -s file ]] && cat file || echo '[]'` for each input: absent aggregates (collector or an earlier task skipped) read as empty -> no issue."
      notes: "Depends on three prior tasks' artifacts."
    - title: "Probe Production URL Paths for Configured Project(s)"
      at: "runbook.robot:100"
      asserts: "Problem (sev4/3/2) if a synthetic GET against VERCEL_PROBE_PATHS on the production URL returns 5xx, no response (DNS/TLS/connect failure), 4xx, or is slower than VERCEL_PROBE_SLOW_MS (2000)."
      reads: ["curl -sS -L GET <base>/<path> for each probe path (base from VERCEL_PROBE_BASE_URL, custom production alias or latest production deployment URL)"]
      permissions: ["network egress to the production site"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "curl failure is classified as a total failure issue. Cannot determine base URL raises a sev4 issue. Uses vercel_project_config.json from task 1 unless VERCEL_PROBE_BASE_URL is set."
  bundleNotes: "Eleven tasks share state through files in the artifact dir (tasks must run in order in one working dir). Committed in the repo: vercel_*.json artifacts from a real project (including account id and env metadata) sit next to the scripts and should not be there. The Vercel-API tasks are properly error-checked; the aggregation/summary tasks and the SLI runtime-error sub-score fail open."
