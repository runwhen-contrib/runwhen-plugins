# CNT-1 inventory, group k8s-c. rw-cli-codecollection origin/main @ 49ab483. Read-only study.
# Common facts for every bundle below (not repeated per task):
#  - Suite Setup calls RW.K8sHelper.Verify Cluster Connectivity (kubectl version, k8s_helper.py:42-76) except where noted;
#    a failure raises a sev3 issue and aborts the suite (Fatal Error), so total-cluster-unreachable is NOT a false-pass.
#  - RW.CLI.Run Cli never fails on rc!=0 and uses bash -c without pipefail. RW.CLI.Parse Cli Json Output DOES raise on rc!=0
#    (cli_utils.verify_rsp) but then json.loads('') raises on empty stdout, so the task errors rather than passing.
#  - Every bundle needs the kubeconfig secret (not repeated under inputs).
- bundle: k8s-podresources-health
  displayName: Kubernetes Pod Resources Health
  classicResourceTypes: [namespace]
  matchHints: "pattern '.' on name, substring; level of detail detailed; qualifiers namespace, cluster"
  sli: false
  sliAsserts: ""
  egress: none
  tools: [kubectl, jq, awk, sed, date (GNU)]
  inputs: [NAMESPACE, CONTEXT, LABELS, KUBERNETES_DISTRIBUTION_BINARY, UTILIZATION_THRESHOLD, DEFAULT_INCREASE, RESTART_AGE]
  tasks:
    - title: Show Pods Without Resource Limit or Resource Requests Set in Namespace
      at: runbook.robot:20
      asserts: "Running pods (optionally label-filtered) have containers with no resources.limits, or no resources.requests; raised as sev4 issues."
      reads:
        - "kubectl get pods -n NS [-l LABELS] --field-selector=status.phase=Running -ojson | jq '[containers where .resources.limits==null]' (and again for requests)"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "kubectl|jq has no pipefail, but a failed kubectl gives empty stdout and Parse Cli Json Output then json.loads('') raises, so the task errors (no healthy report). Zero Running pods = no issue (healthy by omission). NAMESPACE doc says csv supported but -n NS is used verbatim, so csv breaks. Counts containers but the issue text says pods. Init containers ignored. Report line sums limit+request container counts."
    - title: Check Pod Resource Utilization with Top in Namespace
      at: runbook.robot:93
      asserts: "Nothing; informational. Prints kubectl top --containers per Running pod. No issue is ever raised."
      reads:
        - "kubectl get pods [-l LABELS] -n NS -o custom-columns=:metadata.name --field-selector=status.phase=Running"
        - "kubectl top pod POD -n NS --containers (loop)"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [metrics.k8s.io], resources: [pods], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Failure or no metrics-server yields the report text 'No resource utilization information could be found!' (inconclusive, not healthy). No assertion, so nothing to port as a check; candidate for a typed read output only."
    - title: Identify VPA Pod Resource Recommendations in Namespace
      at: runbook.robot:110
      asserts: "A Deployment-targeted VerticalPodAutoscaler recommendation differs from the Deployment container request by more than 20 percent (CPU or memory); sev4."
      reads:
        - "kubectl get vpa -n NS --context CTX -o json"
        - "kubectl get deployment TARGET -n NS -o json (per VPA, Deployment only)"
      permissions:
        - {apiGroups: [autoscaling.k8s.io], resources: [verticalpodautoscalers], verbs: [get, list]}
        - {apiGroups: [apps], resources: [deployments], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vpa_recommendations.sh:142 vpa_json=$(kubectl get vpa ...) has no rc/stderr check; VPA CRD missing or Forbidden gives empty vpa_json, the loop at :149 never runs, and :161 prints 'No recommendations.' which the runbook treats as healthy."
      notes: "get_current_requests only handles kind Deployment (vpa_recommendations.sh:55-60); StatefulSet/DaemonSet targets print 'Unsupported target kind' and are silently dropped. Division by vpa target 0 or empty would abort the shell arithmetic. Threshold variable is 20 though the comment says 10. The runbook re-extracts JSON by awk after 'Recommended Next Steps:' and passes stdout inside single quotes to echo, which breaks if output contains a quote."
    - title: Identify Overutilized Pods in Namespace
      at: runbook.robot:144
      asserts: "Pods whose kubectl-top CPU or memory exceeds UTILIZATION_THRESHOLD percent of the pod limit (sev3), or whose last termination was OOMKilled/exit 137 within RESTART_AGE minutes (sev2)."
      reads:
        - "kubectl top pod -n NS --no-headers"
        - "kubectl get pod POD -o jsonpath for limits.cpu, limits.memory, lastState.terminated.{reason,exitCode,finishedAt}"
        - "find_resource_owners.sh: kubectl get Pod -n NS | grep NAME; kubectl get pod/replicaset ownerReferences"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [metrics.k8s.io], resources: [pods], verbs: [get, list]}
        - {apiGroups: [apps], resources: [replicasets], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "identify_resource_contrained_pods.sh:37 pods=$(kubectl top pod ... | awk) with no rc check; metrics-server absent or top Forbidden gives empty pods, the :40 loop never runs, and :116-124 writes '[]' to overutilized_pods.json, which the runbook (:152-160) reads as no overutilized pods."
      notes: "Bugs: multi-container pods make jsonpath limits space-separated so the arithmetic breaks (:44-63); only Gi/Mi memory and m/core CPU suffixes are converted; pods with no limits are skipped entirely. Combined reason 'CPU usage exceeds threshold and memory usage exceeds threshold' only matches the CPU branch in the runbook (:179 vs :191, capital M). check_pod_status uses GNU date -d, which is empty-safe only by accident. Output file overutilized_pods.json is relative to cwd. Owner lookup via grep on names can mis-attribute."
  bundleNotes: "Generation rule is namespace-scoped (one SLX per namespace) though every task is pod-level. No SLI. Three of four tasks are check-like, one is informational."

- bundle: k8s-postgres-healthcheck
  displayName: Kubernetes Postgres Healthcheck
  classicResourceTypes: [postgresclusters.postgres-operator.crunchydata.com, statefulset, postgresqls.acid.zalan.do]
  matchHints: "crunchy: pattern '.+' on name, substring; zalando-ss: statefulset where label application equals spilo exactly; zalando: pattern '.+' on name, substring; all level of detail detailed, baseName postgres-health, qualifiers resource, namespace, cluster"
  sli: true
  sliAsserts: "Average of two binary scores: patroni_lag.sh Issues array empty (lag), backup_health.sh Issues array empty. Confirmed false-pass: patroni_lag.sh:35-37,49,52 (no pod, no output, parse failure all produce zero issues) and backup_health.sh:31 (date -d of empty string)."
  egress: none
  tools: [kubectl, jq, awk, sed, grep, date (GNU), bash, python3 (optional), psql and patronictl inside the DB pod]
  inputs: [CONTEXT, OBJECT_NAME, RESOURCE_LABELS, WORKLOAD_NAME, DATABASE_CONTAINER, NAMESPACE, QUERY, HOSTNAME, KUBERNETES_DISTRIBUTION_BINARY, DATABASE_LAG_THRESHOLD, OBJECT_API_VERSION, OBJECT_KIND, BACKUP_MAX_AGE, CONNECTION_UTILIZATION_THRESHOLD, STORAGE_WARNING_THRESHOLD, STORAGE_CRITICAL_THRESHOLD]
  tasks:
    - title: List Resources Related to Postgres Cluster
      at: runbook.robot:19
      asserts: "Nothing; informational dump."
      reads:
        - "kubectl get all -l RESOURCE_LABELS -n NS"
        - "kubectl describe OBJECT_KIND OBJECT_NAME -n NS"
      permissions:
        - {apiGroups: ["", apps, batch], resources: [pods, services, deployments, statefulsets, replicasets, jobs, cronjobs, daemonsets], verbs: [get, list]}
        - {apiGroups: [""], resources: [events], verbs: [list]}
        - {apiGroups: [postgres-operator.crunchydata.com, acid.zalan.do], resources: [postgresclusters, postgresqls], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Two commands joined with && so a get-all failure suppresses describe. OBJECT_KIND defaults empty, which makes describe fail for spilo StatefulSet SLXs unless set."
    - title: Get Postgres Pod Logs & Events
      at: runbook.robot:31
      asserts: "Nothing; informational. Last 100 log lines per labeled Running pod and events by involvedObject name."
      reads:
        - "kubectl get pods -l RESOURCE_LABELS -o=name --field-selector=status.phase=Running"
        - "kubectl logs POD -c DATABASE_CONTAINER --tail=100"
        - "kubectl get events --field-selector involvedObject.name=POD"
      permissions:
        - {apiGroups: [""], resources: [pods, events], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/log], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Empty output is reported as 'No logs found!'. Raises no issue ever."
    - title: Get Postgres Pod Resource Utilization
      at: runbook.robot:67
      asserts: "Nothing; informational kubectl top pods --containers."
      reads:
        - "kubectl top pods -l RESOURCE_LABELS --containers -n NS"
      permissions:
        - {apiGroups: [metrics.k8s.io], resources: [pods], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "No issue path."
    - title: Check PostgreSQL Connection Health
      at: runbook.robot:79
      asserts: "psql SELECT 1 on a replica (else primary) fails; or connections / (max_connections - superuser_reserved) >= threshold (warn) or threshold+10 (critical); idle >30m count >10 with utilization >= threshold/2; idle-in-transaction >5m count >0; sessions waiting on Lock >5."
      reads:
        - "kubectl get pods -l role labels (crunchy/zalando/spilo) -o jsonpath"
        - "kubectl exec POD -c CONTAINER -- psql -U postgres -t -c 'SELECT 1; SHOW max_connections; SELECT count(*) FROM pg_stat_activity ...'"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "connection_health.sh:217-220 unreadable max_connections only adds a report line and returns, no issue; :424-442 (long idle), :446-461 (idle in transaction), :465-479 (lock waits) sub-queries run with 2>/dev/null and a non-numeric/empty result falls to the 'OK: No ...' branches."
      notes: "Preflight connectivity SELECT 1 (:133) does catch an exec or auth failure and raises an issue, which limits the exposure to mid-run failures. Requires passwordless psql -U postgres inside the pod. Crunchy container name hard-coded to database, zalando to postgres. No pod found raises a sev2 issue (good)."
    - title: Check PostgreSQL Core Metrics
      at: runbook.robot:112
      asserts: "Filesystem matching pgdata|postgres|/home is >= STORAGE_WARNING/CRITICAL percent used; any table with >10000 dead tuples and >=30 percent dead; unused indexes over 1MB (sev4); backend-written buffers >20 percent (sev3)."
      reads:
        - "kubectl exec PRIMARY -- df -h | grep -E 'pgdata|postgres|/home'"
        - "kubectl exec PRIMARY -- du -sh /pgdata; ls /pgdata/pg*/pg_wal"
        - "kubectl exec PRIMARY -- psql -U postgres -t -c (pg_database_size, pg_stat_user_tables, pg_stat_user_indexes, pg_stat_database, pg_stat_bgwriter)"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "core_metrics.sh:139 `df -h 2>/dev/null | grep | head`, a failed df prints 'Could not retrieve filesystem usage information' (:168) with no issue; every psql call has 2>/dev/null (e.g. :268-290 bloat, :315-330 indexes) and empty output is reported as 'No tables with significant bloat detected' (:305) / 'No unused indexes detected' (:343)."
      notes: "Bug: the pg_stat_bgwriter issue (generate_issue at :411 inside `echo | while` at :393) is generated inside a piped while subshell (echo | while), so ISSUES+= is lost and the sev3 buffer issue never reaches the report. pg_stat_bgwriter.checkpoints_timed is removed in PG17, so that query errors silently. /pgdata paths hard-coded."
    - title: Get Running Postgres Configuration
      at: runbook.robot:145
      asserts: "SHOW ALL output lacks shared_buffers or max_connections, or max_connections < 100 (sev4 fixed); pgbouncer ConfigMap max_client_conn missing or < 100 (crunchy)."
      reads:
        - "kubectl get pods -l role=master -o jsonpath"
        - "kubectl exec POD -- psql -U postgres -c 'SHOW ALL'"
        - "kubectl get postgresclusters.postgres-operator.crunchydata.com NAME -o jsonpath status.proxy.pgBouncer.readyReplicas; kubectl get configmap -l role=pgbouncer"
      permissions:
        - {apiGroups: [""], resources: [pods, configmaps], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
        - {apiGroups: [postgres-operator.crunchydata.com], resources: [postgresclusters], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "config_health.sh:124-127 spilo path with no running pod only echoes and returns (no issue); :208-209 unsupported OBJECT_API_VERSION with no spilo kind also only echoes. (Crunchy/Zalando exec failure produces bogus 'missing shared_buffers' issues instead, the opposite error.)"
      notes: "max_connections < 100 is an arbitrary opinion, not a fault. Empty CONFIG makes MAX_CONNECTIONS empty and (( < 100 )) true, a false issue. Crunchy label role=master selects the first pod regardless of cluster (no cluster label). Zalando path uses -l application=spilo without cluster-name. The runbook json.loads has no empty guard, so a missing report file errors the task."
    - title: Get Patroni Output and Add to Report
      at: runbook.robot:176
      asserts: "Nothing; informational patronictl list."
      reads:
        - "kubectl get pods (resolve_workload_exec_pod via patroni_helpers.sh)"
        - "kubectl exec POD -c CONTAINER -- patronictl list"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "No-pod and empty output are reported as text only; no issue path exists."
    - title: Fetch Patroni Database Lag
      at: runbook.robot:199
      asserts: "A Patroni member reports Lag in MB greater than DATABASE_LAG_THRESHOLD (sev1 fixed in the runbook)."
      reads:
        - "kubectl get pods (resolve exec pod)"
        - "kubectl exec POD -- patronictl list -f json (fallback: text table parsed by python3 or awk)"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "patroni_lag.sh:35-37 no resolved pod only adds an ERROR report line; :49 empty patronictl output only adds a WARNING; :52 MEMBERS_JSON=$(... || echo '[]') then :56 lag // 0; patroni_helpers.sh:63 unparsable lag becomes 0. None of these add to ISSUES, so the Issues array is empty and the runbook and SLI treat it as healthy."
      notes: "patronictl_list_text merges stderr into stdout (2>&1), so an error message is parsed as a table and yields no members. Sev1 for any lag breach is severe. Same script feeds the SLI lag score."
    - title: Check Database Backup Status
      at: runbook.robot:230
      asserts: "Latest backup is older than BACKUP_MAX_AGE hours: crunchy status.pgbackrest.scheduledBackups max completionTime; zalando/spilo pg_stat_archiver.last_archived_time or wal-g backup-list; missing archive data also raises."
      reads:
        - "kubectl get postgresclusters.postgres-operator.crunchydata.com NAME -o json | jq max_by(.completionTime)"
        - "kubectl exec POD -- psql -U postgres -t -A -c 'SELECT last_archived_time FROM pg_stat_archiver'"
        - "kubectl exec POD -- bash -c 'wal-g backup-list | tail -1'; echo USE_WALG_BACKUP"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
        - {apiGroups: [postgres-operator.crunchydata.com], resources: [postgresclusters], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "backup_health.sh:28-31 crunchy: kubectl get failure or missing .status.pgbackrest.scheduledBackups gives empty LATEST_BACKUP_TIME, and GNU date -d '' returns midnight today, so BACKUP_AGE is under 24h and the backup is reported healthy; :165 unsupported OBJECT_API_VERSION only echoes."
      notes: "Crunchy path ignores repo backups outside scheduledBackups (manual or full-only schedules). pg_stat_archiver last_archived_time proves WAL archiving, not a base backup. The runbook json.loads has no empty guard. sed -i with GNU syntax."
    - title: Run DB Queries
      at: runbook.robot:260
      asserts: "psql exec of each line of the user QUERY variable returns non-zero; raises sev3 per failed query. Success only appends results to the report."
      reads:
        - "kubectl get pods -l role=master (crunchy) or application=spilo -o jsonpath"
        - "kubectl exec POD -- bash -c 'psql -U postgres -c QUERY'"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: true
      falsePass: likely
      falsePassWhy: "dbquery.sh:106 unsupported OBJECT_API_VERSION with no spilo kind only echoes (no issue); rc of exec IS checked per query (:44) so a failed query is an issue."
      notes: "Runs arbitrary user-supplied SQL as postgres superuser; nominally read-only but the QUERY variable can write. Default QUERY lists database sizes. QUERY is interpolated into a double-quoted bash -c string (quote injection). generate_issue emits a duplicate JSON key description. Pod picked is first with the label, not necessarily the primary for zalando."
  bundleNotes: "Three generation rules (Crunchy CR, Zalando CR, bare Spilo StatefulSet) share one runbook; behaviour branches on OBJECT_API_VERSION / OBJECT_KIND. Report files are written to ../ relative to cwd and re-read by awk. Pattern: every script builds an Issues JSON array and the runbook only reports what is in it, so any early-return path that does not add an issue is a pass. Bash scripts use set -uo pipefail (connection_health, core_metrics, patroni_lag) or nothing (backup, config, dbquery). The SLI score also depends on report files being fresh."

- bundle: k8s-postgres-operations
  displayName: PostgreSQL Operations
  classicResourceTypes: [postgresclusters.postgres-operator.crunchydata.com, postgresqls.acid.zalan.do]
  matchHints: "crunchy and zalando: pattern '.+' on name, substring; level of detail detailed; baseName postgres-operations; slx and runbook only"
  sli: false
  sliAsserts: ""
  egress: none
  tools: [kubectl, jq, bash, patronictl and psql inside the DB pod]
  inputs: [KUBERNETES_DISTRIBUTION_BINARY, CONTEXT, NAMESPACE, OBJECT_NAME, OBJECT_API_VERSION, DATABASE_CONTAINER]
  tasks:
    - title: Reinitialize Failed PostgreSQL Cluster Members
      at: runbook.robot:21
      asserts: "WRITE. Runs patronictl reinit --force on any member with Patroni state failed/stopped or lag above LAG_THRESHOLD_BYTES (100MB, hard-coded env). Raises sev2 if script JSON contains severity error, else sev4 'Members Were Reinitialized'."
      reads:
        - "kubectl exec POD -- patronictl list -f json"
        - "kubectl exec POD -- psql (replication lag, slots, WAL retention, disk)"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
        - {apiGroups: [postgres-operator.crunchydata.com, acid.zalan.do], resources: [postgresclusters, postgresqls], verbs: [get]}
      scope: ns:target
      readOnly: false
      falsePass: confirmed
      falsePassWhy: "cluster_operations.sh:6 set -euo pipefail plus main returning 1 (e.g. :537, :548) aborts the script before the issues JSON is printed (:921-934); the runbook only looks for the literal string severity error, so an aborted run reports nothing and the else branch is silent or says reinitialized."
      notes: "Destructive: reinit wipes the member data directory and re-clones from the leader. The runbook never checks rc or that the member recovered. The reinit lag reading is patronictl 'Lag in MB'."
    - title: Perform PostgreSQL Cluster Failover Operation
      at: runbook.robot:65
      asserts: "WRITE. patronictl switchover (with TARGET_MEMBER) or failover --force on the current leader; verifies new leader by polling patronictl list after sleep 30. Raises sev1 if master unchanged or script reports errors, sev3 if result unclear, sev4 'Failover Completed' on success."
      reads:
        - "kubectl get pods -l role=master|spilo-role=master"
        - "kubectl exec LEADER -- patronictl switchover|failover --force; patronictl list -f json"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: false
      falsePass: likely
      falsePassWhy: "Success is decided by substring match of the stdout text (runbook.robot:93-94, 'completed successfully. New master:'); if the script aborts early under set -e the 'result unclear' sev3 fallback at :150 is the only signal."
      notes: "TARGET_MEMBER is read from env but the runbook never sets it, so the automatic branch runs. Uses patronictl exit via if-capture; failures are captured and turned into text."
    - title: Restart PostgreSQL Cluster with Rolling Update
      at: runbook.robot:164
      asserts: "WRITE. patronictl restart --force on every replica then the leader. Reports sev2 on 'severity: error' in output, otherwise raises a sev4 'Rolling Restart Completed' issue."
      reads:
        - "kubectl get pods -l instance labels"
        - "kubectl exec POD -- patronictl list -f json; patronictl restart CLUSTER MEMBER --force"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: false
      falsePass: confirmed
      falsePassWhy: "runbook.robot:178-201 the success issue is the ELSE of a string check for severity error; cluster_operations.sh set -e (restart_cluster return 1 at :417, :461) aborts before any JSON is printed, so a failed restart is reported as 'Rolling Restart Completed' sev4."
      notes: "Reports success (as an issue) regardless of rc. Does not wait for pods Ready or verify replication."
    - title: Verify Cluster Recovery and Generate Summary
      at: runbook.robot:203
      asserts: "Runs OPERATION=overview (default) and raises sev4 'Operations Completed Successfully / cluster is now healthy' unless stdout contains severity error or critical; else sev2 'Still Has Issues'."
      reads:
        - "kubectl get postgresclusters|postgresqls NAME -o json"
        - "kubectl get pods -l cluster labels -o jsonpath"
        - "kubectl exec MASTER -- psql (pg_replication_slots, pg_stat_replication)"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
        - {apiGroups: [postgres-operator.crunchydata.com, acid.zalan.do], resources: [postgresclusters, postgresqls], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:216-217 all_healthy = stdout does NOT contain 'severity: error'/'critical' (Should Not Contain Any); the script aborts under set -e (cluster_operations.sh:78, :137 return 1) before printing issues, and the generate_issue 'warning' severity never matches, so unreachable or missing clusters still yield 'cluster is now healthy'."
      notes: "Tagged access:read-write but OPERATION defaults to overview which only reads. The only task here that is a pure check, and it is wrong. cluster_overview 'Cluster not found' uses get ... 2>/dev/null || echo {}, a rc swallow that later does raise an error-severity issue but then set -e kills output."
  bundleNotes: "Remediation runbook; three of four tasks mutate via patronictl through pods/exec. All Add Issue sites are status issues (sev4 success reports), not findings. Script is 945 lines shared across tasks by OPERATION env via cmd_override. set -euo pipefail inverts the failure path as described. Hard-coded: LAG_THRESHOLD_BYTES=104857600, sleep 30 + 10 verification attempts."

- bundle: k8s-prometheus-healthcheck
  displayName: Kubeprometheus Operator Troubleshoot
  classicResourceTypes: [prometheuses.monitoring.coreos.com]
  matchHints: "pattern '.+' on name, substring; level of detail detailed; baseName kubeprom-hlthck; slx and runbook only"
  sli: false
  sliAsserts: ""
  egress: none
  tools: [kubectl, jq, grep (-P), awk, wget inside the prometheus container]
  inputs: [KUBERNETES_DISTRIBUTION_BINARY, CONTEXT, NAMESPACE, PROM_NAMESPACE]
  tasks:
    - title: Check Prometheus Service Monitors in namespace
      at: runbook.robot:20
      asserts: "Intended: a ServiceMonitor selector matches no Service or matches a Service whose port names do not include the monitor's endpoint port. Actual: always raises a sev3 issue."
      reads:
        - "kubectl get servicemonitors -n NAMESPACE -o json"
        - "kubectl get services -n NAMESPACE -l SELECTOR -o json (per ServiceMonitor)"
      permissions:
        - {apiGroups: [monitoring.coreos.com], resources: [servicemonitors], verbs: [get, list]}
        - {apiGroups: [""], resources: [services], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "validate_servicemonitors.sh:115 tests [ -n $MISSING_MONITORS ] after they were defaulted to 'None detected' (:87-95), so NEXTSTEPS always contains 'Investigate the endpoints' and the runbook (:33) always raises the issue: always-fail false positive. Port loop (:62-69) resets PORT_MATCHES per port so only the last port counts. Uses literal kubectl, ignores KUBERNETES_DISTRIBUTION_BINARY, and passes no --context. NAMESPACE default is loki, unrelated to Prometheus. A failed get is tolerated (no -e) and also lands in the always-issue path."
    - title: Check For Successful Rule Setup in Kubernetes Namespace
      at: runbook.robot:46
      asserts: "First prometheus pod (label app.kubernetes.io/name=prometheus) logs contain a line matching 'load.*.fail' that also contains the word error; sev2."
      reads:
        - "kubectl get pods -n PROM_NAMESPACE -l app.kubernetes.io/name=prometheus -o jsonpath items[0]"
        - "kubectl logs POD -c prometheus | grep -iP '(load.*.fail)' || true"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/log], verbs: [get]}
      scope: secondary-ns
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:51 'kubectl logs $(kubectl get pods ... items[0]) | grep ... || true': an empty pod name, Forbidden on pods/log or any kubectl failure yields empty stdout and rc 0, and :57 Should Contain error on empty is false, so no issue; :69-71 turns empty into 'No error logs found.'."
      notes: "Docs say operator logs but it reads the Prometheus server pod. A matching line without the substring error is ignored. Only the first pod is sampled. Task names itself 'prometheys' in tags."
    - title: Verify Prometheus RBAC Can Access ServiceMonitors
      at: runbook.robot:75
      asserts: "The ClusterRole named kube-prometheus-stack-operator has a rule mentioning servicemonitors; otherwise sev2."
      reads:
        - "kubectl get clusterrole/kube-prometheus-stack-operator -ojson"
      permissions:
        - {apiGroups: [rbac.authorization.k8s.io], resources: [clusterroles], verbs: [get]}
      scope: cluster
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "ClusterRole name hard-coded (breaks for any release not named kube-prometheus-stack). A failed or Forbidden get yields empty stdout, which the runbook treats as 'no servicemonitors' and raises the sev2 issue: false positive. The JSON is pasted inside double quotes into echo (runbook.robot:85), so embedded quotes likely break jq and force the issue even when RBAC is fine (not run). Title says namespace but the object is cluster-scoped."
    - title: Inspect Prometheus Operator Logs for Scraping Errors
      at: runbook.robot:100
      asserts: "First prometheus pod logs contain a line matching 'scrape.*.error' that also contains the word error; sev2."
      reads:
        - "kubectl get pods -n PROM_NAMESPACE -l app.kubernetes.io/name=prometheus"
        - "kubectl logs POD -c prometheus | grep -iP '(scrape.*.error)' || true"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/log], verbs: [get]}
      scope: secondary-ns
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:104 same '| grep ... || true' pattern as the rule-setup task; any failure or no pod gives empty stdout and no issue."
      notes: "Near-duplicate of task 2 with a different regex; issue titles are identical text apart from this."
    - title: Check Prometheus API Healthy
      at: runbook.robot:128
      asserts: "wget -S to 127.0.0.1:9090/-/healthy inside the first prometheus pod returns an HTTP status containing 200; otherwise sev2."
      reads:
        - "kubectl exec POD -c prometheus -- wget -qO- -S 127.0.0.1:9090/-/healthy 2>&1 | grep HTTP/ | awk"
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: secondary-ns
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Empty output (exec failed, no pod) fails Should Not Contain 200 as true, so it raises: inconclusive reported as a problem, which is the safe direction. Pass test is a substring match for 200 in the status line."
  bundleNotes: "Generation rule keys on a Prometheus CR but only task 1 and the RBAC check use NAMESPACE; the log/health tasks use PROM_NAMESPACE (default kube-prometheus-stack), so the SLX resource and the targets can disagree. Only first Prometheus pod is ever examined. Task 1 is a permanent false positive."

- bundle: k8s-pvc-healthcheck
  displayName: Kubernetes Persistent Volume Healthcheck
  classicResourceTypes: [persistentvolumeclaim]
  matchHints: "pattern '.' on name, substring; level of detail detailed; qualifiers namespace, cluster (so one SLX per namespace)"
  sli: true
  sliAsserts: "Runs pvc_utilization_check.sh and scores 1 if pvc_issues.json is an empty array else 0 (PVC pods not Running, df exec failed, or usage >= 80 percent of Gi/Ti/Pi PVCs). False-pass confirmed: pvc_utilization_check.sh:65 empty pod list gives []; also reads a possibly stale cwd file."
  egress: none
  tools: [kubectl, jq, awk, sed, base64]
  inputs: [KUBERNETES_DISTRIBUTION_BINARY, CONTEXT, NAMESPACE]
  tasks:
    - title: Fetch Events for Unhealthy Kubernetes PersistentVolumeClaims
      at: runbook.robot:22
      asserts: "A PVC with status.phase != Bound has at least one event; raises one sev2 issue with storage-class next steps."
      reads:
        - "kubectl get pvc -n NS -o json | jq phase != Bound"
        - "kubectl get events -n NS --field-selector involvedObject.name=PVC -o json"
      permissions:
        - {apiGroups: [""], resources: [persistentvolumeclaims, events], verbs: [get, list]}
        - {apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:26 the pvc list is inside $(... | jq ...) of a for loop; a failed get gives an empty list, the loop never runs, and no issue is raised. Also an unbound PVC with zero events raises nothing (issue only created per event line, :58)."
      notes: "WaitForFirstConsumer PVCs are Pending with a benign event and raise a sev2 false issue. Event parsing splits on ', ' in a shell echo, so messages with commas break. storage_next_steps.sh uses ${CONTEXT} but cluster-scoped get storageclass (cluster-scoped read)."
    - title: List PersistentVolumeClaims in Terminating State
      at: runbook.robot:79
      asserts: "A PVC has metadata.deletionTimestamp set (stuck Terminating); sev4."
      reads:
        - "kubectl get pvc -n NS -o json | jq select(.metadata.deletionTimestamp != null)"
      permissions:
        - {apiGroups: [""], resources: [persistentvolumeclaims], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:83 kubectl|jq without pipefail; failed get gives empty stdout, :89 Should Contain Terminating is false, no issue and the report prints an empty summary."
      notes: "Any PVC mid-normal-deletion is flagged immediately (no age threshold) at sev4."
    - title: List PersistentVolumes in Terminating State
      at: runbook.robot:114
      asserts: "Intended: a PV is Terminating, with events. Actual check is dead."
      reads:
        - "kubectl get pv -o json | jq select(.status.phase == Terminating)"
        - "kubectl get events --all-namespaces --field-selector involvedObject.name=PV"
      permissions:
        - {apiGroups: [""], resources: [persistentvolumes], verbs: [get, list]}
        - {apiGroups: [""], resources: [events], verbs: [list]}
      scope: cluster
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:118 for pv in $(kubectl get pv ... | jq ...) with no rc check (forbidden on cluster-scoped PVs is the common case) gives an empty loop and :124 Should Contain Name is false; additionally .status.phase is never the string Terminating (PV phases are Pending/Available/Bound/Released/Failed; Terminating is a kubectl display column from deletionTimestamp), so this never matches even with access."
      notes: "Lists every PV in the cluster, not just those used in NAMESPACE, yet titled per namespace. Needs cluster-wide PV list and events across all namespaces."
    - title: List Pods with Attached Volumes and Related PersistentVolume Details
      at: runbook.robot:146
      asserts: "Nothing; informational per-pod report of PVC, PV phase, node, zone, storage class, access mode, reclaim policy, CSI driver."
      reads:
        - "kubectl get pods -n NS --field-selector=status.phase=Running"
        - "kubectl get pvc/pv/pod/nodes (many calls per pod volume)"
      permissions:
        - {apiGroups: [""], resources: [pods, persistentvolumeclaims], verbs: [get, list]}
        - {apiGroups: [""], resources: [persistentvolumes, nodes], verbs: [get]}
      scope: cluster
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "No issue path. The && chain silently skips a pod/volume row if any lookup fails (e.g. nodes get Forbidden drops the whole row). jsonpath dots escaped with double backslash through Robot."
    - title: Fetch the Storage Utilization for PVC Mounts
      at: runbook.robot:160
      asserts: "Pod using a PVC is not Running and not Job-owned (sev2); df exec on the PVC mount fails or returns no usage (sev4); df usage >= 80/90/95/100 percent (sev4/3/2/1) for PVCs sized in Gi, Ti or Pi."
      reads:
        - "kubectl get pods -n NS -o json | jq select(volumes persistentVolumeClaim)"
        - "kubectl exec POD -c CONTAINER -- df -h MOUNT (twice: report loop and script)"
        - "kubectl get pvc PVC -o json (.status.capacity.storage); kubectl get replicaset/pod ownerReferences"
      permissions:
        - {apiGroups: [""], resources: [pods, persistentvolumeclaims], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
        - {apiGroups: [apps], resources: [replicasets], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "pvc_utilization_check.sh:65 for pod in $(kubectl get pods ... | jq ...) with no rc check: a failed list leaves the loop empty and :124 writes []; pvc_utilization_check.sh:15 convert_to_gigabytes returns 0 for Mi/Ki/G/M sized PVCs so calculate_recommendation emits nothing (:111) and they are never flagged."
      notes: "Failed df is correctly turned into an issue (:99-103, a good pattern, though it fires for any exec RBAC denial). Summary text hard-codes 'StatefulSet' owner (:112). Not-Running pods flagged even if Succeeded bare pods. pvc_issues.json written to cwd; the runbook cats the same name, so a stale file could be read if the script dies before writing."
    - title: Check for RWO Persistent Volume Node Attachment Issues
      at: runbook.robot:200
      asserts: "For each non-Job pod with a ReadWriteOnce PVC, the pod's node differs from the node whose status.volumesInUse contains the PV name; raises sev2 on any 'Error' line."
      reads:
        - "kubectl get pods -n NS -o json; kubectl get pod/pvc per volume"
        - "kubectl get nodes -o json (volumesInUse)"
      permissions:
        - {apiGroups: [""], resources: [pods, persistentvolumeclaims], verbs: [get, list]}
        - {apiGroups: [""], resources: [nodes], verbs: [get, list]}
      scope: cluster
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:204 PODS=$(kubectl get pods ... -o json) with no check; empty PODS makes the for loop empty and the output has no 'Error' line, so no issue."
      notes: "False-issue direction too: nodes get Forbidden or CSI volumesInUse naming not containing the PV name leaves STORAGE_NODE_NAME empty, which is reported as Mismatched (sev2). `contains($pv)` substring match. Inline function _jq with escaped dollar signs. Pods ending on different nodes legitimately during moves flagged."
  bundleNotes: "Six tasks, three of which need cluster-scoped reads (PV, nodes, events -A) though the SLX is namespace-scoped. Shared failure idiom is $(kubectl ... | jq ...) feeding for-loops with no rc check. pvc_utilization_check.sh feeds both runbook and SLI."

- bundle: k8s-redis-healthcheck
  displayName: Kubernetes Redis Healthcheck
  classicResourceTypes: [deployment]
  matchHints: "pattern 'redis' on name, substring; level of detail detailed; qualifiers resource, namespace, cluster"
  sli: false
  sliAsserts: ""
  egress: none
  tools: [kubectl, redis-cli inside the redis pod]
  inputs: [KUBERNETES_DISTRIBUTION_BINARY, CONTEXT, NAMESPACE, DEPLOYMENT_NAME, REDIS_HEALTHCHECK_KEY]
  tasks:
    - title: Ping Redis Workload
      at: runbook.robot:20
      asserts: "kubectl exec deployment/NAME -- redis-cli PING does not output PONG; sev2."
      reads:
        - "kubectl exec deployment/DEPLOYMENT_NAME -n NS -- redis-cli PING"
      permissions:
        - {apiGroups: [apps], resources: [deployments], verbs: [get]}
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Empty output (exec Forbidden, deployment missing, NOAUTH from a password-protected redis, redis-cli absent) all raise the same sev2 'PING failed' issue: wrong cause attribution but not a pass. next_steps point at PVC health."
    - title: Verify Redis Read Write Operation
      at: runbook.robot:44
      asserts: "SET key 0 then INCR key then GET key does not return exactly 1; sev1."
      reads:
        - "kubectl exec deployment/NAME -- redis-cli SET KEY 0; INCR KEY; GET KEY"
      permissions:
        - {apiGroups: [apps], resources: [deployments], verbs: [get]}
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Tagged access:read-only but it writes a key (default runwhen_task_rw_healthcheck) and leaves it behind. SET/INCR return codes ignored; only the final GET value is compared, so a failed GET (empty) raises sev1 (safe). With multiple replicas kubectl exec deployment/ picks one pod, which on a replica fails SET (READONLY) and raises. Key never deleted."
  bundleNotes: "Classic type deployment matched by name substring 'redis' misses StatefulSet-based redis (very common) and also matches unrelated deployments such as redis-exporter. Redis auth not supported. Tiny bundle; both tasks are genuine checks with rc/empty treated as failure."

