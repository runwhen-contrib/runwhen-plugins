# CNT-1 inventory, group k8s-a (16 bundles). rw-cli-codecollection origin/main @ 49ab483.
# Scope values: ns:target | secondary-ns | cluster | all-namespaces. 'cluster' used where node/event reads span the cluster.
# falsePass policy: confirmed = line where error becomes empty/zero/healthy; likely = rc ignored and empty means healthy (or action outcome never checked); none = loud failure, rc checked, or report-only dump with no assertion.
# Report-only tasks (no assertion, no issue, no metric) are marked falsePass none and noted as informational.

- bundle: k8s-app-troubleshoot
  displayName: "Kubernetes Application Troubleshoot"
  classicResourceTypes: [deployment]
  matchHints: "annotations contain 'gitApplication' AND 'gitTokenName' AND labels contain 'app' (substring); level of detail detailed"
  sli: true
  sliAsserts: "sli.robot:18 pushes the raw COUNT of parsed stacktraces in recent container logs (0 = healthy, not a 0-1 score). false-pass confirmed: sli.robot:24-25 appends '| grep -Eiv EXCLUDE_PATTERN || true' (default pattern non-empty) so a failed kubectl logs yields empty logs -> 0 exceptions. SLI does not run Verify Cluster Connectivity."
  egress: "public internet: git clone of REPO_URI (github.com) in env_check.sh and RW.K8sApplications.Clone Repo (always, even if CREATE_ISSUES=NO); GitHub REST API (list/create issues) when CREATE_ISSUES=YES"
  tools: [kubectl, oc, git, grep, sed, xargs, bash]
  inputs: [kubeconfig, NAMESPACE, CONTEXT, KUBERNETES_DISTRIBUTION_BINARY, REPO_URI, REPO_AUTH_TOKEN, LABELS, NUM_OF_COMMITS, CREATE_ISSUES, LOGS_SINCE, EXCLUDE_PATTERN, CONTAINER_NAME, WORKLOAD_NAME, MAX_LOG_LINES]
  tasks:
    - title: "Get Application Logs from Workload"
      at: runbook.robot:20
      asserts: "None; attaches up to MAX_LOG_LINES / 256KB of logs for pods matching LABELS (container CONTAINER_NAME) to the report. No issue raised."
      reads: ["kubectl logs -l LABELS --container=C --tail=N --since=LOGS_SINCE --limit-bytes=256000"]
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/log], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Informational dump; rc/stderr ignored but nothing is asserted. -l selector may match several pods; --container fails on pods lacking it."
    - title: "Scan Application For Misconfigured Environment"
      at: runbook.robot:32
      asserts: "None; report-only. Greps first deployment/statefulset's last 50 log lines for 'env', maps tokens to env-var-like names in a cloned repo and lists files changed in last NUM_OF_COMMITS commits. No issue raised."
      reads: ["kubectl get deployment,statefulset -l LABELS -oname | head -1", "kubectl logs <that> --all-containers --tail=50", "git clone REPO_URI /tmp/app_repo (unauthenticated)", "git diff HEAD~N HEAD --name-only -S word", "grep -rin over repo"]
      permissions:
        - {apiGroups: [apps], resources: [deployments, statefulsets], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/log], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "env_check.sh:34 '... | grep -i env || true' turns a failed kubectl logs into empty APPLOGS; env_check.sh:77 then prints 'No potential environment variable issues were found'. env_check.sh:36 'git clone ... || true' also masks clone failure (then cd fails and greps run in cwd)."
      notes: "Hard-coded kubectl (ignores KUBERNETES_DISTRIBUTION_BINARY). Clone ignores REPO_AUTH_TOKEN, so private repos silently fail. Writes /tmp/app_repo and node-local temp files only. Heuristic word-splitting of log text; output is a free-text report, not structured."
    - title: "Tail Application Logs For Stacktraces in Workload"
      at: runbook.robot:43
      asserts: "Sev3 issue when RW.K8sApplications.Parse Stacktraces finds >=1 exception/stacktrace in recent container logs (after EXCLUDE_PATTERN filtering); optionally opens/links a GitHub issue."
      reads: ["kubectl logs -l LABELS --container=C --tail --since --limit-bytes | grep -Eiv EXCLUDE_PATTERN || true", "kubectl get all -l LABELS -oname | grep -iE 'deploy|stateful' | head -1", "kubectl exec <that> --container=C -- ps -eo command --no-header", "git clone REPO_URI with REPO_AUTH_TOKEN", "GitHub REST: list issues, create issue"]
      permissions:
        - {apiGroups: ["", apps, batch, autoscaling], resources: [pods, services, replicationcontrollers, deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs, horizontalpodautoscalers], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/log], verbs: [get]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: false
      falsePass: confirmed
      falsePassWhy: "runbook.robot:62 '${cmd} | grep -Eiv \"${EXCLUDE_PATTERN}\" || true': pipeline rc is grep's and '|| true' swallows it, so a failed/forbidden kubectl logs -> empty stdout -> zero parsed exceptions -> no issue (line 117 only fires when exceptions > 0). exec ps failure also silently yields empty process list."
      notes: "Writes to GitHub (creates an issue) when CREATE_ISSUES=YES (default), so not read-only. The issue 'details' always say a GitHub issue was created even if CREATE_ISSUES=NO. exec target is the first deployment/statefulset from 'get all', not necessarily the pod set selected by LABELS. 'get all' implies reading many kinds. Default EXCLUDE_PATTERN 'FalseError|SecondErrorToSkip' is a placeholder."
  bundleNotes: "Only task 3 raises an issue; tasks 1-2 are informational dumps. Generation rule requires gitApplication+gitTokenName annotations, so it only attaches to a narrow set of git-annotated Deployments. Runbook Suite Init runs Verify Cluster Connectivity; SLI does not. Hard-coded kubectl in env_check.sh."

- bundle: k8s-argocd-application-health
  displayName: "Kubernetes ArgoCD Application Health & Troubleshoot"
  classicResourceTypes: [applications.argoproj.io]
  matchHints: "pattern '.+' on name (substring, matches every Application); level of detail detailed"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: none
  tools: [kubectl, oc, jq, grep]
  inputs: [kubeconfig, binary_name, CONTEXT, ERROR_PATTERN, APPLICATION, APPLICATION_TARGET_NAMESPACE, APPLICATION_APP_NAMESPACE]
  tasks:
    - title: "Fetch ArgoCD Application Sync Status & Health"
      at: runbook.robot:74
      asserts: "None; report-only. Prints .status.sync.status, .status.health.status and the first condition message of the Application."
      reads: ["kubectl get applications.argoproj.io APP -n APP_NS -o jsonpath=..."]
      permissions:
        - {apiGroups: [argoproj.io], resources: [applications], verbs: [get]}
      scope: secondary-ns
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Namespace is APPLICATION_APP_NAMESPACE (where the Application CR lives, usually argocd). Informational: no issue even if Degraded/OutOfSync. Description says blank APPLICATION queries all apps but the command always passes the name (default is the literal two-quote string)."
    - title: "Fetch ArgoCD Application Last Sync Operation Details"
      at: runbook.robot:88
      asserts: "None; report-only. Prints last operationState phase/message and timestamps."
      reads: ["kubectl get applications.argoproj.io APP -n APP_NS -o json | jq"]
      permissions:
        - {apiGroups: [argoproj.io], resources: [applications], verbs: [get]}
      scope: secondary-ns
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Bug: labels 'Last Sync Start Time' and 'Last Sync Finish Time' are swapped (start prints finishedAt, finish prints startedAt). A failed sync is never raised as an issue."
    - title: "Fetch Unhealthy ArgoCD Application Resources"
      at: runbook.robot:103
      asserts: "Sev2 issue per entry in .status.resources[] whose health.status is set and != Healthy, plus per Application condition whose type matches Error|Warning|Degraded."
      reads: ["kubectl get applications.argoproj.io APP -n APP_NS -o json | jq"]
      permissions:
        - {apiGroups: [argoproj.io], resources: [applications], verbs: [get]}
      scope: secondary-ns
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Empty stdout (kubectl failed or app missing) makes json.loads raise at runbook.robot:112, so the task errors instead of passing (inconclusive, no issue). Does NOT check sync status (OutOfSync) and skips resources with null health. One issue per resource (no dedupe). Issue text uses APPLICATION_TARGET_NAMESPACE."
    - title: "Scan For Errors in Pod Logs Related to ArgoCD Application"
      at: runbook.robot:132
      asserts: "None; report-only. Greps last 50 log lines of each Deployment labelled argocd.argoproj.io/instance=<TARGET_NS>_<APP> for ERROR_PATTERN."
      reads: ["kubectl get deployments -l argocd.argoproj.io/instance=NS_APP -n TARGET_NS", "kubectl logs deployment/X --tail=50 -n TARGET_NS | grep -E ERROR_PATTERN (in a for loop)"]
      permissions:
        - {apiGroups: [apps], resources: [deployments], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/log], verbs: [get]}
      scope: ns:target
      readOnly: true
      falsePass: likely
      falsePassWhy: "runbook.robot:136 for-loop with 'kubectl logs ... | grep -E'; no pipefail/rc check, failed logs or an empty deployment list produce empty output that is indistinguishable from a clean scan; no issue is ever raised."
      notes: "Neither kubectl call passes --context (uses kubeconfig current-context) and logs call hard-codes kubectl. Label value '<ns>_<app>' is a guess; under ArgoCD default label tracking the value is the app name, so selector can match nothing. Only Deployments (no StatefulSets/DaemonSets)."
    - title: "Fully Describe ArgoCD Application"
      at: runbook.robot:146
      asserts: "None; report-only kubectl describe of the Application."
      reads: ["kubectl describe applications.argoproj.io APP -n APP_NS"]
      permissions:
        - {apiGroups: [argoproj.io], resources: [applications], verbs: [get]}
        - {apiGroups: [""], resources: [events], verbs: [list]}
      scope: secondary-ns
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "describe also lists events in the Application namespace."
  bundleNotes: "Suite Init calls Verify Cluster Connectivity with ${KUBERNETES_DISTRIBUTION_BINARY}, which this file never imports or sets (it imports binary_name instead); likely an undefined-variable failure in Suite Setup unless the runtime injects it (verify). 4 of 5 tasks are report dumps; only task 3 asserts. Split across two namespaces (APPLICATION_APP_NAMESPACE vs APPLICATION_TARGET_NAMESPACE)."

- bundle: k8s-argocd-helm-health
  displayName: "Kubernetes ArgoCD HelmRelease TaskSet"
  classicResourceTypes: [applications.argoproj.io]
  matchHints: "pattern '.+' on name (substring, matches every Application); level of detail detailed"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: none
  tools: [kubectl, oc, jq]
  inputs: [kubeconfig, DISTRIBUTION, KUBERNETES_DISTRIBUTION_BINARY, NAMESPACE, RESOURCE_NAME, CONTEXT]
  tasks:
    - title: "Fetch all available ArgoCD Helm releases"
      at: runbook.robot:16
      asserts: "None; report-only list of Applications that have .spec.source.helm with sync and health status."
      reads: ["kubectl get RESOURCE_NAME -n NAMESPACE -o json | jq (select .spec.source.helm != null)"]
      permissions:
        - {apiGroups: [argoproj.io], resources: [applications], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Informational. kubectl|jq without pipefail: a failed list prints an empty 'available' list. Multi-source Applications (.spec.sources[]) are excluded by the .spec.source.helm filter."
    - title: "Fetch Installed ArgoCD Helm release versions"
      at: runbook.robot:29
      asserts: "None; report-only. Prints target revision, attempted revision, sync status and operation message for Helm-sourced Applications."
      reads: ["kubectl get RESOURCE_NAME -n NAMESPACE -o json | jq"]
      permissions:
        - {apiGroups: [argoproj.io], resources: [applications], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Informational; never raises an issue for mismatched or failed syncs."
  bundleNotes: "Pure inventory/report bundle, no assertion anywhere. Tasks reference ${KUBECONFIG} and ${CONTEXT} while Suite Init only sets KUBERNETES_DISTRIBUTION_BINARY, RESOURCE_NAME, NAMESPACE and env as suite variables (kubeconfig and CONTEXT are keyword-local); may be undefined at runtime (verify). NAMESPACE description says it accepts '--all-namespaces' but commands use '-n ${NAMESPACE}'. Overlaps k8s-argocd-application-health."

- bundle: k8s-artifactory-health
  displayName: "Kubernetes Artifactory Triage"
  classicResourceTypes: [stateful_set]
  matchHints: "pattern 'artifactory' on name (substring); level of detail basic"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: none
  tools: [kubectl, oc, curl (must exist inside the Artifactory container image)]
  inputs: [kubeconfig, STATEFULSET_NAME, NAMESPACE, CONTEXT, LABELS, EXPECTED_AVAILABILITY, KUBERNETES_DISTRIBUTION_BINARY]
  tasks:
    - title: "Check Artifactory Liveness and Readiness Endpoints"
      at: runbook.robot:78
      asserts: "Sev2 issue per endpoint when stdout of an in-pod curl to localhost:8091/artifactory/api/v1/system/liveness (resp. readiness) does not contain the substring 'OK'."
      reads: ["kubectl exec statefulset/NAME -n NS -- curl -k --max-time 10 http://localhost:8091/artifactory/api/v1/system/liveness", "same for .../readiness"]
      permissions:
        - {apiGroups: [apps], resources: [statefulsets], verbs: [get]}
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Fails closed: exec/curl failure leaves empty stdout, which does not contain 'OK', so an issue is raised (but mislabelled as an endpoint failure; forbidden exec, missing curl and unhealthy app are indistinguishable). exec statefulset/NAME targets pod-0 only. Substring 'OK' match. LABELS and EXPECTED_AVAILABILITY are imported but unused. Task title has literal NAMESPACE (no ${}). Needs pods/exec, which is not in a view-only role."
  bundleNotes: "Single task. Open-source Artifactory only. Hard-coded port 8091 and path. Commented-out topology/health task needs auth secrets (TODO)."

- bundle: k8s-certmanager-healthcheck
  displayName: "Kubernetes cert-manager Healthcheck"
  classicResourceTypes: [certificates.cert-manager.io]
  matchHints: "pattern '.' on name (substring, any Certificate); qualifiers namespace+cluster so one SLX per namespace; level of detail detailed; outputs slx, sli, slo, runbook"
  sli: true
  sliAsserts: "sli.robot:17 pushes COUNT = (certificates with status.notAfter < now) + (certificates with Ready=False) in NAMESPACE (0 = healthy, raw count). False-pass none: empty/failed kubectl makes Convert To Number raise (no metric emitted); a Certificate lacking status.conditions makes jq abort so the SLI emits nothing rather than 0. No Verify Cluster Connectivity in SLI."
  egress: none
  tools: [kubectl, oc, jq, awk, sed, grep, date]
  inputs: [kubeconfig, KUBERNETES_DISTRIBUTION_BINARY, CONTEXT, NAMESPACE]
  tasks:
    - title: "Get Namespace Certificate Summary"
      at: runbook.robot:21
      asserts: "Sev3 issue when stdout contains 'Namespace', i.e. >=1 Certificate that is Ready=True, has status.renewalTime and status.notAfter <= now (expired but still reported Ready)."
      reads: ["kubectl get certificates.cert-manager.io -n NS -ojson | jq (select Ready True, renewalTime set, notAfter <= now)"]
      permissions:
        - {apiGroups: [cert-manager.io], resources: [certificates], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:25 'kubectl get ... | jq' has no pipefail; failed kubectl (CRD absent, forbidden, unreachable) -> empty stdout -> line 31 'Should Contain Namespace' is False -> no issue. Also jq iterates .status.conditions[] without a guard: a freshly created Certificate (no conditions) aborts jq mid-stream and later items are dropped silently."
      notes: "Only catches already-expired certs; expiring-soon and Ready=False certs are not covered here (Ready=False is the next task). Title/doc say 'due for renewal' but logic is notAfter <= now. Commands use -n ${NAMESPACE} although the SLI description claims csv lists."
    - title: "Find Unhealthy Certificates"
      at: runbook.robot:45
      asserts: "Sev3 issue per Certificate with a Ready condition of status False."
      reads: ["kubectl get certificates.cert-manager.io -n NS -ojson | jq (Ready False + observedAt)"]
      permissions:
        - {apiGroups: [cert-manager.io], resources: [certificates], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Empty stdout makes json.loads raise (runbook.robot:54): task errors, no pass. Same jq abort on a Certificate without status.conditions errors the whole task (loud). Ready=Unknown (issuing) is not flagged."
    - title: "Find Failed Certificate Requests and Identify Issues"
      at: runbook.robot:73
      asserts: "Sev2 issue per CertificateRequest whose Ready condition status != True (message, issuer, owning Certificate extracted via grep/sed)."
      reads: ["kubectl get certificaterequests.cert-manager.io -n NS -o json | jq -r (ownerReferences, Ready, Approved)", "local grep/sed on the text; certificate_next_steps.sh (pure text)"]
      permissions:
        - {apiGroups: [cert-manager.io], resources: [certificaterequests], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:86 kubectl|jq emits nothing on kubectl failure; line 91 Split String on '' gives [''] and line 94 skips blank items -> loop body never runs -> no issue. jq also emits nothing for any CertificateRequest lacking an Approved condition or ownerReferences (object construction over an empty generator), so those are silently dropped."
      notes: "Shell-quoting: items are passed via echo '${item}' so apostrophes in cert-manager messages break extraction. Next-step script only recognises 2 message strings ('Referenced Issuer not found', 'Waiting on certificate issuance'). Issue observed_at taken from a subshell result."
  bundleNotes: "Only Certificates/CertificateRequests in one namespace; no Issuer/ClusterIssuer checks or cert-manager controller health despite next-step text referencing logs of the cert-manager deployment."

- bundle: k8s-chaos-flux
  displayName: "Kubernetes Flux Choas Testing"
  classicResourceTypes: []
  matchHints: "none: bundle has no .runwhen/generation-rules (not auto-generated; manual deployment only)"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: none
  tools: [kubectl, oc, "shell inside target container (CHAOS_COMMAND)"]
  inputs: [kubeconfig, "kubectl service (RW.Core.Import Service)", KUBERNETES_DISTRIBUTION_BINARY, CONTEXT, RANDOMIZE, FLUX_RESOURCE_TYPE, FLUX_RESOURCE_NAME, FLUX_RESOURCE_NAMESPACE, TARGET_NAMESPACE, TARGET_RESOURCE, CHAOS_COMMAND, CHAOS_COMMAND_LOOP, ADDNL_COMMAND]
  tasks:
    - title: "Suspend the Flux Resource Reconciliation"
      at: runbook.robot:115
      asserts: "None (action). Sets spec.suspend=true on a Flux resource so chaos is not reverted by GitOps."
      reads: []
      permissions:
        - {apiGroups: [kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io], resources: [kustomizations, helmreleases], verbs: [get, patch]}
      scope: secondary-ns
      readOnly: false
      falsePass: likely
      falsePassWhy: "runbook.robot:118-123 patch result is never inspected (rc/stderr/stdout ignored; report prints only the command history), so a failed suspend looks like success."
      notes: "kubectl patch FLUX_RESOURCE_TYPE NAME -n FLUX_RESOURCE_NAMESPACE --type=json add /spec/suspend. Namespace is FLUX_RESOURCE_NAMESPACE (default flux-system). Action, not a check."
    - title: "Select Random FluxCD Workload for Chaos Target"
      at: runbook.robot:125
      asserts: "None (selection). When RANDOMIZE=Yes, picks a random Deployment labelled kustomize.toolkit.fluxcd.io/name=FLUX_RESOURCE_NAME and sets TARGET_RESOURCE."
      reads: ["kubectl get deployments -l kustomize.toolkit.fluxcd.io/name=NAME -n TARGET_NS -o json"]
      permissions:
        - {apiGroups: [apps], resources: [deployments], verbs: [get, list]}
      scope: ns:target
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Tagged access:read-write but only reads. Bug: random.sample(range(1, N), 1) never selects index 0 and raises ValueError when N=1. Only works for Kustomization-managed Deployments (label), not HelmReleases."
    - title: "Execute Chaos Command on target resource"
      at: runbook.robot:149
      asserts: "None (action). Runs CHAOS_COMMAND inside TARGET_RESOURCE CHAOS_COMMAND_LOOP times via kubectl exec (default: a CPU-burning 'while true; do yes > /dev/null & done')."
      reads: []
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
      scope: ns:target
      readOnly: false
      falsePass: likely
      falsePassWhy: "runbook.robot:153-156 exec result unchecked inside the loop; report shows only command history."
      notes: "Destructive by design (resource exhaustion). Arbitrary command execution in a pod."
    - title: "Execute Additional Chaos Command"
      at: runbook.robot:161
      asserts: "None (action). Runs ADDNL_COMMAND verbatim with ' -n TARGET_NAMESPACE --context CONTEXT' appended (default 'kubectl get pods')."
      reads: []
      permissions:
        - {apiGroups: ["*"], resources: ["*"], verbs: ["*"]}
      scope: ns:target
      readOnly: false
      falsePass: likely
      falsePassWhy: "runbook.robot:164-169 result unchecked."
      notes: "Arbitrary user-supplied shell command; RBAC is whatever the command needs (wildcard shown as upper bound). Command injection surface by design."
    - title: "Resume Flux Resource Reconciliation"
      at: runbook.robot:171
      asserts: "None (action). Removes spec.suspend via JSON patch."
      reads: []
      permissions:
        - {apiGroups: [kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io], resources: [kustomizations, helmreleases], verbs: [get, patch]}
      scope: secondary-ns
      readOnly: false
      falsePass: likely
      falsePassWhy: "runbook.robot:174-179 patch result unchecked; a failed resume leaves Flux suspended with no signal."
      notes: "Task title uses TARGET_NAMESPACE but the patch uses FLUX_RESOURCE_NAMESPACE. JSON-patch 'remove' fails if /spec/suspend is absent (rc ignored). Must be run manually after chaos; no automatic cleanup."
  bundleNotes: "Chaos/action bundle: no assertions, no issues, no SLI, no generation rule. All five tasks write or exec. Imports a legacy RW.Core.Import Service kubectl. Candidate to exclude from V13 health skills or model as explicit action-only."

- bundle: k8s-chaos-namespace
  displayName: "Kubernetes Namespace Chaos Engineering"
  classicResourceTypes: []
  matchHints: "none: bundle has no .runwhen/generation-rules (not auto-generated; manual deployment only)"
  sli: false
  sliAsserts: "n/a (no sli.robot)"
  egress: none
  tools: [kubectl, jq, shuf, bash]
  inputs: [kubeconfig, CONTEXT, NAMESPACE]
  tasks:
    - title: "Kill Random Pods In Namespace"
      at: runbook.robot:20
      asserts: "None (action). Deletes up to 10 random pods (50% coin flip per pod, 3s apart) in NAMESPACE to test HA."
      reads: ["kubectl get pods -oname -n NS"]
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list, delete]}
      scope: ns:target
      readOnly: false
      falsePass: likely
      falsePassWhy: "delete_random_pods.sh:15 'kubectl delete' errors go to stderr and script exit is the last command's (kubectl get pods) so rc is 0; report prints stdout only."
      notes: "Destructive; any pod in the namespace including singletons and system pods. No tags for access level."
    - title: "OOMKill Pods In Namespace"
      at: runbook.robot:29
      asserts: "None (action). Execs a memory-hog loop (dd bs=2GiB x5 background loops) into one random Running pod to trigger an OOMKill, then describes it."
      reads: ["kubectl get pods -oname --field-selector=status.phase=Running", "kubectl describe pod/X"]
      permissions:
        - {apiGroups: [""], resources: [pods], verbs: [get, list]}
        - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
        - {apiGroups: [""], resources: [events], verbs: [list]}
      scope: ns:target
      readOnly: false
      falsePass: likely
      falsePassWhy: "oomkill_pod.sh:16 exec failure (no /bin/sh, forbidden) is not checked; script ends with kubectl get pods (rc 0) and report shows stdout only."
      notes: "MAX_KILL=1. Exec runs arbitrary workload-affecting commands."
    - title: "Mangle Service Selector In Namespace"
      at: runbook.robot:49
      asserts: "None (action). Picks a random Service and rewrites its first selector key's value to 'chaos' so it selects no pods."
      reads: ["kubectl get services -o jsonpath", "kubectl get service X -o jsonpath={.spec.selector}"]
      permissions:
        - {apiGroups: [""], resources: [services], verbs: [get, list, patch]}
      scope: ns:target
      readOnly: false
      falsePass: likely
      falsePassWhy: "change_service_selector.sh:19 patch result unchecked; script ends with echo (rc 0)."
      notes: "No guard for Services without a selector (ExternalName) -> patches an empty key. Destructive network disruption; expected to be healed by GitOps."
