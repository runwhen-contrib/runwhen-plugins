- bundle: gcp-apigateway-health
  displayName: GCP API Gateway Health
  classicResourceTypes: [gcp_apigateway_gateways]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project]"
  sli: true
  sliAsserts: "Weighted 0-1 composite of 6 dimensions (states .20, drift .20, invoker .20, managed svc .15, error rate .15, latency .10); each scored 1/0 on issue count. Rc and issues-file are checked and a failed check Fails the task; no-traffic error/latency dims are 'unmeasured' and dropped from the weighting. Residual false-pass: Monitoring query errors become 0 -> 'unmeasured' (not healthy), and an empty Cloud Run list makes invoker score 1. Status: likely"
  egress: "cloud API (apigateway, run, serviceusage, monitoring googleapis.com)"
  tools: [gcloud, jq, yq, curl, bc, base64, awk]
  inputs: [GCP_PROJECT_ID, GCP_REGIONS, API_NAME, API_CONFIG_NAME, METRIC_LOOKBACK_PERIOD, ERROR_RATE_THRESHOLD, AUTH_ERROR_RATE_THRESHOLD, LATENCY_THRESHOLD_MS, LATENCY_GAP_THRESHOLD_MS, OPERATIONS_LOOKBACK]
  tasks:
    - title: Check GCP API Gateway Resource States
      at: runbook.robot:18
      asserts: "Any Api, ApiConfig or Gateway is not ACTIVE (FAILED etc.)"
      reads: ["gcloud api-gateway apis|api-configs|gateways list --format=json", "gcloud api-gateway gateways describe", "gcloud api-gateway api-configs describe (via discover_apigateway.sh inventory)"]
      permissions: [apigateway.apis.list, apigateway.apiconfigs.list, apigateway.apiconfigs.get, apigateway.gateways.list, apigateway.gateways.get]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Reads apigateway_inventory.json, which only sli.robot Suite Initialization writes (discover_apigateway.sh); runbook.robot never calls discover, so a runbook-only run Fails with 'inventory not found' (loud, not false-pass) unless a stale file exists in the workdir. Discovery itself fails loudly if a list fails (apigw_gcloud_list). Issues are one per problem class, project scoped."
    - title: Check GCP API Gateway Config Drift
      at: runbook.robot:59
      asserts: "A Gateway is pinned to an ApiConfig older than the newest ACTIVE ApiConfig of its API"
      reads: ["inventory json", "gcloud api-gateway gateways describe <gw> --location --format=value(apiConfig) (fallback)"]
      permissions: [apigateway.gateways.get, apigateway.gateways.list, apigateway.apiconfigs.list]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "check_config_drift.sh:59-60 fallback describe uses 2>/dev/null || echo '' -> empty cfg_id -> `continue` (gateway skipped, no drift); only hit when inventory apiConfig is empty"
      notes: "Same inventory dependency as states check. 'Newest' is by createTime among ACTIVE configs; a gateway with no resolvable config is silently skipped."
    - title: Verify API Gateway Managed Service is Enabled
      at: runbook.robot:100
      asserts: "No enabled Service Usage service matches <api-id>-*.apigateway.<project>.cloud.goog for an Api"
      reads: ["gcloud services list --enabled --format=value(config.name)"]
      permissions: [serviceusage.services.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "check_managed_service.sh:38-39 swallows a services-list failure (2>/dev/null || echo ''), but empty list makes every API look disabled -> false ALARM, not false pass. Early exit with no issues when inventory has 0 apis."
    - title: Check Gateway Backend Invoker Permissions
      at: runbook.robot:141
      asserts: "The gateway service account lacks roles/run.invoker (and allUsers/allAuthenticatedUsers is absent) on a Cloud Run backend referenced by x-google-backend.address"
      reads: ["gcloud api-gateway api-configs describe --view=FULL (openapiDocuments, gatewayServiceAccount)", "gcloud run services list --format=json", "gcloud run services get-iam-policy <svc> --region"]
      permissions: [apigateway.apiconfigs.get, run.services.list, run.services.getIamPolicy]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "apigateway_common.sh:324-325 gcloud run services list 2>/dev/null || echo '[]' -> backend address unresolved -> `continue` (:~498) -> no finding. Also gateway with no gatewayServiceAccount -> '[]'."
      notes: "Only Cloud Run (*.run.app) backends are checked; other backends ignored. get-iam-policy and api-config describe failures are loud (return 1)."
    - title: Detect Dangling and Unreachable Gateway Backends
      at: runbook.robot:182
      asserts: "A x-google-backend.address *.run.app host matches no Cloud Run service in the project (dangling); any 504 in serviceruntime request_count during lookback"
      reads: ["api-configs describe --view=FULL", "gcloud run services list", "GET monitoring.googleapis.com/v3/projects/<p>/timeSeries serviceruntime.googleapis.com/api/request_count response_code=504"]
      permissions: [apigateway.apiconfigs.get, run.services.list, monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_backends.sh:101-102 curl -s 2>/dev/null || echo '{}' then jq '... | add // 0' || echo 0 -> API error/403 = 0 504s = no issue"
      notes: "If `run services list` fails, common.sh:325 returns [] so EVERY run.app backend is reported dangling (false alarm). 504 query is project-wide (not scoped to this gateway's managed service)."
    - title: Analyze GCP API Gateway Error Rates
      at: runbook.robot:223
      asserts: "5xx ratio > ERROR_RATE_THRESHOLD or 401/403 ratio > AUTH_ERROR_RATE_THRESHOLD over METRIC_LOOKBACK_PERIOD"
      reads: ["GET monitoring timeSeries apigateway.googleapis.com/proxy/request_count (resolved metric)", "serviceruntime api/request_count scoped to managed services"]
      permissions: [monitoring.timeSeries.list, monitoring.metricDescriptors.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_error_rates.sh:60-61 curl 2>/dev/null || echo '{}' ; jq 'add // 0' || echo 0 -> Monitoring error = total 0 = 'No request data' = no issue (runbook has no unmeasured concept)"
      notes: "Token acquisition failure exits 1 (loud). SLI variant writes error_rate_measured=false so the dimension is excluded rather than scored 1."
    - title: Analyze GCP API Gateway Latency
      at: runbook.robot:264
      asserts: "p95 total latency > LATENCY_THRESHOLD_MS, or gateway-vs-backend p95 gap > LATENCY_GAP_THRESHOLD_MS"
      reads: ["GET monitoring timeSeries total/backend latency metrics, scoped to managed service"]
      permissions: [monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_latency.sh:80-81 curl 2>/dev/null || echo '{}' ; jq 'max // 0' || echo 0 -> API error = p95 0 = 'no latency data' = no issue; also exits 0 with no issues if no managed service known (:~60)"
      notes: "SLI marks no data as unmeasured."
    - title: Check for Failed GCP API Gateway Operations
      at: runbook.robot:305
      asserts: "An API Gateway long-running operation within OPERATIONS_LOOKBACK finished with an error"
      reads: ["GET apigateway.googleapis.com/v1/projects/<p>/locations/<region>/operations"]
      permissions: [apigateway.operations.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_operations.sh:60-61 HTTP status != 200 for a region -> `continue` (silently skipped); curl 2>/dev/null || echo 000 -> same. All regions failing = no issues"
      notes: "Lookback parsed with sed|bc, falls back to 86400. If no regions known, uses 'global'. Operations are not paginated (first page only)."
  bundleNotes: "Hardened bundle: every task checks rc, removes stale output files first, parses the issues file in TRY/EXCEPT. Remaining holes are the curl/jq '|| echo 0' Monitoring idiom and run services list fallback. runbook.robot lacks the discover_apigateway.sh step that sli.robot has. GCP_REGIONS/API_NAME/API_CONFIG_NAME imported; API_NAME and API_CONFIG_NAME are only referenced by common.sh defaults."
- bundle: gcp-apigee-environment-health
  displayName: GCP Apigee Environment and Edge Health
  classicResourceTypes: [gcp_apigee_organizations]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [resource]"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (apigee.googleapis.com via curl, gcloud services/compute); plus direct TCP/DNS probes from the runner to customer target-server hosts"
  tools: [gcloud, curl, jq, getent, timeout, bash /dev/tcp, xargs]
  inputs: [GCP_PROJECT_ID, APIGEE_ORG, ENVIRONMENTS, CERT_EXPIRY_WARNING_DAYS, TARGET_REACHABILITY_TIMEOUT]
  tasks:
    - title: Check Apigee Organization and Environment State
      at: runbook.robot:18
      asserts: "Org state not ACTIVE (FAILED/UNKNOWN worse), or any environment not ACTIVE / stuck CREATING/UPDATING, or env unreadable"
      reads: ["topology json from discover_topology.sh (GET organizations/<org>)", "GET apigee v1 organizations/<org>/environments/<env>"]
      permissions: [apigee.organizations.get, apigee.environments.get, apigee.environments.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:30-33 rc ignored, `except` on unparseable/missing issues file -> 'defaulting to empty list' (script exit 1 when topology missing = no issues). apigee_common.sh apigee_get curl ... || true -> empty (but unreadable envs ARE raised as an issue in check_org_env_state.sh:104-108); empty org_state is skipped (script :61)"
      notes: "Depends on apigee_topology.json from Suite Initialization discovery. Discovery failures surface through discovery_issues.json (sev 4) and an up-front token check (sev 1), which is the only guard."
    - title: Check Apigee Environment to Instance Attachment Coverage
      at: runbook.robot:51
      asserts: "An environment has no instance attachment (cannot serve traffic)"
      reads: ["topology json (instance attachments from GET organizations/<org>/instances/<i>/attachments)"]
      permissions: [apigee.instances.list, apigee.instanceattachments.list, apigee.environments.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot rc ignored + parse-fail -> empty list; check_instance_attachments.sh:53-66 exits 0 with no issues when org/instances empty, and discover_topology.sh apigee_list_field returns [] on any curl failure (a failed attachments fetch makes every env look unattached = false alarm, a failed instances fetch = skip = no issue)"
      notes: "No live calls of its own; pure function of the topology dump."
    - title: Check Apigee Environment Group Attachments and Hostname Routing
      at: runbook.robot:84
      asserts: "An env group has no environment attachments or no hostnames"
      reads: ["topology json (GET organizations/<org>/envgroups and .../attachments)"]
      permissions: [apigee.envgroups.list, apigee.envgroupattachments.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_envgroup_attachments.sh:~58 'No environment groups found' exit with empty issues; discover_topology.sh apigee_list_field -> [] on API failure"
      notes: "Same topology dependency."
    - title: Check Apigee Keystore Alias Certificate Expiry
      at: runbook.robot:117
      asserts: "A keystore/truststore alias certificate is expired or expires within CERT_EXPIRY_WARNING_DAYS (only for envs attached to an env group)"
      reads: ["GET organizations/<org>/environments/<env>/keystores", ".../keystores/<ks>", ".../keystores/<ks>/aliases/<alias>"]
      permissions: [apigee.keystores.list, apigee.keystores.get, apigee.keyaliases.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_keystore_cert_expiry.sh keystore list `case ... *) continue`, empty keystore/alias body `continue` -> any API error skips the keystore/alias silently (apigee_common.sh apigee_get ... || true)"
      notes: "Envs not attached to any env group are skipped deliberately. Expiry from alias certsInfo expiryDate ms."
    - title: Check Apigee Target Server Configuration and Reachability
      at: runbook.robot:150
      asserts: "A target server is disabled, its host does not resolve (getent) or its host:port does not accept a TCP connection from the runner within TARGET_REACHABILITY_TIMEOUT"
      reads: ["GET .../environments/<env>/targetservers and /<ts>", "getent hosts <host>", "bash /dev/tcp/<host>/<port>"]
      permissions: [apigee.targetservers.list, apigee.targetservers.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_target_servers.sh targetservers list `case *) echo 'No target servers accessible'; continue` and empty detail `continue` -> API error = no finding"
      notes: "Reachability is from the runner's network position, not from Apigee runtime, so private targets reachable only from the Apigee VPC will false-alarm; public targets are probed from wherever the runner is."
    - title: Check Apigee Southbound VPC Peering and Private Service Connect
      at: runbook.robot:183
      asserts: "Service networking peering list fails, or a PSC forwarding rule has pscConnectionStatus != ACCEPTED; org network missing"
      reads: ["gcloud services vpc-peerings list --network", "gcloud compute addresses describe <range> --global", "gcloud compute forwarding-rules list --filter=pscConnectionStatus:*"]
      permissions: [servicenetworking.services.get, compute.addresses.get, compute.forwardingRules.list]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "gcloud failures are captured and raised as issues (good), but `compute addresses describe ... 2>/dev/null || continue` swallows range lookups; skipped entirely when disableVpcPeering true or topology missing org"
      notes: "Only PENDING/REJECTED/CLOSED PSC status raises; peering status itself (ACTIVE) is not inspected, only that list succeeded."
    - title: Check Apigee Instance Capacity and Regional Failover
      at: runbook.robot:216
      asserts: "Instance not ACTIVE / provisioning, capacity reductionStatus != NORMAL, or an environment attached to only one instance (no regional failover); org has no instances"
      reads: ["topology json instances", "GET organizations/<org>/instances/<inst>?entity=asyncRuntime"]
      permissions: [apigee.instances.list, apigee.instances.get, apigee.environments.list]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "check_instance_capacity.sh capacity body `if [ -n cap_body ]` skipped on API failure (apigee_get || true); failed instances list is reported as 'no instances' (false alarm, not pass)"
      notes: "Single-instance 'no failover' is a design observation, not a fault."
  bundleNotes: "Pattern for all apigee-* bundles: apigee_common.sh apigee_get = curl -fsS ... || true so every API error becomes empty output, and runbook.robot never checks returncode and swallows unparseable issue files. Only guards: Suite Initialization token check (sev 1 issue) and discovery_issues.json (sev 4) for org lookup failure. discover_topology.sh and the issue-file contract run in Suite Initialization, so runbook tasks are not self-contained. Scripts run with set -x (token hidden via set +x in helpers)."
- bundle: gcp-apigee-product-governance
  displayName: GCP Apigee Product and Developer Governance
  classicResourceTypes: [gcp_apigee_organizations]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [resource]; runbook only in generation rule (no sli output item)"
  sli: true
  sliAsserts: "Mean of 4 binary dimension scores (products, key expiry, orphaned entitlements, developer status). Each dimension scores 0 (count -1) when the status sidecar access_ok != true, so unreadable != healthy. Status: none (the generation rule does not emit the SLI, so it is not deployed by default)"
  egress: "cloud API (apigee.googleapis.com via curl)"
  tools: [curl, jq, gcloud, date]
  inputs: [GCP_PROJECT_ID, APIGEE_ORG, APIPRODUCTS, DEVELOPER_APPS, KEY_EXPIRY_WARNING_DAYS, USAGE_LOOKBACK_DAYS]
  tasks:
    - title: Check Apigee API Product Expiry and Status
      at: runbook.robot:18
      asserts: "An API product has approvalType auto (unapproved access) or a missing/zero quota"
      reads: ["GET apigee v1 organizations/<org>/apiproducts?expand=true (paged)", "GET organizations (org ownership probe)"]
      permissions: [apigee.apiproducts.list, apigee.organizations.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Task name says Expiry and Status but the script checks neither: it checks approvalType and product-level quota (false alarm if quota is defined per operation group instead). Access failure writes api_products_status.json access_ok=false and runbook Report Access Failure raises a sev-2 issue; script exits 0 on failure. Status/issues files are not deleted before the run, so a crashed script could leave stale files."
    - title: Check Apigee Developer App Credential Expiry
      at: runbook.robot:32
      asserts: "A developer-app consumer key is expired, expires within KEY_EXPIRY_WARNING_DAYS, or has an unparseable expiresAt"
      reads: ["GET organizations/<org>/apps?expand=true (paged, via apigee_list_apps)"]
      permissions: [apigee.developerapps.list, apigee.appkeys.get]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Consumer keys/secrets are redacted from output (APIGEE_REDACT_FILTER). expiresAt -1/0 treated as never expires. Status sidecar guard as above."
    - title: Check Apigee Orphaned and Unused Products and Apps
      at: runbook.robot:46
      asserts: "A product referenced by no app credential, an app with no credentials, or (via analytics) an app with zero traffic over USAGE_LOOKBACK_DAYS"
      reads: ["apps list", "apiproducts list", "GET organizations/<org>/environments", "GET .../environments/<env>/stats/developer_app?select=sum(message_count)"]
      permissions: [apigee.apiproducts.list, apigee.developerapps.list, apigee.environments.list, apigee.environments.getStats]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "If any env returns no analytics the usage part is skipped with a reason and a sev-4 issue about missing analyticsViewer rather than treating all apps as unused. Housekeeping findings, not faults."
    - title: Check Apigee Developer Status and Dangling References
      at: runbook.robot:60
      asserts: "A developer is inactive/blocked but owns active apps, or an app credential references an API product that no longer exists"
      reads: ["apps list", "apiproducts list", "GET organizations/<org>/developers?expand=true (paged)"]
      permissions: [apigee.developers.list, apigee.developerapps.list, apigee.apiproducts.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Developer list truncation is detected (apigee_developers_truncated)."
  bundleNotes: "Best-hardened Apigee bundle: apigee_common.sh tracks access failures in .apigee_access_failures, writes *_status.json {access_ok,reason}, runbook Report Issues From File raises a sev-2 'could not run' issue when access_ok is false or the sidecar is missing, and an unparseable issues file is an issue, not empty. Its apigee_common.sh differs from the one in the other apigee-* bundles (which use apigee_get ... || true). Weakness: runbook ignores script returncode and status files are not cleared before a run."
- bundle: gcp-apigee-proxy-health
  displayName: GCP Apigee API Proxy Deployment and Traffic Health
  classicResourceTypes: [gcp_apigee_organizations]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [resource]"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (apigee.googleapis.com via curl; Apigee Analytics stats endpoint)"
  tools: [curl, jq, gcloud, awk, "GNU date -d"]
  inputs: [GCP_PROJECT_ID, APIGEE_ORG, PROXIES, ENVIRONMENTS, POLICY_ERROR_THRESHOLD, TARGET_ERROR_THRESHOLD, LATENCY_MS_THRESHOLD, OVERHEAD_MS_THRESHOLD, AUTH_ERROR_RATE_THRESHOLD, RATE_LIMIT_ERROR_THRESHOLD, ANALYTICS_WINDOW_MIN, APIGEE_MAX_STATUS_CALLS, REVISION_ACCUMULATION_THRESHOLD]
  tasks:
    - title: Check Apigee Proxy Deployment Health
      at: runbook.robot:18
      asserts: "A proxy deployment has runtime state ERROR or PROGRESSING, status unreadable (UNKNOWN), or non-empty errors[] while serving"
      reads: ["inventory from discover_proxies.sh: GET organizations/<org>/deployments, apis, per-deployment status (capped by APIGEE_MAX_STATUS_CALLS)"]
      permissions: [apigee.deployments.list, apigee.deployments.get, apigee.proxies.list, apigee.proxyrevisions.get]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Hardened: Suite Initialization Fails on discovery rc!=0, deletes stale topology first, raises discovery issues (API errors sev 2, no token sev 3, org lookup sev 2) before failing. Per-task runbook wrapper still ignores script rc and parse failure -> empty list, but the issues file is pre-initialised to [] and inputs come from a verified inventory. Deployments past the status cap are reported UNKNOWN, not healthy."
    - title: Check Apigee Deployed Revision vs Expected and Revision Drift
      at: runbook.robot:52
      asserts: "A proxy runs a revision older than its latest revision in some environment, or different environments run different revisions"
      reads: ["inventory deployments", "inventory proxies (latestRevisionId)"]
      permissions: [apigee.deployments.list, apigee.proxies.list, apigee.proxyrevisions.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "'Expected' is just the latest revision; no real expected-revision input. Latest-revision drift is often intentional (staged rollouts)."
    - title: Check Apigee Undeployed and Orphaned Proxies
      at: runbook.robot:86
      asserts: "A proxy exists with zero deployments in any in-scope environment"
      reads: ["inventory proxies and deployments"]
      permissions: [apigee.proxies.list, apigee.deployments.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Script is named check_failed_deployments.sh but only finds undeployed proxies; failed deployments are covered by the state task. Housekeeping finding."
    - title: Check Apigee Environment Deployment Coverage
      at: runbook.robot:120
      asserts: "An environment has no API proxies deployed (sev 4); skipped when PROXIES filter is set"
      reads: ["inventory environments (GET organizations/<org>/environments) and deployments"]
      permissions: [apigee.environments.list, apigee.deployments.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Housekeeping finding, not a fault."
    - title: Check Apigee Proxy Revision Housekeeping
      at: runbook.robot:154
      asserts: "A proxy has >= REVISION_ACCUMULATION_THRESHOLD stored revisions"
      reads: ["inventory proxies revision arrays and deployments"]
      permissions: [apigee.proxies.list, apigee.proxyrevisions.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Hygiene finding, not a fault."
    - title: Analyze Apigee policy_error vs target_error Split
      at: runbook.robot:188
      asserts: "Per proxy/env, policy_error/message_count > POLICY_ERROR_THRESHOLD or target_error/message_count > TARGET_ERROR_THRESHOLD over ANALYTICS_WINDOW_MIN"
      reads: ["GET organizations/<org>/environments/<env>/stats/apiproxy?select=sum(message_count),sum(is_error),sum(policy_error),sum(target_error)"]
      permissions: [apigee.environments.list, apigee.environments.getStats]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "Stats API failures are recorded and appended as a sev-3 'API calls failed' issue (analyze_error_split.sh:~end), but only counted via apigee_api_error_count; empty analytics ('No proxies returned metrics data') is treated as no problem"
      notes: "Uses GNU date -d (fails on BSD/mac). No-traffic proxies skipped silently."
    - title: Analyze Apigee Latency and Processing Overhead
      at: runbook.robot:222
      asserts: "Per proxy/env, LATENCY_PERCENTILE_FN(total_response_time) > LATENCY_MS_THRESHOLD or total minus target response time overhead > OVERHEAD_MS_THRESHOLD"
      reads: ["GET .../environments/<env>/stats/apiproxy?select=<pctl>(total_response_time),<pctl>(target_response_time)"]
      permissions: [apigee.environments.list, apigee.environments.getStats]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "Same pattern as error split: API errors surface via apigee_append_api_error_issue, empty analytics = no issue"
      notes: "LATENCY_PERCENTILE_FN is read from env but not an imported runbook variable (default in script)."
    - title: Analyze Apigee Auth and Quota Error Elevation
      at: runbook.robot:256
      asserts: "401/403 ratio > AUTH_ERROR_RATE_THRESHOLD or 429 ratio > RATE_LIMIT_ERROR_THRESHOLD of total messages per proxy"
      reads: ["GET .../environments/<env>/stats/apiproxy,response_status_code?select=sum(message_count)"]
      permissions: [apigee.environments.list, apigee.environments.getStats]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "analyze_http_error_rates.sh: empty counts file -> echo 'No HTTP error rate data' + append API-error issue only if calls failed; otherwise exit 0 clean"
      notes: ""
    - title: Check Apigee Failed Long-Running Operations
      at: runbook.robot:290
      asserts: "A completed Apigee long-running operation carries an error, excluding ones already reported as ERROR deployments"
      reads: ["GET organizations/<org>/operations (paginated)"]
      permissions: [apigee.operations.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_failed_operations.sh:59 ops=$(apigee_list_operations) -> apigee_curl records the error but returns body; paginate then yields [] ; this script never calls apigee_reset_api_errors/apigee_append_api_error_issue so a 403 = zero ops = no issue"
      notes: "The only inventory-independent check without an API-error issue."
  bundleNotes: "Hardest of the apigee bundles on discovery (status field in apigee_topology.json, discovery issues surfaced before Fail, stale files deleted). apigee_common.sh apigee_curl returns 000/non-2xx bodies and records them in apigee_api_errors.json; four check scripts exit 0 with an initialised '[]' issues file when no token or org (relying on the discovery issue). Runbook wrappers for each check still ignore rc and default parse failures to empty. Analytics tasks use GNU `date -d`."
- bundle: gcp-apigee-security-config
  displayName: GCP Apigee Security and Configuration Health
  classicResourceTypes: [gcp_apigee_organizations]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [resource]"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (apigee.googleapis.com, monitoring.googleapis.com via curl)"
  tools: [curl, jq, gcloud, awk, date]
  inputs: [APIGEE_ORG, GCP_PROJECT_ID, QUOTA_ABUSE_THRESHOLD, SECURITY_SCORE_THRESHOLD, SECURITY_WINDOW_HOURS]
  tasks:
    - title: Check Apigee API Product Quota and Rate Limits
      at: runbook.robot:26
      asserts: "An API product has no quota, a quota >= QUOTA_ABUSE_THRESHOLD, or approvalType auto"
      reads: ["GET apigee v1 organizations/<org>/apiproducts"]
      permissions: [apigee.apiproducts.list, apigee.apiproducts.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "apigee_common.sh:107-110 apigee_get curl -fsS 2>/dev/null, error swallowed -> empty body -> apigee_obj_list returns [] -> check_quota_limits.sh 'has no API products; nothing to evaluate' writes [] ; runbook.robot:36-39 unparseable issues file -> empty list"
      notes: "Token absence IS raised as an issue. List is requested without expand=true, so per-product quota fields may be absent and every product could be flagged 'no quota' (unverified; the script reads .quota from the list items). Overlaps the auto-approval/quota checks in gcp-apigee-product-governance."
    - title: Check Apigee Developer App Access Scope
      at: runbook.robot:59
      asserts: "An approved app or approved consumer key has a wildcard (*) scope, or a key is revoked"
      reads: ["GET organizations/<org>/developers", "GET .../developers/<email>/apps", "GET .../developers/<email>/apps/<app>"]
      permissions: [apigee.developers.list, apigee.developerapps.list, apigee.developerapps.get, apigee.appkeys.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_app_access.sh: empty developer list -> 'no registered developers; nothing to evaluate' writes []; per-app `[ -z app ] && continue` skips unreadable apps; apigee_get swallows curl errors (apigee_common.sh:107-110)"
      notes: "N+1 REST calls (developer x app). Consumer-key prefixes (8 chars) are echoed into the report."
    - title: Check Apigee Security Score and Incidents
      at: runbook.robot:92
      asserts: "Cloud Monitoring apigee.googleapis.com/security/score below SECURITY_SCORE_THRESHOLD (sev 4 under 40), or any security/detected_request_count or incident_request_count in SECURITY_WINDOW_HOURS"
      reads: ["POST monitoring.googleapis.com/v3/projects/<p>/timeSeries:list for apigee security score / detected_request_count / incident_request_count"]
      permissions: [monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_security_score.sh query(): curl -s 2>/dev/null, `|| _resp=''` then `{}` ; latest_value/sum_value jq || echo '' -> 'No security/score data returned ... raising nothing' (explicit by design: absence is not unhealthy)"
      notes: "Requires Advanced API Security metrics; not enabled = silent. Uses GNU date -d with BSD fallback. Query is a POST on a read API (read-only)."
    - title: Check Apigee Target Server and Virtual Host Configuration
      at: runbook.robot:125
      asserts: "A target server has sSLInfo.enabled != true (plaintext backend connection)"
      reads: ["GET organizations/<org>/environments", ".../environments/<env>/targetservers", ".../targetservers/<ts>"]
      permissions: [apigee.environments.list, apigee.targetservers.list, apigee.targetservers.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_target_vhost_config.sh: empty environments list -> 'no environments; nothing to evaluate' (:~30); empty target server list or unreadable target server -> skipped (`continue`); apigee_get swallows errors"
      notes: "Task name mentions virtual hosts but only target-server TLS is checked (no virtualhost/envgroup logic). Dedicated keystore expiry task was intentionally removed (duplicates gcp-apigee-environment-health)."
  bundleNotes: "Least hardened apigee bundle. apigee_common.sh:107-110 apigee_get = curl -fsS 2>/dev/null returning the (possibly empty) body with exit 0, every script treats empty as 'nothing to evaluate'. Runbook wrapper ignores rc and defaults an unparseable issues file to empty. The only guards are the Suite Initialization token check (sev 1) and per-script token check. Scripts run `set -x` with xtrace suppression around token handling."
- bundle: gcp-apigee-traffic-health
