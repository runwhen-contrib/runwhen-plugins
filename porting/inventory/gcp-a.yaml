      asserts: "Worker CPU usage/quota averages below UNDERUTILIZATION_THRESHOLD_PERCENT (idle capacity, cost)"
      reads: ["MQL workloads_cpu_quota_usage and workloads_cpu_quota"]
      permissions: [monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "same mql_query -> empty -> 'NO DATA' -> no issue (for this check missing data is a no-finding, not a false alarm)"
