    - title: Check Apigee Throughput and Anomalies
      at: runbook.robot:84
      asserts: "Live path: apigee.googleapis.com/environment/anomaly_count > 0 for an environment. (Throughput deviation vs previous window exists only in the MOCK_DATA_FILE branch)"
      reads: ["GET monitoring timeSeries environment/api_call_count and environment/anomaly_count per environment"]
      permissions: [monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_throughput.sh:153,155 curl 2>/dev/null || echo '{}' ; add // 0 || echo 0 -> anomaly 0 = no issue"
      notes: "BUG: THROUGHPUT_DEVIATION_PCT and the 'throughput changed sharply' finding are computed only from mock rows (check_throughput.sh:63-99); the live branch (160-180) never computes previous-window deviation, so the documented spike/drop detection does not run in production."
    - title: Check Apigee Target and Backend Performance
      at: runbook.robot:117
      asserts: "Per target server, 5xx / targetv2 request_count over the window exceeds ERROR_RATE_THRESHOLD percent"
