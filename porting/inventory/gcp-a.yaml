      permissions: [monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_target_performance.sh:143,145 curl 2>/dev/null || echo '{}' ; add // 0 || echo 0 -> total 0 -> err_rate 0"
      notes: "Report row has p95_latency_ms hard-coded 0 (latency not measured despite the task title/doc). Target servers come from discovery (environment targetservers)."
  bundleNotes: "Monitoring-only bundle (no apigee runtime Management reads except discovery). Discovery (discover_metrics_scope.sh) raises issues on missing token/org/error response but api_get converts curl failure to '{}' so a failed environments or targetservers list yields an empty scope = 'nothing to evaluate'. Every check script contains a MOCK_DATA_FILE test branch in the production path. Suite Init runs discovery and surfaces discovery_issues.json."
- bundle: gcp-artifact-registry-governance
  displayName: GCP Artifact Registry Governance & Cleanup
  classicResourceTypes: [gcp_artifactregistry_repositories]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project, resource]"
  sli: true
  sliAsserts: "Mean of 4 binary scores (cleanup policies, stale images, untagged images, storage utilization), 0 if any issue or script rc!=0 or issue-file unparseable. False-pass status: confirmed (list failures and an empty repository list produce no issues -> score 1; discovery issues are never read)"
  egress: "cloud API (artifactregistry.googleapis.com via gcloud; gcr.io and artifacts.<project>.appspot.com for legacy check)"
  tools: [gcloud, jq, awk, "GNU date -d"]
  inputs: [GCP_PROJECT_ID, ARTIFACT_REGISTRY_LOCATIONS, ARTIFACT_REGISTRY_REPOSITORIES, ARTIFACT_REGISTRY_LOCATION, ARTIFACT_REGISTRY_REPOSITORY, STALE_IMAGE_THRESHOLD_DAYS, UNTAGGED_IMAGE_THRESHOLD_DAYS, STORAGE_UTILIZATION_THRESHOLD_GB, MIN_TAGS_TO_KEEP]
  tasks:
    - title: Check Cleanup Policy Configuration for Repositories
      at: runbook.robot:19
      asserts: "A Docker repository has no cleanup policies, or lacks an untagged-manifest rule or an aged-tag rule, or has dry-run on"
      reads: ["gcloud artifacts repositories describe <repo> --location --format=json"]
      permissions: [artifactregistry.repositories.get, artifactregistry.repositories.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "gcp-artifact-registry-helpers.sh:119 `gcloud artifacts locations list 2>/dev/null || true` and discover_repositories `continue` on a failed repositories list (issue goes to discover_repositories_issues.json which no runbook or SLI step reads) -> zero repositories -> no issues. The describe failure itself is raised as an issue (check-cleanup-policies.sh)."
      notes: "Runbook raises an issue on rc!=0. Non-Docker repositories are skipped. Discovery runs in Suite Initialization (runbook.robot:431) with its return value ignored."
    - title: Identify Stale Container Images
      at: runbook.robot:70
      asserts: "A Docker repository has tagged images not updated for STALE_IMAGE_THRESHOLD_DAYS"
      reads: ["gcloud artifacts docker images list <repo path> --include-tags --limit=500 --format=json"]
      permissions: [artifactregistry.dockerimages.list, artifactregistry.repositories.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "gcp-artifact-registry-helpers.sh:215 list_docker_images ... 2>/dev/null || echo '[]' -> permission error = no images = no stale images"
      notes: "Limited to IMAGE_LIST_MAX=500 images per repository (silent truncation, sorting undefined). days_since_timestamp falls back to now (age 0) if date parsing fails (BSD -j form lacks timezone)."
    - title: Identify Untagged Images Consuming Storage
      at: runbook.robot:121
      asserts: "A Docker repository has untagged images older than UNTAGGED_IMAGE_THRESHOLD_DAYS"
      reads: ["gcloud artifacts docker images list ... --include-tags"]
      permissions: [artifactregistry.dockerimages.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "same list_docker_images ... || echo '[]' (helpers:215)"
      notes: "Same 500-image cap. Multi-arch child manifests appear as untagged and can be over-counted (unverified)."
    - title: Detect Legacy Container Registry Usage
      at: runbook.robot:172
      asserts: "gcr.io/<project> still holds images or legacy artifacts*.appspot.com buckets hold objects (sev 2 if no Artifact Registry repos exist)"
      reads: ["gcloud container images list --repository=gcr.io/<project>", "gcloud storage ls gs://[us.|eu.|asia.]artifacts.<project>.appspot.com/ and -r gs://.../**"]
      permissions: [storage.objects.list, storage.buckets.get, artifactregistry.repositories.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "detect-legacy-gcr-usage.sh `gcloud container images list ... 2>/dev/null` inside `if` and `gcloud storage ls ... >/dev/null 2>&1` -> any error (denied, API disabled) = zero legacy usage = no issue"
      notes: "Recursive object count `gcloud storage ls -r` of whole legacy bucket can be very slow/large. Raises a sev-4 'nothing found' note when no AR repos and no legacy found."
    - title: Report Artifact Registry Storage Utilization by Repository
      at: runbook.robot:223
      asserts: "Estimated repository size (max of repo sizeBytes and sampled image bytes) exceeds STORAGE_UTILIZATION_THRESHOLD_GB (0 disables)"
      reads: ["repositories list sizeBytes (discovery)", "gcloud artifacts docker images list"]
      permissions: [artifactregistry.repositories.list, artifactregistry.dockerimages.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "helpers:215 list_docker_images || echo '[]' ; discovery repos list failure -> continue; threshold 0 (disables) is allowed"
      notes: "Writes storage_utilization_report.json. Docker-only image sampling; other formats rely on repo sizeBytes only."
    - title: Generate Artifact Registry Cleanup Policy Recommendations
      at: runbook.robot:280
      asserts: "A Docker repository lacks cleanup-policy coverage (untagged and/or aged); raises a sev-4 recommendation with a suggested policy JSON (apply command printed, not run)"
      reads: ["gcloud artifacts repositories describe <repo>"]
      permissions: [artifactregistry.repositories.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "helpers.sh repository_cleanup_policy_gaps: describe failed -> `echo \"\"; return 0` -> empty gaps = 'already covered; no recommendation'"
      notes: "Duplicates check-cleanup-policies logic. Recommendation only; does not apply."
  bundleNotes: "Runbook raises an issue on non-zero script rc (hardened) but the scripts themselves swallow the data-producing gcloud calls (helpers:119, :215, :264). Repository discovery is cached per scope key in discovered_repositories.<key>.json and its issues (discover_repositories_issues.json) are never surfaced. SLI tasks Fetch the same cached list. Scripts use set -x."
- bundle: gcp-artifact-registry-spend-analysis
  displayName: GCP Artifact Registry Spend Analysis
  classicResourceTypes: [project]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project]; baseName gcp-artifact-registry-spend (resource type is the generic 'project', not an artifact registry type)"
  sli: true
  sliAsserts: "Mean of 3 binary scores (anomaly spike, MoM growth, project concentration) from artifact-spend-sli-check.sh JSON on stdout; unparseable output -> 0 (fails closed) and billing-table not found -> default zeros. False-pass status: likely - an empty BigQuery result (wrong project filter, no export rows) gives total 0 and every score 1"
  egress: "cloud API (BigQuery via bq CLI / python google-cloud-bigquery; billing export table)"
  tools: [bq, gcloud, jq, bc, awk, "python3 + google-cloud-bigquery (fallback)", "GNU date -d"]
  inputs: [GCP_PROJECT_IDS, GCP_BILLING_EXPORT_TABLE, GCP_BILLING_QUERY_PROJECT, COST_ANALYSIS_LOOKBACK_DAYS, ARTIFACT_COST_SPIKE_MULTIPLIER, ARTIFACT_MOM_GROWTH_THRESHOLD_PERCENT, ARTIFACT_PROJECT_COST_THRESHOLD_PERCENT, OUTPUT_FORMAT, GCP_ORG_WIDE_REPORT]
  tasks:
    - title: Analyze Artifact Registry Spend by Project and SKU
      at: runbook.robot:19
      asserts: "Raises only an access issue when the billing export table cannot be found; otherwise produces a spend report (per project/SKU totals with daily/weekly/monthly rollups) with no threshold"
      reads: ["bq ls (auto-discover gcp_billing_export_v1_* table)", "bq query: SUM(cost)+credits grouped by project/SKU/day over artifact-registry/container-registry SKUs"]
      permissions: [bigquery.datasets.get, bigquery.tables.list, bigquery.tables.getData, bigquery.jobs.create]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:30-33 script rc ignored; reads artifact_spend_analysis_output.json if present else '[]' (file never deleted before the run, so a crashed bq query leaves a stale file or none); common.sh run_bq_json_query returns '[]' with rc 1 on failure"
      notes: "Informational report; real findings only when billing context is missing. If no billing export exists and GCP_BILLING_EXPORT_TABLE is empty it tries `bq ls` across projects (discover_billing_table, 2>/dev/null)."
    - title: Report Top Artifact Registry Cost Contributors
      at: runbook.robot:61
      asserts: "A single project accounts for >= ARTIFACT_PROJECT_COST_THRESHOLD_PERCENT of artifact spend, or legacy Container Registry SKUs have cost > 0"
      reads: ["bq query (same cost rows over lookback)"]
      permissions: [bigquery.tables.getData, bigquery.jobs.create]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "same rc-ignored / stale *_output.json / '[]' fallback as the analyze task; threshold default 0 in script disables the share check"
      notes: "Cost/FinOps observation, not a fault in the source system."
    - title: Compare Artifact Registry Spend Month-over-Month
      at: runbook.robot:103
      asserts: "Last complete month total (or storage / transfer component) grew >= ARTIFACT_MOM_GROWTH_THRESHOLD_PERCENT over the prior month"
      reads: ["bq query: monthly SUM(cost)+credits for last 3 complete months, total / storage SKUs / transfer SKUs"]
      permissions: [bigquery.tables.getData, bigquery.jobs.create]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "compare-artifact-spend-mom.sh: `run_bq_json_query | jq -r '.[0].total_cost // 0'` -> failed/empty query = 0, and `if m2_total > 0` guard skips the comparison; runbook ignores rc"
      notes: "Uses bc for arithmetic (bc must be installed)."
    - title: Detect Artifact Storage Cost Anomalies
      at: runbook.robot:145
      asserts: "A storage SKU's single-day cost is >= ARTIFACT_COST_SPIKE_MULTIPLIER x its 7-day average, or weekly cost >= 1.5x the monthly-implied weekly cost"
      reads: ["bq query: daily cost per storage SKU over the lookback window"]
      permissions: [bigquery.tables.getData, bigquery.jobs.create]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "run_bq_json_query returns '[]' on failure (common.sh:~190); empty rows -> no SKUs -> no spike; rc ignored; stale artifact_anomaly_output.json"
      notes: "Average only includes days with cost > 0."
    - title: Generate Artifact Registry Spend Optimization Summary
      at: runbook.robot:187
      asserts: "Recommendation findings: legacy GCR cost > 0; storage > 60% of artifact spend; vulnerability scanning > 15%; high-cost projects"
      reads: ["bq query (cost rows over lookback)"]
      permissions: [bigquery.tables.getData, bigquery.jobs.create]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "same query-failure -> empty rows -> no recommendations; rc ignored; stale artifact_recommendations_output.json"
      notes: "Advice generator, not a health check."
  bundleNotes: "Billing-export (BigQuery) bundle; all five runbook scripts follow the same shape: `ensure_billing_context` (loud access issue if table not found) then queries whose failure becomes '[]'/0. Runbook never checks rc and reads a persistent *_output.json that is not cleared, so stale results can masquerade. SLI is the safer half (fails closed on parse failure). The classic resource type is the generic `project`, so one SLX per GCP project is generated (not per repository). Requires GNU or BSD date for ranges."
- bundle: gcp-bigquery-dataset-health
  displayName: GCP BigQuery Dataset Health
  classicResourceTypes: [gcp_bigquery_datasets]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project]"
  sli: true
  sliAsserts: "Mean of 5 binary scores (table size, dataset access, expiration, audit logging, table optimization); each 1 if its issues file has 0 entries. Issues file is produced by scripts that treat bq/gcloud errors as an empty dataset list -> score 1. Status: confirmed"
  egress: "cloud API (bigquery via bq CLI, cloud logging and resourcemanager via gcloud)"
  tools: [bq, gcloud, jq, python3]
  inputs: [GCP_PROJECT_ID, TABLE_SIZE_THRESHOLD_GB, TABLE_GROWTH_THRESHOLD_PERCENT, INCLUDE_STREAMING_BUFFER]
  tasks:
    - title: Check BigQuery Table Size Trends
      at: runbook.robot:20
      asserts: "A table's numBytes exceeds TABLE_SIZE_THRESHOLD_GB (default 100)"
      reads: ["bq --project_id <p> ls --format=json", "bq ls --format=json <dataset>", "bq show --format=json <dataset>.<table>"]
      permissions: [bigquery.datasets.get, bigquery.tables.list, bigquery.tables.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_table_size_trends.sh:~7 datasets=$(bq ... ls 2>/dev/null || echo '[]') then 'No datasets found' + '[]' + exit 0; per-table `bq show ... 2>/dev/null` -> empty -> numBytes 0 -> skipped"
      notes: "Name says 'trends' and TABLE_GROWTH_THRESHOLD_PERCENT/INCLUDE_STREAMING_BUFFER are imported but never used; only an absolute size threshold is checked. `bq ls` returns at most 50 datasets/tables by default (no --max_results), so larger projects are silently truncated. Writes issue JSON via printf (backticks in titles)."
    - title: Check BigQuery Dataset Access Configuration
      at: runbook.robot:53
      asserts: "A dataset ACL contains allUsers/allAuthenticatedUsers (sev high) or a role matching owner|admin|editor"
      reads: ["bq ls --format=json", "bq show --format=json <dataset> | jq .access"]
      permissions: [bigquery.datasets.get, bigquery.datasets.getIamPolicy]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_dataset_access.sh: `bq ls 2>/dev/null || echo '[]'` -> 'No datasets found'; `bq show ... 2>/dev/null | jq '.access // []'` -> failed show = no ACL entries = no issue"
      notes: "Matches role names loosely (regex owner|admin|editor), so legacy basic role OWNER on the dataset creator is flagged on nearly every dataset (false alarms). Same 50-item truncation."
    - title: Check BigQuery Table Expiration Policies
      at: runbook.robot:86
      asserts: "A dataset has no default table expiration, or a table has no expirationTime"
      reads: ["bq ls", "bq show dataset", "bq ls <dataset>", "bq show <dataset.table>"]
      permissions: [bigquery.datasets.get, bigquery.tables.list, bigquery.tables.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_table_expiration.sh: bq ls 2>/dev/null || echo '[]' -> 'No datasets found'. (A failed `bq show` yields empty and is reported as 'no expiration', i.e. a false alarm, not a false pass)"
      notes: "Flags every table and dataset without an expiry, which is a hygiene preference not a fault; very noisy (one issue per table)."
    - title: Check BigQuery Audit Logging Configuration
      at: runbook.robot:119
      asserts: "No Cloud Logging sink exists, or none of the sinks has a filter mentioning bigquery / broad filter (treated as evidence audit logs are captured)"
      reads: ["gcloud projects get-iam-policy <p> --format=json (fetched but unused)", "gcloud logging sinks list --format=json"]
      permissions: [logging.sinks.list, resourcemanager.projects.getIamPolicy]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "check_audit_logging.sh: any broad sink (null/empty filter) or a sink whose filter contains the word bigquery is accepted as 'audit logs captured' without checking auditConfigs / DATA_READ enablement; the IAM policy audit_config is read but never inspected. A sinks list failure (|| echo '[]') produces a false 'no sinks' alarm instead"
      notes: "Does not actually verify Data Access audit logging (auditConfigs). Exits 0 early after writing the issue file."
    - title: Analyze BigQuery Table Partitioning and Clustering
      at: runbook.robot:152
      asserts: "A table with numBytes > 0 has no time/range partitioning, or is partitioned but not clustered"
      reads: ["bq ls", "bq ls <dataset>", "bq show <dataset.table>"]
      permissions: [bigquery.datasets.get, bigquery.tables.list, bigquery.tables.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "bq ls 2>/dev/null || echo '[]' -> 'No datasets found'; bq show 2>/dev/null empty -> numBytes 0 -> `continue`"
      notes: "Flags any non-empty unpartitioned table regardless of size ('Large table' wording but no size floor). Views/external tables numBytes 0 are skipped."
    - title: Generate BigQuery Dataset Health Summary Report
      at: runbook.robot:185
      asserts: "No fault assertion; builds a summary (dataset/table counts, total storage, datasets without default expiration, largest tables)"
      reads: ["bq ls", "bq show <dataset>", "bq ls <dataset>", "bq show <dataset.table>"]
      permissions: [bigquery.datasets.get, bigquery.tables.list, bigquery.tables.get]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "generate_dataset_summary.sh: errors -> '[]' / empty -> a summary with zero datasets is emitted as a valid report"
      notes: "Writes scratch files to fixed /tmp paths (/tmp/bq_summary_parts.jsonl, bq_largest_tables.jsonl): not safe for concurrent runs. Report only."
  bundleNotes: "Oldest-style bundle: scripts never check the bq exit status; every list/show is `2>/dev/null || echo '[]'`; runbook ignores returncode and defaults an unparseable issues file to empty. The task docs claim 'trends'/'streaming buffer' analysis that is not implemented. `bq ls` pagination default (50) means projects with >50 datasets/tables are partially inspected. SLI (cat <file> | jq length) fails loudly only if the file is missing."
- bundle: gcp-bigquery-job-health
  displayName: GCP BigQuery Job Health
  classicResourceTypes: [project]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project] (generic 'project' resource type)"
  sli: true
  sliAsserts: "Mean of 3 binary scores (success rate, slow jobs, slot contention) from each script's output-issues file; unparseable file -> 0 (fails closed). False-pass status: likely - bq failure is raised as an issue (good) but queries are hard-wired to region-us so non-US projects see zero jobs = 100% success"
  egress: "cloud API (BigQuery via bq CLI)"
  tools: [bq, jq, bc]
  inputs: [GCP_PROJECT_ID, JOB_LOOKBACK_HOURS, SUCCESS_RATE_THRESHOLD, SLOW_JOB_DURATION_MINUTES, SLOT_CONTENTION_THRESHOLD]
  tasks:
    - title: Check BigQuery Job Success Rate
      at: runbook.robot:19
      asserts: "Success rate of QUERY jobs in JOBS_BY_PROJECT over JOB_LOOKBACK_HOURS is below SUCCESS_RATE_THRESHOLD percent (only when total_jobs > 0)"
      reads: ["bq query INFORMATION_SCHEMA.JOBS_BY_PROJECT (`<p>.region-us`) COUNT/COUNTIF error_result"]
      permissions: [bigquery.jobs.create, bigquery.jobs.listAll]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "check_job_success_rate.sh:~13 hard-coded `region-us` INFORMATION_SCHEMA: a project whose jobs run in EU/other regions returns 0 rows, `.success_rate // 100` -> 'HEALTHY'; also `total_jobs > 0` guard. A bq failure IS raised as an issue (exit 0 with issue JSON)."
      notes: "Only job_type = 'QUERY' is counted (load/copy/extract jobs ignored). bq query itself creates a (billed, tiny) query job. Runbook defaults unparseable output file to empty and the output file is not removed before the run (stale risk); ISSUE rc not checked."
    - title: Analyze Failed BigQuery Job Error Patterns
      at: runbook.robot:55
      asserts: "Any failed QUERY job exists in the lookback window; raises one issue per error_result.reason with a severity map (quotaExceeded, accessDenied, invalidQuery, timeout, ...)"
      reads: ["bq query JOBS_BY_PROJECT GROUP BY error_result.reason"]
      permissions: [bigquery.jobs.create, bigquery.jobs.listAll]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "same hard-coded region-us -> 'No failed jobs found' for non-US; bq failure is raised as an issue"
      notes: "Any failed job (even a user typo, invalidQuery) raises an issue regardless of rate."
    - title: Identify Slow Running BigQuery Jobs
      at: runbook.robot:91
      asserts: "QUERY jobs whose end_time - start_time exceeds SLOW_JOB_DURATION_MINUTES in the lookback (LIMIT 50); severity by count (>20 sev4, >5 sev3)"
      reads: ["bq query JOBS_BY_PROJECT with duration filter"]
      permissions: [bigquery.jobs.create, bigquery.jobs.listAll]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "hard-coded region-us -> zero rows = 'No slow jobs'; bq failure raised as an issue"
      notes: "Completed jobs only (end_time must be non-null); jobs still running past the threshold are not counted."
    - title: Check BigQuery Job Slot Contention
      at: runbook.robot:127
      asserts: "Hourly SUM(period_slot_ms) from JOBS_TIMELINE exceeds SLOT_CONTENTION_THRESHOLD (default 1,000,000 ms) in any of the last 48 hours"
      reads: ["bq query INFORMATION_SCHEMA.JOBS_TIMELINE (region-us) grouped by hour"]
      permissions: [bigquery.jobs.create, bigquery.jobs.listAll]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "hard-coded region-us -> no rows -> 'no slot contention'; bq failure raised as an issue (script blames a missing reservation)"
      notes: "Measures slot-ms consumed per hour, which is usage, not contention (no wait/queue measure, no comparison with reservation capacity). Message claims JOBS_TIMELINE needs a reservation, which is not true for on-demand projects (unverified)."
  bundleNotes: "Better than the dataset-health bundle: bq query failure is detected (`if ! query_result=$(bq query ... 2>/dev/null)`) and raised as an issue, but stderr is discarded so the cause is lost. The region is hard-coded to region-us in all four scripts (no input for location). The SLI task list omits error-pattern scoring although its doc mentions it. SLI fails closed on unparseable output."
- bundle: gcp-bigquery-quota-health
  displayName: GCP BigQuery Quota Health
  classicResourceTypes: [gcp_bigquery_datasets]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project]"
  sli: true
  sliAsserts: "Mean of 4 binary scores (slot utilization, storage quota, daily query count, dataset/table limits); each 1 when its issues file has 0 entries. Status: confirmed - every script writes [] when its data source failed or returned nothing"
  egress: "cloud API (bigquery via bq, gcloud bigquery reservations, monitoring.googleapis.com via curl)"
  tools: [bq, gcloud, jq, curl, python3]
  inputs: [GCP_PROJECT_ID, SLOT_UTILIZATION_THRESHOLD, STORAGE_QUOTA_THRESHOLD, DAILY_QUERY_THRESHOLD, DATASET_TABLE_THRESHOLD, DAILY_QUERY_LIMIT, BIGQUERY_STORAGE_QUOTA_BYTES]
  tasks:
    - title: Check BigQuery Slot Reservation Utilization
      at: runbook.robot:19
      asserts: "Reserved slot utilization >= SLOT_UTILIZATION_THRESHOLD percent (sev 3 at >=95), derived from reservation slot_capacity and bigquery.googleapis.com/slots/available_capacity"
      reads: ["gcloud bigquery reservations list --project=<admin> --location=<BIGQUERY_LOCATION|US> --format=json", "GET monitoring v3 timeSeries bigquery.googleapis.com/slots/available_capacity"]
      permissions: [bigquery.reservations.list, monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_slot_utilization.sh:~8 `gcloud bigquery reservations list ... 2>/dev/null || echo '[]'` -> capacity 0 -> 'No reservations found. Nothing to monitor.' exit 0; monitoring curl `2>/dev/null || echo ''`; no data -> 'Reporting 0% utilized'"
      notes: "Unverified: whether `gcloud bigquery reservations` exists as a command group in stock gcloud (bq reservations are normally `bq ls --reservation`); if it does not, this task always reports 'nothing to monitor'. On-demand projects (no reservations) are skipped. Utilization math (capacity - available_capacity) is only valid for a single reservation location. BIGQUERY_ADMIN_PROJECT and BIGQUERY_LOCATION env read but not imported as runbook variables."
    - title: Check BigQuery Storage Quota
      at: runbook.robot:52
      asserts: "Sum of TABLE_STORAGE logical bytes across datasets >= STORAGE_QUOTA_THRESHOLD percent of BIGQUERY_STORAGE_QUOTA_BYTES (default 10 TB)"
      reads: ["bq ls --format=json", "bq query SELECT SUM(TOTAL_LOGICAL_BYTES) FROM `<p>.<dataset>.INFORMATION_SCHEMA.TABLE_STORAGE` per dataset"]
      permissions: [bigquery.datasets.get, bigquery.tables.list, bigquery.jobs.create, bigquery.tables.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_storage_quota.sh:~20-30 per-dataset `bq query ... 2>/dev/null || echo ''` -> l=p=0 -> 'No storage data reported' -> []; bq ls failure also -> 'No datasets found or bq ls failed' -> []"
      notes: "Likely never returns data: TABLE_STORAGE is believed to be a region-qualified view (`region-us.INFORMATION_SCHEMA.TABLE_STORAGE`) not dataset-qualified (unverified). The 10 TB 'quota' default is an assumption; BigQuery has no per-project storage quota of that kind. 50-dataset `bq ls` default page applies."
    - title: Check BigQuery Query Per-Day Limit
      at: runbook.robot:85
      asserts: "Count of QUERY jobs created today (JOBS_BY_PROJECT, region-us) >= DAILY_QUERY_THRESHOLD percent of DAILY_QUERY_LIMIT (default 100000)"
      reads: ["bq query COUNT(*) FROM `<p>.region-us.INFORMATION_SCHEMA.JOBS_BY_PROJECT` WHERE creation_time >= today AND job_type='QUERY'"]
      permissions: [bigquery.jobs.create, bigquery.jobs.listAll]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_query_daily_limit.sh:~16 `bq query ... 2>/dev/null | jq -r '.[0].cnt // 0'` -> failure (or non-US region) -> 0 (pipefail then set -e aborts only if the pipeline fails, leaving a stale/missing output file that runbook defaults to empty)"
      notes: "Hard-coded region-us. DAILY_QUERY_LIMIT is a user-supplied number, not read from any GCP quota (BigQuery has no default per-day query-count limit; it has custom byte quotas). Compares a count to an invented limit."
    - title: Check BigQuery Dataset and Table Limits
      at: runbook.robot:118
      asserts: "A dataset's table count or the project's dataset count is >= DATASET_TABLE_THRESHOLD percent of hard-coded caps (10000 tables/dataset, 10000 datasets/project)"
      reads: ["bq ls --format=json", "bq ls --format=json <dataset>"]
      permissions: [bigquery.datasets.get, bigquery.tables.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_dataset_table_limits.sh:~8 `bq ls 2>/dev/null || echo '[]'` -> 'No datasets found' -> []; per-dataset ls `|| echo '[]'` -> 0 tables"
      notes: "`bq ls` pages at 50 by default so counts above 50 are capped and never approach 80% of 10000: this check cannot trigger in practice. Cap values are assumptions (unverified against GCP documented limits)."
  bundleNotes: "Quota-themed but mostly checks invented limits (10 TB storage, 100k queries/day, 10k tables) rather than real GCP quotas (no serviceusage / consumer quota API is read). All four scripts use `2>/dev/null || echo ...`; none checks the exit status of bq/gcloud; runbook ignores rc and treats a parse failure of the issues file as empty. SLI uses `cat file | jq length` so a missing file fails loudly but a stale one scores as truth."
- bundle: gcp-bucket-health
  displayName: GCP Storage Bucket Health
  classicResourceTypes: [gcp_storage_buckets]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project]; also emits an slo"
  sli: true
  sliAsserts: "Mean of 3 binary scores: any bucket > USAGE_THRESHOLD TB (default 0.5), public buckets <= PUBLIC_ACCESS_BUCKET_THRESHOLD (default 0), any bucket total ops/s > OPS_RATE_THRESHOLD (default 10). Status: confirmed - empty bucket list / failed Monitoring or ACL/IAM reads score 1"
  egress: "cloud API (gcloud storage, gsutil, Cloud Monitoring PromQL endpoint monitoring.googleapis.com/v1/.../prometheus)"
  tools: [gcloud, gsutil, curl, jq, awk]
  inputs: [PROJECT_IDS, USAGE_THRESHOLD, OPS_RATE_THRESHOLD, PUBLIC_ACCESS_BUCKET_THRESHOLD]
  tasks:
    - title: Fetch GCP Bucket Storage Utilization
      at: runbook.robot:18
      asserts: "A bucket's size (Monitoring storage_total_bytes, or gsutil du fallback) is above USAGE_THRESHOLD TB"
      reads: ["gsutil ls -p <project>", "gcloud services list --enabled (monitoring check)", "POST monitoring.googleapis.com/v1/projects/<p>/location/global/prometheus/api/v1/query storage_googleapis_com:storage_total_bytes", "gsutil du -s gs://<bucket> (fallback)", "gcloud storage buckets describe gs://<bucket>"]
      permissions: [storage.buckets.list, storage.buckets.get, serviceusage.services.list, monitoring.timeSeries.list, storage.objects.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "bucket_size.sh list_buckets: `gsutil ls -p 2>/dev/null | sed` -> empty on denied -> no buckets -> bucket_report.json '[]'; get_bucket_size_gsutil `gsutil du ... 2>/dev/null ... || true`, `${size_bytes:-0}` -> 0 TB; buckets with no Monitoring series just 'No size data found'"
      notes: "Runbook ignores script rc and reads bucket_report.json (not removed first, stale risk). Monitoring path uses avg_over_time 30m so new buckets/empty buckets are skipped. gsutil du of a large bucket can take very long (180s task timeout). Task name says 'utilization' but this is absolute size, not a quota."
    - title: Add GCP Bucket Storage Configuration to Report
      at: runbook.robot:49
      asserts: "None; adds each bucket's `gcloud storage buckets describe` JSON to the report"
      reads: ["gsutil ls -p <project>", "gcloud storage buckets describe gs://<bucket> --format=json"]
      permissions: [storage.buckets.list, storage.buckets.get]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "bucket_details.sh: describe `2>/dev/null` and `[ -n metadata ]` -> unreadable bucket silently omitted; no issues are raised by design"
      notes: "Report-only; Documentation is copy-pasted from the utilization task."
    - title: Check GCP Bucket Security Configuration
      at: runbook.robot:60
      asserts: "A bucket is public (allUsers/allAuthenticatedUsers in IAM policy when uniform access is on, or in ACLs otherwise); raised when public count > PUBLIC_ACCESS_BUCKET_THRESHOLD"
      reads: ["gsutil ls -p <project>", "gcloud storage buckets describe gs://<bucket> --format=json", "gcloud storage buckets get-iam-policy gs://<bucket>", "gsutil acl get gs://<bucket>"]
      permissions: [storage.buckets.list, storage.buckets.get, storage.buckets.getIamPolicy]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_security.sh: `gcloud storage buckets get-iam-policy ... 2>/dev/null || echo '{}'` and `gsutil acl get ... 2>/dev/null || echo '[]'` -> permission error = 'not publicly accessible'; `gsutil ls -p ... 2>/dev/null` empty -> 'No security issues found'; describe failure -> 'Error fetching settings' + return (skipped)"
      notes: "Task doc claims risky IAM permissions and encryption are checked; encryption is only echoed and no risky-role check exists. A PUBLIC_ACCESS_BUCKET_THRESHOLD above 0 suppresses all findings. Does not check public access prevention (iamConfiguration.publicAccessPrevention) or conditional bindings."
    - title: Fetch GCP Bucket Storage Operations Rate
      at: runbook.robot:96
      asserts: "A bucket's 30-minute rate of read+write API requests exceeds OPS_RATE_THRESHOLD ops/s"
      reads: ["gsutil ls -p <project>", "PromQL query storage_googleapis_com:api_request_count read and write rates (Cloud Monitoring prometheus endpoint)", "gcloud storage buckets describe"]
      permissions: [storage.buckets.list, storage.buckets.get, serviceusage.services.list, monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "bucket_ops_costs.sh: read_ops/write_ops `select(...) | .ops // 0 | tonumber | round`, `${read_ops:-0}` -> a Monitoring error response parses to empty -> 0 ops; projects without the Monitoring API enabled are silently skipped ('Monitoring API is not enabled')"
      notes: "rate() is rounded to integer ops/s before comparing, so rates below 0.5 round to 0. The token fetch failure exits 1 (loud)."
  bundleNotes: "Bash scripts, first generation. Runbook tasks do not check rc; two tasks hard-fail (json.loads error) when the report file is absent but read stale files otherwise. Bucket enumeration is `gsutil ls -p <project> 2>/dev/null` everywhere, so any listing failure means 'no buckets, no problems'. PROJECT_IDS accepts a comma list although the SLX is per-bucket-resource-type with qualifier project. The generation rule matches on gcp_storage_buckets yet the scripts re-enumerate all buckets in the project (not the matched bucket)."
- bundle: gcp-cloud-composer-health
  displayName: GCP Cloud Composer Health
  classicResourceTypes: [gcp_composer_environments]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [resource, project]; baseName gcp-composer-health"
  sli: true
  sliAsserts: "Mean of 5 binary scores (env state, config, DAG/scheduler, worker/queue, error logs), each 1 when its issues file has 0 entries; an empty/missing file explicitly scores 0 issues = 1 (runbook `Set Variable If '${count}' == '' 0`). Status: confirmed"
  egress: "cloud API (composer, logging, monitoring via gcloud/curl) plus HTTPS to each environment's Airflow web server (airflowUri, /api/v1)"
  tools: [gcloud, curl, jq, awk, sed]
  inputs: [GCP_PROJECT_ID, ENV_NAME, LOCATIONS, LOG_LOOKBACK_WINDOW_DAYS, STALE_QUEUE_AGE_MINUTES]
  tasks:
    - title: Check Cloud Composer Environment Health State
      at: runbook.robot:19
      asserts: "A Composer environment's control-plane state is not RUNNING, or Monitoring web_server/health reports unhealthy samples in the last 15m"
      reads: ["gcloud composer environments list --locations=<LOCATIONS> --format=json", "gcloud composer environments describe --format=value(state)", "POST monitoring.googleapis.com/v3/projects/<p>/timeSeries:query web_server/health"]
      permissions: [composer.environments.list, composer.environments.get, monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_env_state.sh:~20 `gcloud composer environments list ... 2>/dev/null || echo '[]'` -> 'No Cloud Composer environments found' -> [] ; get_web_server_health curl 2>/dev/null | jq -> empty -> total 0 -> skipped. (describe failure becomes state UNKNOWN which IS flagged)"
      notes: "LOCATIONS default us-central1 only, so environments in other regions are silently not seen. Runbook ignores rc and falls back to empty list on parse failure."
    - title: Fetch Cloud Composer Environment Configurations
      at: runbook.robot:52
      asserts: "Environment uses a composer-1 image, an Airflow major < 2, or has no Airflow web server URI"
      reads: ["gcloud composer environments list", "gcloud composer environments describe --format=json"]
      permissions: [composer.environments.list, composer.environments.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "fetch_env_config.sh: list `2>/dev/null || echo '[]'` -> 'No environments'; describe `2>/dev/null || echo '{}'` -> empty image_version -> no version issue (only the 'no Airflow URI' issue would fire)"
      notes: "Configuration dump plus version-deprecation heuristic; no drift comparison despite the bundle doc saying 'configuration drift'."
    - title: Check Cloud Composer DAG and Scheduler Health
      at: runbook.robot:85
      asserts: "Airflow web server URI missing/unreachable, /api/v1/health scheduler or metadatabase status != healthy, or failed DAG runs (and their failed task instances) exist"
      reads: ["gcloud composer environments describe --format=value(config.airflowUri)", "Airflow REST: GET /api/v1/health, /api/v1/dags?limit=200, /api/v1/dags/<id>/dagRuns?state=failed&limit=100, /dagRuns/<run>/taskInstances"]
      permissions: [composer.environments.get, composer.environments.list]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "check_jobs_and_scheduler.sh: unreachable web server / empty dag list are raised as issues (good), but per-DAG `[ -z \"$dag_runs\" ] && continue` and `[ -z \"$ti\" ] && continue` silently skip a failed Airflow API call; env list `|| echo '[]'` -> none found"
      notes: "Needs network path from the runner to the Airflow web UI (private IP/IAP Composer environments will report 'unreachable') and the SA must have Airflow API access (Composer User/Airflow role) - the IAM list above is only the GCP side. failed dagRuns query has no time window (all-time failed runs, limit 100), so one ancient failure raises a standing issue. Limit 200 DAGs; no pagination."
    - title: Check Cloud Composer Worker and Queue Health
      at: runbook.robot:118
      asserts: "Queued task instances across running DAG runs exceed 2x running task instances (queue backlog), or an environment has no configured worker count (not set/0)"
      reads: ["Airflow REST: /api/v1/dags, dagRuns?state=running, taskInstances", "gcloud composer environments describe --format=json (workloadsConfig.worker)"]
      permissions: [composer.environments.get, composer.environments.list]
      scope: project
      readOnly: true
      falsePass: likely
      falsePassWhy: "check_workers_and_queues.sh: `[ -z \"$dag_runs\" ] && continue` / `[ -z \"$ti\" ] && continue` skip failed API calls; queue test requires queued_sum>0 and running_sum>0; describe `|| echo '{}'` -> worker 'not set' raises issue (false alarm)"
      notes: "STALE_QUEUE_AGE_MINUTES is passed into the issue text but no task age is measured (only counts). Composer 1 environments have no workloadsConfig, so they always flag 'not set'."
    - title: Get Error Logs for Cloud Composer Environments
      at: runbook.robot:151
      asserts: "Any ERROR-or-higher cloud_composer_environment log entry exists in the last LOG_LOOKBACK_WINDOW_DAYS days (grouped per environment with sample messages)"
      reads: ["gcloud logging read 'resource.type=cloud_composer_environment AND severity>=ERROR' --freshness=<N>d --limit=1000"]
      permissions: [logging.logEntries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "get_error_logs.sh:~12 `gcloud logging read ... 2>/dev/null || echo '[]'` -> 'No Cloud Composer error logs found' -> []"
      notes: "Default lookback 14 days, so a task failing once 13 days ago keeps the issue alive (noisy). Limit 1000 entries."
    - title: Generate Cloud Composer Health Summary
      at: runbook.robot:184
      asserts: "Environment state != RUNNING (summary table; duplicate of the state task)"
      reads: ["gcloud composer environments list", "gcloud composer environments describe x4 per env (state, imageVersion, worker.count, scheduler.count)"]
      permissions: [composer.environments.list, composer.environments.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "composer_health_summary.sh: list `|| echo '[]'` -> 'No environments'; describe `|| echo UNKNOWN` fields then `state != RUNNING` flags (UNKNOWN is flagged)"
      notes: "Four separate describe calls per environment. Re-raises the RUNNING check already done by the first task."
  bundleNotes: "Every list/describe is `2>/dev/null || echo ...`; no script checks gcloud rc; runbook ignores rc and treats unparseable issues files as empty; SLI treats an empty file as zero issues. Default LOCATIONS=us-central1 is a silent scope limit. Stray file error_logs_issues.json.tmp (977 bytes, a leftover run artifact) is checked in at the bundle root. Airflow REST calls use the gcloud access token against airflowUri."
- bundle: gcp-cloud-composer-performance
  displayName: GCP Cloud Composer Performance & Capacity
  classicResourceTypes: [gcp_composer_environments]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [resource, project]"
  sli: true
  sliAsserts: "Mean of 3 dimension scores (worker capacity: CPU avg >= UTILIZATION_THRESHOLD_PERCENT or >=50% of samples above; queue health: avg queue depth >= QUEUE_BACKLOG_THRESHOLD; utilization balance: CPU avg < UNDERUTILIZATION_THRESHOLD_PERCENT), averaged over environments. No data scores 1 (`if $n == 0 then 1`, compute_composer_sli.sh:109-113) and zero environments scores health 1.0. Status: confirmed"
  egress: "cloud API (composer list via gcloud, Cloud Monitoring MQL timeSeries:query via curl)"
  tools: [gcloud, curl, jq]
  inputs: [GCP_PROJECT_ID, ENV_NAME, LOCATIONS, LOOKBACK_WINDOW_MINUTES, BASELINE_WINDOW_MINUTES, UTILIZATION_THRESHOLD_PERCENT, UNDERUTILIZATION_THRESHOLD_PERCENT, DELTA_THRESHOLD_PERCENT, QUEUE_BACKLOG_THRESHOLD]
  tasks:
    - title: Analyze Cloud Composer Worker Utilization
      at: runbook.robot:20
      asserts: "Worker CPU quota usage / quota (%) averages >= UTILIZATION_THRESHOLD_PERCENT or is above it for >= SATURATION_PERCENT_OF_TIME (50%) of samples over LOOKBACK_WINDOW_MINUTES (default 1440)"
      reads: ["POST monitoring v3 projects/<p>/timeSeries:query MQL workloads_cpu_quota_usage, workloads_cpu_quota, executor/running_tasks per environment"]
      permissions: [monitoring.timeSeries.list, composer.environments.list]
      scope: project
