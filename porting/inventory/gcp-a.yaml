    - title: Detect Cloud Composer Usage Deltas Over Normal Baseline
      at: runbook.robot:135
      asserts: "Current-window CPU utilization or queue depth deviates from the BASELINE_WINDOW_MINUTES (default 10080 = 7d) average by more than DELTA_THRESHOLD_PERCENT"
      reads: ["MQL for current window and baseline window of cpu quota usage/quota and task_queue_length"]
      permissions: [monitoring.timeSeries.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "detect_usage_deltas.sh:54,61 mql_query | extract_point_values | jq 'if length>0 then add/length else 0' -> failed query = 0 current and 0 baseline = no delta"
      notes: "Baseline includes the current window; division by a zero baseline is guarded."
  bundleNotes: "Monitoring-only bundle. composer_metrics_common.sh converts every auth/API failure to an empty timeseries, and every analysis treats empty as NO DATA / healthy. Suite Initialization runs discover_composer_environments.sh, which writes '[]' and exits 0 on a failed `composer environments list` (LOCATIONS default us-central1), producing zero iterations (tasks pass vacuously). Runbook ignores script rc. Environment name is interpolated into MQL unescaped."
- bundle: gcp-cloud-function-health
  displayName: GCP Cloud Function Health
  classicResourceTypes: [gcp_functions_functions, gcp_functionsv2_functions]
  matchHints: "pattern .+ on property project_id (substring); level of detail basic; qualifiers [project]; also emits an slo"
  sli: true
  sliAsserts: "Binary: 1 only if all 4 dimensions pass (no functions in non-ACTIVE state, no public invokers, no failed builds/deployments, gen2 Cloud Run services Ready with traffic on latest). Status: confirmed - IAM, build and gen2 dimensions read files written by scripts that turn gcloud failures into an empty list; the function-state dimension fails loudly on an empty gcloud output"
  egress: "cloud API (cloudfunctions, run, cloudbuild, logging via gcloud)"
  tools: [gcloud, jq, awk, sed, xargs]
  inputs: [GCP_PROJECT_ID]
  tasks:
    - title: List Unhealthy Cloud Functions
      at: runbook.robot:18
      asserts: "Any Cloud Function (gen1 or gen2) matches gcloud filter `state!=ACTIVE OR status!=ACTIVE`; one sev-1 issue per function with state messages and tailored next steps"
      reads: ["gcloud functions list --filter='state!=ACTIVE OR status!=ACTIVE' --format=json|table --project"]
      permissions: [cloudfunctions.functions.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Output is parsed with json.loads in Robot, so a failing gcloud (empty stdout) raises an error instead of reporting zero. Gen1 functions have `status` and gen2 have `state`; the OR filter's behaviour on the field a given generation lacks is unverified (could flag every function). Sev 1 for any non-active function. Runs gcloud list three times."
    - title: Get Error Logs for Unhealthy Cloud Functions
      at: runbook.robot:84
      asserts: "An unhealthy function has severity=ERROR log entries in the last 14 days (cloud_function or cloud_run_revision resource types)"
      reads: ["gcloud functions list --filter=... --format=json", "gcloud logging read 'severity=ERROR AND (resource.type=cloud_function ... OR resource.type=cloud_run_revision ...)' --limit 50 --freshness=14d --format=json"]
      permissions: [cloudfunctions.functions.list, logging.logEntries.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Both list and log read are json.loads-parsed, so command failures raise. Only functions already flagged unhealthy are searched for errors, so a healthy-but-erroring function is not reported. Function names are interpolated into shell commands unquoted."
    - title: Fetch Cloud Function Configurations
      at: runbook.robot:151
      asserts: "A function has no dedicated service account (falls back to default compute/appspot SA)"
      reads: ["gcloud functions list --format=json", "gcloud functions describe <name> --region [--gen2] --format=json"]
      permissions: [cloudfunctions.functions.list, cloudfunctions.functions.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "fetch_function_config.sh:~7 `gcloud functions list ... 2>/dev/null || echo '[]'` -> 'No Cloud Functions found' -> []; describe `2>/dev/null || echo '{}'` -> empty SA -> flagged (false alarm)"
      notes: "Treats an absent serviceAccountEmail as 'default SA'; for gen2 it is under serviceConfig. Runbook ignores rc."
    - title: Check Cloud Function IAM Policies
      at: runbook.robot:184
      asserts: "A function's IAM policy binds allUsers or allAuthenticatedUsers (publicly invocable)"
      reads: ["gcloud functions list", "gcloud functions get-iam-policy <name> --region [--gen2] --format=json"]
      permissions: [cloudfunctions.functions.list, cloudfunctions.functions.getIamPolicy]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_function_iam.sh: list `2>/dev/null || echo '[]'` -> 'No Cloud Functions found'; get-iam-policy `2>/dev/null || echo '{}'` -> no bindings -> not public"
      notes: "Any public invoker is flagged regardless of whether public is intended (e.g. public webhook). Ignores Cloud Run service-level IAM for gen2 (run.invoker on the service) and ingress settings."
    - title: Check Gen2 Cloud Run Service Health
      at: runbook.robot:217
      asserts: "Cloud Run service backing a gen2 function has Ready != True, or its latest ready revision receives 0% traffic"
      reads: ["gcloud functions list (filter GEN_2 in jq)", "gcloud run services describe <name> --region --format=json"]
      permissions: [cloudfunctions.functions.list, run.services.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_gen2_run_health.sh: list `|| echo '[]'` -> 'No gen2 Cloud Functions found'; describe `2>/dev/null || echo '{}'` -> ready 'Unknown' != True -> flagged (a failure is a false ALARM, but a failed function list is a false pass)"
      notes: "Assumes the Cloud Run service name equals the function name (lower-cased id)."
    - title: Check for Failed Cloud Function Builds
      at: runbook.robot:250
      asserts: "Any function appears non-ACTIVE (jq `.state != \"ACTIVE\" or .status != \"ACTIVE\"`), or any of the last 20 Cloud Build jobs with status=FAILURE exists in the project"
      reads: ["gcloud functions list --format=json", "gcloud builds list --filter=status=FAILURE --limit=20 --format=json"]
      permissions: [cloudfunctions.functions.list, cloudbuild.builds.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_function_builds.sh: both lists `2>/dev/null || echo '[]'` -> no issues. Conversely the jq predicate is true whenever either field is absent (gen1 lacks .state, gen2 lacks .status), so it likely flags every function as a deployment problem (false alarm)"
      notes: "BUG (jq semantics): null != \"ACTIVE\" is true, so functions with only one of state/status are always raised. The Cloud Build FAILURE list is project-wide (not filtered to functions) and unbounded in age, so a standing old failed build keeps the issue open. Needs cloudbuild API enabled."
    - title: Check Cloud Function Scaling and Timeout Configuration
      at: runbook.robot:283
      asserts: "An HTTP function has a timeout > HTTP_TIMEOUT_WARN_SECONDS (300), or a gen2 function has no maxInstanceCount cap"
      reads: ["gcloud functions list", "gcloud functions describe <name> --region [--gen2] --format=json"]
      permissions: [cloudfunctions.functions.list, cloudfunctions.functions.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_function_scaling.sh: list `|| echo '[]'`; describe `2>/dev/null || echo '{}'` -> no timeout, trigger unknown, then an empty maxInstanceCount raises 'no cap' (false alarm)"
      notes: "HTTP_TIMEOUT_WARN_SECONDS is read from env but not a runbook input. Best-practice / cost finding rather than a fault."
  bundleNotes: "Mixed: the first two tasks parse gcloud output with json.loads and fail loudly, but all five script-based tasks use `2>/dev/null || echo '[]'` for the list and `|| echo '{}'` for describes, and the runbook ignores script rc. Missing-field failures usually appear as false alarms (empty SA, no cap, not Ready) while a failed top-level list appears as a pass. Resource types include both gen1 and gen2 function types but the SLX is project-scoped (matches on project_id). SLI aggregate is all-or-nothing (1 or 0)."
- bundle: gcp-cloud-loadbalancer-health
  displayName: GCP Cloud Load Balancer Health
  classicResourceTypes: [gcp_compute_forwarding_rules]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers [project]; also emits an slo"
  sli: true
  sliAsserts: "Mean of 4 binary scores (SSL cert expiry, backend health, 5xx ratio, p95 latency), each 1 when its issues file has 0 entries (`jq length file 2>/dev/null || echo 0`). sli.robot never runs discover_loadbalancers.sh, so lb_config.json (with .type) is absent and the SSL/error/latency scripts fall back to raw forwarding rules without a type, evaluating nothing. Status: confirmed"
  egress: "cloud API (compute via gcloud, monitoring.googleapis.com via curl)"
  tools: [gcloud, jq, curl, awk, "GNU date -d", "grep -P"]
  inputs: [GCP_PROJECT_ID, SSL_WARNING_DAYS, ERROR_RATE_THRESHOLD, LATENCY_THRESHOLD_MS, METRIC_LOOKBACK_PERIOD]
  tasks:
    - title: Discover GCP Cloud Load Balancers and Configurations
      at: runbook.robot:18
      asserts: "Forwarding-rule listing fails (raised as an issue); otherwise inventory only (type HTTPS/HTTP/SSL/TCP/NETWORK, IP, target proxy, backend service)"
      reads: ["gcloud compute forwarding-rules list --format=json"]
      permissions: [compute.forwardingRules.list]
      scope: project
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Writes lb_config.json that every later runbook task depends on. gcloud failure is captured via err.log and raised as an issue, then exit 0. Type is inferred from the target URL string (targetHttpsProxies etc.); internal/regional LBs without a target are labelled NETWORK."
    - title: Check SSL Certificate Expiry for HTTPS/SSL Load Balancers
      at: runbook.robot:51
      asserts: "A certificate attached to a target HTTPS/SSL proxy expires within SSL_WARNING_DAYS (expired is higher severity)"
      reads: ["lb_config.json (or gcloud compute forwarding-rules list fallback)", "gcloud compute target-https-proxies|target-ssl-proxies describe <proxy>", "gcloud compute ssl-certificates describe <cert>"]
      permissions: [compute.targetHttpsProxies.get, compute.targetSslProxies.get, compute.sslCertificates.get, compute.forwardingRules.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_ssl_certificates.sh: proxy describe `2>/dev/null | jq ... || echo '[]'` -> `continue`; cert describe `2>/dev/null || echo '{}'` -> empty expireTime -> `continue`; `date -d ... 2>/dev/null || echo ''` -> `continue`; without lb_config.json the fallback list has no `.type` so nothing is selected"
      notes: "Uses GNU date -d and grep -oP (fails on macOS/BusyBox). Certificates referenced by certificate maps / Certificate Manager are not seen (only sslCertificates on the proxy)."
    - title: Check Load Balancer Backend Health
      at: runbook.robot:84
      asserts: "A backend instance/endpoint in `backend-services get-health` is not HEALTHY (DRAINING sev 2, otherwise higher)"
      reads: ["gcloud compute backend-services list --format=json", "gcloud compute backend-services get-health <bs> --global|--region --format=json"]
      permissions: [compute.backendServices.list, compute.backendServices.get, compute.regionBackendServices.get]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_backend_health.sh: get-health `2>/dev/null || echo '{}'` -> 'returned no health status' -> `continue` (error = skipped); backend services with no backends are skipped. The list failure itself IS raised as an issue"
      notes: "Does not use lb_config.json (lists all backend services in the project, not those behind matched forwarding rules). Serverless NEG / Cloud Run backends return no health status and are silently skipped."
    - title: Analyze Load Balancer Error Rates via Cloud Monitoring
      at: runbook.robot:117
      asserts: "Per forwarding rule, 5xx / total request_count ratio over METRIC_LOOKBACK_PERIOD exceeds ERROR_RATE_THRESHOLD (default 0.01)"
      reads: ["GET monitoring timeSeries loadbalancing.googleapis.com/https|http/request_count (or compute.googleapis.com/backend/request_count for others) filtered by forwarding_rule_name"]
      permissions: [monitoring.timeSeries.list, compute.forwardingRules.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_error_rates.sh query_metric_count: curl -s 2>/dev/null || echo '{}' ; jq 'add // 0' || echo 0 -> total 0 -> 'no request data in lookback window' -> `continue` (no issue)"
      notes: "Token failure IS raised as an issue (exit 0 with issue). For TCP/SSL/NETWORK LBs it queries compute.googleapis.com/backend/request_count with a forwarding_rule_name label that metric does not carry (unverified), so non-HTTP LBs are effectively unmeasured. Uses GNU date -d."
    - title: Analyze Load Balancer Latency Performance
      at: runbook.robot:150
      asserts: "Per forwarding rule, p95 of loadbalancing total_latencies (ms) exceeds LATENCY_THRESHOLD_MS (default 5000)"
      reads: ["GET monitoring timeSeries loadbalancing.googleapis.com/https|http/total_latencies with ALIGN_PERCENTILE_95"]
      permissions: [monitoring.timeSeries.list, compute.forwardingRules.list]
      scope: project
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_latency.sh: curl 2>/dev/null || echo '{}' ; jq 'max // 0' || echo 0 -> p95 0 -> 'no latency data' -> `continue`"
      notes: "For non-HTTP LBs the script queries compute.googleapis.com/backend/request_count and reads .value.doubleValue which a count metric lacks, so it always yields 0 (unmeasured). Token failure raised as issue."
    - title: Generate Load Balancer Health Summary
      at: runbook.robot:183
      asserts: "Builds a per-LB table (SSL/BACKEND/ERROR_RATE/LATENCY/verdict) by counting issues in the other tasks' output files whose title contains the LB name"
      reads: ["lb_config.json", "ssl_certificate_issues.json, backend_health_issues.json, error_rate_issues.json, latency_issues.json (outputs of earlier tasks in the same workdir)"]
      permissions: []
      scope: n/a
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "generate_lb_summary.sh count_issues_for_lb: missing file -> echo 0 -> 'OK'; a task that did not run or failed leaves no file so its column reads OK/healthy; reads stale files from prior runs"
      notes: "No cloud calls of its own; depends on task order and on titles containing the forwarding-rule name (backend-health titles name backend services, not LBs, so backend column mostly stays OK)."
  bundleNotes: "Only the discovery task (runbook) and the backend-service checks are robust against a failing gcloud list; everything else is `2>/dev/null || echo ...` and treats no-data as 'continue'. Dependency bug: lb_config.json is produced only by runbook task 1; sli.robot has no discovery step, so SLI SSL/error/latency dimensions run against raw forwarding rules lacking `.type` and report 0 issues. Runbook ignores script rc; SLI swallows missing issue files with `|| echo 0`. Several scripts use set -x and GNU-only date -d/grep -P."
