  classicResourceTypes: [repository]
  matchHints: "platform azure_devops; pattern .+ on name (substring); level of detail basic; qualifiers organization, project, resource"
  sli: false
  sliAsserts: "no sli.robot (generation rule lists an sli outputItem but the bundle has none)"
  egress: "Azure DevOps REST (dev.azure.com) via az devops/repos/pipelines; az devops extension may be installed from public internet"
  tools: [az (azure-devops extension), jq, bash]
  inputs: [AZURE_DEVOPS_ORG, AZURE_DEVOPS_PROJECT, AZURE_DEVOPS_REPOS, REPO_SIZE_THRESHOLD_MB, "(other analysis thresholds and lookback)", "azure_credentials (service principal) OR azure_devops_pat"]
