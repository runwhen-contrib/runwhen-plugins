- bundle: azure-acr-health
  displayName: Azure ACR Health Check
  classicResourceTypes: [azure_containerregistry_registries]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource, subscription_id"
  sli: true
  sliAsserts: "6 sub-scores (reachability, sku_usage, pull_push_ratio, storage, network, security) each 0/1 (security = 100 minus penalty per issue) averaged; scripts emit issue JSON so a failed az call becomes an issue -> score 0, and JSON parse failure -> 0. False-pass: likely - pull/push sub-score inherits the Log Analytics swallow, and the security sub-score only deducts 5-10 points for a sev-3/4 'az call failed' issue (sli.robot:135-150), so a fully failed security script still scores ~0.9-0.95."
  egress: "cloud API (ARM, Azure Monitor, Log Analytics) + <registry>.azurecr.io (nslookup/curl/openssl) + customer webhook serviceUri (curl)"
  tools: [az, jq, bash, nslookup, curl, openssl, bc, python3]
  inputs: [AZ_RESOURCE_GROUP, ACR_NAME, AZURE_SUBSCRIPTION_ID, AZURE_SUBSCRIPTION_NAME, USAGE_THRESHOLD, azure_credentials]
  tasks:
    - title: Check Network Configuration for ACR
      at: runbook.robot:21
      asserts: "ACR public network access, IP/VNet rules, private endpoint state, replication and webhook status, DNS resolution and HTTPS reachability look safe/healthy"
      reads: ["az acr show", "az network private-endpoint list", "az acr network-rule list", "az acr replication list", "az acr webhook list", "nslookup <loginServer>", "curl -sI https://<loginServer>/v2/", "curl -sI <webhook serviceUri>"]
      permissions: ["Microsoft.ContainerRegistry/registries/read", "Microsoft.Network/privateEndpoints/read", "Microsoft.ContainerRegistry/registries/replications/read", "Microsoft.ContainerRegistry/registries/webhooks/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "acr_network_config.sh:109,150,299,328 private-endpoint/network-rule/replication/webhook list use 2>/dev/null and the check block is skipped when output is empty, so a forbidden/failed call raises no issue (only az acr show at :73 is rc-checked)"
      notes: "Robot also runs a second az acr show just to build a portal URL (rc ignored, cosmetic). Private endpoint query filters by privateLinkServiceId across the whole subscription (no -g)."
    - title: Check DNS & TLS Reachability for Registry
      at: runbook.robot:55
      asserts: "ACR login server resolves in DNS, answers HTTPS, presents a non-expiring TLS cert and returns a /v2/ API response"
      reads: ["nslookup <name>.azurecr.io", "curl -I https://<name>.azurecr.io", "openssl s_client -connect <name>.azurecr.io:443 | openssl x509 -dates", "curl https://<name>.azurecr.io/v2/"]
      permissions: ["none (network reachability from the runner to <name>.azurecr.io:443)"]
      scope: n/a
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "No az calls. Exit codes of nslookup/curl are checked and each failure becomes an issue. Cert expiry uses `date -d` (GNU) with `|| echo 0` fallback at acr_reachability.sh:141, which would yield a bogus expiry on non-GNU date (false positive, not false pass). Depends on network path from runner (private endpoint / firewall), so a result is relative to the runner, not to clients."
    - title: Check ACR Login & Authentication for Registry
      at: runbook.robot:80
      asserts: "The workload identity can read the registry, read admin credentials and obtain an access token via az acr login --expose-token"
      reads: ["az account show", "az acr show", "az acr credential show", "az acr login --expose-token"]
      permissions: ["Microsoft.ContainerRegistry/registries/read", "Microsoft.ContainerRegistry/registries/listCredentials/action", "Microsoft.ContainerRegistry/registries/generateCredentials/action (az acr login --expose-token uses AAD token exchange; no ARM action beyond AcrPull/AcrPush on data plane)"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Each az call has stderr captured to a log and rc checked; failures become issues (permission vs generic split by stderr text). `az acr credential show` returns admin secrets into script memory (not printed)."
    - title: Check ACR SKU and Usage Metrics for Registry
      at: runbook.robot:114
      asserts: "Storage and webhook usage are under USAGE_THRESHOLD percent of the SKU quota; SKU is not Basic/under-provisioned; admin user is disabled"
      reads: ["az acr show", "az acr show-usage"]
      permissions: ["Microsoft.ContainerRegistry/registries/read", "Microsoft.ContainerRegistry/registries/listUsages/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Percentages computed with `bc ... || echo 0` (acr_usage_sku.sh:158,181); if bc is missing the percentage is 0 and no threshold issue fires (edge, not the main path). Quota key read as .limitValue in this script but .limit in acr_storage_utilization.sh:147 - one of the two is wrong."
    - title: Check ACR Storage Utilization for Registry
      at: runbook.robot:148
      asserts: "Registry storage used is under USAGE_THRESHOLD/CRITICAL percent of quota; repositories have tags/retention that bound growth"
      reads: ["az acr show", "az acr show-usage", "az acr login", "az acr repository list", "az acr repository show-tags", "az acr config retention show", "ARM GET registries/<name> via curl + bearer token"]
      permissions: ["Microsoft.ContainerRegistry/registries/read", "Microsoft.ContainerRegistry/registries/listUsages/read", "Microsoft.ContainerRegistry/registries/pull/read (data plane: AcrPull for repository list/show-tags)", "Microsoft.ContainerRegistry/registries/config/read (retention)"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Core usage check is rc-checked. Per-repo tag counts use `2>/dev/null | jq length || echo 0` (acr_storage_utilization.sh:314,323) and retention show uses 2>/dev/null (:402) - only affect advisory recommendations. Also runs `az acr login` (needs docker or token flow) as a side effect."
    - title: Analyze ACR Pull/Push Success Ratio for Registry
      at: runbook.robot:184
      asserts: "Pull and push success rates over TIME_PERIOD_HOURS are above PULL/PUSH_SUCCESS_THRESHOLD, and failed pulls are not coming from IPs outside the network allowlist"
      reads: ["az monitor metrics list PullCount/PushCount", "az monitor diagnostic-settings list", "az monitor log-analytics workspace list", "az monitor log-analytics query (ContainerRegistryRepositoryEvents)", "az acr network-rule list"]
      permissions: ["Microsoft.Insights/metrics/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read", "Microsoft.ContainerRegistry/registries/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "acr_pull_push_ratio.sh:200-207 metrics list 2>/dev/null, :350,:363 `|| echo \"[]\"`, :394-398 log-analytics query `2>/dev/null || echo \"[]\"` then :425-445 'No detailed Log Analytics data available' is stderr-only text, no issue -> failed/forbidden query == no failures reported"
      notes: "If no Log Analytics workspace is found it raises a sev-4 'workspace not found' issue (so unconfigured diagnostics is visible). Workspace discovery also falls back to ANY workspace in the resource group/subscription (:33,:70), which may not hold this ACR's logs."
    - title: Check ACR Repository Event Failures for Registry
      at: runbook.robot:221
      asserts: "ContainerRegistryRepositoryEvents in Log Analytics contains no failed (ResultType != 0) push/pull/repo events"
      reads: ["az acr show --query id", "az monitor diagnostic-settings list", "az monitor log-analytics workspace list", "az monitor log-analytics query (table check, then failure summary)"]
      permissions: ["Microsoft.ContainerRegistry/registries/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Table-check and query rc are checked (acr_events.sh:56,83) and failures are sev-4 issues; missing workspace is a sev-4 issue. Discovery calls at :26-39 are 2>/dev/null but lead to the 'no workspace' issue rather than silence. Tagged data:logs-regexp."
    - title: Check ACR Security Configuration and RBAC for Registry
      at: runbook.robot:246
      asserts: "Admin user disabled, public network access restricted, no overbroad Owner/Contributor/user role assignments, private endpoint present, webhooks use https/auth"
      reads: ["az acr show", "az role assignment list --scope <acr id>", "az network private-endpoint list -g", "az acr repository list", "az acr config content-trust show", "az acr webhook list"]
      permissions: ["Microsoft.ContainerRegistry/registries/read", "Microsoft.Authorization/roleAssignments/read", "Microsoft.Network/privateEndpoints/read", "Microsoft.ContainerRegistry/registries/webhooks/read", "AcrPull (data plane repository list)"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "acr_rbac_security.sh:243 private-endpoint list 2>/dev/null and :298 webhook list 2>/dev/null: failure leaves empty result; webhook checks skipped silently. RBAC list failure is flagged (:235)"
      notes: "Missing access:read-only tag but is read-only. Mislabelled check: 'anonymous pull' is read from `az acr config content-trust show` (:277), which is content trust, not anonymous pull."
  bundleNotes: "Scripts emit a JSON array of issues on stdout (`add_issue` appending to a temp file) and human text on stderr; Robot json.loads()es stdout so an empty stdout would crash the task rather than pass. Pattern is mostly 'az call fails -> sev-4 issue', which is good, with the Log Analytics path as the main hole. acr_storage_usage.sh is not called by runbook or sli (dead). Runbook has no per-task SLX-level inputs beyond ACR_NAME/AZ_RESOURCE_GROUP/subscription. Generation rule qualifiers lack resource_group although the runbook requires AZ_RESOURCE_GROUP."
- bundle: azure-acr-image-sync
  displayName: Azure ACR Image Sync
  classicResourceTypes: []
  matchHints: "no .runwhen/generation-rules directory; bundle is not auto-discovered, deployed by hand"
  sli: true
  sliAsserts: "counts configured images whose upstream copy is newer than the newest matching ACR tag (or missing in ACR) and pushes the raw count as the metric (not 0-1); false-pass confirmed: a skopeo/az failure yields empty SOURCE_CREATED and the image is counted as up to date"
  egress: "public internet: source registries in IMAGE_MAPPINGS (docker.io etc., via az acr import server-side and skopeo inspect from the runner) + cloud API (ACR)"
  tools: [az, jq, skopeo, bash]
  inputs: [ACR_REGISTRY, IMAGE_MAPPINGS, USE_DATE_TAG_PATTERN, TAG_CONFLICT_HANDLING, USE_DOCKER_AUTH, AZURE_RESOURCE_SUBSCRIPTION_ID, azure_credentials, DOCKER_USERNAME, DOCKER_TOKEN]
  tasks:
    - title: Sync Container Images into Azure Container Registry
      at: runbook.robot:18
      asserts: "none - an action, not a check: imports each IMAGE_MAPPINGS source image into the ACR (az acr import), deleting an existing tag first when TAG_CONFLICT_HANDLING=overwrite"
      reads: ["az acr repository show-tags", "az acr repository delete --yes (overwrite mode)", "az acr import --name <acr> --source <src> --image <dest>"]
      permissions: ["Microsoft.ContainerRegistry/registries/importImage/action", "Microsoft.ContainerRegistry/registries/read", "AcrDelete / Microsoft.ContainerRegistry/registries/artifacts/delete (overwrite mode)", "AcrPull (show-tags)"]
      scope: resource-group
      readOnly: false
      falsePass: confirmed
      falsePassWhy: "acr_sync_images.sh:115-121 `eval \"$cmd\"` failure only echoes 'Failed to import <src>'; script ends 'All images processed.' exit 0 and the Robot task adds no issue"
      notes: "Mutating (import, and delete tag in overwrite mode). `eval` of a string built from IMAGE_MAPPINGS plus Docker password on the command line (visible in process list). Script default TAG_CONFLICT_HANDLING is overwrite, runbook default is rename. `rename` mode always appends -<TAG_PATTERN>, so TAG_PATTERN is empty if USE_DATE_TAG_PATTERN=false and handling=overwrite. ACR_REGISTRY is passed to --name as 'myacr.azurecr.io' form (az accepts it)."
    - title: Count Outdated Images in Azure Container Registry
      at: sli.robot:75
      asserts: "number of configured images where the upstream image creation date is later than the newest ACR tag matching the base tag, or no matching ACR tag exists"
      reads: ["az acr repository show-tags", "az acr manifest list-metadata", "skopeo inspect docker://<source>"]
      permissions: ["Microsoft.ContainerRegistry/registries/read", "AcrPull (repository show-tags, manifest list-metadata)", "public pull access to source registries"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_for_image_updates.sh:118-129 skopeo/jq failure leaves SOURCE_CREATED empty, `[[ \"\" > \"$ACR_CREATED\" ]]` is false -> 'is up to date'; az show-tags failure (:74) makes LATEST_ACR_TAG empty so image is counted outdated instead. Also UPDATE_COUNT is never initialised in the visible lines and sli.robot:85-88 greps stdout, so a crashed script pushes an empty metric"
      notes: "This is the SLI (sli.robot), included as a task because the bundle has no runbook check. Pushes the count twice (sub_name=outdated_images and unnamed). String comparison of timestamps in different formats (skopeo RFC3339 vs az createdTime) is unreliable."
  bundleNotes: "Only bundle in the set with a mutating runbook task and no generation rules. Both scripts lack set -e/pipefail and have no error handling."
- bundle: azure-adf-health
  displayName: Azure Data factories Health
  classicResourceTypes: [azure_datafactory_factories]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource_group, subscription_id"
  sli: true
  sliAsserts: "average of 5 sub-scores: resource health (fraction Available), pipeline errors / failed pipelines / large data ops / long running (each 1 if count==0 else 0); false-pass confirmed: JSON load failure defaults to empty -> score 1 for the last four, and scripts write an empty result file on az failure"
  egress: "cloud API (ARM, Resource Health, Log Analytics)"
  tools: [az, jq, column, bash]
  inputs: [AZURE_RESOURCE_GROUP, AZURE_RESOURCE_SUBSCRIPTION_ID, LOOKBACK_PERIOD, THRESHOLD_MB, FAILURE_THRESHOLD, RUN_TIME_THRESHOLD, azure_credentials]
  tasks:
    - title: Check for Resource Health Issues Affecting Data Factories
      at: runbook.robot:19
      asserts: "Azure Resource Health availabilityStatus for each Data Factory in the resource group is 'Available'; also raises sev-4 if no health records could be obtained"
      reads: ["az provider show --namespace Microsoft.ResourceHealth (and az provider register if not registered)", "az datafactory list -g", "az rest GET .../providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.DataFactory/factories/read", "Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/read", "Microsoft.Resources/subscriptions/providers/register/action (when provider unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: likely
      falsePassWhy: "resource_health.sh:137-150 per-factory az rest failure only prints WARNING and the factory is simply absent from datafactory_health.json; with partial failure the remaining Available factories look healthy. Total failure yields '[]' which is reported (sev 4 unavailable)"
      notes: "Side effect: `az provider register` if Microsoft.ResourceHealth is unregistered (a write to the subscription) - so readOnly false despite the access:read-only tag. Reads results via `cat datafactory_health.json`, a shared filename in the working dir (stale-file risk)."
    - title: List Frequent Pipeline Errors in Data Factories
      at: runbook.robot:69
      asserts: "A pipeline has more than FAILURE_THRESHOLD failures in LOOKBACK_PERIOD according to Log Analytics AzureDiagnostics (PipelineRuns); script/infra errors surface as sev-4 issues"
      reads: ["az datafactory list", "az monitor diagnostic-settings list --resource <factory id>", "az monitor log-analytics workspace show --ids", "az monitor log-analytics query (KQL on ADFPipelineRun/AzureDiagnostics)"]
      permissions: ["Microsoft.DataFactory/factories/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "error_trend.sh:118-127 az datafactory list failure writes the empty template '{\"error_trends\":[],\"script_errors\":[]}' to error_trends.json then exit 1; runbook never reads rc, so 'No Frequent Pipeline Errors' is reported (runbook.robot:68-120)"
      notes: "Per-factory diagnostic-setting and query failures are recorded as script_errors (sev 4 issues) so those paths are visible. A factory with no diagnostic settings is a script_error, not silent."
    - title: List Failed Pipelines in Data Factories
      at: runbook.robot:147
      asserts: "Failed pipeline runs in LOOKBACK_PERIOD found via Log Analytics, each enriched with linked services; script errors reported as sev 4"
      reads: ["az datafactory list", "az datafactory linked-service list", "az monitor diagnostic-settings list", "az monitor log-analytics workspace show", "az monitor log-analytics query"]
      permissions: ["Microsoft.DataFactory/factories/read", "Microsoft.DataFactory/factories/linkedservices/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "failed_pipeline.sh:83 `az datafactory list ... || true` then invalid JSON becomes a script_error (visible), but :121 linked-service list `|| linked_servi...` falls back silently and the runbook's JSON-parse EXCEPT (runbook.robot:138) sets {} -> 'No failed pipelines' if the output file is missing"
      notes: "Also installs the log-analytics az extension at runtime (`az extension add`, needs internet to pypi/GitHub)."
    - title: Find Large Data Operations in Data Factories
      at: runbook.robot:224
      asserts: "The latest succeeded ActivityRun per factory read or wrote more than THRESHOLD_MB bytes according to Log Analytics"
      reads: ["az datafactory list", "az monitor diagnostic-settings list", "az monitor log-analytics workspace show", "az monitor log-analytics query (top 1 ActivityRuns Succeeded)"]
      permissions: ["Microsoft.DataFactory/factories/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "data_volume_audit.sh:97-101 az datafactory list failure writes '{\"data_volume_alerts\":[]}' and exit 1; runbook ignores rc -> 'No heavy data operations detected'"
      notes: "KQL is `top 1 by TimeGenerated desc` over succeeded ActivityRuns, i.e. only the single most recent activity per factory, not all operations in the window. Files-in-cwd handoff (data_volume_audit.json)."
    - title: Fetch Azure Data Factory Details
      at: runbook.robot:268
      asserts: "none - informational report of factory location, diagnostic settings, pipelines, triggers, linked services, datasets"
      reads: ["az datafactory list", "az monitor diagnostic-settings list", "az datafactory pipeline list", "az datafactory trigger list", "az datafactory linked-service list", "az datafactory dataset list"]
      permissions: ["Microsoft.DataFactory/factories/read", "Microsoft.DataFactory/factories/pipelines/read", "Microsoft.DataFactory/factories/triggers/read", "Microsoft.DataFactory/factories/linkedservices/read", "Microsoft.DataFactory/factories/datasets/read", "Microsoft.Insights/diagnosticSettings/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Never raises an issue; on failure prints 'unable to retrieve data'. Per-resource list calls are 2>/dev/null (adf_details.sh:162-189)."
    - title: List Long Running Pipeline Runs in Data Factories
      at: runbook.robot:299
      asserts: "A pipeline run exceeded RUN_TIME_THRESHOLD seconds according to Log Analytics"
      reads: ["az datafactory list", "az monitor diagnostic-settings list", "az monitor log-analytics workspace show", "az monitor log-analytics query"]
      permissions: ["Microsoft.DataFactory/factories/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "long_pipeline_runs.sh:97-101 az datafactory list failure writes empty template and exit 1; runbook.robot:290-330 ignores rc and prints 'No long running pipelines found'"
      notes: ""
  bundleNotes: "Hand-off is via fixed-name JSON files in cwd read with `cat`, and scripts use set -euo pipefail so the first az failure exits 1 after writing an empty-result file - the runbook ignores the exit code, so the whole bundle's 'no problem' output equals 'could not look'. Only error_trend.sh and failed_pipeline.sh surface script_errors. runbook imports `Library Jenkins` (unused). Everything depends on diagnostic settings sending logs to Log Analytics; absence is a sev-4 script error, not a pass."
- bundle: azure-aks-cost-optimization
  displayName: Azure AKS Cost Optimization
  classicResourceTypes: [azure_containerservice_managed_clusters]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers subscription_id, resource_group"
  sli: false
  sliAsserts: "no sli.robot (generation rule lists an sli outputItem but bundle has none)"
  egress: "cloud API (ARM, Azure Monitor, Resource Graph)"
  tools: [az, jq, bc, awk, bash]
  inputs: [AZURE_SUBSCRIPTION_IDS, AZURE_RESOURCE_GROUPS, AZURE_SUBSCRIPTION_NAME, COST_ANALYSIS_LOOKBACK_DAYS, LOW_COST_THRESHOLD, MEDIUM_COST_THRESHOLD, HIGH_COST_THRESHOLD, AZURE_DISCOUNT_PERCENTAGE, TIMEOUT_SECONDS, azure_credentials]
  tasks:
    - title: Analyze AKS Node Pool Resizing Opportunities Based on Utilization Metrics
      at: runbook.robot:18
      asserts: "An AKS node pool's min/max node count or VM size is larger than 30-day avg/peak CPU and memory utilization (plus safety margin) requires; issue title carries the estimated monthly saving"
      reads: ["az aks list (or Resource Graph az graph query)", "az aks nodepool list", "az vmss list -g <node RG>", "az monitor metrics list (CPU, memory per VMSS / cluster node metrics)", "az aks show --query nodeResourceGroup"]
      permissions: ["Microsoft.ContainerService/managedClusters/read", "Microsoft.ContainerService/managedClusters/agentPools/read", "Microsoft.Compute/virtualMachineScaleSets/read", "Microsoft.Insights/metrics/read", "Microsoft.ResourceGraph/resources/read"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "analyze_aks_node_pool_optimization.sh:347-349 `az aks list ... 2>/dev/null || echo '[]'` and :359 nodepool list `|| echo '[]'`, plus libraries/Azure/azure_performance_utils.sh:88 `az graph query ... || echo '{\"data\":[]}'` -> runbook.robot:64-66 prints 'No AKS node pool optimization opportunities found'"
      notes: "Inverse hazard too: metrics failures fall back to `echo '{\"value\":[]}'` (:397,:407,:483,:494) and jq `// 0`, so a pool whose metrics could not be read is treated as 0% utilization and can be recommended for downsizing. No metrics-missing guard found by grep. Cost figures come from built-in price tables, not the Retail Prices API. If the script dies before the final `mv` (set -eo pipefail), `cat aks_node_pool_optimization_issues.json` reads a stale or missing file (json.loads on empty crashes the task)."
  bundleNotes: "Single-task cost analyzer, one 69KB script. Shares libraries/Azure/azure_performance_utils.sh (Resource Graph, `|| echo` swallow) with vm, appservice, databricks cost bundles. Generation rule matches every AKS cluster but the script analyses whole subscriptions/resource groups from AZURE_SUBSCRIPTION_IDS/AZURE_RESOURCE_GROUPS, not the matched cluster, so (inferred, not verified in the platform) each matched cluster would yield a duplicate subscription-wide SLX. No RW.CLI-level rc check anywhere in the Robot file."
- bundle: azure-aks-triage
  displayName: Azure AKS Triage
  classicResourceTypes: [azure_containerservice_managed_clusters]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource, resource_group, subscription_id"
  sli: false
  sliAsserts: "no sli.robot (generation rule lists an sli outputItem but the bundle has none)"
  egress: "cloud API (ARM, Resource Health, Azure Monitor)"
  tools: [az, jq, bc, awk, bash]
  inputs: [AZ_RESOURCE_GROUP, AKS_CLUSTER, RW_LOOKBACK_WINDOW, TIMEOUT_SECONDS, AZURE_RESOURCE_SUBSCRIPTION_ID, azure_credentials]
  tasks:
    - title: Check for Resource Health Issues Affecting AKS Cluster
      at: runbook.robot:17
      asserts: "Azure Resource Health availabilityStatus for the cluster is not 'Available'; sev-4 if no health record is returned"
      reads: ["az provider show/register --namespace Microsoft.ResourceHealth", "az rest GET .../managedClusters/<name>/providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/read", "Microsoft.Resources/subscriptions/providers/register/action (only when provider unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Registers the Microsoft.ResourceHealth provider if missing (write). aks_resource_health.sh:51 redirects `az rest` stdout to the json file with no rc check; a failed call leaves an empty file so json.loads crashes the task (loud, not a pass). Auth/timeout detection is substring matching on stdout ('Authentication failed', 'client secret keys') and returncode == -1 (runbook.robot:24-52): any other az failure is not classified."
    - title: Check Configuration Health of AKS Cluster
      at: runbook.robot:90
      asserts: "Cluster provisioningState is Succeeded, no agent pool is Failed/Canceled, diagnostic settings exist, node pools have autoscaling"
      reads: ["az aks show", "az monitor diagnostic-settings list --resource <cluster id>"]
      permissions: ["Microsoft.ContainerService/managedClusters/read", "Microsoft.Insights/diagnosticSettings/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Opposite problem: no set -e; if `az aks show` fails (aks_cluster_health.sh:20) PROVISIONING_STATE is empty so it reports a sev-1 'Provisioning Failure' (wrong diagnosis; permission or missing-cluster errors look like a failed cluster). Autoscaling check tests `.enableAutoScaling == null` - clusters with explicit false are missed."
    - title: Check Network Configuration of AKS Cluster
      at: runbook.robot:151
      asserts: "none - report only: network profile, subnet, NSG rules, route table, firewall presence, portal links; never raises an issue"
      reads: ["az aks show --query networkProfile / vnetSubnetId", "az network vnet subnet show --ids", "az network nsg rule list", "az network route-table route list", "az network firewall list"]
      permissions: ["Microsoft.ContainerService/managedClusters/read", "Microsoft.Network/virtualNetworks/subnets/read", "Microsoft.Network/networkSecurityGroups/securityRules/read", "Microsoft.Network/routeTables/routes/read", "Microsoft.Network/azureFirewalls/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "aks_network.sh has no set -e and no rc handling: any failed az call just prints an empty/'Recommendation:' line and the Robot task only handles timeout/auth strings (runbook.robot:158-190) so it always 'passes'; but it asserts nothing so there is nothing to false-pass"
      notes: "NSG and route-table lookups use $AZ_RESOURCE_GROUP (the cluster RG) rather than the NSG's own resource group (aks_network.sh:54,57,80); wrong when networking lives in another RG. `az config set extension.use_dynamic_install=yes_without_prompt` triggers runtime extension install."
    - title: Fetch Activities for AKS Cluster
      at: runbook.robot:192
      asserts: "Activity log entries at level Critical/Error/Warning exist for the cluster in the lookback window"
      reads: ["az aks show --query id", "az monitor activity-log list --resource-id <id> (full, then per level Critical/Error/Warning)"]
      permissions: ["Microsoft.ContainerService/managedClusters/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "aks_activities.sh:44-50 `az aks show` failure leaves resource_id empty -> writes '{\"issues\": []}' and exit 0; :71 `az monitor activity-log list ... | jq` has no pipefail, a failed list becomes an empty array; :114-115 invalid JSON also replaced by '{\"issues\": []}'"
      notes: "Warning events are reported at severity 4, Critical 1, Error 2. data:logs-bulk."
    - title: Check Kubernetes Version Support for AKS Cluster
      at: runbook.robot:252
      asserts: "Cluster Kubernetes version is within the AKS supported minor versions for its region and is not near end of support"
      reads: ["az aks show", "az aks get-versions --location <region>"]
      permissions: ["Microsoft.ContainerService/managedClusters/read", "Microsoft.ContainerService/locations/kubernetesVersions/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "aks_version_support.sh:82-89 `az aks get-versions` failure prints 'Proceeding with version display only', writes empty issues and exit 0; also :104-110 no latest_version -> empty issues, exit 0; runbook.robot:277 `cat aks_version_support.json 2>/dev/null || echo '{\"issues\": []}'`"
      notes: "`az aks show` failure at :52-62 does raise an issue. Judgement is a function of the live az get-versions list, not a pinned EOL table."
    - title: Analyze AKS Cluster Cost Optimization Opportunities
      at: runbook.robot:312
      asserts: "Node pool VMSS has low 30-day average/peak CPU and memory (with savings estimate from built-in VM price table), or unattached disks in the node resource group"
      reads: ["az aks show", "az disk list -g <nodeResourceGroup>", "az vmss list -g <nodeResourceGroup>", "az monitor metrics list (VMSS CPU/memory)"]
      permissions: ["Microsoft.ContainerService/managedClusters/read", "Microsoft.Compute/disks/read", "Microsoft.Compute/virtualMachineScaleSets/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "aks_cost_optimization.sh:41-44 EXIT trap writes '[]' to the issues file whenever the script dies; :168-174 `az aks show` failure -> 'exit 0 with empty results'; :263 `az disk list ... 2>/dev/null || echo '[]'`; :435-452 metrics `|| echo '{\"value\":[]}'`"
      notes: "Failed metrics read as 0% utilization (see :455-456 `|| echo \"\"`), a downsizing false positive. Overlaps azure-aks-cost-optimization (same idea, subscription-wide)."
  bundleNotes: "Same Robot template for every task: timeout -> sev-2 issue (returncode == -1), stdout substring 'Authentication failed' / 'client secret keys' / 'Azure login failed' -> sev-2 auth issue, else read a json file via `cat`. Non-timeout non-auth failures are never classified, and exit codes other than -1 are ignored. Suite Initialization raises sev-1 'Service Principal Credentials Expired' for ANY secret import failure (runbook.robot:~395-410) and still continues. Scripts mix set -euo pipefail (cost) and no flags at all (health, network, activities)."
- bundle: azure-apim-health
  displayName: Azure APIM Health
  classicResourceTypes: [azure_apimanagement_service]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource, resource_group, subscription_id; baseName is az-appgw-health (copy-paste from appgateway bundle)"
  sli: true
  sliAsserts: "mean of 6 binary scores (resource health Available, metrics issues==0, diagnostic-log issues==0, policy issues==0, SSL issues==0, dependency issues==0). False-pass: likely - policy score reads an issues file produced by a script whose api/product list calls are `|| echo \"{}\"`; conversely an APIM using only the default hostname gets a sev-4 'No Custom Hostname Configurations' issue and scores 0"
  egress: "cloud API (ARM, Log Analytics, App Insights, Key Vault) + public internet to APIM custom hostnames (curl --insecure) and to backend URLs found in APIM config (nslookup, curl)"
  tools: [az, jq, curl, nslookup, xmllint, bash]
  inputs: [AZ_RESOURCE_GROUP, APIM_NAME, RW_LOOKBACK_WINDOW, AZURE_RESOURCE_SUBSCRIPTION_ID, azure_credentials]
  tasks:
    - title: Gather APIM Resource Information
      at: runbook.robot:16
      asserts: "none - informational config dump (SKU, location, VNet type, hostnames, URLs); emits recommendation-style issues if the script writes any"
      reads: ["az group show", "az apim show"]
      permissions: ["Microsoft.Resources/subscriptions/resourceGroups/read", "Microsoft.ApiManagement/service/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Script has set -euo pipefail so a failure aborts and stdout shows partial output; the result file apim_config_issues.json is written only at the very end (gather_apim_resource_information.sh:173), so an aborted run leaves no file and the Robot `cat` / json.loads errors out (a task error, not a pass)."
    - title: Check for Resource Health Issues Affecting APIM
      at: runbook.robot:46
      asserts: "Resource Health availabilityStatus is not 'Available' (category 'Not Applicable' suppressed); sev-4 if no status returned; any stderr output from the script raises sev-3"
      reads: ["az provider show/register Microsoft.ResourceHealth", "az rest GET .../Microsoft.ApiManagement/service/<name>/providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/read", "Microsoft.Resources/subscriptions/providers/register/action (when unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Registers the Microsoft.ResourceHealth provider if missing (write). stderr != '' => sev-3 issue, so az warnings (e.g. deprecation notices) create noise."
    - title: Fetch Key Metrics for APIM
      at: runbook.robot:111
      asserts: "APIM Azure Monitor metrics (failed/unauthorized requests, latency, capacity, gateway CPU/memory) breach the script's built-in thresholds; failed metric fetch is a sev-4 issue"
      reads: ["az apim show --query id", "az monitor metrics list --metric TotalRequests/FailedRequests/SuccessfulRequests/UnauthorizedRequests/OtherRequests/Requests/Duration/BackendDuration/Capacity/CpuPercent_Gateway/MemoryPercent_Gateway"]
      permissions: ["Microsoft.ApiManagement/service/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "apim_metrics.sh:128-135 parse_metric_value returns 0 for invalid or empty metric payloads, so a metric with no datapoints (e.g. tier lacks the metric, no traffic) is scored 0 and cannot breach a threshold; hard fetch failures are recorded as sev-4 (:195-215)"
      notes: "Uses eval of an az command string. Capacity/CPU metrics are only valid for some SKUs."
    - title: Check Logs for Errors with APIM
      at: runbook.robot:165
      asserts: "Log Analytics AzureDiagnostics (GatewayLogs and others) contains known error types more than the warning threshold in the lookback window; missing diagnostic settings/workspace is sev-4; query failure is sev-1"
      reads: ["az apim show", "az monitor diagnostic-settings list", "az monitor log-analytics workspace show", "az monitor log-analytics query (category discovery, then KQL)"]
      permissions: ["Microsoft.ApiManagement/service/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Category discovery query is 2>/dev/null (apim_diagnostic_logs.sh:186-189) which only narrows the category list. A diag-settings list failure (`|| true` at :107) is reported as 'No Diagnostic Settings Configured' (wrong diagnosis, not a pass). Script exits 1 after writing the issue file; Robot ignores rc but reads the file."
    - title: Check Activity Logs for APIM Management Operations
      at: runbook.robot:221
      asserts: "Activity log shows failed/errored management operations on the APIM resource in the lookback window"
      reads: ["az apim show", "az monitor activity-log list --resource-id"]
      permissions: ["Microsoft.ApiManagement/service/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "rc of az apim show and activity-log list are both checked (apim_activity_logs.sh:31,89) with exit 1 + stderr; Robot raises sev-3 on any stderr. data:logs-bulk."
    - title: Check Application Insights Integration for APIM
      at: runbook.robot:277
      asserts: "APIM has an Application Insights logger and App Insights shows frequent exceptions, failed requests or slow performance over thresholds"
      reads: ["az apim show", "az monitor app-insights component show", "az monitor app-insights query (exceptions, requests success==false, performance)"]
      permissions: ["Microsoft.ApiManagement/service/read", "Microsoft.Insights/components/read", "Microsoft.Insights/components/api/read (query)"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_apim_appinsights.sh:157-165 (and :205,:255 equivalents) on `az monitor app-insights query` failure only `echo \"[WARN] Could not query Application Insights ...\"` to stdout; no issue, stderr stays empty so runbook.robot:289 stderr check does not fire"
      notes: "Requires the az application-insights extension (dynamic install)."
    - title: Check Key Vault Dependencies for APIM
      at: runbook.robot:326
      asserts: "Key Vaults referenced by APIM named values/certificates are accessible, referenced secrets exist and are readable, and Key Vault audit logs show no access failures above 5"
      reads: ["az apim show", "az keyvault show", "az monitor diagnostic-settings list (KV)", "az monitor log-analytics query (AzureDiagnostics AuditEvent not Success)", "az keyvault secret show --query attributes"]
      permissions: ["Microsoft.ApiManagement/service/read", "Microsoft.KeyVault/vaults/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/query/read", "Key Vault data-plane: secrets/get (access policy or RBAC Key Vault Secrets User)"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_apim_keyvault.sh:169-170 diag-settings list `2>/dev/null || echo \"[]\"` and :180-198 workspace show/query `2>/dev/null` inside `if` -> audit-failure check silently skipped when the query errors"
      notes: "Secret existence/permission checks (:247) are rc-checked and classified by stderr text (SecretNotFound / Forbidden). Reads secret attributes only, not values."
    - title: Verify APIM Policy Configurations
      at: runbook.robot:375
      asserts: "Service/API/product/operation policy XML is well-formed (xmllint), has auth/rate-limit/etc. expectations, and backend URLs in set-backend-service resolve"
      reads: ["az apim show", "az rest GET <apim>/policies/policy, /apis, /products, /apis/<id>/operations (+ their policies)", "xmllint", "nslookup/curl on extracted backend URLs"]
      permissions: ["Microsoft.ApiManagement/service/read", "Microsoft.ApiManagement/service/policies/read", "Microsoft.ApiManagement/service/apis/read", "Microsoft.ApiManagement/service/apis/policies/read", "Microsoft.ApiManagement/service/apis/operations/policies/read", "Microsoft.ApiManagement/service/products/read", "Microsoft.ApiManagement/service/products/policies/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "verify_apim_policies.sh:190-191 `az rest .../apis ... 2>/dev/null || echo \"{}\"` -> api_count 0 and the API loop never runs; :203,:246,:298 per-API/operation/product policy fetch `2>/dev/null || echo \"\"` is treated as 'no policy'; :286-287 same for products"
      notes: "Service-level policy fetch (:139) is rc/stderr-checked. apim_policies.sh (234 lines, near-duplicate) is unused by the runbook. SLI uses the same script."
    - title: Check APIM SSL Certificates
      at: runbook.robot:432
      asserts: "Custom-domain certificates are not expired and have more than DAYS_THRESHOLD days left; cert subject roughly matches the hostname"
      reads: ["az apim show (hostnameConfigurations)", "curl --insecure -v https://<hostname> (live expiry)"]
      permissions: ["Microsoft.ApiManagement/service/read", "network reachability to the APIM custom hostnames on 443 from the runner"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "If expiry cannot be determined it raises sev-4 'Cannot Determine Certificate Expiry' (check_apim_ssl_certs.sh) rather than passing. `curl --insecure` means chain trust is not verified (only expiry is read). `date -d` is GNU-only with `|| echo 0` fallback leading to the sev-4 path. Service with only the default hostname raises sev-4 'No Custom Hostname Configurations' (a non-problem). Hostname-vs-subject test is a substring grep (no SAN parsing)."
    - title: Inspect Dependencies and Related Resources for APIM
      at: runbook.robot:480
      asserts: "Backends, Key Vaults and other dependencies discovered from APIM APIs are resolvable/reachable (nslookup + 5s curl) and Key Vaults show"
      reads: ["az apim show", "az apim api list", "az keyvault show --ids", "nslookup <backend host>", "curl -s --max-time 5 <backend url>"]
      permissions: ["Microsoft.ApiManagement/service/read", "Microsoft.ApiManagement/service/apis/read", "Microsoft.KeyVault/vaults/read", "network reachability from the runner to backend URLs"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "inspect_apim_dependencies.sh:198-203 backend curl has no -f, so any HTTP response (401/500) counts as reachable; only connect/timeout failures are flagged"
      notes: "Egress to arbitrary customer backend URLs (SSRF-ish surface: URLs come from APIM config). SKIP_CONNECTIVITY_CHECK env disables the curl step. In SLI, the stderr issue is raised but does not affect the score."
  bundleNotes: "Scripts all follow set -euo pipefail with `exit 1` after writing an issue JSON; Robot treats any stderr as a sev-3 'Errors running ...' issue, which is a decent catch-all but noisy and does not cover failures where the script prints to stdout (appinsights). Scripts exchange results via fixed-name JSON files in cwd. Generation rule baseName az-appgw-health collides with the Application Gateway bundle's baseName."
- bundle: azure-appgateway-health
  displayName: Azure Application Gateway Health
  classicResourceTypes: [azure_network_application_gateways]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource, resource_group, subscription_id; baseName az-appgw-health"
  sli: true
  sliAsserts: "mean of 6 binary scores (resource health Available, config issues==0, backend pool issues==0, metrics issues==0, SSL issues==0, error-log issues==0); scripts write error issues on az failure so most failures score 0; false-pass: likely only through metrics (empty data parses to 0) and SSL paths"
  egress: "cloud API (ARM, Log Analytics, Monitor) + public internet to listener hostnames/IPs (curl --insecure for live cert expiry)"
  tools: [az, jq, curl, openssl, base64, bc, bash]
  inputs: [AZ_RESOURCE_GROUP, APP_GATEWAY_NAME, AZURE_RESOURCE_SUBSCRIPTION_ID, AZURE_SUBSCRIPTION_NAME, azure_credentials]
  tasks:
    - title: Check for Resource Health Issues Affecting Application Gateway
      at: runbook.robot:16
      asserts: "Resource Health availabilityStatus for the gateway is not 'Available'; sev-4 if no record returned; sev-3 on any stderr"
      reads: ["az provider show/register Microsoft.ResourceHealth", "az rest GET .../Microsoft.Network/applicationGateways/<name>/providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/read", "Microsoft.Resources/subscriptions/providers/register/action (when unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Registers Microsoft.ResourceHealth if missing (write). Robot bug: stderr issue uses `${resource_health.stderrt}` (typo, runbook.robot:30) so a script that writes stderr makes the task error out instead of reporting. app_gateway_resource_health.sh:58-60 az rest failure exits 1 (stderr)."
    - title: Check Configuration Health of Application Gateway
      at: runbook.robot:68
      asserts: "Gateway has subnet, public IP, operationalState Running, HTTP/2, listeners, rules, SKU/WAF recommendations; findings returned as issues"
      reads: ["az network application-gateway show", "az network vnet subnet show --ids", "az network public-ip show --ids"]
      permissions: ["Microsoft.Network/applicationGateways/read", "Microsoft.Network/virtualNetworks/subnets/read", "Microsoft.Network/publicIPAddresses/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "app_gateway_config_health.sh has no set -e and no rc check on `az network application-gateway show` (:31), so a failed call produces empty fields; az stderr is then non-empty and Robot's stderr branch hits the `stderrt` typo (runbook.robot:88) and errors rather than passing. Expected text says 'has configuration recommendations' - many findings are advisory."
    - title: Check Backend Pool Health for Application Gateway
      at: runbook.robot:109
      asserts: "Every backend pool member reports Healthy in `az network application-gateway show-backend-health`; no backend pools / pools without HTTP settings are sev-1; identifies the backing Azure resource of unhealthy members"
      reads: ["az network application-gateway show-backend-health", "az webapp list / az container list / az aks list / az storage account list / az apim list / az cdn profile list / az sql server list / az postgres|mysql flexible-server list / az vm list-ip-addresses (resolve backend address to resource)"]
      permissions: ["Microsoft.Network/applicationGateways/backendhealth/action", "Microsoft.Web/sites/read", "Microsoft.ContainerInstance/containerGroups/read", "Microsoft.ContainerService/managedClusters/read", "Microsoft.Storage/storageAccounts/read", "Microsoft.ApiManagement/service/read", "Microsoft.Cdn/profiles/read", "Microsoft.Sql/servers/read", "Microsoft.DBforPostgreSQL/flexibleServers/read", "Microsoft.DBforMySQL/flexibleServers/read", "Microsoft.Compute/virtualMachines/read", "Microsoft.Network/networkInterfaces/read"]
      scope: subscription
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "show-backend-health rc and JSON validity are checked and become sev-3/sev-1 issues (app_gateway_backend_health.sh:35-72). The reverse resource lookups are all `2>/dev/null` (:143-255) but only enrich the report. Lookups are subscription-wide lists (no -g), so they need broad read."
    - title: Fetch Log Analytics for Application Gateway
      at: runbook.robot:150
      asserts: "none - report only: errors by user agent / URI from Log Analytics; never adds an issue other than the stderr one"
      reads: ["az network application-gateway show --query id", "az monitor diagnostic-settings list", "az monitor log-analytics workspace show", "az monitor log-analytics query (several KQL)"]
      permissions: ["Microsoft.Network/applicationGateways/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Asserts nothing, so nothing to false-pass; failures are only visible as stderr. app_gateway_comprehensive_log_check.sh is unused by the runbook (dead)."
    - title: Fetch Metrics for Application Gateway
      at: runbook.robot:178
      asserts: "Azure Monitor metrics for the gateway (failed requests, unhealthy hosts, latency, capacity units etc.) breach the script's thresholds"
      reads: ["az network application-gateway show --query id", "az monitor metrics list --metric <several>"]
      permissions: ["Microsoft.Network/applicationGateways/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "app_gateway_metrics.sh:89-120 parse helper returns 0 for invalid/empty payloads and `jq ... || echo \"0\"` -> a metric with no datapoints reads as 0 and cannot breach; hard fetch failure is only an issue if the script's error branch fires (not fully traced)"
      notes: "Same structure as apim_metrics.sh; `cat app_gateway_metrics.json | jq '.issues'` where the pipeline rc is jq's."
    - title: Check SSL Certificate Health for Application Gateway
      at: runbook.robot:225
      asserts: "Listener certificates (and key-vault certs) are not expired / near expiry; expiry from config, from ssl-cert publicCertData, or a live curl --insecure TLS probe"
      reads: ["az network application-gateway show", "az network application-gateway ssl-cert show", "az network public-ip show --ids", "curl --insecure -v https://<listener host or IP>", "openssl x509 / pkcs12 on publicCertData"]
      permissions: ["Microsoft.Network/applicationGateways/read", "Microsoft.Network/applicationGateways/sslCertificates/read (az ssl-cert show)", "Microsoft.Network/publicIPAddresses/read", "network reachability to listener hosts on 443"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "app_gateway_ssl_certs.sh:2 `# set -euo pipefail` is commented out; :386-407 ssl-cert show failure only echoes to stdout and the script falls back to a live probe; whether the final 'cannot determine expiry' case raises an issue was not traced"
      notes: "date -d (GNU) with `|| echo 0` fallbacks (:76,95,110,152,375). Live probe uses --insecure, so expiry is read from whatever the listener serves (could be a different cert than configured). 669-line script, largest in the bundle."
    - title: Check Logs for Errors with Application Gateway
      at: runbook.robot:266
      asserts: "Log Analytics AzureDiagnostics has more than WARNINGS_THRESHOLD HTTP 4xx/5xx errors for the gateway in the lookback window; missing diag settings/workspace flagged"
      reads: ["az network application-gateway show --query id", "az monitor diagnostic-settings list", "az monitor log-analytics workspace show", "az monitor log-analytics query"]
      permissions: ["Microsoft.Network/applicationGateways/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Query failure is a sev-1 issue (app_gateway_log_errors.sh:181-200); diag-settings list `|| true` (:89) turns a failure into 'no diagnostic settings' (wrong diagnosis, not a pass). Documentation says 'IP mismatches or subnet issues' but the query counts generic HTTP errors."
    - title: List Related Azure Resources for Application Gateway
      at: runbook.robot:308
      asserts: "none - discovery report mapping backend pool addresses to Azure resources (VM, App Service, container group, AKS, private endpoint, NICs)"
      reads: ["az network application-gateway show", "az network vnet subnet show --ids", "az vm list-ip-addresses", "az webapp list", "az container list", "az aks list", "az vm show / az network nic show / az webapp show --ids", "az network private-endpoint list"]
      permissions: ["Microsoft.Network/applicationGateways/read", "Microsoft.Network/virtualNetworks/subnets/read", "Microsoft.Compute/virtualMachines/read", "Microsoft.Network/networkInterfaces/read", "Microsoft.Web/sites/read", "Microsoft.ContainerInstance/containerGroups/read", "Microsoft.ContainerService/managedClusters/read", "Microsoft.Network/privateEndpoints/read"]
      scope: subscription
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Informational; lookups are `2>/dev/null || true` so unresolved backends are just omitted."
  bundleNotes: "Same family as azure-apim-health and azure-aks-triage: scripts write fixed-name JSON files and Robot treats stderr != '' as a sev-3 issue. Two tasks have a `stderrt` typo that turns the stderr branch into a Robot error. The log-based tasks (error logs) correctly turn query failures into issues. Generation rule baseName az-appgw-health is shared with azure-apim-health."
- bundle: azure-appservice-cost-optimization
  displayName: Azure App Service Cost Optimization
  classicResourceTypes: [azure_appservice_plans]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers subscription_id, resource_group"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (ARM, Azure Monitor, Resource Graph)"
  tools: [az, jq, bc, awk, bash]
  inputs: [AZURE_SUBSCRIPTION_IDS, AZURE_RESOURCE_GROUPS, AZURE_SUBSCRIPTION_NAME, LOW_COST_THRESHOLD, MEDIUM_COST_THRESHOLD, HIGH_COST_THRESHOLD, OPTIMIZATION_STRATEGY, TIMEOUT_SECONDS, azure_credentials]
  tasks:
    - title: Analyze App Service Plan Cost Optimization
      at: runbook.robot:18
      asserts: "An App Service Plan has no apps (empty), or its CPU/memory utilization is low enough that fewer instances or a smaller SKU would do, per OPTIMIZATION_STRATEGY (aggressive/balanced/conservative); issue carries estimated saving"
      reads: ["az group list", "az appservice plan list -g", "az webapp list --query [?appServicePlanId==...]", "az functionapp list", "az monitor metrics list (plan CPUPercentage/MemoryPercentage)", "Resource Graph via azure_performance_utils.sh"]
      permissions: ["Microsoft.Web/serverfarms/read", "Microsoft.Web/sites/read", "Microsoft.Resources/subscriptions/resourceGroups/read", "Microsoft.Insights/metrics/read", "Microsoft.ResourceGraph/resources/read"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "azure_appservice_cost_optimization.sh:76-83 and :92-93 `az webapp list`/`az functionapp list` ... `2>/dev/null || echo '[]'` / `|| echo \"0\"`; :922 `az group list ... 2>/dev/null`; plan-list failure at :999-1004 is only counted in failed_rgs and logged (:1073), never an issue -> 'All App Service Plans appear to be efficiently utilized'"
      notes: "Wrong-direction hazard: a failed or forbidden `az webapp list` returns [] so the plan looks EMPTY and is reported (with an `az appservice plan delete` next step) as a deletable plan. Same stale-file/`cat` behaviour as other cost bundles. Suggested remediation commands in issue text include delete/update (not executed)."
  bundleNotes: "Single task. Same generation-rule mismatch as AKS cost: per-plan SLX but the script scans whole subscription/RGs from env. Overlaps conceptually with azure-appservice-plan-health (asp_cost_optimization.sh)."
- bundle: azure-appservice-functionapp-health
  displayName: Azure Function App Health
  classicResourceTypes: [azure_appservice_web_apps]
  matchHints: "pattern .+ on name AND pattern ^functionapp(?:,.*)?$ on kind (substring); level of detail detailed; qualifiers resource, resource_group, subscription_id"
  sli: true
  sliAsserts: "mean of 5 binary scores (resource health Available; health-check metric issues; config issues; activities issues; deployment issues); but each issue-file score is 0 only when an issue has severity 1 or 2 (sli.robot Evaluate loops), and tool-failure issues in these scripts are mostly sev 3-4; false-pass: likely"
  egress: "cloud API (ARM, Azure Monitor, Log Analytics, Advisor); az webapp log download pulls app logs (SCM/Kudu endpoint of the app)"
  tools: [az, jq, bc, unzip, timeout, bash]
  inputs: [AZ_RESOURCE_GROUP, FUNCTION_APP_NAME, AZURE_RESOURCE_SUBSCRIPTION_ID, RW_LOOKBACK_WINDOW, azure_credentials]
  tasks:
    - title: Check for Resource Health Issues Affecting Function App
      at: runbook.robot:17
      asserts: "Resource Health availabilityStatus of the Function App is not 'Available'; sev-4 if no record returned"
      reads: ["az provider show/register Microsoft.ResourceHealth", "az rest GET .../Microsoft.Web/sites/<name>/providers/Microsoft.ResourceHealth/availabilityStatuses/current", "az functionapp show --query id (portal link)"]
      permissions: ["Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Web/sites/read", "Microsoft.Resources/subscriptions/providers/register/action (when unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Registers Microsoft.ResourceHealth if missing. appservice_resource_health.sh:56-63 redirects az rest to the file and exits 1 on failure; Robot then reads a missing/empty file (json.loads error or sev-4 'unavailable')."
    - title: Log Every Function Invocation Result
      at: runbook.robot:68
      asserts: "Per-function executions/errors/duration/memory over the lookback window show elevated error rate or poor health score (issue file invocation_log.json)"
      reads: ["az functionapp function list", "az monitor metrics list FunctionExecutionCount / FunctionExecutionUnits / errors / duration / memory (per function dimension)"]
      permissions: ["Microsoft.Web/sites/functions/read", "Microsoft.Insights/metrics/read", "Microsoft.Web/sites/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "function_invocation_logger.sh:55-70 `az functionapp function list ... 2>/dev/null` empty -> treated as no functions, exit 0; :90-120 metrics `2>/dev/null || echo \"[]\"`; runbook.robot:89 `if [ -f invocation_log.json ]; else echo '{\"issues\": []}'`"
      notes: "Name says 'Log Every Invocation' but it aggregates metrics (no per-invocation log). Overlaps 'Check Individual Function Invocations Health'."
    - title: Analyze Function Failure Patterns
      at: runbook.robot:119
      asserts: "none - Robot only prints a summary of failure_analysis.json (title/severity of the first issue); it never calls Add Issue"
      reads: ["az functionapp function list", "az monitor metrics list (executions, errors, duration per function)"]
      permissions: ["Microsoft.Web/sites/functions/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Task cannot fail; findings in failure_analysis.json are dropped. A V13 port should decide whether this is a typed output or dead weight."
    - title: Check Function App Health in Resource Group
      at: runbook.robot:139
      asserts: "Function App state is Running and Azure Monitor health-check / HTTP metrics (5xx, response time, etc.) are within script thresholds"
      reads: ["az functionapp show", "az monitor metrics list (per metric in FUNCTION_METRICS, PT1M, plus baseline)"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_health_metric.sh:76-82 metric list `2>/dev/null` with no rc check (no set -e), empty metric_json is then fed to jq --argjson (:89-92); baseline fetch `|| echo '{\"value\":[]}'` (:213-219): missing data is not an issue"
      notes: "Same script powers the SLI health-check sub-score (counted only for sev 1/2 issues)."
    - title: Fetch Function App Plan Utilization Metrics
      at: runbook.robot:193
      asserts: "CPU/memory metrics of the hosting plan exceed utilization thresholds"
      reads: ["az functionapp show", "az monitor metrics list CpuTime/MemoryWorkingSet (or plan CPU/memory)"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "appservice_plan_utilization_health.sh:113-125 metric list `2>/dev/null`; empty or zero-length result -> 'No data found for metric' and `continue` (no issue)"
      notes: ""
    - title: Check Individual Function Invocations Health
      at: runbook.robot:246
      asserts: "Functions in the app have errors, throttles or abnormal duration/memory in the lookback window"
      reads: ["az functionapp function list", "az monitor metrics list FunctionExecutionCount/Errors/Throttles/Duration/Memory with --filter FunctionName"]
      permissions: ["Microsoft.Web/sites/functions/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "function_invocation_health.sh:60-71 function list `2>/dev/null` empty -> writes '{\"issues\":[],...}' exit 0; :127-172 every metric `2>/dev/null || echo \"0\"` then 'Function App level metrics retrieved' (also flagged in prior audit)"
      notes: "timeout_seconds=60 in the runbook for a 697-line script that makes many metric calls; a timeout returns rc -1 which the Robot ignores."
    - title: Get Function App Logs and Analyze Errors
      at: runbook.robot:293
      asserts: "Downloaded app log files contain ERROR/Exception/Failed lines or critical entries above thresholds"
      reads: ["az functionapp show --query state", "az webapp log download", "az webapp log tail --provider docker", "unzip + grep on the log archive"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Web/sites/config/list/action (publishing credentials needed by log download)", "Microsoft.Web/sites/publish/action"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:305 `if [ -f function_app_log_issues_report.json ]; then cat ...; else echo '{\"issues\": []}'; fi`; appservice_logs.sh:85-139 `az webapp log download ... 2>/dev/null` failure falls through to other branches with all errors silenced"
      notes: "Uses `az webapp log download` against a function app. `timeout` wrappers return non-zero but are swallowed."
    - title: Check Configuration Health of Function App
      at: runbook.robot:334
      asserts: "Function App configuration (state, HTTPS only, runtime, diagnostic settings count, plan SKU) has no misconfiguration findings"
      reads: ["az functionapp show", "az monitor diagnostic-settings list", "az appservice plan show --ids"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "appservice_config_health.sh:50-71 exits 1 when functionapp show fails, so Robot reads a missing file (loud). Plan/diag lookups are 2>/dev/null and only add advisory findings."
    - title: Check Deployment Health of Function App
      at: runbook.robot:374
      asserts: "Production slot and deployment slots exist and are in a Running/healthy state; deployment config fetch failure is sev 2"
      reads: ["az functionapp deployment slot list", "az functionapp show", "az functionapp deployment slot show"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Web/sites/slots/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Slot-list failure (`2>/dev/null`, appservice_deployment_health.sh:68) is treated as 'no slots' and falls to the production check whose failure is a sev-2 issue (:83-96), so not silent."
    - title: Fetch Function App Activities
      at: runbook.robot:415
      asserts: "Activity log (or Log Analytics) shows failed/critical operations on the Function App, excluding noisy publish-xml operations"
      reads: ["az functionapp show", "az monitor diagnostic-settings list", "az monitor log-analytics query", "az monitor activity-log list"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/query/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "functionapp_activities.sh:106,129-134 diag-settings and activity-log list `2>/dev/null`; empty -> no activities; rc not checked"
      notes: "Task at runbook.robot:493 runs the same script and reads the same JSON file - exact duplicate."
    - title: Fetch Azure Recommendations and Notifications for Function App
      at: runbook.robot:454
      asserts: "Azure Advisor recommendations, service health events or security assessments exist for the Function App; plus HTTPS-only/managed identity/App Insights/plan SKU checks"
      reads: ["az advisor recommendation list", "az rest (serviceHealth/events, security assessments)", "az functionapp show / identity show", "az appservice plan show"]
      permissions: ["Microsoft.Advisor/recommendations/read", "Microsoft.ResourceHealth/events/read", "Microsoft.Security/assessments/read", "Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_recommendations.sh:131-133,194-198,231-235 advisor/service-health/security calls end `2>/dev/null | jq -c '.'`; empty = no recommendations (no pipefail)"
      notes: "Advisory content; absence is normal. Companion appservice_recommendations_enhanced.sh and appservice_activities_enhanced.sh are not referenced by the runbook or SLI (dead code)."
    - title: Check Recent Activities for Function App
      at: runbook.robot:493
      asserts: "Same as 'Fetch Function App Activities' (identical script and result file)"
      reads: ["same as runbook.robot:415"]
      permissions: ["same as runbook.robot:415"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "same as runbook.robot:415 (functionapp_activities.sh)"
      notes: "Duplicate of the task at line 415."
    - title: Check Diagnostic Logs for Function App
      at: runbook.robot:522
      asserts: "Function App diagnostic settings route logs somewhere and logs/Application Insights contain errors above thresholds"
      reads: ["az functionapp show (tags hidden-link app-insights id)", "az monitor diagnostic-settings list", "az monitor app-insights query / az monitor log-analytics query"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.Insights/components/api/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "functionapp_diagnostic_logs.sh:64 and :138 `timeout 30 az ... 2>/dev/null` with set -e only; timeouts/failures leave empty variables handled as 'not configured'; not traced to the final issue"
      notes: "Not fully traced; classification is from the idiom, not a verified path."
  bundleNotes: "Largest bundle by script count (15). Two script families coexist: appservice_*.sh (used by SLI and several tasks) and function_*.sh/functionapp_*.sh (function-specific, set -e, metrics with `|| echo 0`). Several scripts are near-copies of the webapp-health ones with az webapp -> az functionapp swapped. SLI has a commented-out log-analysis task and references appservice_log_analysis.sh which does not exist here. function_invocation_health.sh (known from the earlier audit): errors go to 2>/dev/null yielding issues:[] and exit 0; metrics fall back to `|| echo \"0\"` yet print 'metrics retrieved'."
- bundle: azure-appservice-plan-health
  displayName: Azure App Service Plan Health
  classicResourceTypes: [azure_appservice_plans]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource_group, subscription_id"
  sli: true
  sliAsserts: "mean of 2 binary scores: availability (1 if at least ONE plan in the RG is Available) and capacity (1 if count of high-usage plans <= MAX_HIGH_USAGE_APP_SERVICE_PLAN); false-pass: confirmed - availability >= 1 passes even when most plans are unhealthy, and an empty/failed health list is unguarded (json.loads error) while capacity script exit 0 'No plans found' scores 1"
  egress: "cloud API (ARM, Resource Health, Azure Monitor)"
  tools: [az, jq, bc, bash]
  inputs: [AZURE_RESOURCE_GROUP, AZURE_SUBSCRIPTION_ID, AZURE_SUBSCRIPTION_NAME, azure_credentials, "(plus capacity thresholds / MAX_HIGH_USAGE_APP_SERVICE_PLAN, CPU/memory thresholds, METRICS_OFFSET/INTERVAL)"]
  tasks:
    - title: Check Azure App Service Plan Resource Health
      at: runbook.robot:19
      asserts: "Resource Health availabilityState of every App Service Plan in the resource group is 'Available'; sev-4 if no health records could be collected"
      reads: ["az provider show/register Microsoft.ResourceHealth", "az group show", "az appservice plan list -g", "az rest GET .../Microsoft.Web/serverfarms/<plan>/providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.Web/serverfarms/read", "Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/register/action (when unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: likely
      falsePassWhy: "asp-health-check.sh:85-87 per-plan `az rest ... 2>/dev/null` failure drops that plan from asp_health.json; remaining Available plans mask it; runbook.robot:27-32 JSON load failure also defaults to an empty list (but empty list raises the sev-4 'unavailable' issue)"
      notes: "Registers Microsoft.ResourceHealth if missing. No set -e in the script."
    - title: Check App Service Plan Capacity and Recommendations
      at: runbook.robot:68
      asserts: "A plan's CPU, memory or disk-queue exceed capacity thresholds (high usage) and the script's scale-up/scale-down recommendations"
      reads: ["az appservice plan list (whole subscription, no -g)", "az monitor metrics list CpuPercentage MemoryPercentage DiskQueueLength"]
      permissions: ["Microsoft.Web/serverfarms/read", "Microsoft.Insights/metrics/read"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "check_appservice_plan_capacity.sh:232-250 metrics `2>/dev/null || echo \"\"` twice then empty cpu/mem is simply not evaluated (no issue); :44-49 empty plan list -> 'No App Service Plans found', exit 0"
      notes: "Lists plans for the ENTIRE subscription although the SLX is per resource group (AZURE_RESOURCE_GROUP not applied at :44), so thresholds and results span other RGs. Plan list failure has no rc check (:44)."
    - title: Analyze App Service Plan Cost Optimization Opportunities
      at: runbook.robot:145
      asserts: "A plan is empty or underutilized (low CPU/memory/requests) so it could be removed or downsized, with estimated saving"
      reads: ["az appservice plan list -g", "az monitor metrics list CpuPercentage / MemoryPercentage / Requests"]
      permissions: ["Microsoft.Web/serverfarms/read", "Microsoft.Web/sites/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "asp_cost_optimization.sh:193-220 each metric `2>/dev/null || echo '{\"value\":[]}'`; plan list at :155 is not swallowed (set -euo pipefail aborts, EXIT trap writes '[]' similar to other cost bundles)"
      notes: "Failed metrics read as zero utilization -> downsizing/removal false positive. Overlaps azure-appservice-cost-optimization."
    - title: Analyze App Service Plan Weekly Utilization Trends
      at: runbook.robot:175
      asserts: "CPU/memory utilization (and app HTTP 4xx/5xx/response time) trended over the past weeks shows a sustained rise or anomaly"
      reads: ["az appservice plan list -g", "az monitor metrics list (CPU/memory per week window)", "az webapp list", "az monitor metrics list (Requests, Http4xx, Http5xx, AverageResponseTime)"]
      permissions: ["Microsoft.Web/serverfarms/read", "Microsoft.Web/sites/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "asp_weekly_trend_analysis.sh:56-66 plan list `2>/dev/null || echo '[]'` then exit 0 with no issue; :108-128 metrics `2>/dev/null || echo '{}'`; :39 az account set `|| true`"
      notes: "`az webapp list` covers web apps only (function apps are separate). Uses GNU `date -d` with BSD fallback."
    - title: Check App Service Plan Changes
      at: runbook.robot:206
      asserts: "Activity log shows write/delete/scale/update operations on the plans in the lookback window, classified High/Medium by operation (failed operations reported as issues)"
      reads: ["az appservice plan list -g --query id", "az monitor activity-log list --resource-id <plan> --offset 24h"]
      permissions: ["Microsoft.Web/serverfarms/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "asp-audit.sh set -euo pipefail aborts on a failed activity-log list (:42), leaving no result files; runbook.robot:216-230 TRY/EXCEPT then defaults both files to an empty dict, i.e. 'no changes'"
      notes: "A listing failure shows only on stderr, which the Robot does not inspect."
  bundleNotes: "SLI and runbook share asp-health-check.sh and check_appservice_plan_capacity.sh. SLI availability sub-score (>=1 Available plan) is much weaker than the runbook (any non-Available plan is an issue). The cost and trend tasks duplicate analysis in azure-appservice-cost-optimization."
- bundle: azure-appservice-webapp-health
  displayName: Azure App Service Health
  classicResourceTypes: [azure_appservice_web_apps]
  matchHints: "pattern .+ on name AND pattern ^app(?:,.*)?$ on kind (substring); level of detail detailed; qualifiers resource, resource_group, subscription_id"
  sli: true
  sliAsserts: "mean of 5 binary scores (resource health Available; health-check metric issues; config issues; deployment issues; activities issues); issue-file scores are 0 only if an issue has severity 1 or 2 (sli.robot:61,90,119,146), so sev-3/4 tool-failure issues leave the score at 1; false-pass: likely"
  egress: "cloud API (ARM, Azure Monitor, Log Analytics, App Insights, Advisor); az webapp log download pulls logs from the app's Kudu/SCM endpoint"
  tools: [az, jq, bc, unzip, timeout, bash]
  inputs: [AZ_RESOURCE_GROUP, APP_SERVICE_NAME, AZURE_RESOURCE_SUBSCRIPTION_ID, RW_LOOKBACK_WINDOW, azure_credentials]
  tasks:
    - title: Check for Resource Health Issues Affecting App Service
      at: runbook.robot:17
      asserts: "Resource Health availabilityStatus of the web app is not 'Available'; sev-4 if no record"
      reads: ["az provider show/register Microsoft.ResourceHealth", "az rest GET .../Microsoft.Web/sites/<name>/providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/register/action (when unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Registers Microsoft.ResourceHealth if missing (write)."
    - title: Check App Service Health
      at: runbook.robot:69
      asserts: "App Service exists and is Running; HealthCheckStatus metric is below threshold or missing (sev 3 'No Health Check Data'); health-check path configured"
      reads: ["az webapp show (id, state, siteConfig.healthCheckPath)", "az monitor metrics list --metrics HealthCheckStatus"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Good pattern: not-found (sev 1) and no-data (sev 3) are issues (appservice_health_metric.sh:23-46,127-135); app not found exits 0 but writes the issue. State and healthCheckPath lookups (:74,:99) have no rc check."
    - title: Fetch App Service Utilization Metrics
      at: runbook.robot:123
      asserts: "Web app metrics (CPU time, memory, HTTP 5xx, response time, requests etc.) breach thresholds over the lookback window"
      reads: ["az webapp show", "az monitor metrics list (per metric)"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_metric_health.sh:202-216 per-metric `az monitor metrics list ... 2>/dev/null` inside `if`, empty/zero-length value -> 'No data found for metric' and `continue` with no issue"
      notes: "App-not-found is a sev-1 issue (:85-109)."
    - title: Get App Service Logs
      at: runbook.robot:169
      asserts: "none - displays the last lines of downloaded log files; Robot adds no issue"
      reads: ["az account set", "az webapp log download", "unzip + tail of log files"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Web/sites/config/list/action (publishing credentials for log download)"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Pure report. Download and unzip failures exit 1 (appservice_logs.sh:43-77) but the Robot ignores rc."
    - title: Check Configuration Health of App Service
      at: runbook.robot:188
      asserts: "Web app configuration (HTTPS only, always-on, runtime, diagnostic settings, plan tier) has findings"
      reads: ["az webapp show", "az monitor diagnostic-settings list", "az appservice plan show --ids"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_config_health.sh has no set -e and no rc checks (:13,:50,:79); failed `az webapp show` yields empty APP_SERVICE_DETAILS and jq on empty input emits nothing, so checks do not fire; az error text on stderr is not inspected by the Robot"
      notes: ""
    - title: Check Deployment Health of App Service
      at: runbook.robot:228
      asserts: "Deployment slots / production app state and last deployment log show failures"
      reads: ["az webapp deployment slot list", "az webapp show", "az webapp deployment slot show", "az webapp log deployment show"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Web/sites/slots/read", "Microsoft.Web/sites/config/list/action (deployment logs)"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_deployment_health.sh:18,57,80 no rc checks and no stderr redirect handling; slot list failure leaves DEPLOYMENTS empty and the script falls to the production-config branch; log deployment show failure yields no deployment findings"
      notes: ""
    - title: Fetch App Service Activities
      at: runbook.robot:268
      asserts: "Activity log shows failed/critical operations on the web app in the lookback window"
      reads: ["az webapp show", "az monitor activity-log list (per level)"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_activities.sh (shared pattern with function app copy): `az monitor activity-log list ... 2>/dev/null` stop-search queries; empty -> no activities"
      notes: "Same data as the next task; the 'enhanced' variant reads a different file."
    - title: Check Recent Activities for App Service
      at: runbook.robot:304
      asserts: "Critical/Error/Warning administrative activities on the web app, with tenant/subscription-aware filtering"
      reads: ["az webapp show", "az monitor activity-log list"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_activities_enhanced.sh: activity-log calls guarded by `if x=$(az ...)` with exit 0 on missing resource; list failure treated as no activities (not traced end to end)"
      notes: "Duplicate intent of runbook.robot:268."
    - title: Check Recommendations and Notifications for App Service
      at: runbook.robot:333
      asserts: "Azure Advisor recommendations, service health events and security assessments apply to the web app, plus HTTPS-only / managed identity / App Insights / plan checks"
      reads: ["az advisor recommendation list", "az rest serviceHealth and security assessments", "az webapp show / identity show", "az appservice plan show"]
      permissions: ["Microsoft.Advisor/recommendations/read", "Microsoft.ResourceHealth/events/read", "Microsoft.Security/assessments/read", "Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_recommendations.sh advisor/service-health/security calls end `2>/dev/null | jq -c '.'` (same pattern as function app copy); empty = no recommendations"
      notes: "Advisory content; absence is normal."
    - title: Check Diagnostic Logs for App Service
      at: runbook.robot:379
      asserts: "Log Analytics / Application Insights for the web app contain errors, failed requests or slow requests above thresholds; missing diagnostic settings reported"
      reads: ["az webapp show", "az monitor diagnostic-settings list", "az monitor log-analytics query", "az resource list/show (App Insights component)", "az monitor app-insights query"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/query/read", "Microsoft.Insights/components/read", "Microsoft.Insights/components/api/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_diagnostic_logs.sh:34-44 exits 0 when `az webapp show` fails (writes an issue), but :83,:137,:179 query calls are `if x=$(timeout 15s az ... 2>/dev/null)` and a failed/timed-out query falls through with no issue"
      notes: "Short hard-coded `timeout` values (3-15s) make timeouts plausible; a timed-out query is silent."
    - title: Check Logs for Errors in App Service
      at: runbook.robot:433
      asserts: "App Insights exceptions and Log Analytics error rows exist for the app in the recent window; script stderr raises sev 3"
      reads: ["az webapp show", "az webapp config appsettings list", "az monitor app-insights query", "az monitor diagnostic-settings list", "az monitor log-analytics query"]
      permissions: ["Microsoft.Web/sites/read", "Microsoft.Web/sites/config/list/action (appsettings)", "Microsoft.Insights/components/api/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "appservice_log_analysis.sh:49,61,104,116 each az call is `timeout 3s|5s ... 2>/dev/null` in an `if`; a failure or timeout just skips that source (the 3s webapp-show timeout writes a sev-3 issue)"
      notes: "`az webapp config appsettings list` returns app setting VALUES including secrets into script memory (only APPINSIGHTS key is selected via --query)."
  bundleNotes: "Same script family as azure-appservice-functionapp-health, but the web-app copies are better written for the not-found / no-data cases (explicit issues, exit 0). SLI sub-scores ignore sev-3/4 so degraded-but-not-failed states still score 1. Checked-in JSON files (app_service_log_issues_report.json, app_service_recommendations.json) in the bundle dir are stale artifacts."
