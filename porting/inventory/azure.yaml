  sliAsserts: "no sli.robot"
  egress: "cloud API (ARM)"
  tools: [az, jq, unzip, timeout, bash]
  inputs: [AZ_RESOURCE_GROUP, APP_SERVICE_NAME, AZURE_RESOURCE_SUBSCRIPTION_ID, RW_LOOKBACK_WINDOW, SCALE_OUT_FACTOR, SCALE_IN_FACTOR, SOURCE_SLOT, TARGET_SLOT, azure_credentials]
  tasks:
    - title: Restart App Service
      at: runbook.robot:17
      asserts: "none - action, not a check: restarts the web app; downloads pre/post-restart logs; raises a sev-3 issue if the script stdout contains 'ERROR'"
      reads: ["az webapp restart (after downloading/tailing logs and checking the activity log)"]
      permissions: ["Microsoft.Web/sites/restart/action", "Microsoft.Web/sites/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "The restart rc is checked (appservice_restart.sh:162-164 echoes ERROR to stdout and exits 1, matching runbook.robot check). No set -e: the activity-log verification (:107) and pre/post log fetches are best-effort, so the restart is confirmed by report text only. Tags use access:read-write."
    - title: Swap Deployment Slots
      at: runbook.robot:45
      asserts: "none - action, not a check: swaps source and target slots (auto-picks the single non-production slot); raises a sev-3 issue if the script stdout contains 'ERROR'"
      reads: ["az webapp deployment slot swap"]
      permissions: ["Microsoft.Web/sites/slots/slotsswap/action", "Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read", "Microsoft.Web/sites/slots/read"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Failures echo 'ERROR' to stdout (slot_swap.sh:46-213) matching the Robot check. Refuses when plan SKU does not support slots or multiple non-prod slots exist. No timeout/history flags set on Run Bash File."
    - title: Scale Up App Service
      at: runbook.robot:75
      asserts: "none - action, not a check: changes the App Service Plan SKU to the next tier (costs money, affects every app on the plan); raises a sev-3 issue if the script stdout contains 'ERROR'"
      reads: ["az appservice plan update --sku <next SKU from SKU_MAP_JSON>"]
      permissions: ["Microsoft.Web/serverfarms/write", "Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "'ERROR' printed to stdout on failure (scaleup.sh:60-124). Mutates the shared plan, not just this app. include_in_history=true (unlike other tasks)."
    - title: Scale Down App Service
      at: runbook.robot:104
      asserts: "none - action, not a check: changes the App Service Plan SKU to the previous tier; raises a sev-3 issue if the script stdout contains 'ERROR'"
      reads: ["az appservice plan update --sku <previous SKU>"]
      permissions: ["Microsoft.Web/serverfarms/write", "Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Same pattern as scale up; verified by a re-read of the plan."
    - title: Scale Out Instances for App Service
      at: runbook.robot:130
      asserts: "none - action, not a check: multiplies the plan instance count by SCALE_OUT_FACTOR; raises a sev-3 issue if the script stdout contains 'ERROR'"
      reads: ["az appservice plan update --number-of-workers (or az webapp scale for Arc)"]
      permissions: ["Microsoft.Web/serverfarms/write", "Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Arc-enabled branch uses az webapp scale --instance-count."
    - title: Scale In Instances for App Service
      at: runbook.robot:159
      asserts: "none - action, not a check: divides the plan instance count by SCALE_IN_FACTOR (floor 1); raises a sev-3 issue if the script stdout contains 'ERROR'"
      reads: ["az appservice plan update --number-of-workers (or az webapp scale for Arc)"]
      permissions: ["Microsoft.Web/serverfarms/write", "Microsoft.Web/sites/read", "Microsoft.Web/serverfarms/read"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Same pattern as scale out."
    - title: Redeploy App Service from Latest Source
      at: runbook.robot:184
      asserts: "none - action, not a check: redeploys the app from its configured container image or a zip package; raises a sev-3 issue if the script stdout contains 'ERROR'"
      reads: ["az webapp restart (container) or az webapp deployment source config-zip (code, needs ZIP_PACKAGE_PATH)"]
      permissions: ["Microsoft.Web/sites/restart/action", "Microsoft.Web/sites/extensions/write (zip deploy)", "Microsoft.Web/sites/config/list/action", "Microsoft.Web/sites/read"]
      scope: resource-group
      readOnly: false
      falsePass: confirmed
      falsePassWhy: "appservice_redeploy.sh:51,103,114,128 write 'ERROR: ...' with `1>&2` (stderr) and exit 1, but runbook.robot:~205 checks `'ERROR' in $redeploy.stdout` only, so a failed redeploy raises no issue"
      notes: "ZIP_PACKAGE_PATH is referenced by the script but not imported in the runbook. Only the stdout check is used, unlike the other ops tasks."
  bundleNotes: "Only mutating runbook in the group besides acr-image-sync. Success/failure of every task is decided by the substring 'ERROR' in script stdout; any failure path that writes to stderr or only exits non-zero without printing ERROR to stdout is a false pass (redeploy). Scale tasks modify the shared App Service Plan, so they affect every app on it. appservice_logs.sh is present but unused by the runbook."
- bundle: azure-databricks-cost-optimization
  displayName: Azure Databricks Cost Optimization
  classicResourceTypes: [azure_subscription_subscriptions]
  matchHints: "pattern .+ on name (substring) against subscription; level of detail basic; qualifiers subscription_id, resource_group"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (ARM, Resource Graph) + Databricks workspace REST API https://<workspace>.azuredatabricks.net/api/2.0/clusters/*"
  tools: [az, jq, curl, bc, bash]
  inputs: [AZURE_SUBSCRIPTION_IDS, AZURE_RESOURCE_GROUPS, AZURE_SUBSCRIPTION_NAME, COST_ANALYSIS_LOOKBACK_DAYS, LOW_COST_THRESHOLD, MEDIUM_COST_THRESHOLD, HIGH_COST_THRESHOLD, AZURE_DISCOUNT_PERCENTAGE, TIMEOUT_SECONDS, azure_credentials]
  tasks:
    - title: Analyze Databricks Cluster Auto-Termination and Over-Provisioning Opportunities
      at: runbook.robot:18
      asserts: "A Databricks cluster has no auto-termination, has been running idle, or is over-provisioned relative to utilization; issue carries estimated saving"
      reads: ["az graph query / az databricks workspace list", "az databricks workspace show --query workspaceUrl", "az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d", "GET /api/2.0/clusters/list", "POST /api/2.0/clusters/events", "GET /api/2.0/clusters/get", "GET /api/2.0/clusters/spark-ui"]
      permissions: ["Microsoft.Databricks/workspaces/read", "Microsoft.ResourceGraph/resources/read", "Databricks workspace-level access for the service principal (workspace user/CAN_ATTACH_TO on clusters); script note says Contributor on the workspace"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "analyze_databricks_cluster_optimization.sh:226-255 list_clusters: curl ... 2>/dev/null, invalid JSON or Databricks error_code both `echo '{\"clusters\":[]}'`; token failure (:842-848) and `az account set ... || continue` (:894) just skip the workspace; az databricks workspace show 2>/dev/null (:212) -> all end in 'No clusters found / All clusters have proper auto-termination'"
      notes: "Requires the az databricks extension for `az databricks workspace show`. Databricks API calls use `-s` with no -f and no rc check. Generation rule resourceType is the subscription, not a Databricks workspace; the SLX fires for every subscription whether or not it has Databricks."
  bundleNotes: "Single task, 49KB script. Uses shared Resource Graph helper with `|| echo '{\"data\":[]}'`."
- bundle: azure-devops-organization-health
  displayName: Azure DevOps Organization Health
  classicResourceTypes: [organization]
  matchHints: "platform azure_devops; pattern .+ on name (substring); level of detail basic; qualifiers resource"
  sli: true
  sliAsserts: "mean of 3 availability sub-scores (platform_incident_ok from the ADO status API, pool_capacity_ok = no self-hosted pool with a job queued longer than QUEUE_AGING_THRESHOLD_MIN, org_policy_ok = at least one Administrator security group exists); license_headroom_ok is reported but excluded. False-pass: confirmed by design - 'unmeasurable => 1' (sli-org-health-score.sh:92-97 pool list failure leaves pool_aging=0; :175 admin_groups unreadable (-1) => 1; platform probe defaults to ${ADO_PLATFORM_INCIDENT_OK:-1})"
  egress: "Azure DevOps REST (dev.azure.com, vssps/vsaex hosts) + public internet: Azure DevOps status API / status page; az devops extension may be installed from public internet"
  tools: [az (azure-devops extension), jq, curl, bash]
  inputs: [AZURE_DEVOPS_ORG, AGENT_UTILIZATION_THRESHOLD, LICENSE_UTILIZATION_THRESHOLD, RW_LOOKBACK_WINDOW, MAX_PROJECTS, AGENT_FETCH_PARALLELISM, "azure_credentials (service principal) OR azure_devops_pat"]
  tasks:
    - title: Validate Azure DevOps Access for Organization
      at: runbook.robot:19
      asserts: "The configured identity (PAT or service principal) holds the PAT scopes / roles the org-health checks need; a capability matrix from the suite-setup preflight says which are DENIED or ERROR"
      reads: ["preflight-check.sh (run in Suite Initialization): az devops project list, az pipelines pool list, az devops user list, az devops security group list --scope organization, az devops service-endpoint list"]
      permissions: ["PAT scopes: vso.project (Project and Team: Read), vso.agentpools (Agent Pools: Read), vso.memberentitlementmanagement (Member Entitlement Management: Read), vso.graph (Graph: Read), vso.serviceendpoint (Service Connections: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Real preflight: missing/invalid results file is treated as access_ok=false (runbook.robot:~420-428). Good model for a V13 capability probe. preflight-check.sh uses set -uo pipefail (no -e) and records each probe's rc into the matrix."
    - title: Check Service Health Status for Azure DevOps Organization
      at: runbook.robot:38
      asserts: "Core ADO APIs answer for the organization: project list, agent pool list, service endpoints for the first project, security group list; separates connectivity failures from permission denials"
      reads: ["az devops configure --defaults", "az devops project list", "az pipelines pool list", "az devops service-endpoint list --project <first>", "az devops security group list --scope organization"]
      permissions: ["PAT scopes: vso.project, vso.agentpools, vso.serviceendpoint, vso.graph (all Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Each call is `if ! x=$(az ... 2>err.log)` and becomes an issue; runbook TRY/EXCEPT defaults to an empty list only if the JSON file is missing (organization-service-health.sh exits 1 before writing in some paths: :46,:52,:73), which would read as no issues."
    - title: Check Agent Pool Capacity and Utilization
      at: runbook.robot:76
      asserts: "Self-hosted agent pools have offline agents, high utilization (> AGENT_UTILIZATION_THRESHOLD) or queued job requests aging past the threshold; elastic/VMSS pools judged by online capacity, not offline count"
      reads: ["az pipelines pool list", "GET _apis/distributedtask/pools/<id>/agents and /jobrequests (REST via az devops invoke or curl with PAT/SP bearer)", "Distributed Task elasticpools API"]
      permissions: ["PAT scope vso.agentpools (Agent Pools: Read); elastic pools API needs the same scope"]
      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "agent-pool-capacity.sh: pool list failure is an issue + exit 1 (:71-88), and a missing JSON file raises sev-3 'collection failed' (runbook.robot:94-104); but the per-pool agent fetch is best-effort with 'fetch_err' notes (:187) and elastic pool detection is explicitly 'degrade gracefully' (_az_helpers.sh:166-169,241), so unreadable pools/agents are not failed"
      notes: "Zero pools raises a sev-3 'No Agent Pools Found' issue (:96-99). timeout 600s. Highest-quality script in the group (documents the VMSS 'offline agent' trap)."
    - title: Validate Organization Policies and Security Settings
      at: runbook.robot:122
      asserts: "Organization has security groups / admin groups, projects have enabled branch policies on their first repository, service connections exist; flags projects without policies"
      reads: ["az devops project list", "az repos list --project", "az repos policy list --repository-id <first repo>", "az devops service-endpoint list --project", "az devops security group list --scope organization", "az devops configure --list"]
      permissions: ["PAT scopes: vso.project, vso.code (Code: Read), vso.serviceendpoint, vso.graph (all Read)"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "organization-policies.sh:163,170,197 `if repos=$(az repos list ... 2>/dev/null); then` and policies/service-conns likewise: a failed or forbidden call is skipped, and a project is added to projects_without_policies only when the policy list succeeded and had zero enabled policies, so unreadable == no finding"
      notes: "Samples only the FIRST repository of each project (:166-170), so 'project has policies' is a one-repo claim. Project-list failure is an issue (:133)."
    - title: Check License Utilization and Capacity
      at: runbook.robot:160
      asserts: "License assignments exceed LICENSE_UTILIZATION_THRESHOLD or include inactive users (cost optimization)"
      reads: ["az devops user list (Member Entitlement Management), page size USER_PAGE_SIZE"]
      permissions: ["PAT scope vso.memberentitlementmanagement (Member Entitlement Management: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Failure is a sev issue with the exact missing scope named (license-utilization.sh:50-58). If the API refuses to return all users the total is unmeasurable (SLI treats that as 1)."
    - title: Investigate Platform-wide Service Incidents
      at: runbook.robot:198
      asserts: "Azure DevOps service status (official status API) reports an incident, or core endpoints respond slowly / non-2xx"
      reads: ["curl https://dev.azure.com/<org> and core API endpoints (http code + time)", "Azure DevOps status API / portal"]
      permissions: ["none (public status page) + PAT/SP read for API probes"]
      scope: n/a
      readOnly: true
      falsePass: likely
      falsePassWhy: "service-incident-check.sh:58,176,231 curl probes are `curl -s ... 2>/dev/null` inside `if`; the else branches record connectivity problems, but the status-API probe default is 'ADO_PLATFORM_INCIDENT_OK:-1' (healthy) when the status service is unreachable"
      notes: "Egress to the public ADO status service. Parsing was previously wrong (numeric health code 4=healthy) per _az_helpers.sh:82-87."
    - title: Analyze Cross-Project Dependencies
      at: runbook.robot:236
      asserts: "Agent pools / service connections shared across projects, naming conflicts between projects"
      reads: ["az devops project list", "az pipelines list --project", "GET _apis/distributedtask/queues (curl with auth header)", "az devops service-endpoint list --project"]
      permissions: ["PAT scopes: vso.project, vso.build (Build: Read), vso.agentpools, vso.serviceendpoint (all Read)"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "cross-project-dependencies.sh:130,141,157 per-project `az pipelines list ... 2>/dev/null`, curl `2>/dev/null`, service-endpoint list `2>/dev/null` inside `if`: failure -> project contributes nothing -> no dependency findings"
      notes: "Informational analysis (sharing is not itself a fault). Capped by MAX_PROJECTS."
    - title: Investigate Platform Issues
      at: runbook.robot:274
      asserts: "Agent pool problems plus recent failed pipeline runs across projects point to a platform (not project) problem"
      reads: ["az pipelines pool list", "az devops project list", "az pipelines list --project", "az pipelines runs list --pipeline-id --query result=='failed'", "az devops service-endpoint list --project"]
      permissions: ["PAT scopes: vso.project, vso.build, vso.agentpools, vso.serviceendpoint (all Read)"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "platform-issue-investigation.sh:62,263,277,285,356,362 every az call is `if x=$(az ... 2>/dev/null); then`; failed pool/project/pipeline/run lookups silently contribute zero failures; only :395 (project list for the final check) turns failure into an issue"
      notes: "Overlaps the pool-capacity and service-health tasks."
  bundleNotes: "Newer-style bundle: shared _az_helpers.sh (identical copy exists in azure-devops-project-health), meta.yaml, a real preflight capability matrix, and explicit 'unmeasurable' handling. The helper file states its REST helpers 'never abort the calling script' by design - good for resilience, but it is precisely why per-project/per-pool failures vanish. Auth: azure_credentials (SP) preferred, else azure_devops_pat; PAT scopes are the effective permission model, not Azure RBAC. Cached config dir under CODEBUNDLE_TEMP_DIR/.azure-devops."
- bundle: azure-devops-project-health
  displayName: Azure DevOps Project Health
  classicResourceTypes: [project]
  matchHints: "platform azure_devops; pattern .+ on name (substring); level of detail basic; qualifiers organization, resource"
  sli: true
  sliAsserts: "mean of 5 binary sub-scores per project set: data_collection_ok (access preflight and build query succeeded), pipeline_failure_ratio_ok, protected_branch_failures_ok, queue_aging_ok, long_running_ok; defaults to min() across projects. Explicit data_collection_ok means a failed build query scores 0 (build_query_ok default 0), and the SLI Fails the run if no projects are found (sli.robot:191). False-pass: none"
  egress: "Azure DevOps REST (dev.azure.com) via az devops / curl; az devops extension may be installed from public internet"
  tools: [az (azure-devops extension), jq, curl, bash]
  inputs: [AZURE_DEVOPS_ORG, AZURE_DEVOPS_PROJECTS, DURATION_THRESHOLD, QUEUE_THRESHOLD, RW_LOOKBACK_WINDOW, AGENT_FETCH_PARALLELISM, "azure_credentials (service principal) OR azure_devops_pat"]
  tasks:
    - title: Validate Azure DevOps Access
      at: runbook.robot:19
      asserts: "The identity holds the PAT scopes / roles the project-health checks need, per a suite-setup preflight capability matrix"
      reads: ["preflight-check.sh: az devops project list, az pipelines pool list, az pipelines list, az repos list, az devops service-endpoint list"]
      permissions: ["PAT scopes: vso.project, vso.build (Build: Read), vso.code (Code: Read), vso.agentpools, vso.serviceendpoint (all Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Same preflight design as the organization bundle."
    - title: Check Agent Pool Availability Across Projects
      at: runbook.robot:38
      asserts: "Agent pools used by the projects have offline agents, no online capacity, or queued jobs aging beyond threshold (elastic/VMSS pools judged by online capacity)"
      reads: ["az pipelines pool list", "GET _apis/distributedtask/pools/<id>/agents and /jobrequests", "elastic pools API"]
      permissions: ["PAT scope vso.agentpools (Agent Pools: Read)"]
      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "agents-pool fetch is best-effort with a 'Fetch error' note (agent-pools.sh:~156) and elastic-pool detection degrades gracefully (_az_helpers.sh); pool list failure is rc-checked (:62-76)"
      notes: "Org-level resource examined from a project SLX; every project SLX repeats the same org-wide pool scan (MAX_POOLS 500)."
    - title: Check for Failed Pipelines Across Projects
      at: runbook.robot:87
      asserts: "Failed builds in the lookback window exist; for each, the log with the most lines is fetched and analysed for errors"
      reads: ["az devops invoke --area build --resource builds (project dataset)", "az devops invoke --area build --resource logs (list, then content)"]
      permissions: ["PAT scope vso.build (Build: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Loops AZURE_DEVOPS_PROJECTS in Robot. Per-log failures are issues (pipeline-logs.sh:95-110) but log-content fetch failure is skipped (:132-135) after the failed build itself has been reported."
    - title: Check for Long-Running Pipelines Across Projects
      at: runbook.robot:150
      asserts: "In-flight builds (sev 3) or completed builds (sev 2) whose duration exceeds DURATION_THRESHOLD minutes"
      reads: ["fetch_project_builds (az devops invoke builds)"]
      permissions: ["PAT scope vso.build (Build: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Build fetch failure is a sev-3 'Failed to Fetch Builds' issue + exit 1 (long-running-pipelines.sh:70-84)."
    - title: Check for Queued Pipelines Across Projects
      at: runbook.robot:202
      asserts: "Builds in notStarted state have waited longer than QUEUE_THRESHOLD minutes"
      reads: ["fetch_project_builds (az devops invoke builds)"]
      permissions: ["PAT scope vso.build (Build: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Same single-pass dataset and failure handling as long-running."
    - title: Check Repository Branch Policies Across Projects
      at: runbook.robot:254
      asserts: "Repositories (or default branches) lack enabled branch policies such as required reviewers or build validation; projects that deny repo access are reported as access-denied"
      reads: ["az devops project list", "az repos list --project", "az repos policy list --project"]
      permissions: ["PAT scope vso.code (Code: Read), vso.project (Project and Team: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "repo-policies.sh:121-124 a failed `az repos list` goes to access_denied_repos (reported) instead of being skipped. Uses az_with_retry."
    - title: Check Service Connection Health Across Projects
      at: runbook.robot:303
      asserts: "Service connections (service endpoints) are ready / not failing; endpoint list failure is an issue"
      reads: ["az devops service-endpoint list"]
      permissions: ["PAT scope vso.serviceendpoint (Service Connections: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "service-connections.sh:35-49 rc-checked. Reads connection metadata only; does not verify the credential behind a connection actually works."
    - title: Investigate Pipeline Performance Issues Across Projects
      at: runbook.robot:352
      asserts: "Per-definition average duration regressions or high variance from the recent build dataset; 'No Pipeline Activity Found' is itself a sev-2 finding"
      reads: ["fetch_project_builds (az devops invoke builds)"]
      permissions: ["PAT scope vso.build (Build: Read)"]
      scope: account
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Zero builds is reported (sev 2) rather than treated as healthy (pipeline-performance-analysis.sh:63-67)."
    - title: Investigate Failed Pipeline Runs with Commit Correlation Across Projects
      at: runbook.robot:406
      asserts: "Failed builds in the window correlated to the source commit and the last 5 commits on the branch to show what changed"
      reads: ["failed_builds from fetch_project_builds", "az repos commit show --commit-id", "az repos commit list --branch --top 5"]
      permissions: ["PAT scopes: vso.build, vso.code (Code: Read)"]
      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "pipeline-failure-investigation.sh:63-85 build fetch failure exits 1 (issue), but 'No Recent Failures' is emitted as a sev-1 finding and commit lookups (:111,:136) failing just drop the correlation"
      notes: "Emits a sev-1 'No Recent Failures' informational entry when there are none - a pass encoded as an issue."
    - title: Analyze Recent Repository Activity Across Projects
      at: runbook.robot:460
      asserts: "Recent commits, active PRs and branch policy state per repository; surfaces stale or risky repos"
      reads: ["az repos list", "az repos pr list --status active", "az repos policy list", "az repos commit list --repository --query date >= from_date"]
      permissions: ["PAT scope vso.code (Code: Read), vso.project"]
      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "repository-health-analysis.sh:79-88 `if az_with_retry az repos pr list ...; then` and per-repo commit list errors are skipped (stderr logged to commits_err.log); repo list failure is an issue (:49-61)"
      notes: "Informational digest."
  bundleNotes: "Newer-style bundle (preflight, single-pass build dataset shared across tasks, explicit 'No data' findings, SLI data_collection_ok). Same _az_helpers.sh as the organization bundle (identical or near-identical copy). Fan-out over AZURE_DEVOPS_PROJECTS (comma list, 'All' or empty -> auto-discover via discover-projects.sh; if that script's JSON is missing the Robot falls back to parsing its stdout lines as project names, which can inject junk names - runbook.robot:~690-705). Generation rule is per project but the inputs allow many projects per SLX."
- bundle: azure-devops-repository-health
