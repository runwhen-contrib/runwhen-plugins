      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "recent-changes-analysis.sh:241,270 tags and PR lookups are `if x=$(az ... 2>/dev/null); then` with no else; commits list stderr goes to a log (:88) - failure means no change findings"
      notes: "Loops AZURE_DEVOPS_REPOS (or auto-discovered list) in Robot. `az repos show` failure is an issue (:59-76)."
    - title: Analyze Pipeline Failures for Repositories
      at: runbook.robot:60
      asserts: "Pipelines tied to the repository show failed runs or low success rate in the lookback window; failure details per run"
      reads: ["az pipelines list --repository", "az pipelines runs list --pipeline-id --query finishTime >= from", "az pipelines runs show --id", "az pipelines runs list --result succeeded --top 1"]
      permissions: ["PAT scope vso.build (Build: Read)"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "pipeline-failure-analysis.sh:115,149,287 per-pipeline `if recent_runs=$(az pipelines runs list ... 2>/dev/null); then` has no else: a failed or forbidden runs query adds zero runs/failures; :96 zero pipelines is 'no pipelines' exit 0"
      notes: "The pipelines list itself (:59-76) is rc-checked."
    - title: Check Repository Security Configuration
      at: runbook.robot:102
      asserts: "Repository lacks enabled branch policies (required reviewers, build validation), permissions look overbroad, or sensitive files appear in the repo"
      reads: ["az repos show", "az repos policy list --repository-id", "az devops security permission list --id", "az repos list (for file checks)"]
      permissions: ["PAT scopes: vso.code (Code: Read), vso.security_manage (Security: Manage - needed for `az devops security permission list`)", "vso.project"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "repository-security-analysis.sh:94 `if branch_policies=$(az repos policy list ... 2>/dev/null); then` and :162 permissions list, :187 file list: no else branch for failure, so a denied policy read yields no 'missing branch policy' finding"
      notes: "Permission analysis is a stub ('simplified check', :165). `az repos list` used as 'files' check does not inspect files."
    - title: Analyze Code Quality for Repositories
      at: runbook.robot:144
      asserts: "Heuristic code-quality signals from build pass/fail history and ref activity (technical debt, maintainability)"
      reads: ["az repos show", "az repos list", "az repos ref list", "az pipelines list --repository", "az pipelines runs list --pipeline-id --top 10"]
      permissions: ["PAT scopes: vso.code, vso.build (Read)"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "code-quality-analysis.sh:81,85,108,134,184 every data read is `if x=$(az ... 2>/dev/null); then` with no else"
      notes: "Does not read source code or run linters; 'quality' is inferred from pipeline results and ref lists. Weak assertion; candidate to drop in V13."
    - title: Check Branch Management for Repositories
      at: runbook.robot:186
      asserts: "Stale branches, excessive branch count, and unprotected default branches"
      reads: ["az repos show", "az repos ref list --filter heads/", "az repos policy list --repository-id"]
      permissions: ["PAT scope vso.code (Code: Read)"]
      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "branch-management-analysis.sh:84-101 branch list is rc-checked (issue), but :286 policy list `2>/dev/null` inside `if` skips the protection check on failure"
      notes: ""
    - title: Analyze Pull Request and Collaboration Patterns for Repositories
      at: runbook.robot:228
      asserts: "PR review patterns: long-open PRs, PRs merged without reviewers, contributor concentration (bus factor)"
      reads: ["az repos show", "az repos pr list --status all", "az repos pr show --id"]
      permissions: ["PAT scope vso.code (Code: Read)"]
      scope: account
      readOnly: true
      falsePass: likely
      falsePassWhy: "collaboration-analysis.sh:79-96 PR list is rc-checked, but :185 per-PR detail `2>/dev/null` inside `if` is silently skipped"
      notes: "Process/engineering-health analysis rather than runtime health."
    - title: Investigate Critical Repository Issues
      at: runbook.robot:270
      asserts: "Combined critical findings: missing branch protection, risky permissions, stale activity, failing pipelines"
      reads: ["az repos show", "az repos policy list", "az devops security permission list", "az repos ref list", "az repos pr list --top 10", "az pipelines list --repository"]
      permissions: ["PAT scopes: vso.code, vso.build, vso.security_manage (Read)"]
      scope: account
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "critical-repository-investigation.sh:54,74,110,131,142,168 every az call is `if x=$(az ... 2>/dev/null); then`; repo-not-found only exits 1 at :66 after the repo lookup itself failed"
      notes: "Overlaps security, branch and pipeline tasks. Unused scripts in the dir: repository-performance-analysis.sh, security-incident-check.sh."
  bundleNotes: "Oldest-style Azure DevOps bundle: no preflight capability matrix, no data_collection score, and no SLI. Almost every sub-check is `if x=$(az ... 2>/dev/null); then ... fi` with no else, so permission gaps (very common with PATs) produce clean results. Contrast with azure-devops-organization-health / project-health, which added preflight and explicit unmeasurable handling."
- bundle: azure-kv-health
  displayName: Azure Key Vault Health
  classicResourceTypes: [azure_keyvault_keyvault]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource_group, subscription_id"
  sli: true
  sliAsserts: "mean of 6 binary scores (resource health, availability, configuration, expiring items, log issues, performance), each 1 when the issue count is 0; false-pass: confirmed - JSON load failure defaults to an empty list (score 1) in every sub-task (sli.robot:~30-33, 57, 84, 117, 141, 164) so a failed az call scores healthy"
  egress: "cloud API (ARM, Azure Monitor, Log Analytics) + Key Vault data plane (<vault>.vault.azure.net) for expiry listing"
  tools: [az, jq, bash]
  inputs: [AZURE_RESOURCE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, THRESHOLD_DAYS, "REQUEST_* performance thresholds/intervals", azure_credentials]
  tasks:
    - title: Check Key Vault Resource Health
      at: runbook.robot:19
      asserts: "Resource Health availabilityState of each Key Vault in the resource group is not degraded/unavailable"
      reads: ["az provider show/register Microsoft.ResourceHealth", "az keyvault list -g", "az rest GET .../Microsoft.KeyVault/vaults/<name>/providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.KeyVault/vaults/read", "Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/register/action (when unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: likely
      falsePassWhy: "kv_resource_health.sh:63 per-vault `az rest` failure drops that vault from keyvault_health.json (no rc handling); the Robot's JSON-load EXCEPT defaults to an empty list (not traced whether an empty list raises a 'health unavailable' issue as in sibling bundles)"
      notes: "Registers Microsoft.ResourceHealth if missing (write)."
    - title: Check Key Vault Availability
      at: runbook.robot:61
      asserts: "Azure Monitor 'Availability' metric (last hourly datapoint over 24h) is 100% for each Key Vault; below 100 raises sev 3"
      reads: ["az keyvault list -g", "az monitor metrics list --metric Availability --aggregation average --interval PT1H"]
      permissions: ["Microsoft.KeyVault/vaults/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "availability.sh:9 `for kv in $(az keyvault list ...)` - a failed list gives an empty loop and `{\"metrics\":[]}`; :11-19 metric failure leaves `availability` empty so `${availability:-\"N/A\"}`; runbook.robot:~84 skips 'N/A' and prints 'No Key Vault availability data found' (no issue). No set -e, no rc, stderr not captured"
      notes: "Only the LAST hourly point is evaluated, so a dip earlier in the 24h window is missed. `date -u -d` is GNU-only."
    - title: Check Key Vault Configuration
      at: runbook.robot:101
      asserts: "Each Key Vault has soft delete and purge protection enabled"
      reads: ["az keyvault list -g", "az keyvault show --name"]
      permissions: ["Microsoft.KeyVault/vaults/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "kv_config.sh:9,12 no rc checks; empty vault list -> `{\"keyVaults\":[]}`; failed `az keyvault show` -> jq yields empty then `${soft_delete:-\"null\"}` strings 'null' that the Robot may treat as unknown; JSON-load EXCEPT defaults to an empty dict"
      notes: "Soft delete is now always on for new vaults (enableSoftDelete may be null on newer API versions, which can read as misconfigured)."
    - title: Check Expiring Key Vault Items
      at: runbook.robot:155
      asserts: "Secrets, certificates and keys with an expiry within THRESHOLD_DAYS (or already expired)"
      reads: ["az keyvault list -g", "az keyvault secret list / show --query attributes.expires", "az keyvault certificate list / show", "az keyvault key list / show"]
      permissions: ["Microsoft.KeyVault/vaults/read", "Key Vault data plane: secrets/list, certificates/list, keys/list (access policy or RBAC 'Key Vault Reader' does NOT include data-plane list; needs e.g. Key Vault Secrets/Certificates/Crypto User or list permissions)"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Good pattern: list and per-item show failures become issues (sev 4) with the exact error (expiry-checks.sh:24,53,78,150,175,249). Reads metadata only, not secret values (--query attributes.expires). Vaults behind firewall/private link fail from the runner and are reported."
    - title: Check Key Vault Logs for Issues
      at: runbook.robot:200
      asserts: "Key Vault diagnostic logs in Log Analytics (AuditEvent failures) show errors above thresholds; no diagnostic settings is flagged"
      reads: ["az extension add log-analytics", "az keyvault list -g", "az monitor diagnostic-settings list --resource", "az monitor log-analytics workspace show", "az monitor log-analytics query"]
      permissions: ["Microsoft.KeyVault/vaults/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "kv list and workspace/query failures are issues (log.sh:36-55,120,146). Diagnostic-settings list uses `|| true` (:68) but an empty result is reported as not configured."
    - title: Check Key Vault Performance Metrics
      at: runbook.robot:241
      asserts: "ServiceApiHit request count and ServiceApiLatency exceed REQUEST_* thresholds"
      reads: ["az keyvault list -g (with properties)", "az monitor metrics list --metric ServiceApiHit / ServiceApiLatency"]
      permissions: ["Microsoft.KeyVault/vaults/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "performance_metrics.sh:135-160 metric calls have no rc check or stderr capture and no set -e; an empty value is echoed ('Request count for X: ') and compared as empty/zero (vault list itself is rc-checked at :61-84)"
      notes: "Only the last datapoint is used."
  bundleNotes: "Mixed quality: expiry-checks.sh and log.sh are rc-checked with explicit issues; availability.sh, kv_config.sh, performance_metrics.sh are bare loops with no error handling. The SLI re-runs the same scripts and treats parse failure as healthy. Key Vault data-plane permissions (list secrets/keys/certs) are separate from ARM Reader and are the usual cause of expiry-check issues."
- bundle: azure-loadbalancer-triage
  displayName: Azure Internal LoadBalancer Triage
  classicResourceTypes: [azure_network_load_balancers]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource, resource_group, subscription_id; no sli outputItem"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (Azure Monitor activity log)"
  tools: [az, jq, bash]
  inputs: [AZ_HISTORY_RANGE, AZ_LB_NAME, AZ_LB_ID, AZURE_RESOURCE_SUBSCRIPTION_ID, azure_credentials]
  tasks:
    - title: Check Activity Logs for Azure Load Balancer
      at: runbook.robot:17
      asserts: "The load balancer's activity log in the last AZ_HISTORY_RANGE hours contains the substring 'Critical' in any printed column (timestamp, status, substatus, details)"
      reads: ["az monitor activity-log list --resource-id <AZ_LB_ID> --start-time --end-time | jq | while read"]
      permissions: ["Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "runbook.robot:21 single-line pipeline `az monitor activity-log list ... | jq ... | while read` with no pipefail and rc ignored; empty stdout (including auth/permission failure) only produces the report text 'No activity log events could be pulled' (runbook.robot:23-25) and no issue"
      notes: "Documentation says it queries a health probe but it only reads the activity log. The `level` field is not among the printed columns, so 'Critical' only matches if it appears in properties.details; most critical events are missed. Uses GNU `date -d`. Requires AZ_LB_ID (full resource ID) as an input in addition to the name. Metadata says Supports Kubernetes/AKS (internal LB for a Service), but nothing is Kubernetes-specific."
  bundleNotes: "Smallest bundle in the group, a single inline command with no script file, and the weakest assertion. No health probe, backend pool or metrics checks despite the name."
- bundle: azure-servicebus-health
  displayName: Azure Service Bus Health
  classicResourceTypes: [azure_servicebus_namespaces]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource, resource_group, subscription_id; baseName az-servicebus-health"
  sli: true
  sliAsserts: "mean of 3 sub-scores: resource health (1 if Available else 0; empty record -> 0), connectivity (1 minus 0.5 per failed AMQP-5671 / HTTPS-443 TCP probe, minus 0.5 for DNS failure, probes run from the runner), critical metrics (1 minus 0.5 per sev-1 and 0.25 per sev-2 issue; sev 3-4 ignored). False-pass: likely - sev-3/4 findings and the abort-on-error path do not lower the score"
  egress: "cloud API (ARM, Azure Monitor, Log Analytics, Resource Health) + direct network probes to <namespace>.servicebus.windows.net (TCP 5671/443, nslookup, ping, curl) from the runner"
  tools: [az (servicebus extension commands), jq, nslookup, ping, curl, bash, timeout]
  inputs: [AZ_RESOURCE_GROUP, SB_NAMESPACE_NAME, AZURE_RESOURCE_SUBSCRIPTION_ID, "ACTIVE_M... (message/size threshold vars)", azure_credentials]
  tasks:
    - title: Check for Resource Health Issues Service Bus
      at: runbook.robot:16
      asserts: "Resource Health availabilityStatus of the namespace is not 'Available'; sev-4 if no record"
      reads: ["az provider show/register Microsoft.ResourceHealth", "az rest GET .../Microsoft.ServiceBus/namespaces/<name>/providers/Microsoft.ResourceHealth/availabilityStatuses/current"]
      permissions: ["Microsoft.ResourceHealth/availabilityStatuses/read", "Microsoft.Resources/subscriptions/providers/register/action (when unregistered)"]
      scope: resource-group
      readOnly: false
      falsePass: none
      falsePassWhy: ""
      notes: "Registers Microsoft.ResourceHealth if missing (write). set -euo pipefail: failures abort and write stderr, which the Robot turns into a sev-3 'Warnings/Errors running task.' issue."
    - title: Check Configuration Health for Service Bus
      at: runbook.robot:77
      asserts: "Namespace minimum TLS version is 1.2, a managed identity is assigned, zone redundancy is enabled (Premium), plus other recommendations"
      reads: ["az servicebus namespace show"]
      permissions: ["Microsoft.ServiceBus/namespaces/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Failure aborts via set -e; stderr raises the generic sev-3 issue. Findings are advisory configuration hygiene, not outage signals."
    - title: Check Metrics for Service Bus
      at: runbook.robot:131
      asserts: "Azure Monitor metrics for the namespace (server errors, throttled requests, active/dead-letter messages, size, CPU/memory for Premium) cross script thresholds"
      reads: ["az servicebus namespace show --query id", "az monitor metrics list --metric <list> --aggregation Total Average Maximum"]
      permissions: ["Microsoft.ServiceBus/namespaces/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "service_bus_metrics.sh:70-76 metrics list has no guard but set -e aborts; however empty/no-datapoint metrics (null totals) analyse as 0 so they cannot breach; a metric unsupported on a SKU is treated the same"
      notes: "SLI runs the same script and only counts sev 1/2."
    - title: Check Queue Health for Service Bus
      at: runbook.robot:190
      asserts: "Queues have status other than Active, large active or dead-letter message counts, near max size, or oldest message age issues"
      reads: ["az servicebus queue list", "az servicebus queue show (per queue)"]
      permissions: ["Microsoft.ServiceBus/namespaces/queues/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Unguarded `$(az servicebus queue list ...)` under set -euo pipefail: failure aborts with stderr -> generic sev-3 issue. Dead-letter counts come from the queue's countDetails (point-in-time)."
    - title: Check Topic Health for Service Bus
      at: runbook.robot:240
      asserts: "Topics and their subscriptions are Active, with bounded active/dead-letter message counts"
      reads: ["az servicebus topic list", "az servicebus topic show", "az servicebus topic subscription list / show"]
      permissions: ["Microsoft.ServiceBus/namespaces/topics/read", "Microsoft.ServiceBus/namespaces/topics/subscriptions/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Same abort-on-error pattern as queues."
    - title: Check Log Analytics for Service Bus
      at: runbook.robot:290
      asserts: "Log Analytics (OperationalLogs, RuntimeAuditLogs, errors) for the namespace contain errors or failed operations in the lookback window"
      reads: ["az servicebus namespace show --query id", "az monitor diagnostic-settings / log-analytics workspace show|list", "az monitor log-analytics query x3 (operations, requests, errors)"]
      permissions: ["Microsoft.ServiceBus/namespaces/read", "Microsoft.OperationalInsights/workspaces/read", "Microsoft.OperationalInsights/workspaces/query/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "service_bus_log_analytics.sh:119-138 each of three queries is `timeout 30 az monitor log-analytics query ... 2>/dev/null || echo \"[]\"`; a failed, forbidden or timed-out query yields an empty log set and no error finding"
      notes: "No workspace found exits 0 at :85 (reported as a finding or not not verified). Workspace discovery may fall back to any workspace in the subscription (:67-73)."
    - title: Check Capacity and Quota Headroom for Service Bus
      at: runbook.robot:340
      asserts: "Namespace throughput, entity size and connection counts are close to SKU quotas (queue/topic counts, size, messaging units)"
      reads: ["az servicebus namespace show", "az servicebus queue list", "az servicebus topic list", "az servicebus topic subscription list", "az monitor metrics list (throughput, size, connections)"]
      permissions: ["Microsoft.ServiceBus/namespaces/read", "Microsoft.ServiceBus/namespaces/queues/read", "Microsoft.ServiceBus/namespaces/topics/read", "Microsoft.ServiceBus/namespaces/topics/subscriptions/read", "Microsoft.Insights/metrics/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "service_bus_capacity.sh metrics reads (:103,:166,:179) feed utilization percentages; a missing metric is 0 percent (not traced beyond idiom); entity list failures abort with stderr"
      notes: "Quota limits are hard-coded in the script rather than read from Azure."
    - title: Check Geo-Disaster Recovery for Service Bus
      at: runbook.robot:390
      asserts: "Premium namespaces have a geo-recovery alias configured and healthy (sync state); Basic/Standard namespaces cannot (skipped)"
      reads: ["az servicebus namespace show", "az servicebus georecovery-alias list"]
      permissions: ["Microsoft.ServiceBus/namespaces/read", "Microsoft.ServiceBus/namespaces/disasterRecoveryConfigs/read"]
      scope: resource-group
      readOnly: true
      falsePass: likely
      falsePassWhy: "service_bus_disaster_recovery.sh:61-64 `az servicebus georecovery-alias list ... 2>/dev/null || echo \"[]\"` - a failed call reads as 'no DR configured' (likely a false positive 'no DR' finding rather than a pass)"
      notes: "Failure direction is false-positive for 'DR missing', but the health of an existing alias is unobservable on failure."
    - title: Check Security Configuration for Service Bus
      at: runbook.robot:440
      asserts: "SAS authorization rules (namespace, queue, topic) with Manage/Send+Listen rights on RootManageSharedAccessKey, excessive RBAC assignments, no managed identity"
      reads: ["az servicebus namespace authorization-rule list", "az servicebus queue|topic authorization-rule list", "az role assignment list --scope <namespace>", "az servicebus namespace show --query identity.type"]
      permissions: ["Microsoft.ServiceBus/namespaces/authorizationRules/read", "Microsoft.ServiceBus/namespaces/queues/authorizationRules/read", "Microsoft.ServiceBus/namespaces/topics/authorizationRules/read", "Microsoft.Authorization/roleAssignments/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Lists rule definitions, not keys (does not call listKeys). set -e aborts on failure."
    - title: Discover Related Resources for Service Bus
      at: runbook.robot:490
      asserts: "none - discovery of Event Grid subscriptions, private endpoints, Logic Apps, Web/Function apps, diagnostic settings and action groups related to the namespace"
      reads: ["az eventgrid event-subscription list", "az network private-endpoint list", "az logic workflow list", "az webapp list", "az functionapp list", "az monitor diagnostic-settings list", "az monitor action-group list"]
      permissions: ["Microsoft.EventGrid/eventSubscriptions/read", "Microsoft.Network/privateEndpoints/read", "Microsoft.Logic/workflows/read", "Microsoft.Web/sites/read", "Microsoft.Insights/diagnosticSettings/read", "Microsoft.Insights/actionGroups/read"]
      scope: subscription
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Informational. Heuristic matching by name/id; subscription-wide lists."
    - title: Test Connectivity to Service Bus
      at: runbook.robot:540
      asserts: "From the runner: TCP 5671 (AMQP) and 443 reach the namespace host, DNS resolves, HTTP endpoint responds; plus network rules and private endpoints listed"
      reads: ["az servicebus namespace show", "az servicebus namespace network-rule list", "az network private-endpoint list", "bash /dev/tcp probes to :5671 and :443", "nslookup", "ping -c 3", "curl"]
      permissions: ["Microsoft.ServiceBus/namespaces/read", "Microsoft.ServiceBus/namespaces/networkRuleSets/read", "Microsoft.Network/privateEndpoints/read", "network reachability from the runner"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Result is relative to the runner's network path, not to the application clients. Network-rule and private-endpoint lookups use `2>/dev/null || echo` (service_bus_connectivity_test.sh:61-70) but only add context. ping ICMP is blocked on Service Bus so that probe is uninformative."
    - title: Check Azure Monitor Alerts for Service Bus
      at: runbook.robot:590
      asserts: "Recommended metric alert rules (e.g. dead-letter, server errors, throttling, size) and action groups exist for the namespace"
      reads: ["az servicebus namespace show --query id", "az monitor metrics alert list -g", "az monitor action-group list"]
      permissions: ["Microsoft.ServiceBus/namespaces/read", "Microsoft.Insights/metricAlerts/read", "Microsoft.Insights/actionGroups/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "A failed alert list aborts (set -e) with stderr, not a 'no alerts' finding. Only metric alerts are checked (not activity-log or log-query alerts)."
  bundleNotes: "All scripts use set -euo pipefail with unguarded az calls; Robot's generic `stderr != ''` -> sev-3 'Warnings/Errors running task' catches aborts, so most failures surface (noisily). Exceptions are the `2>/dev/null || echo` fallbacks in log analytics, DR and connectivity. Many tasks are hygiene/recommendation checks (TLS, managed identity, alerts, DR) rather than health signals. generation-rules baseName is az-servicebus-health. Results are exchanged through fixed-name JSON files in cwd."
- bundle: azure-storage-cost-optimization
  displayName: Azure Storage Cost Optimization
  classicResourceTypes: [azure_compute_disks, azure_storage_accounts, azure_compute_snapshots]
  matchHints: "pattern .+ on name (substring); three resource types; level of detail basic; qualifiers subscription_id, resource_group"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (ARM, Azure Monitor, Resource Graph); may install az resource-graph extension at runtime (public internet)"
  tools: [az, jq, bc, awk, bash]
  inputs: [AZURE_SUBSCRIPTION_IDS, AZURE_RESOURCE_GROUPS, AZURE_SUBSCRIPTION_NAME, COST_ANALYSIS_LOOKBACK_DAYS, LOW_COST_THRESHOLD, MEDIUM_COST_THRESHOLD, HIGH_COST_THRESHOLD, AZURE_DISCOUNT_PERCENTAGE, SNAPSHOT_AGE_THRESHOLD_DAYS, SCAN_MODE, MAX_PARALLEL_JOBS, TIMEOUT_SECONDS, azure_credentials]
  tasks:
    - title: Analyze Azure Storage Cost Optimization Opportunities
      at: runbook.robot:18
      asserts: "Unattached managed disks, snapshots older than SNAPSHOT_AGE_THRESHOLD_DAYS, storage accounts without lifecycle management policy, GRS/RAGRS accounts that could be cheaper redundancy, and Premium disks with low IOPS utilization (each with estimated saving)"
      reads: ["az graph query (disks, snapshots, storage accounts)", "az disk list --query diskState=='Unattached'", "az snapshot list", "az storage account list", "az storage account management-policy show", "az storage account show", "az monitor metrics list (UsedCapacity, disk IOPS)", "az extension add resource-graph"]
      permissions: ["Microsoft.Compute/disks/read", "Microsoft.Compute/snapshots/read", "Microsoft.Storage/storageAccounts/read", "Microsoft.Storage/storageAccounts/managementPolicies/read", "Microsoft.Insights/metrics/read", "Microsoft.ResourceGraph/resources/read"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "analyze_storage_optimization.sh:592-593 `az disk list ... 2>/dev/null || echo '[]'` then :600 'No unattached disks found'; same pattern for storage account list (:1126-1129), snapshots, premium disks (:1443); library azure_performance_utils.sh:88 Resource Graph `|| echo '{\"data\":[]}'`"
      notes: "Inverse hazard: `az storage account management-policy show ... 2>/dev/null || echo '{\"policy\":null}'` (:934-938) means a failed/forbidden call reports 'no lifecycle policy' (false positive). Five independent analyses folded into one Robot task; in the V13 rewrite they are natural separate tasks. Metrics failures zero-fill."
  bundleNotes: "Single task, 77KB script (largest in group). Generation rule matches three resource types so one SLX per disk, per storage account, per snapshot though the script is subscription-wide."
- bundle: azure-subscription-cost-report
  displayName: Azure Subscription Cost Report
  classicResourceTypes: [azure_subscription_subscriptions]
  matchHints: "pattern .+ on name (substring) against subscription; level of detail basic; qualifiers subscription_id"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (Cost Management query, Advisor, Consumption reservationRecommendations)"
  tools: [az, jq, bc, bash]
  inputs: [AZURE_SUBSCRIPTION_IDS, AZURE_SUBSCRIPTION_NAME, COST_ANALYSIS_LOOKBACK_DAYS, COST_INCREASE_THRESHOLD, COST_BUDGET, COST_CONCENTRATION_THRESHOLD, TIMEOUT_SECONDS, azure_credentials]
  tasks:
    - title: Generate Azure Cost Report By Service and Resource Group
      at: runbook.robot:18
      asserts: "Spend over the lookback window versus the previous equal period rose by more than COST_INCREASE_THRESHOLD percent (also budget/concentration checks inside the script); otherwise just a cost report"
      reads: ["az rest POST https://management.azure.com/subscriptions/<id>/providers/Microsoft.CostManagement/query (current, previous, daily)", "az account show"]
      permissions: ["Microsoft.CostManagement/query/action", "Microsoft.Resources/subscriptions/read"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "azure_cost_historical_report.sh:78-84 az rest captured with `2>&1`, error text only logged (:150-157); :542-566 row_count 0 -> 'No cost data returned' and `return 1`; script ends `echo '[]' > $ISSUES_FILE; exit 0` (:860) -> runbook.robot:27-39 sees [] = no cost increase"
      notes: "A 403/429 from Cost Management (common: 429 throttling) is indistinguishable from 'no spend'. Date math uses GNU `date -d` with a BSD fallback. Reads `cat azure_cost_trend_issues.json` with no existence guard."
    - title: Analyze Azure Advisor Reserved Instance Recommendations
      at: runbook.robot:51
      asserts: "Azure Advisor or the Consumption reservationRecommendations API proposes Reserved Instance purchases with total monthly savings above a minimum threshold"
      reads: ["az advisor recommendation list --category Cost", "az rest GET .../providers/Microsoft.Consumption/reservationRecommendations"]
      permissions: ["Microsoft.Advisor/recommendations/read", "Microsoft.Consumption/reservationRecommendations/read"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "azure_advisor_reservation_recommendations.sh:59-72,95-98 az advisor/az rest `2>/dev/null` with empty output -> 'No Advisor cost recommendations found' and `continue`; runbook.robot:61 `cat azure_advisor_ri_issues.json 2>/dev/null || echo \"[]\"`"
      notes: "Output is an opportunity (savings), not a fault; absence of recommendations is normal, so a failed call is indistinguishable from 'nothing to buy'. bc `|| echo 0` fallbacks at :217-221."
  bundleNotes: "Two tasks. Subscription-scope; if AZURE_SUBSCRIPTION_IDS is unset the script exits 1 before writing the issues file."
- bundle: azure-vm-cost-optimization
  displayName: Azure VM Cost Optimization
  classicResourceTypes: [azure_compute_virtual_machines]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers subscription_id, resource_group"
  sli: false
  sliAsserts: "no sli.robot"
  egress: "cloud API (ARM, Azure Monitor, Resource Graph)"
  tools: [az, jq, bc, awk, bash]
  inputs: [AZURE_SUBSCRIPTION_IDS, AZURE_RESOURCE_GROUPS, AZURE_SUBSCRIPTION_NAME, COST_ANALYSIS_LOOKBACK_DAYS, LOW_COST_THRESHOLD, MEDIUM_COST_THRESHOLD, HIGH_COST_THRESHOLD, AZURE_DISCOUNT_PERCENTAGE, TIMEOUT_SECONDS, azure_credentials]
  tasks:
    - title: Analyze Virtual Machine Rightsizing and Deallocation Opportunities
      at: runbook.robot:18
      asserts: "A VM is stopped but not deallocated (still billed), or is oversized (low avg/max CPU and memory over the lookback window) and could move to a smaller or B-series size; issue carries monthly saving"
      reads: ["az graph query (VMs) or az vm list -d", "az vm get-instance-view", "az monitor metrics list 'Percentage CPU' 'Available Memory Bytes'"]
      permissions: ["Microsoft.Compute/virtualMachines/read", "Microsoft.Compute/virtualMachines/instanceView/read", "Microsoft.Insights/metrics/read", "Microsoft.ResourceGraph/resources/read"]
      scope: subscription
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "analyze_vm_optimization.sh:383,388 `az vm list -d ... 2>/dev/null || echo '[]'`; runbook.robot:48 `cat issues.json ... else echo \"[]\"` and :102-103 'All VMs appear to be properly deallocated and sized'; library azure_performance_utils.sh:88 Resource Graph `|| echo '{\"data\":[]}'`"
      notes: "Power state falls back to `|| echo \"Unknown\"` (:500-502) which then matches neither the stopped nor sized branches. Metrics call `|| echo '{\"value\":[]}'` (:228-235) with awk default 0 -> failed metrics look like 0% CPU, i.e. oversize false positive; memory metric needs AMA/VM Insights (silently absent otherwise). Prices come from a built-in table (get_azure_vm_cost)."
  bundleNotes: "Single task, 46KB script. Runbook is the only cost bundle that guards a missing issues file with `echo \"[]\"`, turning a crashed script into a clean pass."
- bundle: azure-vm-os-health
  displayName: Azure VM OS Health
  classicResourceTypes: [azure_compute_virtual_machines]
  matchHints: "pattern .+ on name (substring); level of detail detailed; qualifiers subscription_id, resource_group"
  sli: true
  sliAsserts: "mean of 4 binary scores (disk, memory, uptime, patch), each 1 only if no VM reported errors/connection failures/threshold issues; 0 on complete Azure auth failure. False-pass: confirmed - when `az vm list` fails or returns no VMs the scripts print `{}` and exit 0, giving issue_count 0 -> score 1"
  egress: "cloud API (ARM Compute; run-command executes inside the guest) - in-guest apt-get update / yum check-update use the VM's own internet"
  tools: [az, jq, timeout, bash, python3 (Robot-side Create File)]
  inputs: [AZ_RESOURCE_GROUP, AZURE_RESOURCE_SUBSCRIPTION_ID, AZURE_SUBSCRIPTION_NAME, DISK_THRESHOLD, UPTIME_THRESHOLD, MEMORY_THRESHOLD, MAX_PARALLEL_JOBS, TIMEOUT_SECONDS, VM_INCLUDE_LIST, VM_OMIT_LIST, azure_credentials]
  tasks:
    - title: Check Disk Utilization for VMs
      at: runbook.robot:21
      asserts: "A running Linux VM has a filesystem above DISK_THRESHOLD percent used (from `df -h` run inside the guest); non-running VMs, connection failures and timeouts are sev 3-4; any stderr from the guest command is sev 1"
      reads: ["az vm list -g", "az vm get-instance-view (power state)", "az vm run-command invoke --command-id RunShellScript --scripts 'df -h'"]
      permissions: ["Microsoft.Compute/virtualMachines/read", "Microsoft.Compute/virtualMachines/instanceView/read", "Microsoft.Compute/virtualMachines/runCommand/action (executes a shell script as root inside each VM)"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vm_disk_utilization.sh:24-30 `vms=$(az vm list ... 2>/dev/null)`; on failure or zero VMs it prints `{}` and exit 0, so the Robot loops over zero VMs and raises nothing (runbook.robot ~line 36 empty dict)"
      notes: "run-command is remote code execution on the guest even though the commands are read-only; it needs the VM agent, serialises per VM (slow) and can be blocked by policy. Windows VMs are skipped with a sev-4 issue each (an issue for something expected). Per-VM failures (VMNotRunning sev 3, ConnectionError/CommandTimeout/InvalidResponse sev 4) are surfaced, so the hole is the listing step. A VM stopped by design raises an issue."
    - title: Check Memory Utilization for VMs
      at: runbook.robot:212
      asserts: "A running Linux VM's memory used percentage from `free -m` exceeds MEMORY_THRESHOLD"
      reads: ["az vm list -g", "az vm get-instance-view", "az vm run-command invoke --scripts 'free -m'"]
      permissions: ["Microsoft.Compute/virtualMachines/read", "Microsoft.Compute/virtualMachines/instanceView/read", "Microsoft.Compute/virtualMachines/runCommand/action"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vm_memory_check.sh:23-29 same `az vm list ... 2>/dev/null` -> `{}` exit 0 pattern"
      notes: "Same structure and caveats as disk. Computes percent from `free -m` 'used' which includes cache on some distros."
    - title: Check Uptime for VMs
      at: runbook.robot:329
      asserts: "A running Linux VM's uptime exceeds UPTIME_THRESHOLD days (kernel patching/reboot hygiene)"
      reads: ["az vm list -g", "az vm get-instance-view", "az vm run-command invoke --scripts '<uptime script>'"]
      permissions: ["Microsoft.Compute/virtualMachines/read", "Microsoft.Compute/virtualMachines/instanceView/read", "Microsoft.Compute/virtualMachines/runCommand/action"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vm_uptime_check.sh:23-29 same `az vm list ... 2>/dev/null` -> `{}` exit 0 pattern; :116 the in-guest script ends `2>/dev/null`"
      notes: "Not a fault signal on its own; long uptime is a hygiene finding."
    - title: Check Last Patch Status for VMs
      at: runbook.robot:446
      asserts: "A running Linux VM has pending package updates (apt/yum/dnf) above the patch threshold or has not been patched recently"
      reads: ["az vm list -g", "az vm get-instance-view", "az vm run-command invoke --scripts 'apt-get update; apt list --upgradable | yum check-update | dnf check-update'"]
      permissions: ["Microsoft.Compute/virtualMachines/read", "Microsoft.Compute/virtualMachines/instanceView/read", "Microsoft.Compute/virtualMachines/runCommand/action"]
      scope: resource-group
      readOnly: false
      falsePass: confirmed
      falsePassWhy: "vm_last_patch_check.sh:23-28 az vm list swallow (as above); in-guest :105 `apt-get update -qq 2>/dev/null` failing (no egress) leaves a stale index so :106 reports 'System is up to date'; :120 `yum check-update -q 2>/dev/null | wc -l` a failure counts 0 -> 'up to date'"
      notes: "readOnly false because `apt-get update` refreshes the package index on the VM (a write inside the guest, root). Requires VM outbound access to package mirrors."
  bundleNotes: "Pattern: one subscription-level az login check (rc-checked), then a bounded-parallel per-VM `az vm run-command invoke`. Per-VM failures are classified into codes (VMNotRunning, ConnectionError, CommandTimeout, InvalidResponse, WindowsVM, NotIncluded, Omitted) and surfaced; the listing step and the in-guest `2>/dev/null` are the holes. Generation rule is detailed, qualifiers subscription_id+resource_group (so one SLX per resource group per matching VM resource; inputs are RG-wide, not per VM). The Robot also shells out to next_steps_*.sh with temp files per VM. A V13 skill must declare run-command as an execute-in-guest capability."
- bundle: azure-vmss-triage
  displayName: Azure VM Scale Set Triage
  classicResourceTypes: [azure_compute_virtual_machine_scale_sets]
  matchHints: "pattern .+ on name (substring); level of detail basic; qualifiers resource, resource_group"
  sli: true
  sliAsserts: "single binary score from vmss_metrics.sh exit code (0 = pass, 1 = a sample over the CPU limit 80% or under the memory floor); false-pass: confirmed - missing data or a failed `az monitor metrics list` prints 'No maximum field...' and still exits 0, scoring 1"
  egress: "cloud API (ARM, Azure Monitor)"
  tools: [az, jq, bc, bash]
  inputs: [AZ_RESOURCE_GROUP, VMSCALESET, RW_LOOKBACK_WINDOW, AZURE_RESOURCE_SUBSCRIPTION_ID, azure_credentials]
  tasks:
    - title: Check Scale Set Key Metrics
      at: runbook.robot:18
      asserts: "Any 5-minute max 'Percentage CPU' sample (top METRIC_TOP) is above ALLOWED_CPU=80, or any min available-memory sample is below the ALLOWED_MEM floor"
      reads: ["az monitor metrics list --resource <vmss> --resource-type Microsoft.Compute/virtualMachineScaleSets --metric 'Percentage CPU' --aggregation maximum", "az monitor metrics list --metric <memory metric> --aggregation minimum"]
      permissions: ["Microsoft.Insights/metrics/read", "Microsoft.Compute/virtualMachineScaleSets/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vmss_metrics.sh:34-35 metrics list has no rc check; :38 `echo \"$cpu_data\" | jq -e '...maximum'` on empty/error output fails -> :53 prints \"No 'maximum' field available\" and ok stays 0 -> exit 0 (:74); runbook.robot:28 only raises an issue when returncode > 0"
      notes: "Thresholds ALLOWED_CPU=80 and METRIC_TOP are hard-coded in the script (not inputs). Only samples !=null and !=0.0 are considered, so an all-zero (idle or broken) series passes. `--top` limits dimension values, not time. Memory metric needs VMSS guest metrics/agent."
    - title: Fetch VM Scale Set Config
      at: runbook.robot:40
      asserts: "none - report only: dumps `az vmss show` output"
      reads: ["az vmss show --name --resource-group"]
      permissions: ["Microsoft.Compute/virtualMachineScaleSets/read"]
      scope: resource-group
      readOnly: true
      falsePass: none
      falsePassWhy: ""
      notes: "Asserts nothing; failure is not detected by the Robot. vmss_config.sh has unquoted variables and no error handling."
    - title: Fetch Activities for VM Scale Set
      at: runbook.robot:50
      asserts: "Activity log entries at level Critical/Error/Warning exist for the scale set in the lookback window"
      reads: ["az vmss show --query id", "az monitor activity-log list --resource-id (table, then per level as JSON piped to jq)"]
      permissions: ["Microsoft.Compute/virtualMachineScaleSets/read", "Microsoft.Insights/eventtypes/management/values/read"]
      scope: resource-group
      readOnly: true
      falsePass: confirmed
      falsePassWhy: "vmss_activities.sh:45 `az vmss show` has no rc check; :64 `az monitor activity-log list ... | jq -c` has no pipefail, so a failed list becomes an empty array; runbook.robot:61-64 reads ${OUTPUT DIR}/issues.json and raises only for issues in it"
      notes: "Same template as azure-aks-triage aks_activities.sh. Reads `${OUTPUT DIR}/issues.json` (with a space in the variable name) while the script removes/writes `issues.json` in cwd."
  bundleNotes: "Oldest-style bundle, authored for the early template: no set -e, unquoted shell variables, one rc-based SLI. The runbook never classifies auth or permission failures."
