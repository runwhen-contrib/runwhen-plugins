name: plugins

on:
  pull_request:
  push:
    branches: [main, "v13/**"]

permissions:
  contents: read

env:
  # The runwhen-capability SDK (rwtask) the plugins are validated and replayed with. The
  # repo variable overrides the pin; bump the pin with the SDK the plugins target.
  SDK_REF: ${{ vars.SDK_REF || 'd05a5791ab452f5302648c9023163b4a7fd84e4c' }}

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          plugins="$(python3 ci/changed_plugins.py | jq -R . | jq -sc .)"
          echo "plugins=${plugins}" >> "$GITHUB_OUTPUT"
          echo "changed plugins: ${plugins}"

  plugin:
    needs: changed
    if: needs.changed.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rwtask
        if: env.SDK_REF != ''
        run: pip install "runwhen-capability @ git+https://github.com/runwhen-contrib/runwhen-capability@${SDK_REF}"
      - name: Unit tests
        run: |
          set -euo pipefail
          if [ -d "plugins/${{ matrix.plugin }}/tests/unit" ]; then
            pip install pytest pyyaml jsonschema
            python -m pytest "plugins/${{ matrix.plugin }}/tests/unit" -q
          fi
      - name: Validate
        if: env.SDK_REF != ''
        run: rwtask validate "plugins/${{ matrix.plugin }}"
      - name: Integration registers through papi's pack validator
        if: env.SDK_REF != ''
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          rwtask compile "plugins/${{ matrix.plugin }}" --out "$out"
          python3 ci/papi_register_check.py "$out"/*.compiled.json
      - name: Test (replay recorded fixtures)
        if: env.SDK_REF != ''
        run: |
          set -euo pipefail
          for skill in plugins/${{ matrix.plugin }}/skills/*/; do
            [ -d "$skill" ] || continue
            rwtask test "$(basename "$skill")" --plugin-dir "plugins/${{ matrix.plugin }}"
          done
      - name: SDK not pinned
        if: env.SDK_REF == ''
        run: echo "::notice::vars.SDK_REF is unset; skipping rwtask validate/test for ${{ matrix.plugin }}"

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest ci/tests porting/tools/tests -q
