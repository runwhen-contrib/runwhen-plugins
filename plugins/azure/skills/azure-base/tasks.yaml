apiVersion: runwhen.com/tasks/v1
runtime: azure@1              # ships az (runtimes/azure)
defaults: { credentials: azure/cli, timeout: 60s }
settings:
  maxItems: { type: integer, default: 200, min: 1, max: 10000, description: "Most entries a list output returns; the total and the number left out are reported beside it" }
  commandTimeout: { type: duration, default: 60s, description: "How long one az command may run before it is stopped (timeout)" }
tasks:
  - name: discover
    title: Discover groups, Key Vaults, AKS clusters, plans and web apps
    description: Reads the subscription (id, name, tenant, state), lists its resource groups and, group by group, their Key Vaults, AKS clusters, App Service plans and web apps (function apps included), as facts and as an rw.discovery.v1 sync (subscription -> resource group -> Key Vault | AKS cluster | App Service plan | web app; one partition per group and type, so a group whose listing of a type cannot be read is reported and not swept). Reports the subscription id as the root's canonical key. Read-only.
    script: scripts/discover.py
    tags: [discovery, inventory]
    readOnly: true
    timeout: 600s                                  # the az calls and the push; the push is clamped to what is left (azure_base/budget.py)
    credentials: [azure/cli, runwhen/sync]         # runwhen/sync is platform-minted per run by the lease, not a connection
    permissions:
      - { action: Microsoft.Resources/subscriptions/resourceGroups/read }  # az group list
      - { action: Microsoft.KeyVault/vaults/read }  # az keyvault list -g <group>, once per resource group
      - { action: Microsoft.ContainerService/managedClusters/read }  # az aks list -g <group>, once per resource group
      - { action: Microsoft.Web/serverfarms/read }  # az appservice plan list -g <group>
      - { action: Microsoft.Web/sites/read }        # az webapp list -g <group> and az functionapp list -g <group>
    outputs:
      summary: { kind: rw.discovery.summary.v1, description: "Counts, partitions, per-step errors and root.canonicalKey (subscriptionId)" }
      subscription: { schema: ./schemas/subscription.v1.json, description: "Subscription id, name, tenant and state" }
      resourceGroups: { schema: ./schemas/resourcegroups.v1.json, description: "Name, location, id and the count of Key Vaults, AKS clusters, App Service plans and web apps of each resource group, cut to maxItems" }
      keyvaults: { schema: ./schemas/keyvaults.v1.json, description: "Name, resource group, location and id of each Key Vault, cut to maxItems" }
      aksClusters: { schema: ./schemas/aksclusters.v1.json, description: "Name, resource group, location and id of each AKS cluster, cut to maxItems" }
      appServicePlans: { schema: ./schemas/appserviceplans.v1.json, description: "Name, resource group, location, id, kind and SKU of each App Service plan, cut to maxItems" }
      webApps: { schema: ./schemas/webapps.v1.json, description: "Name, resource group, location, id, kind and state of each web app and function app, cut to maxItems" }
      sync: { artifact: { contentType: application/json, maxSize: 20Mi }, description: "The whole rw.discovery.v1 sync (open, item batches, commit) for this subscription, its resource groups and their Key Vaults, AKS clusters, App Service plans and web apps" }
