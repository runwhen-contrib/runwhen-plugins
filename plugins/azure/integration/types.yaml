# Azure = subscription -> resource group -> the resources a skill targets (D51). The resource group
# is a type because it is part of every resource's address: without `-g` az searches the whole
# subscription for the group (a Microsoft.Resources read the task would have to declare and the
# identity be granted), while `-g` scopes the call, and its permission, to the group. A skill's
# target is subscriptions/<id>/resourcegroups/<group>/<plural>/<name>.
#
# The group's name is lower case in the identity: ARM compares group names without case (a vault's id
# may spell the group differently from `az group list`), so `RG-Prod` and `rg-prod` must be one node.
# The name as ARM spells it is the item's display name.
types:
  # canonicalKey: the subscription id. It is the same whichever identity reaches the subscription
  # (a service principal, a managed identity), so a second connection to it is the same root.
  subscription: { root: true, rootKey: subscriptionId, canonicalKey: subscriptionId, plural: subscriptions }
  resourcegroup: { parent: subscription, plural: resourcegroups, native: { provider: Microsoft.Resources, type: resourceGroups } }
  keyvault: { parent: resourcegroup, plural: keyvaults, native: { provider: Microsoft.KeyVault, type: vaults } }
  aks-cluster: { parent: resourcegroup, plural: aks-clusters, native: { provider: Microsoft.ContainerService, type: managedClusters } }
  app-service-plan: { parent: resourcegroup, plural: app-service-plans, native: { provider: Microsoft.Web, type: serverFarms } }
  # a function app is a web app whose kind contains functionapp (it is one Microsoft.Web/sites resource)
  web-app: { parent: resourcegroup, plural: web-apps, native: { provider: Microsoft.Web, type: sites } }
