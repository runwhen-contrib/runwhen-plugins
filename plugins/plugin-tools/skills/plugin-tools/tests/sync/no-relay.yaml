# `rwtask test` gives the task no runner relay, so a valid request stops at the upload seam with a
# `dependency` error before any git call. (The listing, filtering, upload and manifest logic is
# covered by the pytest suite in plugins/plugin-tools/tests/unit, which runs a real git repo and a
# fake relay.)
inputs:
  source: { id: acme, url: "https://git.example.com/acme/plugins.git" }
calls: []
expect:
  status: failed
  errorCodes: [dependency]
