# Recorded by `rwtask test --record`. Review it before committing: `calls` holds what the
# tools printed. `expect.outputs` is left for you to add -- `outputs: {name: value}` is a
# subset match (a dict by key, a list or a scalar whole; `{$contains: [..]}` and
# `{$containsWhere: {..}}` look inside a list). `expect.artifacts` does the same for
# artifact files. `rwtask test` replays this file.
resource: postgres/instances/orders-db
inputs:
  minDuration: 10s
settings:
  includeQueryText: true
now: '2026-11-03T23:02:37.106Z'
calls:
- argv:
  - psql
  - -X
  - -A
  - -t
  - -q
  - -v
  - ON_ERROR_STOP=1
  - -c
  - |-
    BEGIN READ ONLY; SET LOCAL statement_timeout = 30000; WITH cfg AS (
      SELECT (current_setting('is_superuser') = 'on'
               OR pg_has_role(current_user, 'pg_read_all_stats', 'USAGE')) AS full_view
    ), hidden AS (
      SELECT count(*) AS n
      FROM pg_stat_activity a CROSS JOIN cfg
      WHERE a.pid <> pg_backend_pid()
        AND (a.backend_type = 'client backend'
             OR (a.backend_type IS NULL AND a.datname IS NOT NULL AND a.usename IS NOT NULL))
        AND NOT (cfg.full_view OR coalesce(pg_has_role(current_user, a.usesysid, 'USAGE'), false))
    ), cand AS (
      SELECT a.pid, a.datname, a.usename, a.application_name, host(a.client_addr) AS client_addr,
             a.state, a.backend_type, a.wait_event_type, a.wait_event,
             to_jsonb(a) ->> 'query_id' AS query_id,
             CASE WHEN a.state = 'active' THEN 'active' ELSE 'idleInTransaction' END AS kind,
             CASE WHEN a.state = 'active' THEN now() - a.query_start
                  ELSE now() - a.state_change END AS dur,
             now() - a.xact_start AS xact_age,
             left(a.query, 8192) AS query,
             (octet_length(a.query) >= (SELECT setting::int FROM pg_settings
                                        WHERE name = 'track_activity_query_size') - 4)
               AS query_cut_by_server
      FROM pg_stat_activity a
      WHERE a.pid <> pg_backend_pid()
        AND a.backend_type <> 'walsender'
        AND a.state IN ('active', 'idle in transaction', 'idle in transaction (aborted)')
    ), hits AS (
      SELECT * FROM cand WHERE dur > interval '1 millisecond' * 10000
    ), lk AS MATERIALIZED (
      SELECT pid, locktype, granted, database, relation, page, tuple, virtualxid, transactionid,
             classid, objid, objsubid, virtualtransaction
      FROM pg_locks
    ), prep AS (
      SELECT p.gid, p.prepared, p.owner::text AS owner, p.database::text AS database,
             t.virtualtransaction AS vxid
      FROM pg_prepared_xacts p
      JOIN lk t ON t.pid IS NULL AND t.granted AND t.locktype = 'transactionid'
               AND t.transactionid = p.transaction
    )
    SELECT json_build_object(
      'fullView', (SELECT full_view FROM cfg),
      'hiddenSessions', (SELECT n FROM hidden),
      'total', (SELECT count(*) FROM hits),
      'items', (SELECT coalesce(json_agg(json_build_object(
          'pid', pid,
          'database', datname,
          'user', usename,
          'applicationName', application_name,
          'clientAddr', client_addr,
          'state', state,
          'kind', kind,
          'durationMs', (extract(epoch FROM dur) * 1000)::bigint,
          'xactAgeMs', (extract(epoch FROM xact_age) * 1000)::bigint,
          'waitEventType', wait_event_type,
          'waitEvent', wait_event,
          'backendType', backend_type,
          'queryId', query_id,
          'blockedBy', to_json(bp.pids[1:50]),
          'blockedByTruncated', cardinality(bp.pids) > 50,
          'preparedTransactions', CASE WHEN 0 = ANY(bp.pids) THEN coalesce((
              SELECT json_agg(json_build_object(
                  'gid', x.gid,
                  'prepared', floor(extract(epoch FROM clock_timestamp() - x.prepared) * 1000)::bigint,
                  'owner', x.owner,
                  'database', x.database
                ) ORDER BY x.prepared, x.gid)
              FROM (SELECT DISTINCT pr.gid, pr.prepared, pr.owner, pr.database
                    FROM lk w
                    JOIN lk hl ON hl.pid IS NULL AND hl.granted AND hl.locktype = w.locktype
                             AND hl.database IS NOT DISTINCT FROM w.database
                             AND hl.relation IS NOT DISTINCT FROM w.relation
                             AND hl.page IS NOT DISTINCT FROM w.page
                             AND hl.tuple IS NOT DISTINCT FROM w.tuple
                             AND hl.virtualxid IS NOT DISTINCT FROM w.virtualxid
                             AND hl.transactionid IS NOT DISTINCT FROM w.transactionid
                             AND hl.classid IS NOT DISTINCT FROM w.classid
                             AND hl.objid IS NOT DISTINCT FROM w.objid
                             AND hl.objsubid IS NOT DISTINCT FROM w.objsubid
                    JOIN prep pr ON pr.vxid = hl.virtualtransaction
                    WHERE w.pid = h.pid AND NOT w.granted
                    LIMIT 50) x), '[]'::json) ELSE '[]'::json END,
          'query', left(query_norm, 1024),
          'queryTruncated', (char_length(query_norm) > 1024 OR char_length(query) >= 8192
                             OR query_cut_by_server)
        ) ORDER BY dur DESC, pid), '[]'::json)
        FROM (SELECT t.*, substr(regexp_replace(regexp_replace(regexp_replace(regexp_replace(regexp_replace(regexp_replace(regexp_replace((' ' || t.query), '\$(?:[A-Za-z_\u0080-\U0010FFFF][A-Za-z0-9_\u0080-\U0010FFFF]*)?\$.*$', '?', 'g'), '("(?:[^"]|"")*")|/\*(?:(?:[^*/]|\*(?!/)|/(?!\*))|/\*(?:(?:[^*/]|\*(?!/)|/(?!\*))|/\*(?:[^*/]|\*(?!/)|/(?!\*))*\*/)*\*/)*\*/|--[^\n]*|(?<![A-Za-z0-9_$])[eE]''(?:[^''\\]|\\.|'''')*''(?!'')|(?<![^A-Za-z0-9_$][eE])''(?:[^'']|'''')*''(?!'')', '\1?', 'g'), '(")\?', '\1', 'g'), '("(?:[^"]|"")*")|''.*$|/\*.*$|"[^"]*$', '\1?', 'g'), '(")\?', '\1', 'g'), '("(?:[^"]|"")*")|(?<![A-Za-z0-9_$])(?:0[xX][0-9a-fA-F_]+|0[oO][0-7_]+|0[bB][01_]+|(?:[0-9][0-9_]*(?:\.[0-9_]*)?|\.[0-9][0-9_]*)(?:[eE][+-]?[0-9]+)?)', '\1?', 'g'), '(")\?', '\1', 'g'), 2) AS query_norm
          FROM (SELECT * FROM hits ORDER BY dur DESC, pid LIMIT 200) t) h CROSS JOIN LATERAL (SELECT pg_blocking_pids(h.pid) AS pids) bp)
    ); COMMIT;
  rc: 0
  stdout: |
    {"fullView" : true, "hiddenSessions" : 0, "total" : 2, "items" : [{"pid" : 2001, "database" : "orders", "user" : "rw_monitor", "applicationName" : "rw-fixture-sessions", "clientAddr" : "127.0.0.1", "state" : "idle in transaction", "kind" : "idleInTransaction", "durationMs" : 13429, "xactAgeMs" : 13429, "waitEventType" : "Client", "waitEvent" : "ClientRead", "backendType" : "client backend", "queryId" : null, "blockedBy" : [], "blockedByTruncated" : false, "preparedTransactions" : [], "query" : "select ?;", "queryTruncated" : false}, {"pid" : 2008, "database" : "orders", "user" : "rw_monitor", "applicationName" : "rw-fixture-sessions", "clientAddr" : "127.0.0.1", "state" : "active", "kind" : "active", "durationMs" : 13370, "xactAgeMs" : 13370, "waitEventType" : "Timeout", "waitEvent" : "PgSleep", "backendType" : "client backend", "queryId" : null, "blockedBy" : [], "blockedByTruncated" : false, "preparedTransactions" : [], "query" : "select pg_sleep(?), ? as marker, ? as n", "queryTruncated" : false}]}
  stderr: ''
expect:
  status: ok
  errorCodes: []
  outputs:
    longRunning:
      visibility: full
      queryTextIncluded: true
      items:
        $contains:
        - {kind: idleInTransaction, query: 'select ?;', queryTruncated: false}
        - {kind: active, query: 'select pg_sleep(?), ? as marker, ? as n', queryTruncated: false}
