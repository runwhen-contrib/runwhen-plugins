# Recorded by `rwtask test --record`. Review it before committing: `calls` holds what the
# tools printed. `expect.outputs` is left for you to add -- `outputs: {name: value}` is a
# subset match (a dict by key, a list or a scalar whole; `{$contains: [..]}` and
# `{$containsWhere: {..}}` look inside a list). `expect.artifacts` does the same for
# artifact files. `rwtask test` replays this file.
resource: postgres/instances/orders-db
inputs:
  rules:
  - role: pg_monitor
  - database: '*'
    privilege: CONNECT
  - database: postgres
    privilege: CONNECT
  - database: orders
    privilege: CONNECT
  - function: pg_catalog.pg_control_system
    privilege: EXECUTE
  - table: orders
now: '2026-11-03T22:05:45.282Z'
calls:
- argv:
  - psql
  - -X
  - -A
  - -t
  - -q
  - -v
  - ON_ERROR_STOP=1
  - -c
  - |-
    BEGIN READ ONLY; SET LOCAL statement_timeout = 30000; SELECT json_build_object(
      'user', current_user::text,
      'superuser', current_setting('is_superuser') = 'on',
      'databases', (
        SELECT coalesce(json_agg(json_build_object(
          'name', d.datname,
          'template', d.datistemplate,
          'allowConn', d.datallowconn,
          'CONNECT', has_database_privilege(d.oid, 'CONNECT'),
          'CREATE', has_database_privilege(d.oid, 'CREATE'),
          'TEMPORARY', has_database_privilege(d.oid, 'TEMPORARY')
        ) ORDER BY d.datname), '[]'::json)
        FROM pg_database d),
      'roles', (
        SELECT coalesce(json_agg(json_build_object(
          'role', q.r,
          'exists', q.oid IS NOT NULL,
          'usage', coalesce(pg_has_role(current_user, q.oid, 'USAGE'), false),
          'member', coalesce(pg_has_role(current_user, q.oid, 'MEMBER'), false)
        ) ORDER BY q.r), '[]'::json)
        FROM (
          SELECT r, (SELECT oid FROM pg_roles WHERE rolname = r) AS oid
          FROM unnest(ARRAY[$q0$pg_monitor$q0$]::text[]) AS r) q),
      'functions', (
        SELECT coalesce(json_agg(json_build_object(
          'function', f,
          'overloads', (
            SELECT coalesce(json_agg(json_build_object(
              'signature', p.proname || '(' || oidvectortypes(p.proargtypes) || ')',
              'execute', has_function_privilege(p.oid, 'EXECUTE')
            ) ORDER BY p.proname, oidvectortypes(p.proargtypes)), '[]'::json)
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname || '.' || p.proname = f)
        ) ORDER BY f), '[]'::json)
        FROM unnest(ARRAY[$q0$pg_catalog.pg_control_system$q0$]::text[]) AS f)
    ); COMMIT;
  rc: 0
  stdout: |
    {"user" : "rw_noperm", "superuser" : false, "databases" : [{"name" : "orders", "template" : false, "allowConn" : true, "CONNECT" : false, "CREATE" : false, "TEMPORARY" : true}, {"name" : "postgres", "template" : false, "allowConn" : true, "CONNECT" : true, "CREATE" : false, "TEMPORARY" : true}, {"name" : "template0", "template" : true, "allowConn" : false, "CONNECT" : true, "CREATE" : false, "TEMPORARY" : false}, {"name" : "template1", "template" : true, "allowConn" : true, "CONNECT" : true, "CREATE" : false, "TEMPORARY" : false}], "roles" : [{"role" : "pg_monitor", "exists" : true, "usage" : false, "member" : false}], "functions" : [{"function" : "pg_catalog.pg_control_system", "overloads" : [{"signature" : "pg_control_system()", "execute" : true}]}]}
  stderr: ''
- argv:
  - psql
  - -X
  - -A
  - -t
  - -q
  - -v
  - ON_ERROR_STOP=1
  - -c
  - BEGIN READ ONLY; SET LOCAL statement_timeout = 30000; SELECT json_build_object('systemIdentifier',
    system_identifier::text) FROM pg_control_system(); COMMIT;
  rc: 0
  stdout: |
    {"systemIdentifier" : "7704060091270770728"}
  stderr: ''
expect:
  status: ok
  errorCodes: []
  outputs:
    access:
      root:
        canonicalKey:
          name: systemIdentifier
          value: '7704060091270770728'
      rules:
        $contains:
        - {rule: {role: pg_monitor}, verdict: denied}
        - {rule: {database: '*', privilege: CONNECT}, verdict: partial, scope: [postgres]}
        - {rule: {database: postgres, privilege: CONNECT}, verdict: granted}
        - {rule: {database: orders, privilege: CONNECT}, verdict: denied}
        - {rule: {function: pg_catalog.pg_control_system, privilege: EXECUTE}, verdict: granted}
        - {rule: {table: orders}, verdict: unverified}
