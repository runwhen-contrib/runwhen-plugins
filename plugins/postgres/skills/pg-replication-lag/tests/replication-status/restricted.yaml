# Recorded by `rwtask test --record`. Review it before committing: `calls` holds what the
# tools printed. `expect.outputs` is left for you to add -- `outputs: {name: value}` is a
# subset match (a dict by key, a list or a scalar whole; `{$contains: [..]}` and
# `{$containsWhere: {..}}` look inside a list). `expect.artifacts` does the same for
# artifact files. `rwtask test` replays this file.
resource: postgres/instances/orders-db
now: '2026-11-03T21:42:09.202Z'
calls:
- argv:
  - psql
  - -X
  - -A
  - -t
  - -q
  - -v
  - ON_ERROR_STOP=1
  - -c
  - SET statement_timeout = 30000; SET default_transaction_read_only = on
  - -c
  - |-
    SELECT json_build_object(
      'inRecovery', pg_is_in_recovery(),
      'fullView', pg_has_role(current_user, 'pg_read_all_stats', 'USAGE'),
      'database', current_database()
    )
  rc: 0
  stdout: |
    {"inRecovery" : false, "fullView" : false, "database" : "postgres"}
  stderr: ''
- argv:
  - psql
  - -X
  - -A
  - -t
  - -q
  - -v
  - ON_ERROR_STOP=1
  - -c
  - SET statement_timeout = 30000; SET default_transaction_read_only = on
  - -c
  - |-
    SELECT json_build_object(
      'currentLsn', pg_current_wal_lsn()::text,
      'replicas', coalesce((SELECT json_agg(json_build_object(
          'pid', r.pid,
          'usename', r.usename::text,
          'applicationName', r.application_name,
          'clientAddr', host(r.client_addr),
          'state', r.state,
          'syncState', r.sync_state,
          'writeLagMs', floor(extract(epoch FROM r.write_lag) * 1000)::bigint,
          'flushLagMs', floor(extract(epoch FROM r.flush_lag) * 1000)::bigint,
          'replayLagMs', floor(extract(epoch FROM r.replay_lag) * 1000)::bigint,
          'sentLsnBytes', pg_wal_lsn_diff(pg_current_wal_lsn(), r.sent_lsn)::bigint,
          'writeLsnBytes', pg_wal_lsn_diff(pg_current_wal_lsn(), r.write_lsn)::bigint,
          'flushLsnBytes', pg_wal_lsn_diff(pg_current_wal_lsn(), r.flush_lsn)::bigint,
          'replayLsnBytes', pg_wal_lsn_diff(pg_current_wal_lsn(), r.replay_lsn)::bigint
        ) ORDER BY r.application_name, r.pid) FROM pg_stat_replication r), '[]'::json),
      'slots', coalesce((SELECT json_agg(json_build_object(
          'slotName', s.slot_name::text,
          'slotType', s.slot_type,
          'database', s.database::text,
          'active', s.active,
          'activePid', s.active_pid,
          'walStatus', s.wal_status,
          'retainedWalBytes', pg_wal_lsn_diff(pg_current_wal_lsn(), s.restart_lsn)::bigint,
          'safeWalSize', s.safe_wal_size
        ) ORDER BY s.slot_name) FROM pg_replication_slots s), '[]'::json)
    )
  rc: 0
  stdout: |
    {"currentLsn" : "0/3188F10", "replicas" : [{"pid" : 114, "usename" : "rw_replicator", "applicationName" : "walreceiver", "clientAddr" : null, "state" : null, "syncState" : null, "writeLagMs" : null, "flushLagMs" : null, "replayLagMs" : null, "sentLsnBytes" : null, "writeLsnBytes" : null, "flushLsnBytes" : null, "replayLsnBytes" : null}], "slots" : [{"slotName" : "rw_standby", "slotType" : "physical", "database" : null, "active" : true, "activePid" : 114, "walStatus" : "reserved", "retainedWalBytes" : 0, "safeWalSize" : null}]}
  stderr: ''
expect:
  status: partial
  errorCodes:
  - permission_denied
  outputs:
    replication:
      role: primary
      visibility: partial
      primary:
        replicas:
          total: 1
          items:
            $contains:
            - {applicationName: walreceiver, state: null, syncState: null, replayLsnBytes: null}
        slots:
          items:
            $contains:
            - {slotName: rw_standby, active: true}
