apiVersion: runwhen.com/tasks/v1
runtime: kubernetes@1
defaults:
  credentials: kubernetes/kubeconfig
  timeout: 60s
settings:
  maxItems:
    type: integer
    default: 200
    description: Most entries any list output returns
tasks:
  - name: reinit-member
    title: Reinitialise a Patroni member
    description: >-
      Runs patronictl reinit <cluster> <member> --force inside a member pod: the
      member's data directory is wiped and re-cloned from the leader. The member
      must be a member of the Patroni cluster and must not be the leader (refused
      as invalid_input). The Patroni cluster name is read from patronictl list, not
      guessed. Reinit only starts the re-clone: the result reports the member's
      state read once afterwards, it does not wait. A dry run does every check and
      runs nothing.
    script: scripts/reinit_member.py
    tags: [postgres, patroni, reinit, replica]
    readOnly: false
    destructive: true
    idempotent: false
    dryRun: true
    timeout: 180s
    effects:
      - "Stops Postgres on the member, deletes its data directory and re-clones it from the leader (pg_basebackup or the configured replica-creation method); the member is not a usable replica until that finishes, which takes as long as the database is large."
      - "The re-clone reads the whole database from the leader or from a backup repository, adding load to it."
      - "Data on the member that was not on the leader is lost; the leader's copy is untouched. With synchronous replication the cluster may stall writes if this member was the only synchronous standby."
    permissions:
      - { apiGroups: [postgres-operator.crunchydata.com], resources: [postgresclusters], verbs: [get] }
      - { apiGroups: [acid.zalan.do], resources: [postgresqls], verbs: [get] }
      - { apiGroups: [""], resources: [pods], verbs: [get, list] }
      - { apiGroups: [""], resources: [pods/exec], verbs: [create, get] }
    inputs:
      member: { type: string, description: "The Patroni member to reinitialise (its name in patronictl list, normally the pod name); not the leader" }
    outputs:
      target: { schema: ./schemas/target.v1.json, description: "The cluster object acted on, its Patroni cluster name and whether GitOps manages it" }
      reinit: { schema: ./schemas/reinit.v1.json, description: "The member, its state before and after, and the command run" }

  - name: switchover
    title: Switchover or failover
    description: >-
      Moves leadership to another member. With a healthy leader (role Leader, state
      running) it runs patronictl switchover <cluster> --force, with --candidate
      when the candidate input is given; Patroni picks the replica otherwise. With
      no leader, or one that is not running, it runs patronictl failover <cluster>
      --candidate <member> --force: failover needs a candidate, so without the input
      the running replica with the least known lag is chosen (candidateChosenBy
      auto). A candidate must be another member that is running or streaming. Reads
      patronictl list afterwards for up to the timeout input and reports the leader
      before and after. A dry run does every check and runs nothing.
    script: scripts/switchover.py
    tags: [postgres, patroni, switchover, failover, leader]
    readOnly: false
    destructive: true
    idempotent: false
    dryRun: true
    timeout: 300s
    effects:
      - "Demotes the current leader (a switchover restarts it as a replica) and promotes another member: connections to the old leader are dropped and writes fail for the seconds it takes (longer if the replica has to catch up)."
      - "A failover promotes a replica without the old leader: transactions the replica had not yet received are lost, and the old leader has to be rewound or reinitialised when it returns."
      - "Starts a new Postgres timeline; clients that connect to a fixed pod instead of the cluster's primary service stay on the old leader."
    permissions:
      - { apiGroups: [postgres-operator.crunchydata.com], resources: [postgresclusters], verbs: [get] }
      - { apiGroups: [acid.zalan.do], resources: [postgresqls], verbs: [get] }
      - { apiGroups: [""], resources: [pods], verbs: [get, list] }
      - { apiGroups: [""], resources: [pods/exec], verbs: [create, get] }
    inputs:
      candidate: { type: string, required: false, description: "The member to promote; it must be running or streaming and not the leader. Omitted: Patroni chooses for a switchover, the least-lagging running replica for a failover" }
      timeout: { type: duration, default: 60s, description: "How long to read patronictl list for the new leader (0s to 240s; 0s does not wait). Running out of time is reported as completed false, not as a failure" }
    outputs:
      target: { schema: ./schemas/target.v1.json, description: "The cluster object acted on, its Patroni cluster name and whether GitOps manages it" }
      switchover: { schema: ./schemas/switchover.v1.json, description: "Mode, leader before and after, the candidate and the command run" }

  - name: rolling-restart
    title: Rolling restart of the cluster
    description: >-
      Restarts every member. Crunchy PostgresCluster: sets
      spec.metadata.annotations["postgres-operator.crunchydata.com/restarted"] to the
      run's reference time with a merge patch (a server-side dry run for a dry run);
      the operator then rolls the instance pods. Zalando postgresql: runs patronictl
      restart <cluster> --force in a member pod, which restarts Postgres on every
      member in turn. Then reports whether all members were back to running within
      the timeout input: Crunchy needs as many pods as the spec asks for, each Ready
      and restarted at or after the request; Zalando needs every Patroni member
      running or streaming. Running out of time is completed false, not a failure.
    script: scripts/rolling_restart.py
    tags: [postgres, patroni, restart, rolling]
    readOnly: false
    destructive: false
    idempotent: false
    dryRun: true
    timeout: 300s
    effects:
      - "Restarts Postgres on every member, one after the other with the leader last (Crunchy replaces the instance pods; Zalando restarts the Postgres process in place): each member's connections are dropped while it restarts, and the leader's restart interrupts writes."
      - "Crunchy: sets the annotation postgres-operator.crunchydata.com/restarted on the PostgresCluster spec and on its pod templates; every run changes its value, and a GitOps controller managing the object may report drift."
      - "Applies pending Postgres settings that need a restart, and for Crunchy any pod template change the operator had not yet rolled."
    permissions:
      - { apiGroups: [postgres-operator.crunchydata.com], resources: [postgresclusters], verbs: [get, patch] }
      - { apiGroups: [acid.zalan.do], resources: [postgresqls], verbs: [get] }
      - { apiGroups: [""], resources: [pods], verbs: [get, list] }
      - { apiGroups: [""], resources: [pods/exec], verbs: [create, get] }
    inputs:
      timeout: { type: duration, default: 120s, description: "How long to wait for every member to be back (0s to 240s; 0s does not wait). Running out of time is reported as completed false, not as a failure" }
    outputs:
      target: { schema: ./schemas/target.v1.json, description: "The cluster object acted on, its Patroni cluster name (Zalando) and whether GitOps manages it" }
      restart: { schema: ./schemas/restart.v1.json, description: "How the restart was requested and whether all members were back within the timeout" }
