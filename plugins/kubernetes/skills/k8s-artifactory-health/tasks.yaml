apiVersion: runwhen.com/tasks/v1
runtime: kubernetes@1
defaults:
  credentials: kubernetes/kubeconfig
  timeout: 60s
settings:
  maxItems:
    type: integer
    default: 200
    description: Most pods and Services the health output lists
tasks:
  - name: health
    title: Artifactory health
    description: >-
      Per running pod of the workload and per Service selecting its pods, through the API server's
      proxy (no exec, no credential): Artifactory's liveness and readiness
      (/artifactory/api/v1/system/, port http-internal, else 8081) and, on the router port (http,
      else 8082), the router's health document and its own liveness and readiness
      (/router/api/v1/system/, the chart's probes). Liveness and readiness answer 200 with the
      text OK or JSON whose code is OK, or 503 (ok false); any other 200 is an error, never ok. A
      pod's liveness or readiness 404 is ok false with a reason; when every endpoint of every pod
      is 404 the task fails with not_found (check the port input); on a Service a 404 is served
      false. 401 or 403 means credentials are needed, never sent: authRequired with a
      permission_denied error, skipped when everything answered so. A Service is asked on the port
      that targets the pod's. Pods not Running are listed, not asked; replicas wanted with none
      Running is an unreachable error. Inputs port, routerPort, scheme.
    script: scripts/health.py
    timeout: 120s
    tags: [artifactory, liveness, readiness, router, health]
    readOnly: true
    inputs:
      port: { type: integer, required: false, min: 1, max: 65535, description: "Artifactory port for liveness and readiness; by default the pod's container port named http-internal, else 8081" }
      routerPort: { type: integer, required: false, min: 1, max: 65535, description: "Router port for /router/api/v1/system/health; by default the pod's container port named http, else 8082" }
      scheme: { type: string, default: http, description: "http or https" }
    permissions:
      - { apiGroups: [apps], resources: [statefulsets, deployments], verbs: [get] }
      - { apiGroups: [""], resources: [pods, services], verbs: [list] }
      - { apiGroups: [""], resources: [pods/proxy, services/proxy], verbs: [get] }
    outputs:
      health: { schema: ./schemas/health.v1.json, description: "Per pod and per Service: the liveness, readiness, router health, router liveness and router readiness answers (HTTP status, ok, served, authRequired) and the workload's replica counts" }
