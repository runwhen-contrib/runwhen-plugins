# Recorded by `rwtask test --record`. Review it before committing: `calls` holds what the
# tools printed. `expect.outputs` is left for you to add -- `outputs: {name: value}` is a
# subset match (a dict by key, a list or a scalar whole); `rwtask test` replays this file.
resource: kubernetes/clusters/kind
inputs:
  command: get pods -n rw-broken
calls:
- argv:
  - kubectl
  - get
  - pods
  - --namespace=rw-broken
  rc: 1
  stdout: ''
  stderr: |
    Error from server (Forbidden): pods is forbidden: User "system:serviceaccount:rw-healthy:rw-viewer" cannot list resource "pods" in API group "" in the namespace "rw-broken"
expect:
  status: failed
  errorCodes:
  - permission_denied
