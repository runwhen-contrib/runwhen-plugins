# Recorded by `rwtask test --record`. Review it before committing: `calls` holds what the
# tools printed. `expect.outputs` is left for you to add -- `outputs: {name: value}` is a
# subset match (a dict by key, a list or a scalar whole; `{$contains: [..]}` and
# `{$containsWhere: {..}}` look inside a list). `expect.artifacts` does the same for
# artifact files. `rwtask test` replays this file.
resource: kubernetes/clusters/kind
inputs:
  command: get pod forbidden-app -n rw-healthy
calls:
- argv:
  - kubectl
  - get
  - pod
  - forbidden-app
  - --namespace=rw-healthy
  rc: 1
  stdout: ''
  stderr: |
    Error from server (NotFound): pods "forbidden-app" not found
expect:
  status: failed
  errorCodes:
  - not_found
