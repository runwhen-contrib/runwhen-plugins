apiVersion: runwhen.com/tasks/v1
runtime: kubernetes@1
defaults:
  credentials: kubernetes/kubeconfig
  timeout: 60s
settings:
  maxItems:
    type: integer
    default: 200
    description: Most entries any list output returns (most relevant first)
  stuckMinutes:
    type: number
    default: 15
    description: A NodeClaim older than this many minutes without Ready=True (and not being deleted) has stuck true in nodeclaims
  limitWarningPercent:
    type: number
    default: 90
    description: A NodePool resource at this percent of its limit or more has atOrAbove true in nodepool-status
tasks:
  - name: nodepool-status
    title: NodePool status
    description: >-
      The NodePool's Ready condition and every other condition with reason and
      message, weight, consolidation policy and consolidateAfter, expireAfter, its
      disruption budgets, how much of each spec.limits entry status.resources has
      used (cpu, memory, nodes, ...: percent, atOrAbove against the
      limitWarningPercent setting, exhausted), and the NodeClass it refers to:
      whether it exists and is Ready (EC2NodeClass, AKSNodeClass and GCENodeClass are
      read). A NodeClass of another group or kind is not looked up: lookedUp is
      false with no error. NodeClasses are cluster-scoped; when reading one is
      forbidden the pool facts are still returned, the NodeClass exists and ready are
      null and a permission_denied error says why.
    script: scripts/nodepool_status.py
    tags: [nodepool, karpenter, conditions, limits, disruption, nodeclass]
    readOnly: true
    permissions:
      - { apiGroups: [karpenter.sh], resources: [nodepools], verbs: [get] }
      - { apiGroups: [karpenter.k8s.aws], resources: [ec2nodeclasses], verbs: [get] }
      - { apiGroups: [karpenter.azure.com], resources: [aksnodeclasses], verbs: [get] }
      - { apiGroups: [karpenter.k8s.gcp], resources: [gcenodeclasses], verbs: [get] }
    outputs:
      pool: { schema: ./schemas/pool.v1.json, description: "Conditions, weight, disruption policy and budgets, expireAfter and the NodeClass reference" }
      limits: { schema: ./schemas/limits.v1.json, description: "Each limited or reported resource: limit, used, percent, atOrAbove, exhausted" }
      nodeClass: { schema: ./schemas/node-class.v1.json, description: "The referenced NodeClass: whether it exists and is Ready; lookedUp false for an unknown group or kind" }

  - name: nodeclaims
    title: NodeClaims
    description: >-
      The NodeClaims of the pool (label karpenter.sh/nodepool, and owned by this
      pool when they name an owner): phase from the Launched, Registered,
      Initialized and Ready conditions (Launching, Registering, Initializing, Ready,
      NotReady or Deleting), age, notReadySeconds and stuck (not Ready for longer than
      the stuckMinutes setting: counted from creation for a claim that never became
      Ready, from the Ready condition's last transition for one that went not Ready
      later), the Drifted, Empty and Consolidatable conditions, node name, capacity
      type, instance type and zone; stuck claims first. Counts per phase and capacity
      type cover every claim, not just the ones listed. NodeClaims are cluster-scoped
      and listing them needs a ClusterRole; when it is forbidden the task fails.
    script: scripts/nodeclaims.py
    tags: [nodeclaim, karpenter, provisioning, stuck]
    readOnly: true
    permissions:
      - { apiGroups: [karpenter.sh], resources: [nodepools], verbs: [get] }
      - { apiGroups: [karpenter.sh], resources: [nodeclaims], verbs: [list] }
    outputs:
      nodeClaims: { schema: ./schemas/nodeclaims.v1.json, description: "The pool's NodeClaims with phase, age, stuck, conditions, node and instance facts, stuck first" }
      counts: { schema: ./schemas/claim-counts.v1.json, description: "Totals before the maxItems cap: ready, notReady, stuck, deleting, drifted, per phase and per capacity type" }

  - name: pending-pods
    title: Pending pods this pool could serve
    description: >-
      Pending pods in every namespace with PodScheduled False, reason Unschedulable,
      whose karpenter.sh/nodepool constraint (nodeSelector or required node affinity)
      allows this pool or is absent: those that select it (nodeSelector, or an In
      requirement) first, then oldest first. Age, the scheduler's message, effective
      requested cpu and memory, owner. DaemonSet-owned pods and pods pinned to a node by
      name (matchFields metadata.name) are only counted (daemonSetPods, pinnedToNode).
      Counts split pending pods by whether they select this pool, have another kind of
      constraint (NotIn, Exists), are unconstrained or select another pool. Events of
      reason FailedScheduling, Nominated and FailedProvisioning within the since window
      are grouped per listed pod and reason; events is null (not []) when not read: no
      pod listed, or listing them forbidden (permission_denied; the pods are kept).
      Cluster-wide reads. Taints and tolerations are not evaluated.
    script: scripts/pending_pods.py
    timeout: 120s
    tags: [pending, unschedulable, karpenter, provisioning, capacity]
    readOnly: true
    permissions:
      - { apiGroups: [karpenter.sh], resources: [nodepools], verbs: [get] }
      - { apiGroups: [""], resources: [pods], verbs: [list] }
      - { apiGroups: [""], resources: [events], verbs: [list] }
    inputs:
      since: { type: duration, default: 1h, description: "Look-back window, applied to when each event was last seen" }
    outputs:
      pods: { schema: ./schemas/pending-pods.v1.json, description: "Unschedulable pods this pool could serve, selecting pods first, oldest first" }
      counts: { schema: ./schemas/pending-counts.v1.json, description: "Pending, unschedulable, DaemonSet and node-pinned pods, and the pods selecting this pool, otherwise constrained, unconstrained or selecting another pool, before the maxItems cap" }
      events: { schema: ./schemas/pending-events.v1.json, description: "Events on the listed pods grouped per pod and reason; null when not read (no pod listed, or forbidden)" }
