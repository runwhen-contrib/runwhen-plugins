# Recorded by `rwtask test --record`. Review it before committing: `calls` holds what the
# tools printed. `expect.outputs` is left for you to add -- `outputs: {name: value}` is a
# subset match (a dict by key, a list or a scalar whole); `rwtask test` replays this file.
resource: kubernetes/clusters/kind/namespaces/rw-certs/certificates/failed-cert
calls:
- argv:
  - kubectl
  - -n
  - rw-certs
  - get
  - certificates.cert-manager.io
  - failed-cert
  - -o
  - json
  rc: 1
  stdout: ''
  stderr: |
    Error from server (Forbidden): certificates.cert-manager.io "failed-cert" is forbidden: User "system:serviceaccount:rw-healthy:rw-viewer" cannot get resource "certificates" in API group "cert-manager.io" in the namespace "rw-certs"
expect:
  status: failed
  errorCodes:
  - permission_denied
