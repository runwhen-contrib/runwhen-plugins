apiVersion: runwhen.com/tasks/v1
runtime: kubernetes@1
defaults:
  credentials: kubernetes/kubeconfig
  timeout: 60s
settings:
  maxItems:
    type: integer
    default: 200
    description: Most entries any list output returns
tasks:
  - name: ready-status
    title: Flux object readiness
    description: >-
      Whether the Flux HelmRelease or Kustomization is Ready, Reconciling or
      Stalled, each with its reason and message; whether it is suspended; whether
      the controller has seen the latest spec (observedGeneration against
      generation); the last applied against the last attempted revision (for a
      HelmRelease from status.lastAppliedRevision, else the newest deployed entry
      of status.history, with the chart name and version and the release
      history; for a Kustomization the source and path); and for each object in
      dependsOn whether it exists and is Ready. A dependency in another namespace
      is listed unread with a note. It does not read the chart repository, so it
      cannot say whether a newer chart exists.
    script: scripts/ready_status.py
    tags: [flux, gitops, ready, revision, dependencies]
    readOnly: true
    permissions:
      - { apiGroups: [helm.toolkit.fluxcd.io], resources: [helmreleases], verbs: [get] }
      - { apiGroups: [kustomize.toolkit.fluxcd.io], resources: [kustomizations], verbs: [get] }
    outputs:
      state: { schema: ./schemas/state.v1.json, description: "Ready/Reconciling/Stalled with reasons, suspended, observedGeneration against generation, all conditions" }
      revisions: { schema: ./schemas/revisions.v1.json, description: "Last applied against last attempted revision, last handled reconcile, chart or source details" }
      dependencies: { schema: ./schemas/dependencies.v1.json, description: "dependsOn entries and whether each is Ready; entries outside the target's namespace are unread" }

  - name: reconcile
    title: Request a reconcile
    description: >-
      Asks the Flux controller to reconcile the object now by setting the
      annotation reconcile.fluxcd.io/requestedAt to the current time (what flux
      reconcile does; the source is not reconciled first). Then waits up to the
      timeout input for status.lastHandledReconcileAt to show the controller
      handled that request, and reports completed true or false with the object's
      Ready condition and revisions as last read. Handled is not succeeded: read
      after.ready. Running out of time is completed false, not a failure; a
      timeout of 0s sends the request and does not wait. A suspended object is
      refused, since Flux ignores the request until it is resumed. A dry run
      sends the identical annotate as a server-side dry run and does not wait.
    script: scripts/reconcile.py
    tags: [flux, gitops, reconcile]
    readOnly: false
    destructive: false
    idempotent: true
    dryRun: true
    timeout: 300s
    effects:
      - "Sets the annotation reconcile.fluxcd.io/requestedAt on the Flux object to the current time, which makes the controller reconcile it now instead of at its next interval."
      - "The reconcile applies whatever the source holds at that moment: a chart upgrade, manifests or drift correction for the objects this one manages, including changes in git that were not looked at yet."
      - "The annotation stays on the object; repeating the task only changes its value."
    permissions:
      - { apiGroups: [helm.toolkit.fluxcd.io], resources: [helmreleases], verbs: [get, patch] }
      - { apiGroups: [kustomize.toolkit.fluxcd.io], resources: [kustomizations], verbs: [get, patch] }
    inputs:
      timeout: { type: duration, default: 60s, description: "How long to wait for the controller to handle the request (0s to 240s; 0s does not wait). Running out of time is reported as completed false, not as a failure" }
    outputs:
      target: { schema: ./schemas/target.v1.json, description: "The object acted on and the Flux object that manages it, if any" }
      reconcile: { schema: ./schemas/reconcile.v1.json, description: "The request, whether the controller handled it within the timeout, and the object as last read" }

  - name: suspend
    title: Suspend reconciliation
    description: >-
      Sets spec.suspend to true so the Flux controller stops reconciling the
      object (no drift correction, no new revision applied) until it is resumed.
      What is already running stays as it is. Nothing is sent when it is already
      suspended. A dry run sends the identical patch as a server-side dry run.
    script: scripts/suspend.py
    tags: [flux, gitops, suspend]
    readOnly: false
    destructive: false
    idempotent: true
    dryRun: true
    effects:
      - "Sets spec.suspend to true: GitOps stops reconciling the object, so nothing in git is applied to the cluster and drift is not corrected until it is resumed."
      - "Releases, workloads and other objects the Flux object already applied are left in place; they are not removed or rolled back."
      - "A Flux Kustomization or HelmRelease that manages this object (target.managedBy) may set spec.suspend back to its value in git on its next reconcile."
    permissions:
      - { apiGroups: [helm.toolkit.fluxcd.io], resources: [helmreleases], verbs: [get, patch] }
      - { apiGroups: [kustomize.toolkit.fluxcd.io], resources: [kustomizations], verbs: [get, patch] }
    outputs:
      target: { schema: ./schemas/target.v1.json, description: "The object acted on and the Flux object that manages it, if any" }
      suspension: { schema: ./schemas/suspension.v1.json, description: "spec.suspend before and after" }

  - name: resume
    title: Resume reconciliation
    description: >-
      Sets spec.suspend to false so the Flux controller starts reconciling the
      object again. Nothing is sent when it is not suspended. A dry run sends the
      identical patch as a server-side dry run. Run ready-status afterwards, or
      reconcile to apply the current state at once.
    script: scripts/resume.py
    tags: [flux, gitops, resume]
    readOnly: false
    destructive: false
    idempotent: true
    dryRun: true
    effects:
      - "Sets spec.suspend to false: GitOps starts reconciling the object again, so the controller reconciles it at once and then at each interval."
      - "Everything the source gained while it was suspended (new commits, a new chart version, edits made in git) is applied on that reconcile, including changes that nobody reviewed during the pause."
      - "Changes made to the live objects by hand while it was suspended are overwritten with what git holds."
    permissions:
      - { apiGroups: [helm.toolkit.fluxcd.io], resources: [helmreleases], verbs: [get, patch] }
      - { apiGroups: [kustomize.toolkit.fluxcd.io], resources: [kustomizations], verbs: [get, patch] }
    outputs:
      target: { schema: ./schemas/target.v1.json, description: "The object acted on and the Flux object that manages it, if any" }
      suspension: { schema: ./schemas/suspension.v1.json, description: "spec.suspend before and after" }
