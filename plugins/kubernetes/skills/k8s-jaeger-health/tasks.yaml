apiVersion: runwhen.com/tasks/v1
runtime: kubernetes@1
defaults:
  credentials: kubernetes/kubeconfig
  timeout: 60s
settings:
  maxItems:
    type: integer
    default: 50
    description: Most services the task queries (the rest are counted in servicesNotQueried and not asked). The 100 second budget covers about 50 services in the first pass, so a larger value only helps a fast Jaeger
  statusCodes:
    type: "integer[]"
    default: [400, 401, 403, 404, 429]
    description: HTTP status codes searched for by exact match in the second pass, 400 to 599. 5xx server spans are found by the first pass (error=true) whatever their code, so the default lists only 4xx codes, which OpenTelemetry does not mark as errors. Jaeger's tag search is exact, so each code is one query per status attribute key per service; a 4xx code that is not listed is only counted if a returned trace happens to carry it. Add 408 or 410 where those matter
tasks:
  - name: http-errors
    title: HTTP errors in traces
    description: >-
      Per Jaeger service (or the services input), the spans in the last `since` (default 1h) with
      an HTTP status of 400 or more, counted per operation with status codes, URL paths (ids and
      query removed) and sample trace IDs; outbound (span.kind client) errors apart. Read through
      the API server's pod proxy (no exec, no port-forward, no Secret). Pass 1 asks every service
      for the tag error=true (OpenTelemetry flags 5xx server spans whatever the code); pass 2 asks
      each 4xx code in statusCodes (exact match) on both status attributes. Every status from 400
      to 599 in a returned trace counts; 4xx only for the listed codes. limitReached means a lower
      bound; complete false means the budget cut the service off. Not JSON is an error.
    script: scripts/http_errors.py
    timeout: 120s
    tags: [jaeger, tracing, http, errors]
    readOnly: true
    inputs:
      since: { type: duration, default: 1h, description: "How far back to look, relative to the run's reference time" }
      limit: { type: integer, default: 100, min: 1, max: 500, description: "Most traces Jaeger returns per query (per service and search). Each trace is returned whole, so the query pod holds and sends up to limit traces per query; raise it with care on a busy Jaeger" }
      services: { type: "string[]", default: [], description: "Only these services; empty means every service Jaeger knows" }
      excludeServices: { type: "string[]", default: [], description: "Services to leave out" }
      port: { type: integer, required: false, min: 1, max: 65535, description: "Jaeger query HTTP port (the override); by default the Jaeger container's port named query, http-query or query-http (the container whose image is Jaeger's, else the first that is not a sidecar), else 16686" }
      scheme: { type: string, default: http, description: "http or https" }
    permissions:
      - { apiGroups: [apps], resources: [statefulsets, deployments], verbs: [get] }
      - { apiGroups: [""], resources: [pods], verbs: [list] }
      - { apiGroups: [""], resources: [pods/proxy], verbs: [get] }
    outputs:
      httpErrors: { schema: ./schemas/http-errors.v1.json, description: "Per service: counts of 5xx and 4xx spans per operation with status codes, URL paths and sample trace IDs, outbound error spans, how complete the search was, the query pod's start time and restarts, and the window and limits used" }
