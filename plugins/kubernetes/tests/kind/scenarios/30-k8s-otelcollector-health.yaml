# k8s-otelcollector-health scenario, applied by up.sh (30-k8s-otelcollector-health.sh then sends traffic).
# Namespace rw-otel, three OpenTelemetry Collectors (core distribution, one pod each, limit 128Mi), each with
# an OTLP receiver and its own metrics on :8888 (bound to 0.0.0.0 so the API server's pod proxy reaches it):
#   otel-sink    receiver + debug exporter only: the healthy collector's destination.
#   otel-ok      exports traces, metrics and logs to otel-sink with a sending queue of 10: queues stay empty.
#   otel-broken  exports to otel-dead, a Service with no pods: otlp/dead retries forever with a queue of 10
#                (the queues fill: queue_size == queue_capacity, enqueue_failed and receiver_refused climb);
#                otlp/giveup gives up after 2s with a roomy queue (send_failed climbs).
# The .sh sends a few OTLP/JSON requests of each kind to otel-ok and otel-broken from a throwaway busybox Job.
apiVersion: v1
kind: Namespace
metadata:
  name: rw-otel
---
apiVersion: v1
kind: Service
metadata:
  name: otel-dead
  namespace: rw-otel
spec:
  selector: {app: otel-dead-nothing-selects-this}
  ports:
    - {name: otlp-grpc, port: 4317}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-sink-config
  namespace: rw-otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    exporters:
      debug: {verbosity: basic}
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces: {receivers: [otlp], exporters: [debug]}
        metrics: {receivers: [otlp], exporters: [debug]}
        logs: {receivers: [otlp], exporters: [debug]}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-sink
  namespace: rw-otel
spec:
  selector: {app: otel-sink}
  ports:
    - {name: otlp-grpc, port: 4317}
    - {name: otlp-http, port: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-sink
  namespace: rw-otel
  labels: {app: otel-sink, app.kubernetes.io/name: opentelemetry-collector}
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-sink}
  template:
    metadata:
      labels: {app: otel-sink, app.kubernetes.io/name: opentelemetry-collector}
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector:0.164.0
          args: [--config=/conf/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /conf, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: otel-sink-config}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-ok-config
  namespace: rw-otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    exporters:
      debug: {verbosity: basic}
      otlp/sink:
        endpoint: otel-sink.rw-otel.svc.cluster.local:4317
        tls: {insecure: true}
        timeout: 2s
        sending_queue: {enabled: true, queue_size: 10, num_consumers: 1}
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces: {receivers: [otlp], exporters: [debug, otlp/sink]}
        metrics: {receivers: [otlp], exporters: [debug, otlp/sink]}
        logs: {receivers: [otlp], exporters: [debug, otlp/sink]}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-ok
  namespace: rw-otel
spec:
  selector: {app: otel-ok}
  ports:
    - {name: otlp-grpc, port: 4317}
    - {name: otlp-http, port: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-ok
  namespace: rw-otel
  labels: {app: otel-ok, app.kubernetes.io/name: opentelemetry-collector}
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-ok}
  template:
    metadata:
      labels: {app: otel-ok, app.kubernetes.io/name: opentelemetry-collector}
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector:0.164.0
          args: [--config=/conf/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /conf, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: otel-ok-config}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-broken-config
  namespace: rw-otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    exporters:
      debug: {verbosity: basic}
      otlp/dead:
        endpoint: otel-dead.rw-otel.svc.cluster.local:4317
        tls: {insecure: true}
        timeout: 1s
        retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 2s, max_elapsed_time: 0s}
        sending_queue: {enabled: true, queue_size: 10, num_consumers: 1}
      otlp/giveup:
        endpoint: otel-dead.rw-otel.svc.cluster.local:4317
        tls: {insecure: true}
        timeout: 1s
        retry_on_failure: {enabled: true, initial_interval: 500ms, max_interval: 1s, max_elapsed_time: 2s}
        sending_queue: {enabled: true, queue_size: 1000, num_consumers: 4}
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces: {receivers: [otlp], exporters: [debug, otlp/dead, otlp/giveup]}
        metrics: {receivers: [otlp], exporters: [debug, otlp/dead, otlp/giveup]}
        logs: {receivers: [otlp], exporters: [debug, otlp/dead, otlp/giveup]}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-broken
  namespace: rw-otel
spec:
  selector: {app: otel-broken}
  ports:
    - {name: otlp-grpc, port: 4317}
    - {name: otlp-http, port: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-broken
  namespace: rw-otel
  labels: {app: otel-broken, app.kubernetes.io/name: opentelemetry-collector}
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-broken}
  template:
    metadata:
      labels: {app: otel-broken, app.kubernetes.io/name: opentelemetry-collector}
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector:0.164.0
          args: [--config=/conf/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /conf, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: otel-broken-config}
