# k8s-seaweedfs-health scenario, applied by up.sh (30-k8s-seaweedfs-health.sh then fills it).
# Three SeaweedFS releases in rw-seaweedfs; two have ONE pod running `weed server -s3` (master, volume
# server, filer and S3 gateway in one process, the chart's all-in-one shape, labelled
# component=all-in-one), so the scenario fits a small Docker VM:
#   swfs-ok      room for volumes (volume.max 30), a few writable volumes, S3 open (no identities).
#   swfs-broken  volume.max 3, every slot taken, one volume marked read-only, S3 with identities
#                configured: anonymous may Read and List (the known chart default), writes need a key. Test credentials only: nothing here is a secret.
#   swfs-down    a release whose pod cannot start (image tag that does not exist): ready 0 of 1, the
#                master cannot be asked.
# Pinned to the image the rest of the lane already pulled.
apiVersion: v1
kind: Namespace
metadata:
  name: rw-seaweedfs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swfs-broken-s3
  namespace: rw-seaweedfs
data:
  s3.json: |
    {"identities":[{"name":"anonymous","actions":["Read","List"]},{"name":"rw-test","credentials":[{"accessKey":"RWTESTACCESSKEY","secretKey":"rwtestsecretkeynotreal"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: v1
kind: Service
metadata:
  name: swfs-ok
  namespace: rw-seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-ok, app.kubernetes.io/component: all-in-one}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-ok, app.kubernetes.io/component: all-in-one}
  ports:
    - {name: swfs-master, port: 9333}
    - {name: swfs-volume, port: 8080}
    - {name: swfs-filer, port: 8888}
    - {name: swfs-s3, port: 8333}
---
apiVersion: v1
kind: Service
metadata:
  name: swfs-broken
  namespace: rw-seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-broken, app.kubernetes.io/component: all-in-one}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-broken, app.kubernetes.io/component: all-in-one}
  ports:
    - {name: swfs-master, port: 9333}
    - {name: swfs-volume, port: 8080}
    - {name: swfs-filer, port: 8888}
    - {name: swfs-s3, port: 8333}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swfs-ok
  namespace: rw-seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-ok, app.kubernetes.io/component: all-in-one}
spec:
  serviceName: swfs-ok
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-ok, app.kubernetes.io/component: all-in-one}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-ok, app.kubernetes.io/component: all-in-one}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.41
          args: [server, -dir=/data, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=16, -volume.max=30, -filer, -s3, -metricsPort=9327]
          ports:
            - {name: swfs-master, containerPort: 9333}
            - {name: swfs-volume, containerPort: 8080}
            - {name: swfs-filer, containerPort: 8888}
            - {name: swfs-s3, containerPort: 8333}
          readinessProbe:
            httpGet: {path: /cluster/status, port: 9333}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swfs-broken
  namespace: rw-seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-broken, app.kubernetes.io/component: all-in-one}
spec:
  serviceName: swfs-broken
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-broken, app.kubernetes.io/component: all-in-one}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-broken, app.kubernetes.io/component: all-in-one}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.41
          args: [server, -dir=/data, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=16, -volume.max=3, -filer, -s3, -s3.config=/etc/swfs/s3.json, -metricsPort=9327]
          ports:
            - {name: swfs-master, containerPort: 9333}
            - {name: swfs-volume, containerPort: 8080}
            - {name: swfs-filer, containerPort: 8888}
            - {name: swfs-s3, containerPort: 8333}
          readinessProbe:
            httpGet: {path: /cluster/status, port: 9333}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3, mountPath: /etc/swfs, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - name: s3
          configMap: {name: swfs-broken-s3}
---
apiVersion: v1
kind: Service
metadata:
  name: swfs-down
  namespace: rw-seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-down, app.kubernetes.io/component: all-in-one}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-down, app.kubernetes.io/component: all-in-one}
  ports:
    - {name: swfs-master, port: 9333}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swfs-down
  namespace: rw-seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-down, app.kubernetes.io/component: all-in-one}
spec:
  serviceName: swfs-down
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-down, app.kubernetes.io/component: all-in-one}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: swfs-down, app.kubernetes.io/component: all-in-one}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:does-not-exist-0.0.0
          args: [server, -dir=/data, -filer, -s3]
          resources:
            requests: {cpu: 1m, memory: 1Mi}
