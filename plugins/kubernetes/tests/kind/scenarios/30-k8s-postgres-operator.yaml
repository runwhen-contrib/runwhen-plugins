# k8s-postgres-operator-health / -ops scenarios, applied by up.sh: namespace rw-pgop, two
# synthetic CRDs (the Crunchy PostgresCluster and the Zalando postgresql: real group, kind,
# plural and scope; the schema accepts anything and the status subresource is on) and member
# pods. NO operator and NO Patroni run in kind.
#   * Each cluster's pods are plain Pods carrying the labels the operators put on theirs.
#     The primary pod of hippo and of acid-zalando runs a real postgres:16-alpine (psql over the
#     local socket, trust auth for the local user: no credential anywhere); every other pod runs
#     `sleep` from the same image.
#   * `patronictl` is a STUB script from a ConfigMap (patronictl-stub): `list -f json` prints
#     the recorded members of the cluster (ConfigMap patroni-<cluster>); reinit, switchover,
#     failover and restart are accepted and appended to /tmp/patronictl.log in the pod.
#     switchover/failover also swap in `switched.json`, so the new leader can be read back.
# The CR objects and their status are created by 30-k8s-postgres-operator.sh (a custom
# resource cannot be applied in the same call as its CRD).
apiVersion: v1
kind: Namespace
metadata:
  name: rw-pgop
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresclusters.postgres-operator.crunchydata.com
spec:
  group: postgres-operator.crunchydata.com
  scope: Namespaced
  names:
    kind: PostgresCluster
    listKind: PostgresClusterList
    plural: postgresclusters
    singular: postgrescluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqls.acid.zalan.do
spec:
  group: acid.zalan.do
  scope: Namespaced
  names:
    kind: postgresql
    listKind: postgresqlList
    plural: postgresqls
    singular: postgresql
    shortNames: [pg]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ConfigMap
metadata: {name: pg-trust, namespace: rw-pgop}
data:
  POSTGRES_HOST_AUTH_METHOD: trust
---
apiVersion: v1
kind: ConfigMap
metadata: {name: patronictl-stub, namespace: rw-pgop}
data:
  patronictl: |
    #!/bin/sh
    # STUB, not Patroni. `list` prints the cluster's recorded members; writes are logged.
    DIR=/etc/patroni-stub
    STATE=/tmp/patroni-state.json
    LOG=/tmp/patronictl.log
    [ -f "$STATE" ] || cp "$DIR/members.json" "$STATE"
    cmd=${1:-}
    case "$cmd" in
      list)
        cat "$STATE" ;;
      reinit)
        # patronictl reinit <cluster> <member> --force
        grep -q "\"Member\": \"$3\"" "$STATE" || { echo "Error: $3 is not a member of cluster $2" >&2; exit 1; }
        printf '%s patronictl %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >> "$LOG"
        echo "Success: reinitialize for member $3" ;;
      switchover|failover)
        case "$*" in *--candidate*) ;; *)
          [ "$cmd" = failover ] && { echo "Error: Failover could be performed only to a specific node" >&2; exit 1; } ;;
        esac
        printf '%s patronictl %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >> "$LOG"
        [ -f "$DIR/switched.json" ] && cp "$DIR/switched.json" "$STATE"
        echo "Successfully ${cmd}ed" ;;
      restart)
        printf '%s patronictl %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >> "$LOG"
        echo "Success: restart on all members" ;;
      *)
        echo "patronictl stub: unsupported command: $cmd" >&2; exit 2 ;;
    esac
---
apiVersion: v1
kind: ConfigMap
metadata: {name: patroni-hippo, namespace: rw-pgop}
data:
  members.json: |
    [{"Cluster": "hippo-ha", "Member": "hippo-instance1-0", "Host": "10.244.0.50", "Role": "Leader", "State": "running", "TL": 3},
     {"Cluster": "hippo-ha", "Member": "hippo-instance2-0", "Host": "10.244.0.51", "Role": "Replica", "State": "streaming", "TL": 3, "Lag in MB": 0}]
  switched.json: |
    [{"Cluster": "hippo-ha", "Member": "hippo-instance1-0", "Host": "10.244.0.50", "Role": "Replica", "State": "streaming", "TL": 4, "Lag in MB": 0},
     {"Cluster": "hippo-ha", "Member": "hippo-instance2-0", "Host": "10.244.0.51", "Role": "Leader", "State": "running", "TL": 4}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: patroni-hippo-broken, namespace: rw-pgop}
data:
  # no leader; one replica 512 MB behind, one that failed to start
  members.json: |
    [{"Cluster": "hippo-broken-ha", "Member": "hippo-broken-instance1-0", "Host": "10.244.0.52", "Role": "Replica", "State": "running", "TL": 5, "Lag in MB": 512},
     {"Cluster": "hippo-broken-ha", "Member": "hippo-broken-instance2-0", "Host": "10.244.0.53", "Role": "Replica", "State": "start failed", "TL": 4, "Lag in MB": "unknown"}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: patroni-acid-zalando, namespace: rw-pgop}
data:
  members.json: |
    [{"Cluster": "acid-zalando", "Member": "acid-zalando-0", "Host": "10.244.0.54", "Role": "Leader", "State": "running", "TL": 7},
     {"Cluster": "acid-zalando", "Member": "acid-zalando-1", "Host": "10.244.0.55", "Role": "Replica", "State": "streaming", "TL": 7, "Lag in MB": 0}]
  switched.json: |
    [{"Cluster": "acid-zalando", "Member": "acid-zalando-0", "Host": "10.244.0.54", "Role": "Replica", "State": "streaming", "TL": 8, "Lag in MB": 0},
     {"Cluster": "acid-zalando", "Member": "acid-zalando-1", "Host": "10.244.0.55", "Role": "Leader", "State": "running", "TL": 8}]
---
apiVersion: v1
kind: Pod
metadata:
  name: hippo-instance1-0
  namespace: rw-pgop
  labels:
    postgres-operator.crunchydata.com/cluster: hippo
    postgres-operator.crunchydata.com/instance: hippo-instance1
    postgres-operator.crunchydata.com/instance-set: instance1
    postgres-operator.crunchydata.com/role: master
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/patroni: hippo-ha
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: database
      image: postgres:16-alpine
      envFrom: [{configMapRef: {name: pg-trust}}]
      readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 3}
      resources: {requests: {cpu: 5m, memory: 48Mi}, limits: {memory: 192Mi}}
      volumeMounts:
        - {name: stub, mountPath: /usr/local/bin/patronictl, subPath: patronictl}
        - {name: members, mountPath: /etc/patroni-stub}
  volumes:
    - {name: stub, configMap: {name: patronictl-stub, defaultMode: 0755}}
    - {name: members, configMap: {name: patroni-hippo}}
---
apiVersion: v1
kind: Pod
metadata:
  name: hippo-instance2-0
  namespace: rw-pgop
  labels:
    postgres-operator.crunchydata.com/cluster: hippo
    postgres-operator.crunchydata.com/instance: hippo-instance2
    postgres-operator.crunchydata.com/instance-set: instance1
    postgres-operator.crunchydata.com/role: replica
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/patroni: hippo-ha
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: database
      image: postgres:16-alpine
      command: [sleep, infinity]
      resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 32Mi}}
      volumeMounts:
        - {name: stub, mountPath: /usr/local/bin/patronictl, subPath: patronictl}
        - {name: members, mountPath: /etc/patroni-stub}
  volumes:
    - {name: stub, configMap: {name: patronictl-stub, defaultMode: 0755}}
    - {name: members, configMap: {name: patroni-hippo}}
---
apiVersion: v1
kind: Pod
metadata:
  name: hippo-broken-instance1-0
  namespace: rw-pgop
  labels:
    postgres-operator.crunchydata.com/cluster: hippo-broken
    postgres-operator.crunchydata.com/instance: hippo-broken-instance1
    postgres-operator.crunchydata.com/instance-set: instance1
    postgres-operator.crunchydata.com/role: replica
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/patroni: hippo-broken-ha
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: database
      image: postgres:16-alpine
      command: [sleep, infinity]
      readinessProbe: {exec: {command: ["false"]}, periodSeconds: 5}
      resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 32Mi}}
      volumeMounts:
        - {name: stub, mountPath: /usr/local/bin/patronictl, subPath: patronictl}
        - {name: members, mountPath: /etc/patroni-stub}
  volumes:
    - {name: stub, configMap: {name: patronictl-stub, defaultMode: 0755}}
    - {name: members, configMap: {name: patroni-hippo-broken}}
---
apiVersion: v1
kind: Pod
metadata:
  name: hippo-broken-instance2-0
  namespace: rw-pgop
  labels:
    postgres-operator.crunchydata.com/cluster: hippo-broken
    postgres-operator.crunchydata.com/instance: hippo-broken-instance2
    postgres-operator.crunchydata.com/instance-set: instance1
    postgres-operator.crunchydata.com/role: replica
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/patroni: hippo-broken-ha
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: database
      image: postgres:16-alpine
      command: [sleep, infinity]
      resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 32Mi}}
      volumeMounts:
        - {name: stub, mountPath: /usr/local/bin/patronictl, subPath: patronictl}
        - {name: members, mountPath: /etc/patroni-stub}
  volumes:
    - {name: stub, configMap: {name: patronictl-stub, defaultMode: 0755}}
    - {name: members, configMap: {name: patroni-hippo-broken}}
---
apiVersion: v1
kind: Pod
metadata:
  name: acid-zalando-0
  namespace: rw-pgop
  labels:
    application: spilo
    cluster-name: acid-zalando
    spilo-role: master
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: postgres
      image: postgres:16-alpine
      envFrom: [{configMapRef: {name: pg-trust}}]
      readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 3}
      resources: {requests: {cpu: 5m, memory: 48Mi}, limits: {memory: 192Mi}}
      volumeMounts:
        - {name: stub, mountPath: /usr/local/bin/patronictl, subPath: patronictl}
        - {name: members, mountPath: /etc/patroni-stub}
  volumes:
    - {name: stub, configMap: {name: patronictl-stub, defaultMode: 0755}}
    - {name: members, configMap: {name: patroni-acid-zalando}}
---
apiVersion: v1
kind: Pod
metadata:
  name: acid-zalando-1
  namespace: rw-pgop
  labels:
    application: spilo
    cluster-name: acid-zalando
    spilo-role: replica
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: postgres
      image: postgres:16-alpine
      command: [sleep, infinity]
      resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 32Mi}}
      volumeMounts:
        - {name: stub, mountPath: /usr/local/bin/patronictl, subPath: patronictl}
        - {name: members, mountPath: /etc/patroni-stub}
  volumes:
    - {name: stub, configMap: {name: patronictl-stub, defaultMode: 0755}}
    - {name: members, configMap: {name: patroni-acid-zalando}}
