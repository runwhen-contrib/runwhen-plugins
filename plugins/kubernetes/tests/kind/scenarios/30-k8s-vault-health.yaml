# k8s-vault-health scenarios (namespace rw-vault), labelled like the Vault Helm chart. Every
# container is limited to 128Mi (Vault) or 16Mi (the CSI stand-ins).
#   sts/vault          1 pod, `vault server -dev`: initialized, unsealed, active (healthy).
#   sts/vault-sealed   1 pod, a real (non-dev) server on file storage: uninitialized and sealed
#                      when created; 30-k8s-vault-health.sh initializes it and restarts the
#                      process, leaving it initialized and sealed (what a restarted Vault is).
#   ds/vault-csi-provider         a CSI provider stand-in (busybox): every node ready.
#   ds/vault-csi-provider-broken  the same labels, but its readiness probe never passes and its
#                      liveness probe fails: not ready, restarting, Warning events.
apiVersion: v1
kind: Namespace
metadata:
  name: rw-vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: rw-vault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: vault, component: server}
  ports:
    - {name: http, port: 8200}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: rw-vault
  labels: {app.kubernetes.io/name: vault, app.kubernetes.io/instance: vault}
spec:
  replicas: 1
  serviceName: vault-internal
  selector:
    matchLabels: {app.kubernetes.io/name: vault, app.kubernetes.io/instance: vault, component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vault, app.kubernetes.io/instance: vault, component: server}
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.18.5
          args: [server, -dev, "-dev-listen-address=0.0.0.0:8200"]
          env:
            - {name: SKIP_SETCAP, value: "true"}
          ports:
            - {name: http, containerPort: 8200}
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 128Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault-sealed
  namespace: rw-vault
  labels: {app.kubernetes.io/name: vault, app.kubernetes.io/instance: vault-sealed}
spec:
  replicas: 1
  serviceName: vault-internal
  selector:
    matchLabels: {app.kubernetes.io/name: vault, app.kubernetes.io/instance: vault-sealed, component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vault, app.kubernetes.io/instance: vault-sealed, component: server}
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.18.5
          args: [server]
          env:
            - {name: SKIP_SETCAP, value: "true"}
            - name: VAULT_LOCAL_CONFIG
              value: '{"storage":{"file":{"path":"/vault/file"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"disable_mlock":true,"ui":false}'
          ports:
            - {name: http, containerPort: 8200}
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /vault/file}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 128Mi}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vault-csi-provider
  namespace: rw-vault
  labels: {app.kubernetes.io/name: vault-csi-provider}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: vault-csi-provider, app.kubernetes.io/instance: ok}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vault-csi-provider, app.kubernetes.io/instance: ok}
    spec:
      containers:
        - name: provider
          image: busybox:1.36
          command: [sleep, "1000000"]
          resources:
            requests: {cpu: 1m, memory: 2Mi}
            limits: {memory: 16Mi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vault-csi-provider-broken
  namespace: rw-vault
  labels: {app.kubernetes.io/name: vault-csi-provider}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: vault-csi-provider, app.kubernetes.io/instance: broken}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vault-csi-provider, app.kubernetes.io/instance: broken}
    spec:
      containers:
        - name: provider
          image: busybox:1.36
          command: [sleep, "1000000"]
          readinessProbe:
            exec: {command: [sh, -c, "exit 1"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, "exit 1"]}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests: {cpu: 1m, memory: 2Mi}
            limits: {memory: 16Mi}
