# k8s-loki-health scenarios, applied by up.sh. Two single-binary Loki (grafana/loki, filesystem
# storage on emptyDir, in-memory ring, memory limit 192Mi), in namespace rw-loki:
#   loki        StatefulSet, healthy: /ready answers ready and the ingester ring has one ACTIVE
#               member (target=all serves /ring, /distributor/ring and /compactor/ring)
#   loki-stale  Deployment whose ingester never sends a heartbeat after registering
#               (heartbeat_period 0) and whose ring heartbeat_timeout is 15s: after a while
#               its ring page shows the member as Unhealthy with an old last heartbeat
apiVersion: v1
kind: Namespace
metadata:
  name: rw-loki
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: rw-loki
data:
  loki.yaml: |
    auth_enabled: false
    target: all
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn
    common:
      path_prefix: /loki
      replication_factor: 1
      instance_addr: 127.0.0.1
      ring:
        kvstore: {store: inmemory}
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config:
      reject_old_samples: true
    analytics:
      reporting_enabled: false
  loki-stale.yaml: |
    auth_enabled: false
    target: all
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn
    common:
      path_prefix: /loki
      replication_factor: 1
      instance_addr: 127.0.0.1
      ring:
        kvstore: {store: inmemory}
        heartbeat_period: 0s
        heartbeat_timeout: 15s
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    ingester:
      lifecycler:
        heartbeat_period: 0s
        ring:
          heartbeat_timeout: 15s
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: rw-loki
spec:
  selector: {app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}
  ports:
    - {name: http-metrics, port: 3100, targetPort: http-metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  namespace: rw-loki
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}
  ports:
    - {name: http-metrics, port: 3100, targetPort: http-metrics}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: rw-loki
spec:
  replicas: 1
  serviceName: loki-headless
  selector:
    matchLabels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: [-config.file=/etc/loki/loki.yaml]
          ports:
            - {name: http-metrics, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http-metrics}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 192Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap:
            name: loki-config
            items: [{key: loki.yaml, path: loki.yaml}]
        - name: data
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-stale
  namespace: rw-loki
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loki-stale}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki-stale}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: [-config.file=/etc/loki/loki-stale.yaml]
          ports:
            - {name: http-metrics, containerPort: 3100}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 192Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap:
            name: loki-config
            items: [{key: loki-stale.yaml, path: loki-stale.yaml}]
        - name: data
          emptyDir: {sizeLimit: 128Mi}
