# Everything in rw-healthy should be Ready/Bound/Available.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: rw-healthy
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: rw-healthy
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: rw-healthy
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: rw-healthy
spec:
  rules:
    - host: web.rw-healthy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 80}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: rw-healthy
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "sleep 1000000"]
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 5m, memory: 4Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests: {storage: 100Mi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: rw-healthy
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests: {cpu: 1m, memory: 1Mi}
---
# kind's default StorageClass binds on first consumer, so a pod must mount
# the PVC for it to reach Bound.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: rw-healthy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: {storage: 100Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-user
  namespace: rw-healthy
spec:
  replicas: 1
  selector:
    matchLabels: {app: data-user}
  template:
    metadata:
      labels: {app: data-user}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 1m, memory: 1Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
