# k8s-flux-health scenarios, applied by up.sh: namespace rw-flux and two synthetic
# Flux CRDs (group, kind, plural and scope are the real ones; the schema accepts
# anything and the status subresource is on, so status can be set the way a
# controller would). No Flux controller runs in kind.
# The objects themselves, and their status, are created by 30-k8s-flux-health.sh:
# a CustomResource cannot be applied in the same call as its CRD (not yet established).
apiVersion: v1
kind: Namespace
metadata:
  name: rw-flux
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmreleases.helm.toolkit.fluxcd.io
spec:
  group: helm.toolkit.fluxcd.io
  scope: Namespaced
  names:
    kind: HelmRelease
    listKind: HelmReleaseList
    plural: helmreleases
    singular: helmrelease
    shortNames: [hr]
  versions:
    - name: v2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kustomizations.kustomize.toolkit.fluxcd.io
spec:
  group: kustomize.toolkit.fluxcd.io
  scope: Namespaced
  names:
    kind: Kustomization
    listKind: KustomizationList
    plural: kustomizations
    singular: kustomization
    shortNames: [ks]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
