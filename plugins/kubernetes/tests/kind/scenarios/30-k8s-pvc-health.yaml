# k8s-pvc-health: a claim stuck Terminating. The custom finalizer is never
# removed by anything, so once the claim is deleted it keeps its
# deletionTimestamp. up.sh does not apply this file and does not delete the
# claim; do both once, by hand, before capturing:
#   kubectl --context kind-rw-plugins apply -f 30-k8s-pvc-health.yaml
#   kubectl --context kind-rw-plugins -n rw-broken delete pvc stuck --wait=false
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stuck
  namespace: rw-broken
  finalizers: [rw.test/hold]
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: {storage: 100Mi}
