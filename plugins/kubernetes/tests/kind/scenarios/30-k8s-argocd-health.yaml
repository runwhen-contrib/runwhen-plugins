# k8s-argocd-health scenarios. Namespace rw-argo holds a synthetic argoproj.io
# Application CRD (preserve-unknown-fields, status subresource): no Argo CD is
# installed, so nothing reconciles these objects. The Application instances and
# the status a controller would write are created by 30-k8s-argocd-health.sh,
# because a CR cannot be applied in the same call that creates its CRD.
apiVersion: v1
kind: Namespace
metadata:
  name: rw-argo
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.argoproj.io
spec:
  group: argoproj.io
  scope: Namespaced
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    singular: application
    shortNames: [app, apps]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
