# Each object in rw-broken is broken in exactly one way (see names).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: rw-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: crashloop}
  template:
    metadata:
      labels: {app: crashloop}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'fatal: cannot load config' >&2; exit 1"]
          resources:
            requests: {cpu: 1m, memory: 2Mi}
---
# Readiness probe on a port nothing listens on: Running but never Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-probe
  namespace: rw-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: bad-probe}
  template:
    metadata:
      labels: {app: bad-probe}
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 9999}
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests: {cpu: 1m, memory: 8Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: rw-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: bad-image}
  template:
    metadata:
      labels: {app: bad-image}
    spec:
      containers:
        - name: app
          image: nginx:does-not-exist-0.0.0
          resources:
            requests: {cpu: 1m, memory: 8Mi}
---
# Allocates ~64 MiB in a shell variable under a 16 MiB limit: OOMKilled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom
  namespace: rw-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: oom}
  template:
    metadata:
      labels: {app: oom}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "x=$(head -c 67108864 /dev/zero | tr '\\0' a); echo ${#x}; sleep 3600"]
          resources:
            requests: {cpu: 1m, memory: 8Mi}
            limits: {memory: 16Mi}
---
# Unbound PVC: the StorageClass does not exist.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pending
  namespace: rw-broken
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: does-not-exist
  resources:
    requests: {storage: 100Mi}
---
# Ingress backend Service does not exist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orphan
  namespace: rw-broken
spec:
  rules:
    - host: orphan.rw-broken.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: missing
                port: {number: 80}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fails
  namespace: rw-broken
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: ["sh", "-c", "echo 'job failed' >&2; exit 1"]
          resources:
            requests: {cpu: 1m, memory: 2Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broken-sts
  namespace: rw-broken
spec:
  serviceName: broken-sts
  replicas: 1
  selector:
    matchLabels: {app: broken-sts}
  template:
    metadata:
      labels: {app: broken-sts}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'fatal: data dir corrupt' >&2; exit 2"]
          resources:
            requests: {cpu: 1m, memory: 2Mi}
