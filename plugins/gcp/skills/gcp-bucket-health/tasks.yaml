apiVersion: runwhen.com/tasks/v1
runtime: gcp@1                 # gcloud, pinned; runtimes/gcp
defaults: { credentials: gcp/adc, timeout: 120s }
settings:
  maxItems: { type: integer, default: 200, min: 1, max: 10000, description: "Most buckets a task looks at on a project target, and most entries a list output returns; the total and the number left out are reported beside it" }
  commandTimeout: { type: duration, default: 60s, description: "How long one gcloud call may take before it fails with timeout" }
  usageThresholdTib: { type: number, default: 0.5, min: 0, description: "bucket-size: a bucket holding more than this many TiB (1024^4 bytes) is flagged overThreshold" }
  sizeTimeout: { type: duration, default: 300s, description: "bucket-size: how long gcloud storage du may take for one bucket; it walks every object" }
  publicBucketThreshold: { type: integer, default: 0, min: 0, description: "public-access: more public buckets than this sets overThreshold in totals" }
tasks:
  - name: bucket-config
    title: Bucket configuration
    description: Reads each bucket's settings from the API's bucket resource - location, storage class, versioning, uniform bucket-level access, public access prevention, retention, lifecycle rule count, soft delete, customer-managed key, labels - for the bucket, or for the project's buckets. Read-only.
    script: scripts/bucket_config.py
    tags: [config, storage]
    readOnly: true
    timeout: 600s
    permissions:
      - { permission: storage.buckets.list }               # project target only: the bucket names
      - { permission: storage.buckets.get }                # gcloud storage buckets describe
      - { permission: storage.buckets.getIamPolicy }       # the full bucket resource (ACLs) is part of describe --raw
    outputs:
      buckets: { schema: ./schemas/bucket-config.v1.json, description: "Settings of each bucket, cut to maxItems" }
  - name: public-access
    title: Public access
    description: Reads each bucket's IAM policy and legacy ACLs for grants to allUsers or allAuthenticatedUsers, with uniform bucket-level access and public access prevention, for the bucket or the project's buckets, and counts the public ones against publicBucketThreshold. Read-only.
    script: scripts/public_access.py
    tags: [security, storage]
    readOnly: true
    timeout: 600s
    permissions:
      - { permission: storage.buckets.list }               # project target only
      - { permission: storage.buckets.get }
      - { permission: storage.buckets.getIamPolicy }       # without it a bucket's publicViaIam is null (partial), not false
    outputs:
      access: { schema: ./schemas/public-access.v1.json, description: "Per bucket: the public grants in IAM and ACLs, uniform access and public access prevention, cut to maxItems" }
      totals: { schema: ./schemas/public-totals.v1.json, description: "Buckets examined, public, undecided, and whether the public count is over publicBucketThreshold" }
  - name: bucket-size
    title: Bucket size
    description: Measures each bucket's bytes with gcloud storage du (an object walk, so slow on large buckets), for the bucket or the project's buckets, largest first, and flags the ones over usageThresholdTib. Stops starting new buckets when the task's time budget is nearly used up and says which were skipped. Read-only.
    script: scripts/bucket_size.py
    tags: [usage, storage]
    readOnly: true
    timeout: 900s                                          # a du of a large bucket takes minutes; gcp_bucket_health/size.py reserves the last seconds
    permissions:
      - { permission: storage.buckets.list }               # project target only
      - { permission: storage.objects.list }               # gcloud storage du lists every object
    outputs:
      sizes: { schema: ./schemas/bucket-size.v1.json, description: "Bytes per bucket, largest first, cut to maxItems" }
      totals: { schema: ./schemas/size-totals.v1.json, description: "Buckets measured and skipped, the total bytes, and how many are over usageThresholdTib" }
