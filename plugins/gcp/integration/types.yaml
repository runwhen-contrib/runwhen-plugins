# GCP = project -> bucket; project -> region -> cloud-function (D51): a type exists only if a skill targets it.
# gcp-bucket-health targets buckets and gcp-functions-health targets Cloud Functions. Every later
# GCP skill adds the type it targets (model endpoint, ...) here; names and parents never change (D21).
types:
  # The project id (the globally unique, human-chosen id such as `shop-prod-1234`, not the
  # numeric project number) is the root's name and its canonical key. The key is the same value
  # as the root's name, so gcp-base/discover reports it without a call that may be forbidden.
  project: { root: true, rootKey: projectId, canonicalKey: projectId, plural: projects }
  bucket: { parent: project, plural: buckets }
  # Cloud Functions names are unique per region only (the same id can exist in two regions), so
  # the region is part of a function's identity, as in the aws plugin: a function is
  # project -> region -> cloud-function. Buckets are global names and stay directly under the project.
  region: { parent: project, plural: regions }
  # A Cloud Functions function, first or second generation. Its name is the function id (the NAME
  # column of `gcloud functions list`); its region is its parent.
  cloud-function: { parent: region, plural: cloud-functions }
