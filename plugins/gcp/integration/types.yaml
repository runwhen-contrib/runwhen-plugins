# GCP = project -> bucket (D51): a type exists only if a skill targets it. gcp-bucket-health
# targets buckets, so that is the one child type. Every later GCP skill adds the type it targets
# (function, model endpoint, ...) here; names and parents never change (D21).
types:
  # The project id (the globally unique, human-chosen id such as `shop-prod-1234`, not the
  # numeric project number) is the root's name and its canonical key. The key is the same value
  # as the root's name, so gcp-base/discover reports it without a call that may be forbidden.
  project: { root: true, rootKey: projectId, canonicalKey: projectId, plural: projects }
  bucket: { parent: project, plural: buckets }
