# Canned answers of scenario 'functions-forbidden', written by tests/stub/capture/capture_functions.py from the
# real gcloud 592.0.0 in the runtime image (see ../../README.md). Project, functions and members are invented.
# Every value is one line of JSON.
- argv: ["functions", "list", "--project=shop-prod-1234", "--billing-project=shop-prod-1234"]
  rc: 1
  stderr: "ERROR: (gcloud.functions.list) [None] does not have permission to access projects instance [shop-prod-1234] (or it may not exist): Permission 'cloudfunctions.locations.list' denied on resource 'projects/shop-prod-1234' (or it may not exist).\n"
  source: "https://cloud.google.com/functions/docs/reference/rest/v2/projects.locations.functions/list"
  cli_source: "gcloud 592.0.0: googlecloudsdk/surface/functions/list.py (2nd gen from the v2 API with filter environment=\"GEN_2\", 1st gen from v1; unreachable regions are only warned about)"
- argv: ["functions", "describe", "orders-api", "--region=us-central1", "--project=shop-prod-1234", "--billing-project=shop-prod-1234"]
  rc: 1
  stderr: "ERROR: (gcloud.functions.describe) ResponseError: status=[403], code=[], message=[Permission 'cloudfunctions.functions.get' denied on resource 'projects/shop-prod-1234' (or it may not exist).]\n"
  source: "https://cloud.google.com/functions/docs/reference/rest/v2/projects.locations.functions/get"
  cli_source: "gcloud 592.0.0: googlecloudsdk/surface/functions/describe.py and command_lib/functions/util.py (FunctionResourceCommand: the v2 API names the generation, GEN_2 prints the v2 format, else the v1 one)"
- argv: ["builds", "describe", "a1b2c3d4-0000-4000-8000-000000000001", "--region=us-central1", "--project=shop-prod-1234", "--billing-project=shop-prod-1234"]
  rc: 1
  stderr: "ERROR: (gcloud.builds.describe) PERMISSION_DENIED: Permission 'cloudbuild.builds.get' denied on resource 'projects/shop-prod-1234' (or it may not exist).\n"
  source: "https://cloud.google.com/build/docs/api/reference/rest/v1/projects.locations.builds/get"
  cli_source: "gcloud 592.0.0: googlecloudsdk/surface/builds/describe.py (--region: projects/<p>/locations/<r>/builds/<id>)"
- argv: ["logging", "read", "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"orders-api\" AND resource.labels.location=\"us-central1\" AND severity>=ERROR", "--project=shop-prod-1234", "--freshness=3600s", "--limit=51", "--order=desc", "--billing-project=shop-prod-1234"]
  rc: 1
  stdout: "logs-orders-api.json"
  stderr: "ERROR: (gcloud.logging.read) PERMISSION_DENIED: Permission 'logging.logEntries.list' denied on resource 'projects/shop-prod-1234' (or it may not exist).\n"
  source: "https://cloud.google.com/logging/docs/reference/v2/rest/v2/entries/list"
  cli_source: "gcloud 592.0.0: googlecloudsdk/surface/logging/read.py and api_lib/logging/common.py (entries.list, --order, --limit, --freshness)"
