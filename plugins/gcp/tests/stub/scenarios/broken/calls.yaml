# gcloud answers for the 'broken' scenario. Synthetic: project shop-prod-1234, buckets and
# members are invented. Each entry's `source` is the reference its answer follows; every
# value is JSON (see ../../README.md).
- argv: ["projects", "describe", "shop-prod-1234"]
  rc: 0
  stdout: "project.json"
  source: "https://cloud.google.com/resource-manager/reference/rest/v1/projects"
- argv: ["storage", "buckets", "list", "--project=shop-prod-1234", "--raw"]
  rc: 0
  stdout: "buckets-list.json"
  source: "https://cloud.google.com/storage/docs/json_api/v1/buckets#resource"
- argv: ["storage", "buckets", "describe", "gs://shop-assets", "--raw"]
  rc: 0
  stdout: "bucket-shop-assets.json"
  source: "https://cloud.google.com/storage/docs/json_api/v1/buckets#resource"
- argv: ["storage", "buckets", "get-iam-policy", "gs://shop-assets"]
  rc: 0
  stdout: "iam-shop-assets.json"
  source: "https://cloud.google.com/storage/docs/json_api/v1/buckets/getIamPolicy"
- argv: ["storage", "du", "--summarize", "gs://shop-assets"]
  rc: 0
  stdout: "du-shop-assets.txt"
  source: "https://cloud.google.com/sdk/gcloud/reference/storage/du"
