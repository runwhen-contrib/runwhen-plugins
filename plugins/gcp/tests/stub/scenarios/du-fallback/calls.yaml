- tool: "curl"
  argv: ["-sS", "--fail-with-body", "--max-redirs", "0", "-H", "@.gcp-monitoring-header", "https://monitoring.googleapis.com/v3/projects/shop-prod-1234/timeSeries?filter=metric.type%20%3D%20%22storage.googleapis.com%2Fstorage%2Fv2%2Ftotal_bytes%22%20AND%20resource.type%20%3D%20%22gcs_bucket%22%20AND%20resource.labels.project_id%20%3D%20%22shop-prod-1234%22%20AND%20resource.labels.bucket_name%20%3D%20%22shop-assets%22&interval.endTime=<T>&interval.startTime=<T>&aggregation.alignmentPeriod=3600s&aggregation.perSeriesAligner=ALIGN_MAX&pageSize=1000"]
