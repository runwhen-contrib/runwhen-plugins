  stdout: "bucket-shop-assets.json"
  source: "https://cloud.google.com/storage/docs/json_api/v1/buckets/get"
  cli_source: "gcloud 592.0.0: googlecloudsdk/command_lib/storage/resources/resource_util.py (get_display_dict_for_resource, --raw) and surface/storage/buckets/describe.py (FULL projection)"
